# obs-rust/obs-studio local gate (zackees/ci.yml GATE-001..010).
#
# Before pushing, from a clean, committed tree:
#
#   uvx --from git+https://github.com/zackees/ci.yml@1a970f01574447d681571ff3d0b8de56cb983dcc ci-lint local-gate run
#
# runs every lane below (each cached on its inputs, so an unchanged lane is
# skipped in seconds) and stamps HEAD with a tree-bound `Local-Gate:` trailer
# plus one `Ci-Attestation:` trailer per gate (ci-attestations.yml). CI's
# ci-mode job reads them: an attested, in-policy PR head skips the Linux
# unit-test jobs the gate already ran. Install the pre-push hook once per
# clone with `... ci-lint local-gate install-hook`.
#
# ./lint and ./unittest run the same lanes without stamping.
[gate]
run = ["uv", "run", "ci/local_gate.py"]
verify = "build-project.yaml:ci-mode"
# Not skippable by a Linux attestation, so they start at once instead of
# waiting on ci-mode: event data, the full OBS builds (themselves skipped for
# non-native PRs by check-event's quick gate), and the macOS/Windows Rust and
# Tier 2 legs. ci.yml's format/validation jobs are seconds long.

# The manual fresh-runner compiler transfer trial cannot be locally attested.
verify-exempt = ["check-event", "macos-build", "ubuntu-build", "flatpak-build", "flatpak-runtime-test", "flatpak-compiler-consumer", "windows-build", "rust-tests", "rust-tier2", "ci.yml"]
mode = "shadow"
# GATE-001: these remote jobs run the gate command itself (`--lane` args
# only), so a green local gate predicts them. setup-steps lists steps that
# only prepare their environment.
mirrors = ["build-project.yaml:rust-tests-linux", "build-project.yaml:rust-linux-tier2"]
# The lane-proof steps only publish a pass (ci/lane_proof.py, #699).
setup-steps = ["Save Tier 2 zccache 💾", "Mark Lane Proof 🧾", "Upload Lane Proof 🧾"]

# clang-format 22.1.3 + gersemi 0.25.0 (pinned via uvx, same files as
# build-aux/run-clang-format and run-gersemi), rustfmt, clippy -D warnings.
[gate.lanes.lint]
run = ["uv", "run", "ci/local_gate.py", "--lane", "lint"]
tools = ["uvx", "soldr"]

# Rust Tiers 1-3 (docs/rust-port/testing-policy.md).
[gate.lanes.rust-test]
run = ["uv", "run", "ci/local_gate.py", "--lane", "rust-test"]
tools = ["soldr"]
exclude = ["**"]
keep = ["rust/**", "dylints/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".cargo/**", "libobs/**", "plugins/obs-nvenc/**", "deps/**", "ci/local_gate.py", "ci/nextest_tool.py", "ci/nextest.toml"]

# Clippy and Dylint for x86_64-pc-windows-msvc and both macOS targets,
# cross-checked from this host through soldr (#472).
[gate.lanes.cross]
run = ["uv", "run", "ci/local_gate.py", "--lane", "cross"]
tools = ["soldr"]
exclude = ["**"]
keep = ["rust/**", "dylints/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".cargo/**", "libobs/**", "plugins/obs-nvenc/**", "deps/**"]

# Tier 2: cmocka against libobs and libobs-c-reference (one build) in Docker
# (ubuntu-26.04, the CI image), exported-symbol diff.
[gate.lanes.tier2-linux]
run = ["uv", "run", "ci/local_gate.py", "--lane", "tier2-linux"]
tools = ["docker"]
# Never read by the Tier 2 build (strace of validate.sh in the image, #699):
# docs, packaging, the Windows/Metal/WinRT graphics backends and CI-only files.
# Nor by its cargo builds (#930 A5): tests/benches/examples of any crate, and
# the crates outside the closure of the crates Tier 2's CMake imports (the
# list is checked against that closure by ci/test_tier2_proof_inputs.py).
# Every workspace manifest stays an input: cargo reads them all.
exclude = ["docs/**", "**/*.md", "build-aux/**", "libobs-d3d11/**", "libobs-metal/**", "libobs-winrt/**", "additional_install_files/**", "tools/**", "ci/**", ".github/**", ".claude/**",
  "rust/*/tests/**", "rust/*/benches/**", "rust/*/examples/**",
  "rust/obs-c-oracle/**", "rust/obs-gpu-status/**", "rust/obs-gpu-status-frontend/**"]
keep = ["rust/*/Cargo.toml"]

# GATE-008: decided from THIS file as committed on the PR's base. Fails
# closed: fork or non-writer author, `ci-full` label, head not attested for
# its exact tree, a missing lane, a changed surface, or the 1-in-10 audit
# sample all run the jobs. Pushes to master always run everything.
[gate.trust]
mode = "enforce"
skip = ["build-project.yaml:rust-tests-linux", "build-project.yaml:rust-linux-tier2", "build-project.yaml:rust-cross-lint"]
covered-by = { "build-project.yaml:rust-tests-linux" = ["lint", "rust-test"], "build-project.yaml:rust-linux-tier2" = ["tier2-linux"], "build-project.yaml:rust-cross-lint" = ["cross"] }
surfaces = [
  "ci/nextest_tool.py",
  "ci/nextest.toml",
  "rust/tools/linux-validate/**",
  "rust-toolchain.toml",
]
