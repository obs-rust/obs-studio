# obs-rust/obs-studio local gate (zackees/ci.yml GATE-001..010).
#
# Before pushing, from a clean, committed tree:
#
#   uvx --from git+https://github.com/zackees/ci.yml@a1917ce76598904ce515cd7eec83450c317ea6f2 ci-lint local-gate run
#
# runs every lane below (each cached on its inputs, so an unchanged lane is
# skipped in seconds) and stamps HEAD with a tree-bound `Local-Gate:` trailer
# plus one `Ci-Attestation:` trailer per gate (ci-attestations.yml). CI's
# ci-mode job reads them: an attested, in-policy PR head skips the Linux
# unit-test jobs the gate already ran. Install the pre-push hook once per
# clone with `... ci-lint local-gate install-hook`.
#
# ./lint and ./unittest run the same lanes without stamping.
[gate]
run = ["uv", "run", "ci/local_gate.py"]
verify = "build-project.yaml:ci-mode"
# Not skippable by a Linux attestation, so they start at once instead of
# waiting on ci-mode: event data, the full OBS builds (themselves skipped for
# non-native PRs by check-event's quick gate), and ci.yml's format/validation
# jobs, which are seconds long. The macOS/Windows Rust and Tier 2 legs are
# skippable by their own native lanes ([gate.trust] below, #443).

# The manual fresh-runner compiler transfer trial cannot be locally attested.
verify-exempt = ["check-event", "macos-build", "ubuntu-build", "flatpak-build", "flatpak-runtime-test", "flatpak-compiler-consumer", "windows-build", "ci.yml"]
mode = "shadow"
# GATE-001: these remote jobs run the gate command itself (`--lane` args
# only), so a green local gate predicts them. setup-steps lists steps that
# only prepare their environment.
mirrors = ["build-project.yaml:rust-tests-linux", "build-project.yaml:rust-linux-tier2"]
# The lane-proof steps only publish a pass (ci/lane_proof.py, #699).
setup-steps = ["Save Tier 2 zccache 💾", "Mark Lane Proof 🧾", "Upload Lane Proof 🧾"]

# clang-format 22.1.3 + gersemi 0.25.0 (pinned via uvx), rustfmt,
# clippy -D warnings.
[gate.lanes.lint]
# Compose the existing checks here so CI's unchanged --lane lint still runs
# Dylint, while the local gate caches it independently below.
run = ["uv", "run", "--no-project", "python", "-c", '''
from ci import local_gate as g
files = g.tracked_files()
in_ci = bool(g.os.environ.get("GITHUB_ACTIONS"))
fmt_files = g.format_scope(files, None if in_ci else g.changed_since_master(), in_ci)
g.clang_format(fmt_files, False)
g.gersemi(fmt_files, False)
g.ruff_ratchet(files)
g.self_test()
g.check_test_binary_inventory()
g.check_feature_sets()
g.platform_ifdef_ratchet()
g.perf_guard_lint()
g.knowledge_lint(False)
g.soldr_cargo(["fmt", "--all", "--check"])
g.soldr_cargo(["clippy", "--workspace", "--all-targets", "--locked", "--", "-D", "warnings"])
for args in g.FEATURE_SETS:
    g.soldr_cargo(["clippy", *args, "--all-targets", "--locked", "--", "-D", "warnings"])
''']
tools = ["uvx", "soldr"]
exclude = ["dylints/**"]

# Rust Tiers 1-3 (docs/rust-port/testing-policy.md).
[gate.lanes.rust-test]
run = ["uv", "run", "ci/local_gate.py", "--lane", "rust-test"]
tools = ["soldr"]
exclude = ["**"]
keep = ["rust/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".cargo/**", "libobs/**", "plugins/obs-nvenc/**", "deps/**", "ci/local_gate.py", "ci/nextest_tool.py", "ci/nextest.toml"]

# Clippy and test links for the same PR targets as ci/local_gate.py (#472).
# CI still calls its unchanged cross lane, including cross Dylint.
[gate.lanes.cross]
run = ["uv", "run", "--no-project", "python", "-c", '''
from ci import local_gate as g
scope = ["--workspace", "--exclude", "obs-c-oracle", "--lib", "--bins"]
for target in g.CROSS_TARGETS:
    g.add_target(target)
    g.soldr_cargo(["clippy", *scope, "--locked", "--target", target, "--", "-D", "warnings"])
    g.soldr_cargo(["test", "--workspace", "--no-run", "--locked", "--target", target])
''']
tools = ["soldr"]
exclude = ["**"]
keep = ["rust/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".cargo/**", "libobs/**", "plugins/obs-nvenc/**", "deps/**"]

# Split Dylint from source-sensitive lanes so source-only edits reuse its
# local pass. Cross builds remain opt-in until the store fix makes them cheap:
# https://github.com/forge-ci/soldr/issues/4118
[gate.lanes.dylint]
run = ["uv", "run", "--no-project", "python", "-c", 'from ci import local_gate as g; g.soldr_dylint(["--all", "--", "--workspace", "--lib", "--bins"])']
tools = ["soldr"]
exclude = ["**"]
keep = ["dylints/**", "rust-toolchain.toml", "Cargo.lock"]

# Keep cross Dylint out of default local runs while its store is expensive:
# https://github.com/forge-ci/soldr/issues/4118
# The pinned schema has no default=false; opt in with OBS_GATE_DYLINT_CROSS=1.
# Exit 75 is the gate's optional-lane protocol (never a cached/attested pass).
# CI's rust-cross-lint and rust-cross-lint-release still run Dylint directly.
[gate.lanes.dylint-cross]
run = ["uv", "run", "--no-project", "python", "-c", '''
import os
import sys
if os.environ.get("OBS_GATE_DYLINT_CROSS") != "1":
    print("cross Dylint: opt in with OBS_GATE_DYLINT_CROSS=1; CI runs it separately", flush=True)
    sys.exit(75)
from ci import local_gate as g
scope = ["--workspace", "--exclude", "obs-c-oracle", "--lib", "--bins"]
for target in (*g.CROSS_TARGETS, "x86_64-apple-darwin"):
    g.add_target(target)
    g.soldr_dylint(["--all", "--", *scope, "--target", target])
''']
tools = ["soldr"]
optional = true
env = ["OBS_GATE_DYLINT_CROSS"]
exclude = ["**"]
keep = ["dylints/**", "rust-toolchain.toml", "Cargo.lock"]

# Tier 2: cmocka against libobs and libobs-c-reference (one build) in Docker
# (ubuntu-26.04, the CI image), exported-symbol diff.
[gate.lanes.tier2-linux]
run = ["uv", "run", "ci/local_gate.py", "--lane", "tier2-linux"]
tools = ["docker"]
# Its own heavy chain (#399): it builds in its own Docker container with its
# own build and zccache volumes, so it overlaps the host lanes instead of
# queueing behind them, and the gate's wall time is the longer of the two
# chains rather than their sum (#2769). On a small host, OBS_CTEST_JOBS and
# OBS_GATE_TEST_THREADS are the controls.
group = "docker"
# Never read by the Tier 2 build (strace of validate.sh in the image, #699):
# docs, packaging, the Windows/Metal/WinRT graphics backends and CI-only files.
# Nor by its cargo builds (#930 A5): tests/benches/examples of any crate, and
# the crates outside the closure of the crates Tier 2's CMake imports (the
# list is checked against that closure by ci/test_tier2_proof_inputs.py).
# Every workspace manifest stays an input: cargo reads them all.
exclude = ["docs/**", "**/*.md", "build-aux/**", "libobs-d3d11/**", "libobs-metal/**", "libobs-winrt/**", "additional_install_files/**", "tools/**", "ci/**", ".github/**", ".claude/**",
  "rust/*/tests/**", "rust/*/benches/**", "rust/*/examples/**",
  "rust/obs-c-oracle/**", "rust/obs-camera-busy/**", "rust/obs-fallback-warning/**", "rust/obs-gpu-status/**",
  "rust/obs-frontend/**"]
keep = ["rust/*/Cargo.toml", "rust/obs-mcp/tests/**", "rust/obs-studio-rust/tests/**", "rust/obs-sys/tests/**"]

# The platform half of the gate (#443): a change to macOS or Windows code is
# attested on that host or run in CI. Each lane runs the jobs it attests and
# exits 75 on any other host, which ci-lint reports as "not applicable on this
# host" and never attests -- hence `optional`. Their inputs are every tracked
# file: a host that runs them has the tree and the caches, and the Linux hosts
# that skip them never key them on anything.
[gate.lanes.macos-native]
run = ["uv", "run", "ci/local_gate.py", "--lane", "macos-native"]
tools = ["soldr"]
optional = true

[gate.lanes.windows-native]
run = ["uv", "run", "ci/local_gate.py", "--lane", "windows-native"]
tools = ["soldr"]
optional = true

# GATE-008: decided from THIS file as committed on the PR's base. Fails
# closed: fork or non-writer author, `ci-full` label, head not attested for
# its exact tree, a missing lane, a changed surface, or the 1-in-10 audit
# sample all run the jobs. Pushes to master always run everything.
[gate.trust]
mode = "enforce"
skip = ["build-project.yaml:rust-tests-linux", "build-project.yaml:rust-linux-tier2", "build-project.yaml:rust-cross-lint", "build-project.yaml:rust-tests-macos", "build-project.yaml:rust-tests-windows", "build-project.yaml:rust-tier2-macos", "build-project.yaml:rust-tier2-windows"]
covered-by = { "build-project.yaml:rust-tests-linux" = ["lint", "dylint", "rust-test"], "build-project.yaml:rust-linux-tier2" = ["tier2-linux"], "build-project.yaml:rust-cross-lint" = ["cross", "dylint-cross"], "build-project.yaml:rust-tests-macos" = ["lint", "dylint", "cross", "dylint-cross", "macos-native"], "build-project.yaml:rust-tests-windows" = ["lint", "dylint", "cross", "dylint-cross", "windows-native"], "build-project.yaml:rust-tier2-macos" = ["macos-native"], "build-project.yaml:rust-tier2-windows" = ["windows-native"] }
surfaces = [
  "ci/nextest_tool.py",
  "ci/nextest.toml",
  "rust/tools/linux-validate/**",
  "rust-toolchain.toml",
]
