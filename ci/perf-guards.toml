# Perf guards (#1303): code shapes that a measured performance fix depends
# on. ci/perf_guard_lint.py (lint lane) fails when a guarded function loses
# one, and prints the reason and the bench below.
#
# Add a guard when an obvious "simplification" would bring a measured
# regression back without a failing test: a fix that is fast because of how
# the compiler translates a shape of code (#1303), or a shortcut that gives
# the same result as a simpler path (#1301). Each guarded function also
# carries a `// PERF GUARD #<issue>` comment.
#
# To change guarded code: run the bench, and if the new shape is as fast,
# change the guard here in the same PR with the numbers.
#
# Keys: issue, file, function, reason, bench (required); attributes (must be
# right above the fn), require (must be in the body), forbid (must not be in
# the body). Comments do not count, whitespace does not matter.

[[guard]]
issue = 1303
file = "rust/obs-codec/src/av1.rs"
function = "parse_obu_header"
attributes = ["#[inline(always)]"]
require = ["obu_after(buf, 1)", "obu_after(buf, 2)"]
forbid = ["1 + usize::from("]
reason = "two calls with a constant start make LLVM keep a branch; a computed start (1 + extension_flag) becomes a select, and the size field load waits for the first byte: 1.6x the C code on x86_64 Linux"
bench = "soldr cargo bench -p obs-c-oracle --bench port_comparison -- av1/keyframe (x86_64 Linux, against GCC)"

[[guard]]
issue = 1303
file = "rust/obs-codec/src/av1.rs"
function = "obu_after"
attributes = ["#[inline(always)]"]
reason = "both arms of parse_obu_header must inline into the walk. Measured in #1303: a leb128 rewrite that made LLVM outline parse_obu_header was 1.7-2.0x, and the decode-both variant without #[inline(always)] was 2.0x"
bench = "soldr cargo bench -p obs-c-oracle --bench port_comparison -- av1/keyframe (x86_64 Linux, against GCC)"

[[guard]]
issue = 1303
file = "rust/obs-codec/src/av1.rs"
function = "keyframe"
attributes = ["#[inline]"]
reason = "without the hint, keyframe stays behind a call in the obs_av1_keyframe shim: 1.09x / 1.13x instead of 1.07x / 1.04x"
bench = "soldr cargo bench -p obs-c-oracle --bench port_comparison -- av1/keyframe (x86_64 Linux, against GCC)"

[[guard]]
issue = 1303
file = "rust/obs-codec/src/av1.rs"
function = "leb128"
require = ["shift += 7"]
forbid = ["i * 7"]
reason = "a running shift is one add per byte; `i * 7` adds a multiply to every byte and was 1.22x instead of 1.07x. A fully unrolled leb128 was worse (1.7-2.0x): it stops the inlining of parse_obu_header"
bench = "soldr cargo bench -p obs-c-oracle --bench port_comparison -- av1/keyframe (x86_64 Linux, against GCC)"

[[guard]]
issue = 1301
file = "rust/obs-codec/src/nal.rs"
function = "nal_headers"
require = ["find_startcode_internal(", "pos + 3"]
forbid = ["find_startcode(", "unit_start("]
reason = "the header walk starts each unit 3 bytes after the internal search's `00 00 01`; the fold in find_startcode is a select on a loaded byte (cmov), and the zero skip and the next search wait for it. Without it (NEAR and the prefilter only): 1.21x / 1.14x the C code on x86_64 instead of 0.78x / 0.75x. The result is the same as nal_units, so a shared walk fails no test"
bench = "soldr cargo bench -p obs-c-oracle --bench port_comparison -- '(avc|hevc)/keyframe' (x86_64 Linux, alignment pinned as in #1301)"

[[guard]]
issue = 1301
file = "rust/obs-codec/src/nal.rs"
function = "find_startcode_internal"
require = ["while i < NEAR"]
reason = "the first NEAR positions are tested a word at a time before the 64-byte block skip; without it, a scan for the next code 20 bytes away runs the block test whenever the rest of the buffer is 64 bytes or more. With the header walk alone: 1.43x / 1.41x instead of 0.78x / 0.75x on x86_64"
bench = "soldr cargo bench -p obs-c-oracle --bench port_comparison -- '(avc|hevc)/keyframe' (x86_64 Linux, alignment pinned as in #1301)"

[[guard]]
issue = 1301
file = "rust/obs-codec/src/nal.rs"
function = "word_startcode"
require = ["first.wrapping_sub(ONES) & !first & HIGH == 0"]
reason = "a word without a zero byte holds no start code: one load instead of three. Smaller than the other #1301 guards (about 0.5 ns on x86_64, 1 ns on arm64), but free"
bench = "soldr cargo bench -p obs-c-oracle --bench port_comparison -- '(avc|hevc)/(keyframe|extract)'"

[[guard]]
issue = 1748
file = "rust/obs-callback/src/signal.rs"
function = "drop"
require = ["if state.waiting > 0", "notify_one()"]
reason = "each signal releases two ReentrantLocks; notify_one with no waiter is a FUTEX_WAKE syscall on Linux (about 335 ns in an LXC container), and notifying on every release made signal_handler_signal 12.9x the C code on x86_64"
bench = "soldr cargo bench -p obs-c-oracle --bench port_comparison -- signal/ (x86_64 Linux, needs the callback benches of #1746)"
