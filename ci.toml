# ci.toml -- this repository's CI contract, checked by ci-lint (zackees/ci.yml
# schema 3, docs/ci-toml.md at the pin below). It generates no YAML: it bounds
# what .github/workflows/*.yaml may do, and the cache janitor
# (.github/workflows/ci-pre.yml) deletes every cache that matches no
# cache family below. Add a family before adding a cache key.
schema = 3
profile = "obs-rust"
linter = "zackees/ci.yml@a1917ce76598904ce515cd7eec83450c317ea6f2"

# -- Platforms ----------------------------------------------------------------
# The platforms PR CI builds and tests natively (build-project.yaml).
[platforms]
linux-x64 = { target = "x86_64-unknown-linux-gnu", runs-on = "ubuntu-26.04", group = "linux" }
windows-x64 = { target = "x86_64-pc-windows-msvc", runs-on = "windows-2025-vs2026", group = "windows" }
macos-arm64 = { target = "aarch64-apple-darwin", runs-on = "macos-26", group = "macos" }

# -- Suites (docs/rust-port/testing-policy.md) -------------------------------
[suites]
lint = { run = "uv run ci/local_gate.py --lane lint", required = true }
rust = { run = "uv run ci/local_gate.py --lane rust-test", required = true }
tier2 = { run = "uv run ci/local_gate.py --lane tier2-linux", required = true }
sanitizers = { run = "uv run --no-project rust/tools/sanitize/sanitize.py", gating = false }

# -- Rust ---------------------------------------------------------------------
# The schema requires these two crate globs whenever [rust.tests] is declared,
# but they describe a published amalgam with private crates behind it, which
# this repository is not: libobs-rust is the one staticlib libobs links, and
# every port crate is a workspace member re-exported through it. Empty globs
# say that, and leave RUST-011's amalgam check with nothing to inspect.
[rust]
public = ""
private = ""

# -- Rust test binaries -------------------------------------------------------
# The fan-out budget of docs/rust-port/testing-policy.md: one amalgamated test
# binary per category, so a second binary is a deliberate edit here and not
# something that appears unnoticed (RUST-005). ci/test_ci_toml.py checks the
# list against the Cargo manifests. Utilities and media I/O keep their library
# harness; the other six categories are explicit integration targets.
[rust.tests]
max-binary = "256MB"
max-total = "1GB"
binaries = [
  "obs-data:test:obs-tests-core",
  "obs-gpu-status:test:obs-tests-gpu",
  "obs-graphics:test:obs-tests-graphics",
  "obs-media-io:lib",
  "obs-nvenc:test:obs-tests-codec",
  "obs-preflight:test:obs-tests-preflight",
  "obs-studio-rust:test:obs-tests-app",
  "obs-util:lib",
]

# -- Flows --------------------------------------------------------------------
[flow.pr]
platforms = ["linux-x64"]
suites = ["lint", "rust", "tier2"]

[flow.main]
extends = "pr"
cache = "write"

[flow.release]
platforms = "all"
suites = "all"
publish = "none"

[flow.nightly]
extends = "release"
schedule = "daily"
cache = "write"
janitor = true

[tags]
ci-full = { add = { platforms = "all" } }

# -- Caches -------------------------------------------------------------------
# Only default-branch runs save (write-on); PRs and merge groups restore, so there is
# no PR delta layer. Sizes: the largest live entry of each family
# (gh api repos/obs-rust/obs-studio/actions/caches, 2026-10-15), rounded up.
[cache]
budget = "10GB"
write-on = ["main", "nightly"]
pr = { mode = "none", families = [], max-per-pr = "0MB", budget = "0MB", trim = "on-close" }

# The janitor deletes any cache matching no family. evict = "lru" families
# keep their most recently used entries up to max x cardinality.
[cache.family]
# zackees/setup-soldr (build-project.yaml, release-rust.yaml).
registry = { via = "setup-soldr:cargo-registry", max = "60MB", per = "platform" }
# Linux retains measured dev (~622 MB) and release (~637 MB) snapshots.
deps = { via = "setup-soldr:cook", max = "900MB", evict = "lru", shapes = { linux = { max = "1.4GB" }, macos = { max = "400MB" }, windows = { max = "650MB" } } }
# Embedded compiler-store transport is disabled at every setup-soldr callsite.
# No family: legacy setup-soldr-buildcache-v2-* entries may be reclaimed.
toolchain = { via = "setup-soldr:solo-toolchain", max = "190MB", per = "platform" }
soldr-mini = { via = "setup-soldr:soldr-mini", max = "15MB", per = "platform" }
# astral-sh/setup-uv's own cache.
uv = { via = "setup-uv", max = "50MB" }
# First-match classification: keep this specific prefix before zccache-.
# Queue OFF/ON objects share one archive, measured ~1.17 GB on 2026-10-24
# (ci/fixtures/queue-compiler-caches.json). Independent LRU
# protection prevents newer nightly writes from evicting that queue seed.
zccache-tier2 = { prefix = "zccache-tier2-linux-", max = "1.5GB", evict = "lru" }
# Ubuntu's production app matrix is ON-only; C-reference OFF/ON coverage
# remains in Tier 2. Observed ON archive 905,383,834 B; >30% growth room.
# Separate first-match LRU protection from AppImage/sanitizer writes (#1269).
zccache-ubuntu = { prefix = "zccache-ubuntu-", max = "1.1GB", evict = "lru" }
zccache = { prefix = "zccache-", max = "500MB", evict = "lru", shapes = { appimage = { max = "400MB" }, sanitize = { max = "300MB" } } }
# Windows compiler cache: ccache as cl.exe (build-project.yaml windows-build).
# Independent newest-entry protection: the pooled family deleted a current
# x64 seed while retaining ARM64 (#1269). Allowances cover observed archives.
windows-ccache-x64 = { prefix = "windows-ccache-x64-", max = "1.3GB", evict = "lru" }
windows-ccache-arm64 = { prefix = "windows-ccache-arm64-", max = "1.1GB", evict = "lru" }
# macOS: Xcode's compilation cache (build-project.yaml macos-build).
xcode-x86_64 = { prefix = "macOS-xcode-x86_64-", max = "800MB", evict = "lru" }
xcode-arm64 = { prefix = "macOS-xcode-arm64-", max = "800MB", evict = "lru" }
# Flatpak: the projected archive contains dependency OSTree and SDK ccache.
flatpak-builder = { prefix = "flatpak-builder-", max = "2.5GB", evict = "lru" }
# The standalone compiler migration reader/writer is retired (#1801).
# AppImage (appimage.yaml): cargo and the test images' packages.
# Legacy apt-appimage- and ccache-appimage- have no consumers or live entries;
# they deliberately have no retention family (#1269).
appimage-cargo = { prefix = "cargo-appimage-", max = "500MB", evict = "lru" }
appimage-testpkgs = { prefix = "testpkgs-", max = "250MB" }
# Known CodeQL overlay bases: observed C++ ~131 MB and Python ~11 MB.
# Automatic default setup is disabled; scans run nightly in scheduled.yaml.
# Retain bounded known keys rather than letting maintenance delete them as unknown.
codeql-overlay = { prefix = "codeql-overlay-base-database-", max = "200MB", evict = "lru" }
# services-validator action.
service-check = { prefix = "service-check-", max = "1MB" }
# Pre-zccache tier2-ccache-linux- has no consumer or live entry; no family.
# Tier 2's apt downloads (#1055) and the per-target Linux plugin builds' ccache.
# Both write a new key per configuration/commit, so LRU bounds how many stay.
tier2-apt = { prefix = "tier2-apt-", max = "400MB", evict = "lru" }
targets-ccache = { prefix = "targets-ccache-linux-", max = "300MB", evict = "lru" }
# Host package archive: measured ~147 MB; isolated from container package versions.
targets-apt = { prefix = "targets-apt-", max = "200MB", evict = "lru" }
# Added on master after #957 was written.
tier2-ctest-cost = { prefix = "tier2-ctest-cost-", max = "1MB" }
# October 21 snapshot: 41.4 MB Windows and 44.3 MB macOS; >3x growth room.
windows-tier2-ccache = { prefix = "windows-tier2-ccache-", max = "400MB", evict = "lru" }
macos-tier2-xcas = { prefix = "macos-tier2-xcas-", max = "200MB", evict = "lru" }
# Pruned master archive 507,448,340 B; real warm consumer working store
# 508,489,050 B. The 650M working cap preserves >25% growth room (#1269).
qt-ccache = { prefix = "qt-ccache-linux-", max = "750MB", evict = "lru" }
vcpkg-cmocka = { prefix = "vcpkg-bin-cmocka-", max = "100MB" }
# Immutable dependency archives measured 25.3/66.3 MB; each allowance >2x.
libs-qt = { prefix = "libs-qt-", max = "64MB" }
libs-ffmpeg = { prefix = "libs-ffmpeg-", max = "128MB" }

# -- Local runs (local-gate.toml) --------------------------------------------
[local]
runner = "bosn-act"
lanes = ["lint", "rust-test", "cross", "tier2-linux"]
cache = "machine"

# -- Allowlists ---------------------------------------------------------------
[allow]
workflows = { "ci.yml" = ["workflow_dispatch", "pull_request", "merge_group"], "ci-pre.yml" = ["workflow_call"], "push.yaml" = ["push"], "build-project.yaml" = ["workflow_call"], "analyze-project.yaml" = ["workflow_call"], "check-format.yaml" = ["workflow_call"], "sign-windows.yaml" = ["workflow_call"], "appimage.yaml" = ["push", "workflow_call", "workflow_dispatch"], "claim-bot.yaml" = ["issue_comment", "schedule", "workflow_dispatch"], "dispatch.yaml" = ["workflow_dispatch"], "leaderboard.yml" = ["schedule", "workflow_dispatch"], "publish.yaml" = ["release"], "release-rust.yaml" = ["schedule", "workflow_dispatch"], "sanitizers.yaml" = ["workflow_dispatch", "schedule"], "scheduled.yaml" = ["workflow_dispatch", "schedule"], "welcome.yaml" = ["issues", "pull_request_target"] }
actions = [
  "actions/attest", "actions/cache", "actions/checkout", "actions/download-artifact", "actions/upload-artifact",
  "andriivitiv/setup-steamcmd", "andriivitiv/steam-totp", "astral-sh/setup-uv", "cloudflare/wrangler-action",
  "flatpak/flatpak-github-actions", "github/codeql-action", "google-github-actions/auth",
  "korelstar/xmllint-problem-matcher", "obsproject/obs-crowdin-sync", "obsproject/obs-studio",
  "peter-evans/create-pull-request", "softprops/action-gh-release", "totaldebug/sphinx-publish-action",
  "yuzutech/annotations-action", "zackees/ci.yml", "zackees/setup-soldr",
]
tools = ["soldr", "uv", "uvx", "python3", "cmake", "docker", "git", "gh"]
# Release signing, publishing and service keys the upstream OBS workflows use.
secrets = [
  "CF_ACCOUNT_ID", "CF_API_TOKEN", "CHECK_SERVERS_API_KEY", "CHECK_SERVERS_LIST", "CROWDIN_SYNC_CROWDIN_PAT",
  "CROWDIN_SYNC_GITHUB_PAT", "FLATHUB_BETA_TOKEN", "FLATHUB_TOKEN", "GCP_IDENTITY_POOL", "GCP_SERVICE_ACCOUNT_NAME",
  "GCS_ACCESS_KEY_ID", "GCS_ACCESS_KEY_SECRET", "GPU_PRIORITY_VAL", "MACOS_KEYCHAIN_PASSWORD",
  "MACOS_NOTARIZATION_PASSWORD", "MACOS_NOTARIZATION_USERNAME", "MACOS_SIGNING_CERT", "MACOS_SIGNING_CERT_PASSWORD",
  "MACOS_SIGNING_IDENTITY", "MACOS_SIGNING_PROVISIONING_PROFILE", "PVS_KEY", "PVS_NAME", "RESTREAM_CLIENTID",
  "RESTREAM_HASH", "SPARKLE_PRIVATE_KEY", "STEAM_PASSWORD", "STEAM_SHARED_SECRET", "STEAM_USER", "TWITCH_CLIENT_ID",
  "TWITCH_HASH", "YOUTUBE_CLIENTID", "YOUTUBE_CLIENTID_HASH", "YOUTUBE_SECRET", "YOUTUBE_SECRET_HASH",
]
# "contents: write" is release-rust.yaml's publishers (release, certify,
# nightly_feed) plus appimage and gate, which grant it on to the reusable
# workflows they call: a called workflow may not ask for more than its caller
# grants, and granting less made GitHub refuse to start the run (startup_failure).
# leaderboard.yml's `update` job is the other holder: it pushes to the
# leaderboard branch, so its grant sits on that job, not the top-level block.
# "issues: write" and "pull-requests: read" also name claim-bot.yaml's `claim`
# job, which routes this repo's events to the org claim bot.
# build-project.yaml's native-cache-transport writes the native build caches.
# dispatch.yaml's `services-validation` job is the same shape: it opens a PR, so
# it carries contents/checks/pull-requests writes on the job, not the top level.
# scheduled.yaml's top-level block is read-only; the jobs that write hold their
# grant on the job itself: `services-availability` opens a PR (contents/checks/
# pull-requests: write), `build-project` grants `contents: write` on to the
# reusable workflow it calls, `report-nightly-failure` files issues, and
# `analyze-project`/`codeql` upload security events (`codeql` also reads
# packages). Its two no-block jobs (`upload-language-files`, `steam-upload`) are
# upstream-only, gated on `repository_owner == 'obsproject'`.
# push.yaml's top-level block is read-only; its `create-release` job carries the
# contents: write the release action needs, `compatibility-validation` and
# `services-validation` hold checks: write, and `sign-windows-build` holds the
# attestations scope plus the id-token it hands to the upstream signing workflow.
permissions = { "actions: write" = ["cache-janitor", "cancel-superseded", "ci-pre"], "attestations: write" = ["sign-windows-build"], "checks: write" = ["validate-data", "services-validation", "compatibility-validation", "services-availability"], "contents: write" = ["appimage", "build-project", "certify", "gate", "native-cache-transport", "nightly_feed", "release", "update", "services-validation", "create-release", "services-availability"], "id-token: write" = ["sign-windows-build"], "issues: write" = ["welcome", "claim", "report-nightly-failure"], "packages: read" = ["codeql"], "pull-requests: read" = ["claim"], "pull-requests: write" = ["welcome", "services-validation", "services-availability"], "security-events: write" = ["windows", "macos", "analyze-project", "codeql"] }
# setup-soldr is called from the workflows directly; there is no wrapper.
setup-soldr = { only-in = ".github/workflows", require = {} }
# Host-specific Rust code lives in each crate's src/platform/ (one cfg_select!
# in platform/mod.rs) or src/ffi/, enforced by the repo Dylint
# dylints/ban_platform_cfg_outside_boundary (AGENTS.md, testing-policy.md).
# Tests, the C oracle and the tools are exempt there too.
platform-selector = "rust/obs-util/src/platform/mod.rs"
platform-code = ["rust/*/src/platform/**", "rust/*/src/ffi/**", "rust/*/tests/**", "rust/*/benches/**", "rust/*/build.rs", "rust/obs-c-oracle/**", "rust/tools/**", "dylints/**", "ci/host_platform.py"]

[publish]
pypi = { auth = "none", environment = "none", mode = "none" }

# -- Exceptions -------------------------------------------------------------
# The ci-lint precheck baseline: findings against workflows and scripts that
# predate this ci.toml, grouped by rule. Each is reported as approved_exception
# on every run and expires 2027-04-15; burn-down: https://github.com/obs-rust/obs-studio/issues/962.

# CACHE-001: actions/cache is called directly; there is no .github/actions/cache wrapper yet.
[[exceptions]]
rule = "CACHE-001"
path = ".github/actions/services-validator/action.yaml"
reason = "actions/cache is called directly; there is no .github/actions/cache wrapper yet."
issue = "https://github.com/obs-rust/obs-studio/issues/962"
expires = "2027-04-15"

# CACHE-002: Compiler caches are keyed by commit (github.sha/run_id) on purpose: only master saves and restore-keys pick the newest.
[[exceptions]]
rule = "CACHE-002"
path = ".github/actions/services-validator/action.yaml"
reason = "Compiler caches are keyed by commit (github.sha/run_id) on purpose: only master saves and restore-keys pick the newest."
issue = "https://github.com/obs-rust/obs-studio/issues/962"
expires = "2027-04-15"
[[exceptions]]
rule = "CACHE-002"
path = ".github/workflows/appimage.yaml"
reason = "Compiler caches are keyed by commit (github.sha/run_id) on purpose: only master saves and restore-keys pick the newest."
issue = "https://github.com/obs-rust/obs-studio/issues/962"
expires = "2027-04-15"
[[exceptions]]
rule = "CACHE-002"
path = ".github/workflows/build-project.yaml"
reason = "Compiler caches are keyed by commit (github.sha/run_id) on purpose: only master saves and restore-keys pick the newest."
issue = "https://github.com/obs-rust/obs-studio/issues/962"
expires = "2027-04-15"
[[exceptions]]
rule = "CACHE-002"
path = ".github/workflows/sanitizers.yaml"
reason = "Compiler caches are keyed by commit (github.sha/run_id) on purpose: only master saves and restore-keys pick the newest."
issue = "https://github.com/obs-rust/obs-studio/issues/962"
expires = "2027-04-15"

# CACHE-013: the nine `setup-soldr` steps in build-project.yaml. Their
# `save-cache-remote` is master-only, so no PR save exists for the rule's
# requirement to scope, while `cache-key-suffix` also reshapes the restore key:
# a pr component there would stop PR and merge-group runs restoring master's
# dependency cook cache, which ci/test_cook_profiles.py pins as shared. Tracked
# in #2741 for a decision; the `setup-uv` and `cache/save` findings in the same
# file are fixed.
[[exceptions]]
rule = "CACHE-013"
path = ".github/workflows/build-project.yaml"
reason = "setup-soldr's save-cache-remote is master-only and cache-key-suffix reshapes the restore key too; tracked in #2741."
issue = "https://github.com/obs-rust/obs-studio/issues/2741"
expires = "2027-04-15"

# CT-006: soldr's cross targets come from setup-soldr inputs and local_gate.py; a [workspace.metadata.soldr] table would change what soldr prefetches.
[[exceptions]]
rule = "CT-006"
path = "Cargo.toml"
reason = "soldr's cross targets come from setup-soldr inputs and local_gate.py; a [workspace.metadata.soldr] table would change what soldr prefetches."
issue = "https://github.com/obs-rust/obs-studio/issues/962"
expires = "2027-04-15"

