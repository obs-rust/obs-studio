# SEC-002: Upstream workflows without a top-level permissions block; tracked in #962.
[[exceptions]]
rule = "SEC-002"
path = ".github/workflows/appimage.yaml"
reason = "Upstream workflows without a top-level permissions block; tracked in #962."
issue = "https://github.com/obs-rust/obs-studio/issues/962"
expires = "2027-04-15"
[[exceptions]]
rule = "SEC-002"
path = ".github/workflows/push.yaml"
reason = "push.yaml's sign-windows-build job grants id-token: write to the upstream Windows signing reusable workflow; ci-lint's OIDC rule allows that scope only on a PyPI/crates.io publisher job (ci_lint/rules/secrets_rules.py::_is_oidc_publisher), so the grant cannot be dropped without breaking signing. The file's other SEC-002 findings are cleared (#962)."
issue = "https://github.com/obs-rust/obs-studio/issues/962"
expires = "2027-04-15"
