[package]
autotests = false
name = "obs-build"
version = "0.1.0"
description = "Cargo-driven native OBS build graph and cc::Build execution"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
libobs-integration = []

[dependencies]
dunce = { workspace = true, default-features = true }
cc = { workspace = true, default-features = true, features = ["parallel"] }
pkg-config = { workspace = true, default-features = true }
serde = { workspace = true, default-features = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }

[dev-dependencies]
libloading = { workspace = true, default-features = true }
tempfile = { workspace = true, default-features = true }

[lib]
test = false

[[bin]]
name = "obs-build"
path = "src/bin/obs-build.rs"
test = false
bench = false
