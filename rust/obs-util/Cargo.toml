[package]
autotests = false
name = "obs-util"
version = "0.1.0"
description = "Rust ports of libobs/util"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# GIO_FOUND: os_inhibit_sleep_* on Linux and FreeBSD calls the portal and
# session D-Bus inhibitors, both Rust. Set by libobs-rust, which CMake
# drives (#1500, #1576, #1631).
gio = []

[dependencies]
# Unix errno values and pthread_setname_np in ffi/threading.rs.
libc = "0.2"
# SIMD substring search for dstr_replace (C uses libc strstr), #1297.
memchr = "2"
# gzip for profiler_snapshot_dump_csv_gz (C uses zlib); the pure-Rust
# miniz_oxide backend, so neither libobs-rust nor the test runners need zlib.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
obs-c-oracle = { path = "../obs-c-oracle" }
proptest = "1"

[build-dependencies]
cc = "1"
pkg-config = "0.3"
