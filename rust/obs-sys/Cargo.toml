[package]
name = "obs-sys"
version = "0.1.0"
description = "Native libobs C ABI with an optional cc::Build source build"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
links = "obs"

[features]
default = []
bundled = ["dep:obs-build"]

[build-dependencies]
obs-build = { path = "../obs-build", optional = true }

[[test]]
name = "native"
required-features = ["bundled"]
