[package]
autotests = false
name = "obs-graphics"
version = "0.1.0"
description = "Rust ports of libobs/graphics"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
obs-util = { path = "../obs-util" }
# `rand` / `RAND_MAX` in ffi/math_extra.rs, the same CRT libobs calls.
libc = { workspace = true, default-features = true }

[dev-dependencies]
obs-c-oracle = { path = "../obs-c-oracle" }
proptest = { workspace = true, default-features = true }

[lib]
test = false

[[test]]
name = "obs-tests-graphics"
path = "tests/graphics.rs"
