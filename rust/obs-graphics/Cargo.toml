[package]
autotests = false
name = "obs-graphics"
version = "0.1.0"
description = "Rust ports of libobs/graphics, including libobs/graphics/graphics-sprite.c.h (the sprite and texture upload geometry extracted from graphics.c.h), libobs/graphics/graphics-immediate.c.h (the immediate-mode vertex counts and texture units extracted from graphics.c.h), libobs/graphics/effect-param-types.c.h (the effect parameter types and default-value shapes extracted from effect-parser.c.h) libobs/graphics/graphics-ffmpeg-orient.c.h (the image orientation and size check extracted from graphics-ffmpeg.c.h), libobs/graphics/graphics-ffmpeg-rgba64.c.h (the 16-bit RGBA image rows extracted from graphics-ffmpeg.c.h), libobs/graphics/graphics-ffmpeg-route.c.h (the image decoder's pixel route extracted from graphics-ffmpeg.c.h) and libobs/graphics/graphics-ffmpeg-host-pq.c.h and libobs/graphics/graphics-ffmpeg-host-wic-checks.c.h (the JPEG XR PQ-to-scRGB conversion, and the file-name check and pixel-format pick, extracted from graphics-ffmpeg-host-windows.c.h)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
obs-util = { path = "../obs-util" }
# `rand` / `RAND_MAX` in ffi/math_extra.rs, the same CRT libobs calls.
libc = { workspace = true, default-features = true }

[dev-dependencies]
obs-c-oracle = { path = "../obs-c-oracle" }
proptest = { workspace = true, features = ["std", "fork", "timeout", "bit-set"] }

[lib]
test = false

[[test]]
name = "obs-tests-graphics"
path = "tests/graphics.rs"
