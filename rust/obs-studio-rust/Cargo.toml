[package]
autotests = false
name = "obs-studio-rust"
version = "0.1.0"
description = "Start, stop and inspect OBS streaming over the obs-websocket v5 protocol"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
test = false
name = "obs-studio-rust"
path = "src/main.rs"

[features]
libobs-integration = ["obs-build/libobs-integration"]
bundled-native = ["dep:obs-sys", "obs-sys/bundled"]

[dependencies]
obs-sys = { path = "../obs-sys", optional = true }
base64 = { workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true }
sha2 = { workspace = true, default-features = true }
tungstenite = { workspace = true, features = ["handshake"] }

[lib]
test = false

[[test]]
name = "obs-tests-app"
path = "tests/cli/main.rs"

[dev-dependencies]
dunce = { workspace = true, default-features = true }
pkg-config = { workspace = true, default-features = true }
obs-build = { path = "../obs-build" }
libloading = { workspace = true, default-features = true }
tempfile = { workspace = true, default-features = true }
