[package]
autotests = false
name = "obs-source-seam"
version = "0.1.0"
description = "The C ABI of the obs-source ports that call back into libobs through a seam: libobs/obs-source-transition-access.c.h (the transition getters and manual controls), libobs/obs-source-transition-restore.c.h (the transition load), libobs/obs-source-transition-settings.c.h (the transition settings), libobs/obs-source-transition-size.c.h (the transition size, child matrices and tick), libobs/obs-source-transition-slots.c.h (the transition child slots and swap), libobs/obs-source-transition-stop.c.h (the transition clock read and stop), libobs/obs-source-transition-switch.c.h (the transition start and set), libobs/obs-source-transition-video.c.h (the transition video render) and the rest of libobs/obs-source-transition.c.h (the transition audio render, init and free) over libobs/obs-source-transition-seam.h, the rest of libobs/obs-source-deinterlace.c.h (the deinterlace frame take, texture update, render and setters) over libobs/obs-source-deinterlace-seam.h, and libobs/obs-source-async-decoupled.c.h (the async decoupled setter) over libobs/obs-source-async-decoupled-fields.c.h and the audio output shims"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
test = false

[dependencies]
obs-source = { path = "../obs-source" }
