[package]
autotests = false
name = "obs-hotkey"
version = "0.1.0"
description = "Rust ports of libobs/obs-hotkey-name-map.c, libobs/obs-hotkey-bindings.c.h, libobs/obs-hotkey-translations.c.h, libobs/obs-hotkey-press.c.h, libobs/obs-hotkey-pair.c.h, libobs/obs-nix-hotkey-state.c.h, libobs/obs-nix-portal-shortcut-ids.c.h, libobs/obs-nix-portal-shortcut-sets.c.h, libobs/obs-nix-x11-input.c.h, libobs/obs-nix-x11-keys.c.h and libobs/obs-cocoa-keys.c.h"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The Wayland key state's shortcut list is a bmalloc darray (obs-util ffi).
obs-util = { path = "../obs-util" }

[dev-dependencies]
obs-c-oracle = { path = "../obs-c-oracle" }
proptest = { workspace = true, features = ["std", "fork", "timeout", "bit-set"] }

[lib]
test = false
