[package]
autotests = false
name = "libobs-rust"
version = "0.1.0"
description = "The single Rust staticlib linked into libobs when ENABLE_RUST_LIBOBS=ON"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib"]
test = false
doctest = false

[features]
# GIO_FOUND (obsconfig.h): Linux and FreeBSD sleep inhibition uses the
# portal and session D-Bus inhibitors (#1500). On by default, so a plain
# Cargo build matches a libobs built with GIO; libobs/cmake/os-linux.cmake
# and os-freebsd.cmake drop the default and set it from find_package(Gio).
default = ["gio"]
gio = ["obs-util/gio"]

[dependencies]
obs-util = { path = "../obs-util" }
obs-callback = { path = "../obs-callback" }
obs-graphics = { path = "../obs-graphics" }
obs-hotkey = { path = "../obs-hotkey" }
obs-codec = { path = "../obs-codec" }
obs-media-io = { path = "../obs-media-io" }
obs-missing-files = { path = "../obs-missing-files" }
obs-scene-bounds = { path = "../obs-scene-bounds" }
obs-audio-monitoring = { path = "../obs-audio-monitoring" }
obs-data = { path = "../obs-data" }
obs-properties = { path = "../obs-properties" }
