[package]
autotests = false
name = "obs-data"
version = "0.1.0"
description = "Rust port of libobs/obs-data.c"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The hasher of the item name index (#1450).
foldhash = "=0.2.0"
libc = "0.2"

[build-dependencies]
cc = "1"

[dev-dependencies]
obs-properties = { path = "../obs-properties" }
obs-hotkey = { path = "../obs-hotkey" }
obs-callback = { path = "../obs-callback" }
obs-c-oracle = { path = "../obs-c-oracle" }
obs-util = { path = "../obs-util" }
proptest = "1"
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }

[lib]
test = false

[[test]]
name = "obs-tests-core"
path = "tests/core.rs"

[[bench]]
name = "data_comparison"
harness = false
