[package]
autotests = false
name = "obs-data"
version = "0.1.0"
description = "Rust port of libobs/obs-data.c"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The hasher of the item name index (#1450).
foldhash = { workspace = true, default-features = true }
libc = { workspace = true, default-features = true }

[build-dependencies]
cc = { workspace = true, default-features = true }

[dev-dependencies]
obs-audio-monitoring = { path = "../obs-audio-monitoring" }
obs-core = { path = "../obs-core" }
obs-properties = { path = "../obs-properties" }
obs-hotkey = { path = "../obs-hotkey" }
obs-missing-files = { path = "../obs-missing-files" }
obs-output = { path = "../obs-output" }
obs-scene = { path = "../obs-scene" }
obs-source = { path = "../obs-source" }
obs-audio-controls = { path = "../obs-audio-controls" }
obs-graphics = { path = "../obs-graphics" }
obs-media-io = { path = "../obs-media-io" }
obs-callback = { path = "../obs-callback" }
obs-c-oracle = { path = "../obs-c-oracle" }
obs-util = { path = "../obs-util" }
proptest = { workspace = true, default-features = true }
criterion = { workspace = true, features = ["cargo_bench_support"] }

[lib]
test = false

[[test]]
name = "obs-tests-core"
path = "tests/core.rs"

[[bench]]
name = "data_comparison"
harness = false
