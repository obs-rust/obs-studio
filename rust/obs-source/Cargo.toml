[package]
autotests = false
name = "obs-source"
version = "0.1.0"
description = "Rust ports of libobs/obs-source-activate.c.h (obs_source_activate and obs_source_deactivate), libobs/obs-source-async-decoupled.c.h (the async decoupled setter; C shim in obs-source-seam), libobs/obs-source-async-pacing.c.h (the async video frame pacing), libobs/obs-source-async-upload.c.h (the async video upload decisions), libobs/obs-source-audio-input.c.h (the source audio input steps), libobs/obs-source-audio-place.c.h (the source audio placement and action timeline), libobs/obs-source-audio-render.c.h (the source audio render mix plan), libobs/obs-source-audio-timing.c.h (the source audio timestamp placement), libobs/obs-source-color-space.c.h (the colour space query routing), libobs/obs-source-conversion-plan.c.h (the async video GPU conversion plan), libobs/obs-source-copy-filters.c.h (obs_source_copy_filters and obs_source_copy_single_filter), the rest of libobs/obs-source-deinterlace.c.h (the deinterlace frame take, texture update, render and setters), libobs/obs-source-deinterlace-draw.c.h (the deinterlace draw decisions), libobs/obs-source-deinterlace-pacing.c.h (the 2x deinterlace frame pacing), libobs/obs-source-deinterlace-select.c.h (the deinterlace frame selection), libobs/obs-source-deinterlace-texture.c.h (the deinterlace texture size), libobs/obs-source-draw.c.h (obs_source_draw and obs_source_draw_set_color_matrix), libobs/obs-source-draw-plan.c.h (the source draw decisions), libobs/obs-source-duplicate.c.h (the source and scene duplicate plans), libobs/obs-source-duplicate-entry.c.h (obs_source_duplicate), libobs/obs-source-enum-full-tree.c.h (obs_source_enum_full_tree and its stop-source walk), libobs/obs-source-filter-add.c.h (obs_source_filter_add), libobs/obs-source-filter-backup.c.h (the filter backup), libobs/obs-source-filter-chain.c.h (the filter chain rules), libobs/obs-source-filter-remove.c.h (obs_source_filter_remove and its refless step), libobs/obs-source-frame-copy.c.h (the async frame copy plan and cache decisions), libobs/obs-source-frame-copy-data.c.h (obs_source_frame_copy, running the copy plan), libobs/obs-source-frame-wrappers.c.h (the six async-frame entry points), libobs/obs-source-get-release-frame.c.h (obs_source_get_frame and obs_source_release_frame), libobs/obs-source-info-lookup.c.h (the source type lookup), libobs/obs-source-media-admission.c.h (the media action admission decisions), libobs/obs-source-monitoring.c.h (the source monitoring, monitor-only mute and balance rules), libobs/obs-source-muted-volume.c.h (source_muted and get_source_volume), libobs/obs-source-output-capture-device.c.h (obs_source_audio_output_capture_device_changed and its activate handler), libobs/obs-source-output-cea708.c.h (obs_source_output_cea708), libobs/obs-source-preload-video-internal.c.h (obs_source_preload_video_internal), libobs/obs-source-private-settings.c.h (the source private-settings getter), libobs/obs-source-process-filter-begin.c.h (obs_source_process_filter_begin and obs_source_process_filter_begin_with_color_space), libobs/obs-source-process-filter-end.c.h (obs_source_process_filter_end and obs_source_process_filter_tech_end), libobs/obs-source-ptm-gate.c.h (the push-to-mute and push-to-talk gate), libobs/obs-source-push-to-enable.c.h (the push-to-mute and push-to-talk enable setters), libobs/obs-source-refs.c.h (obs_source_addref, obs_source_release, obs_source_get_ref and obs_weak_source_get_source), libobs/obs-source-remove.c.h (obs_source_remove), libobs/obs-source-render-route.c.h (the source and filter render routing), libobs/obs-source-restore-filters.c.h (obs_source_restore_filters), libobs/obs-source-set-name.c.h (the source rename), libobs/obs-source-set-video-frame-internal.c.h (obs_source_set_video_frame_internal), libobs/obs-source-show-preloaded-video.c.h (obs_source_show_preloaded_video), libobs/obs-source-size.c.h (the size query routing), libobs/obs-source-skip-video-filter.c.h (obs_source_skip_video_filter), libobs/obs-source-transition-access.c.h (the transition getters and manual controls; C shims in obs-source-seam), libobs/obs-source-transition-clock.c.h (the transition clock and fit), libobs/obs-source-transition-load.c.h (the transition load, scale type and swap checks), libobs/obs-source-transition-restore.c.h (the transition load; C shim in obs-source-seam), libobs/obs-source-transition-render.c.h (the transition render and audio steps), libobs/obs-source-transition-sample-time.c.h (the transition's per-sample audio time), libobs/obs-source-transition-settings.c.h (the transition settings; C shims in obs-source-seam), libobs/obs-source-transition-size.c.h (the transition size, child matrices and tick; C shims in obs-source-seam), libobs/obs-source-transition-slots.c.h (the transition child slots and swap; C shims in obs-source-seam), libobs/obs-source-transition-start.c.h (the transition start checks and child handover), libobs/obs-source-transition-stop.c.h (the transition clock read and stop; C shims in obs-source-seam), libobs/obs-source-transition-switch.c.h (the transition start and set; C shims in obs-source-seam), libobs/obs-source-transition-video.c.h (the transition video render; C shims in obs-source-seam), the rest of libobs/obs-source-transition.c.h (the transition audio render, init and free; C shims in obs-source-seam), libobs/obs-source-video-tick.c.h (the per-frame video tick decisions), libobs/obs-source-video-tick-callbacks.c.h (the per-source callback steps of obs_source_video_tick) and libobs/obs-source-volume.c.h (the source volume snap and apply decisions), libobs/obs-source-volume-mul.c.h (the source volume multiply kernels)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
test = false

[dependencies]
obs-media-io = { path = "../obs-media-io" }
obs-callback = { path = "../obs-callback" }
obs-util = { path = "../obs-util" }
