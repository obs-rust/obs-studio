[package]
autotests = false
name = "obs-c-oracle"
version = "0.1.0"
description = "Test-only: original libobs C sources compiled with oracle_ prefixed symbols"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
obs-util = { path = "../obs-util" }
obs-graphics = { path = "../obs-graphics" }
obs-codec = { path = "../obs-codec" }
obs-callback = { path = "../obs-callback" }
obs-core = { path = "../obs-core" }

[[bench]]
name = "port_comparison"
harness = false

[lib]
test = false
