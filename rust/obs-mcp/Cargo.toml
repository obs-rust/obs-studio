[package]
autotests = false
name = "obs-mcp"
version = "0.1.0"
description = "In-process Model Context Protocol server for Rust OBS (calls libobs directly, no obs-websocket)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Tests live in tests/mcp and run in the shared `obs-tests-core` binary.
[lib]
test = false

[features]
# Binds the backend traits to libobs through obs-sys (#3283). Off by default:
# it needs the libobs symbols at link time, which only the application and the
# `bundled-native` contract tests provide.
libobs = ["dep:obs-sys", "dep:libc"]

[dependencies]
obs-sys = { path = "../obs-sys", optional = true }
serde = { workspace = true, default-features = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
base64 = { workspace = true, features = ["std", "simd-unsafe"] }
# Zlib stream of the PNG IDAT chunk.
flate2 = { workspace = true, features = ["rust_backend"] }

# Redirects descriptor 1 to stderr so libobs logs stay off the protocol stream.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true, default-features = true, optional = true }
