[package]
autotests = false
name = "obs-output"
version = "0.1.0"
description = "Rust ports of libobs/obs-output-delay.c.h, obs-output-interleave.c.h, obs-output-caption-text.c.h, obs-output-protocols.c.h, obs-encoder-roi.c.h, obs-output-video-checks.c.h, obs-encoder-size.c.h, obs-encoder-audio-start.c.h, obs-output-stop-stats.c.h, obs-output-raw-audio.c.h, obs-output-slots.c.h, obs-encoder-gpu-gates.c.h, obs-encoder-bind.c.h, obs-encoder-lifecycle.c.h, obs-encoder-packet-ts.c.h, obs-encoder-group-reconfig.c.h, obs-output-start.c.h, obs-output-begin.c.h, obs-output-stop.c.h, obs-output-reconnect.c.h and obs-output-pause.c.h"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
test = false

[dependencies]
# delay_data is a C struct deque, pushed and popped in place (obs-util ffi);
# obs-util also provides os_gettime_ns and the bmem allocator.
obs-util = { path = "../obs-util" }
