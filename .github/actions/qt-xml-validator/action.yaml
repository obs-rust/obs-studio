name: Validate UI XML
description: Validates Qt UI XML files
inputs:
  failCondition:
    description: Controls whether failed checks also fail the workflow run
    required: false
    default: never
  workingDirectory:
    description: Working directory for checks
    required: false
    default: ${{ github.workspace }}
runs:
  using: composite
  steps:
    - name: Set Up uv 🐍
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        save-cache: ${{ github.ref == 'refs/heads/master' }}
        # A PR save carries a delimited pr-<N> key so the janitor can delete it
        # when the PR closes (CACHE-013, #962).
        cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}

    # The guard calls the module through uv, so the toolchain is installed above
    # it; it still fails an unsupported runner before the check runs (#2724).
    - name: Check Runner Operating System 🏃‍♂️
      if: runner.os == 'Windows'
      shell: bash
      run: uv run --no-project --script ${{ github.workspace }}/ci/qt_xml_validate.py guard --notice "qt-xml-validator action requires an Linux-based or macOS-based runner."

    - name: Register Annotations 📝
      uses: korelstar/xmllint-problem-matcher@dd2ad21bd8a2de0187cb621419537f345e7e509c # v1.3.0

    - name: Check for Changed Files ✅
      uses: ./.github/actions/check-changes
      id: checks
      with:
        checkGlob: 'frontend/forms/**/*.ui'

    # The module parses the changed-file list and installs libxml2-utils when
    # xmllint is missing, which is what the deleted shell steps did (#2724).
    - name: Validate XML 💯
      if: fromJSON(steps.checks.outputs.hasChangedFiles)
      id: result
      shell: bash
      env:
        CHANGED_FILES: ${{ steps.checks.outputs.changedFiles }}
      run: uv run --no-project --script ${{ github.workspace }}/ci/qt_xml_validate.py validate --changed-files-json "$CHANGED_FILES" --schema ${{ github.workspace }}/frontend/forms/XML-Schema-Qt5.15.xsd --fail-condition ${{ inputs.failCondition }}
