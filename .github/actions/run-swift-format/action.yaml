name: Run swift-format
description: Runs swift-format and checks for any changes introduced by it
inputs:
  failCondition:
    description: Controls whether failed checks also fail the workflow run
    required: false
    default: never
  workingDirectory:
    description: Working directory for checks
    required: false
    default: ${{ github.workspace }}
runs:
  using: composite
  steps:
    # Every step below is one Python call (#962, GEN-005, ci/run_swift_format.py).
    # The caller (check-format.yaml's swift-format job) installs no toolchain, so
    # the action brings uv itself.
    - name: Set Up uv 🐍
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        save-cache: ${{ github.ref == 'refs/heads/master' }}
        # A PR save carries a delimited pr-<N> key so the janitor can delete it
        # when the PR closes (CACHE-013, #962).
        cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}

    - name: Check Runner Operating System 🏃‍♂️
      if: runner.os == 'Windows'
      shell: bash
      run: uv run --no-project --script ${{ github.workspace }}/ci/run_swift_format.py guard --notice "run-swift-format action requires a macOS-based or Linux-based runner."

    - name: Check for Changed Files ✅
      uses: ./.github/actions/check-changes
      id: checks
      with:
        checkGlob: "'*.swift'"
        diffFilter: 'ACM'

    - name: Install Dependencies 🛍️
      if: runner.os == 'Linux' && fromJSON(steps.checks.outputs.hasChangedFiles)
      shell: bash
      run: uv run --no-project --script ${{ github.workspace }}/ci/run_swift_format.py install-deps

    - name: Run swift-format 🔥
      if: fromJSON(steps.checks.outputs.hasChangedFiles)
      id: result
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        CHANGED_FILES: ${{ steps.checks.outputs.changedFiles }}
      run: uv run --no-project --script ${{ github.workspace }}/ci/run_swift_format.py format --fail-condition "${{ inputs.failCondition }}"
