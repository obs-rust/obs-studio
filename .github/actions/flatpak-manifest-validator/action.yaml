name: Flatpak Manifest Validator
description: Checks order of Flatpak modules in manifest file
inputs:
  manifestFile:
    description: Flatpak manifest file to check
  failCondition:
    description: Controls whether failed checks also fail the workflow run
    required: false
    default: never
  workingDirectory:
    description: Working directory for checks
    required: false
    default: ${{ github.workspace }}
runs:
  using: composite
  steps:
    - name: Set Up uv 🐍
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        save-cache: ${{ github.ref == 'refs/heads/master' }}
        # A PR save carries a delimited pr-<N> key so the janitor can delete it
        # when the PR closes (CACHE-013, #962).
        cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}

    # The guard calls `uv`, so the toolchain is installed before it (a Windows
    # runner has no uv of its own). It still fails an unsupported runner before
    # the check runs.
    - name: Check Runner Operating System 🏃‍♂️
      if: runner.os == 'Windows'
      shell: bash
      run: uv run --no-project --script ${{ github.workspace }}/ci/flatpak_manifest_validate.py guard --notice "services-validation action requires a macOS-based or Linux-based runner."

    - name: Validate Flatpak Manifest 🕵️
      shell: bash
      working-directory: ${{ inputs.workingDirectory }}
      run: uv run --no-project --script ${{ github.workspace }}/ci/flatpak_manifest_validate.py validate --manifest build-aux/io.github.obs_rust.OBSStudioRust.json --fail-condition ${{ inputs.failCondition }}
