name: Run bouf Packaging
description: Generates signed OBS install files
inputs:
  gcpWorkloadIdentityProvider:
    description: GCP Identity Provider Pool ID
    required: true
  gcpServiceAccountName:
    description: Google service account name
    required: true
  version:
    description: Version string (e.g., 30.0.0-rc1)
    required: true
  channel:
    description: Update channel
    required: false
    default: 'stable'
  architecture:
    description: OBS build architecture
    required: false
    default: 'x64'

runs:
  using: composite
  steps:
    # Every step below is one Python call, so the toolchain has to exist before
    # the first one (#962, GEN-005).
    - name: Set Up uv 🐍
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        save-cache: ${{ github.ref == 'refs/heads/master' }}
        # A PR save carries a delimited pr-<N> key so the janitor can delete it
        # when the PR closes (CACHE-013, #962).
        cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}

    - name: Extract Artifact
      shell: bash
      run: uv run --no-project --script ${{ github.workspace }}/ci/windows_signing.py extract-artifact

    - name: Setup bouf
      shell: bash
      env:
        BOUF_TAG: 'v0.6.6'
        BOUF_HASH: 'a4ad7c06fe00c4fdd2c22cab26b72d75b14655f9c756245f4be5dd2dadb7d5c8'
        BOUF_NSIS_HASH: '02b533c3f9388391ec5a5079fac41486886fde67a26e5ed0e2652fa4e895deb4'
        GH_TOKEN: ${{ github.token }}
      run: uv run --no-project --script ${{ github.workspace }}/ci/windows_signing.py setup-bouf

    - name: Install NSIS
      shell: bash
      run: uv run --no-project --script ${{ github.workspace }}/ci/windows_signing.py install-nsis

    - name: Setup Google CNG Provider
      shell: bash
      env:
        CNG_TAG: 'cng-v1.1'
        GH_TOKEN: ${{ github.token }}
      run: uv run --no-project --script ${{ github.workspace }}/ci/windows_signing.py setup-cng

    - name: Install rclone
      shell: bash
      run: uv run --no-project --script ${{ github.workspace }}/ci/windows_signing.py install-rclone

    - name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093' # v3.0.0
      with:
        workload_identity_provider: ${{ inputs.gcpWorkloadIdentityProvider }}
        service_account: ${{ inputs.gcpServiceAccountName }}

    - name: Download Previous Build
      shell: bash
      env:
        RCLONE_GCS_ENV_AUTH: 'true'
      run: uv run --no-project --script ${{ github.workspace }}/ci/windows_signing.py download-previous --architecture "${{ inputs.architecture }}" --channel "${{ inputs.channel }}"

    - name: Sign Game Capture with RSA cert
      shell: bash
      run: uv run --no-project --script ${{ github.workspace }}/ci/windows_signing.py sign-game-capture

    - name: Run bouf
      shell: bash
      run: uv run --no-project --script ${{ github.workspace }}/ci/windows_signing.py run-bouf --version "${{ inputs.version }}" --architecture "${{ inputs.architecture }}" --channel "${{ inputs.channel }}"

    - name: Sync Latest Build
      shell: bash
      env:
        RCLONE_INCLUDE: '**/${{ inputs.version }}/**'
        RCLONE_GCS_ENV_AUTH: 'true'
        RCLONE_GCS_BUCKET_POLICY_ONLY: 'true'
      run: uv run --no-project --script ${{ github.workspace }}/ci/windows_signing.py sync-latest --architecture "${{ inputs.architecture }}" --channel "${{ inputs.channel }}"

    - name: Upload Build to Archive
      shell: bash
      env:
        RCLONE_GCS_ENV_AUTH: 'true'
        RCLONE_GCS_BUCKET_POLICY_ONLY: 'true'
      run: uv run --no-project --script ${{ github.workspace }}/ci/windows_signing.py upload-archive --architecture "${{ inputs.architecture }}"
