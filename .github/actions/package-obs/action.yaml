name: Package obs-studio
description: Packages obs-studio for specified architecture and build config
inputs:
  target:
    description: Build target for dependencies
    required: true
  config:
    description: Build configuration
    required: false
    default: Release
  codesign:
    description: Enable codesigning (macOS only)
    required: false
    default: 'false'
  notarize:
    description: Enable notarization (macOS only)
    required: false
    default: 'false'
  codesignIdent:
    description: Developer ID for application codesigning (macOS only)
    required: false
    default: '-'
  codesignUser:
    description: Apple ID username for notarization (macOS only)
    required: false
    default: ''
  codesignPass:
    description: Apple ID password for notarization (macOS only)
    required: false
    default: ''
  package:
    description: Create platform-specific packages instead of archives
    required: false
    default: 'false'
  workingDirectory:
    description: Working directory for packaging
    required: false
    default: ${{ github.workspace }}
runs:
  using: composite
  steps:
    - name: Run macOS packaging
      if: runner.os == 'macOS'
      shell: zsh --no-rcs --errexit --pipefail {0}
      working-directory: ${{ inputs.workingDirectory }}
      env:
        CODESIGN_IDENT: ${{ inputs.codesignIdent }}
        CODESIGN_IDENT_USER: ${{ inputs.codesignUser }}
        CODESIGN_IDENT_PASS: ${{ inputs.codesignPass }}
      run: |
        : Run macOS Packaging

        local -a package_args=(
          --target macos-${{ inputs.target }}
          --config ${{ inputs.config }}
        )
        if (( ${+RUNNER_DEBUG} )) build_args+=(--debug)

        if [[ '${{ inputs.codesign }}' == true ]] package_args+=(--codesign)
        if [[ '${{ inputs.notarize }}' == true ]] package_args+=(--notarize)
        if [[ '${{ inputs.package }}' == true ]] package_args+=(--package)

        .github/scripts/package-macos ${package_args}

    - name: Install Dependencies 🛍️
      if: runner.os == 'Linux'
      shell: bash
      run: |
        : Install Dependencies 🛍️
        echo ::group::Install Dependencies
        eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> $GITHUB_PATH
        "${GITHUB_WORKSPACE}/.github/scripts/retry" brew update
        "${GITHUB_WORKSPACE}/.github/scripts/retry" brew install --quiet zsh
        echo ::endgroup::

    - name: Run Ubuntu packaging
      if: runner.os == 'Linux'
      shell: zsh --no-rcs --errexit --pipefail {0}
      working-directory: ${{ inputs.workingDirectory }}
      run: |
        : Run Ubuntu Packaging

        local -a package_args=(
          --target ubuntu-${{ inputs.target }}
          --config ${{ inputs.config }}
        )
        if (( ${+RUNNER_DEBUG} )) build_args+=(--debug)

        if [[ '${{ inputs.package }}' == true ]] package_args+=(--package)

        ${{ inputs.workingDirectory }}/.github/scripts/package-ubuntu ${package_args}

    # windows_zip_check.py (split-symbols in Package-Windows.ps1, then the
    # verify step) runs through uv.
    - name: Set Up uv 🐍
      if: runner.os == 'Windows'
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        save-cache: ${{ github.ref == 'refs/heads/master' }}
        # A PR save carries a delimited pr-<N> key so the janitor can delete it
        # when the PR closes (CACHE-013, #962).
        cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}

    - name: Run Windows packaging
      if: runner.os == 'Windows'
      shell: pwsh
      working-directory: ${{ inputs.workingDirectory }}
      run: |
        # Run Windows Packaging
        $PackageArgs = @{
          Target = '${{ inputs.target }}'
          Configuration = '${{ inputs.config }}'
        }

        if ( $Env:RUNNER_DEBUG -ne $null ) {
          $PackageArgs += @{ Debug = $true }
        }

        if ( ( Test-Path env:CI ) -and ( Test-Path env:RUNNER_DEBUG ) ) {
          $BuildArgs += @{
            Debug = $true
          }
        }

        .github/scripts/Package-windows.ps1 @PackageArgs

    # The runner has the VC++ redistributable, so launching proves little on
    # its own: the script also checks the zip's DLL imports against its
    # contents (#626, #627). Launch only x64; arm64 cannot run here.
    - name: Verify Windows package 🔎
      if: runner.os == 'Windows'
      shell: pwsh
      working-directory: ${{ inputs.workingDirectory }}
      run: |
        $Zip = Get-ChildItem "build_${{ inputs.target }}/obs-studio-*-windows-${{ inputs.target }}.zip" | Select-Object -First 1
        $CheckArgs = @('check', $Zip.FullName)
        if ( '${{ inputs.target }}' -eq 'x64' ) {
          $CheckArgs += '--run'
          # Cross-built ARM64 packages get this version check on their native
          # runner. --expect-version requires executing the frontend.
          if ( $Env:OBS_RUST_VERSION ) {
            $CheckArgs += @('--expect-version', $Env:OBS_RUST_VERSION)
          }
        }
        uv run --no-project ci/windows_zip_check.py @CheckArgs
        if ( $LASTEXITCODE -ne 0 ) { exit $LASTEXITCODE }
