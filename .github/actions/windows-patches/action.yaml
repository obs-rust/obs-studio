name: Run bouf Patch Generation
description: Generates OBS updater manifest and patches
inputs:
  gcsAccessKeyId:
    description: GCS S3 Access Key ID
    required: true
  gcsAccessKeySecret:
    description: GCS S3 Access Key Secret
    required: true
  workflowSecret:
    description: GitHub API token to use for API calls
    required: true
  tagName:
    description: GitHub Release tag
    required: true
  channel:
    description: Update channel
    required: false
    default: 'stable'
  architecture:
    description: OBS build architecture
    required: false
    default: 'x64'

runs:
  using: composite
  steps:
    # Every step below is one Python call, so the toolchain has to exist before
    # the first one (#962, GEN-005).
    - name: Set Up uv 🐍
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        save-cache: ${{ github.ref == 'refs/heads/master' }}
        # A PR save carries a delimited pr-<N> key so the janitor can delete it
        # when the PR closes (CACHE-013, #962).
        cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        path: "repo"
        fetch-depth: 0
        ref: ${{ inputs.tagName }}

    - name: Download Release Artifact
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.workflowSecret }}
      run: uv run --no-project --script ${{ github.workspace }}/ci/windows_patches.py download --tag "${{ inputs.tagName }}" --architecture "${{ inputs.architecture }}"

    - name: Setup bouf
      shell: bash
      env:
        BOUF_TAG: 'v0.6.5'
        BOUF_HASH: '2e16d5116415579b5dd8cd68b3fe6edaa7513938427567121942f592292605d5'
        BOUF_NSIS_HASH: 'e323043627cfeebd237d306afc001c8c36a3c37f6ecef2b349a19a3209ae3450'
        GH_TOKEN: ${{ github.token }}
      run: uv run --no-project --script ${{ github.workspace }}/ci/windows_patches.py setup-bouf

    - name: Install NSIS
      shell: bash
      run: uv run --no-project --script ${{ github.workspace }}/ci/windows_patches.py install-nsis

    - name: Install rclone and pandoc
      shell: bash
      run: uv run --no-project --script ${{ github.workspace }}/ci/windows_patches.py install-tools

    - name: Download Previous Builds
      shell: bash
      env:
        RCLONE_TRANSFERS: '100'
        RCLONE_FAST_LIST: 'true'
        RCLONE_EXCLUDE: '"{pdbs/**,**/${{ inputs.tagName }}/**}"'
        RCLONE_S3_PROVIDER: 'GCS'
        RCLONE_S3_ACCESS_KEY_ID: '${{ inputs.gcsAccessKeyId }}'
        RCLONE_S3_SECRET_ACCESS_KEY: '${{ inputs.gcsAccessKeySecret }}'
        RCLONE_S3_ENDPOINT: 'https://storage.googleapis.com'
      run: uv run --no-project --script ${{ github.workspace }}/ci/windows_patches.py download-previous --architecture "${{ inputs.architecture }}"

    - name: Prepare Release Notes
      shell: bash
      run: uv run --no-project --script ${{ github.workspace }}/ci/windows_patches.py prepare-notes --tag "${{ inputs.tagName }}"

    - name: Run bouf
      shell: bash
      run: uv run --no-project --script ${{ github.workspace }}/ci/windows_patches.py run-bouf --tag "${{ inputs.tagName }}" --channel "${{ inputs.channel }}"

    - name: Upload Outputs
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: windows-updater-files
        compression-level: 0
        path: ${{ github.workspace }}/output
