name: Run flatpak-builder-lint
description: Runs flatpak-builder-lint with exceptions
inputs:
  artifact:
    description: Type of artifact to lint (builddir, repo, manifest, appstream)
    required: true
  path:
    description: Path to flatpak-builder manifest or Flatpak build directory
    required: true
  workingDirectory:
    description: Working directory to clone flatpak-builder-lint
    required: false
    default: ${{ github.workspace }}
runs:
  using: composite
  steps:
    # Both steps were inline shell (an artifact-type guard and the linter call
    # with its jq annotation pipeline); they are a ci/ Python module now, so the
    # action carries no shell logic (GEN-005, #2700).
    - name: Check artifact type
      shell: bash
      working-directory: ${{ inputs.workingDirectory }}
      run: uv run --no-project "${{ github.workspace }}/ci/flatpak_builder_lint.py" guard --artifact '${{ inputs.artifact }}'

    - name: Run flatpak-builder-lint
      id: result
      shell: bash
      working-directory: ${{ inputs.workingDirectory }}
      run: uv run --no-project "${{ github.workspace }}/ci/flatpak_builder_lint.py" lint --artifact '${{ inputs.artifact }}' --path '${{ inputs.path }}' --exceptions "${{ github.action_path }}/exceptions.json"
