name: Run flatpak-builder-lint
description: Runs flatpak-builder-lint with exceptions
inputs:
  artifact:
    description: Type of artifact to lint (builddir, repo, manifest, appstream)
    required: true
  path:
    description: Path to flatpak-builder manifest or Flatpak build directory
    required: true
  workingDirectory:
    description: Working directory to clone flatpak-builder-lint
    required: false
    default: ${{ github.workspace }}
runs:
  using: composite
  steps:
    # Both steps were inline shell (an artifact-type guard and the linter call
    # with its jq annotation pipeline); they are a ci/ Python module now, so the
    # action carries no shell logic (GEN-005, #2700).
    #
    # The module is addressed from GITHUB_ACTION_PATH, not the runner context:
    # `${{ github.workspace }}` interpolates to the runner's host path
    # (/home/runner/work/<repo>/<repo>), while a job container mounts the same
    # tree at /__w/<repo>/<repo>, so the host path cannot be spawned there and
    # the Flatpak lane failed with `Failed to spawn: ... (os error 2)`.
    # GITHUB_ACTION_PATH is the value the shell sees container-side.
    - name: Check artifact type
      shell: bash
      working-directory: ${{ inputs.workingDirectory }}
      run: repo="${GITHUB_ACTION_PATH%/.github/actions/flatpak-builder-lint}"; uv run --no-project "${repo}/ci/flatpak_builder_lint.py" guard --artifact '${{ inputs.artifact }}'

    - name: Run flatpak-builder-lint
      id: result
      shell: bash
      working-directory: ${{ inputs.workingDirectory }}
      run: repo="${GITHUB_ACTION_PATH%/.github/actions/flatpak-builder-lint}"; uv run --no-project "${repo}/ci/flatpak_builder_lint.py" lint --artifact '${{ inputs.artifact }}' --path '${{ inputs.path }}' --exceptions "${GITHUB_ACTION_PATH}/exceptions.json"
