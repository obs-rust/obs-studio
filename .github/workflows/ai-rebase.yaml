name: AI rebase

# Rebases conflicting (DIRTY) PRs onto master and resolves conflicts with the
# clud agent (--unattended, DeepSeek Flash via OpenRouter) following
# ci/ai_rebase_prompt.md; ci/ai_rebase.py verifies and pushes. How many PRs a run rebases comes
# from hard attempt caps plus ci/backpressure.py's live headroom: when the merge
# queue is backed up or runners are starved, this rebases nothing, since every
# rebase restarts a PR's CI.
#
# Secrets:
#   OPENROUTER_API_KEY  OpenRouter key (DeepSeek Flash by default).
# Push token: minted each run from the obs-rust-ai-rebase GitHub App
# (contents: write, pull-requests: write, actions: write, checks: read),
# installed on this repository only.
#   vars.AI_REBASE_APP_ID               the App's id
#   secrets.AI_REBASE_APP_PRIVATE_KEY   its private key
# It must not be GITHUB_TOKEN: a push/enqueue made with GITHUB_TOKEN starts
# no workflows, so the rebased PR would never get CI.
# Schedule/manual scan retains capacity recovery without a Pull-completion
# feedback edge; master pushes do not start sweeps.
# Infrastructure-ejected PRs are re-armed on the schedule (up to 30 minutes later).
# A completed Pull run whose failed jobs died only of runner shutdown/loss or
# network loss is rerun at once by the runner-loss-retry job (#5862), PR and
# merge_group alike, at most twice per run. That event reaches no other job.
on:
  workflow_run:
    workflows: [Pull]
    types: [completed]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      prs:
        description: "PR numbers (space separated); empty = every DIRTY PR within headroom"
        required: false
      dry_run:
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  actions: write
  checks: read

jobs:
  capacity-recovery:
    if: >-
      github.event_name != 'workflow_run' &&
      (github.event_name != 'schedule' || github.repository == 'obs-rust/obs-studio') &&
      github.repository == 'obs-rust/obs-studio'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Serialize all recovery paths, without waiting behind a 30-minute rebase.
    concurrency:
      group: ai-rebase-capacity
      cancel-in-progress: false
    env:
      HAS_TOKEN: ${{ vars.AI_REBASE_APP_ID != '' }}
    steps:
      # The push token is minted per run from the obs-rust-ai-rebase GitHub
      # App, so no long-lived token is stored (#4461).
      - name: Mint the ai-rebase App token
        id: app
        if: env.HAS_TOKEN == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.AI_REBASE_APP_ID }}
          private-key: ${{ secrets.AI_REBASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: master
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
      - name: Recover proven hosted capacity failures
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          # shellcheck disable=SC2086 # DRY is an optional argument
          uv run --no-project --script ci/mq_acquire_retry.py $DRY
      - name: Re-arm infrastructure-ejected PRs
        if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          # Broader existing infrastructure recovery is a backstop only.
          # shellcheck disable=SC2086 # DRY is an optional argument
          uv run --no-project --script ci/ai_rebase.py --requeue-ejected --limit 10 $DRY

  runner-loss-retry:
    if: >-
      (github.event_name != 'schedule' || github.repository == 'obs-rust/obs-studio') &&
      github.event_name == 'workflow_run' && github.repository == 'obs-rust/obs-studio' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3 &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'merge_group')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One decision per run; a burst of completions for other runs does not queue behind it.
    concurrency:
      group: runner-loss-retry-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    env:
      HAS_TOKEN: ${{ vars.AI_REBASE_APP_ID != '' }}
    steps:
      - name: Mint the ai-rebase App token
        id: app
        if: env.HAS_TOKEN == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.AI_REBASE_APP_ID }}
          private-key: ${{ secrets.AI_REBASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      # Default-branch code only: never the triggering head or its artifacts.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: master
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
      - name: Rerun runner-loss failures
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: uv run --no-project --script ci/runner_loss_retry.py --run-id "$RUN_ID"

  rebase:
    concurrency:
      group: ai-rebase-conflicts
      cancel-in-progress: false
    if: >-
      github.event_name != 'workflow_run' &&
      (github.event_name != 'schedule' || github.repository == 'obs-rust/obs-studio')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # GitHub does not allow `secrets` in a job `if:`, so whether the App is
    # configured comes through env. Only push/resolution steps need it (#4461).
    env:
      HAS_TOKEN: ${{ vars.AI_REBASE_APP_ID != '' }}
    steps:
      - name: Skip without the ai-rebase App
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::vars.AI_REBASE_APP_ID is not set, so this run rebases nothing."
      # The push token is minted per run from the obs-rust-ai-rebase GitHub
      # App, so no long-lived token is stored (#4461).
      - name: Mint the ai-rebase App token
        id: app
        if: env.HAS_TOKEN == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.AI_REBASE_APP_ID }}
          private-key: ${{ secrets.AI_REBASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
      # rustfmt for resolved Rust files (the agent runs `soldr cargo fmt`).
      - uses: zackees/setup-soldr@db9aa035e488f4dde7d31d5c8cb4ec20ec99c6c1 # merge of forge-ci/setup-soldr#676: persistent-root cook store and recipes (#675)
        if: env.HAS_TOKEN == 'true'
        with:
          version: 0.9.54
          build-cache: false
          save-cache-remote: ${{ github.ref == 'refs/heads/master' }}
      # The conflict resolver: the clud agent, unattended, on DeepSeek Flash
      # through OpenRouter, driven by ci/ai_rebase_prompt.md.
      - name: Install clud
        if: env.HAS_TOKEN == 'true'
        run: uv tool install clud
      # `clud --openrouter` drives the Claude Code CLI (pointed at OpenRouter,
      # so no Anthropic key); clud does not bundle it.
      - name: Install Claude Code
        if: env.HAS_TOKEN == 'true'
        run: npm install --global @anthropic-ai/claude-code@2.1.330
      - name: Rebase
        if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PRS: ${{ inputs.prs }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          git config user.name "obs-rust ai-rebase"
          git config user.email "ai-rebase@users.noreply.github.com"
          # shellcheck disable=SC2086 # PRS and DRY split into arguments on purpose
          if [ -n "$PRS" ]; then
            uv run --no-project --script ci/ai_rebase.py $PRS $DRY --comment
          else
            uv run --no-project --script ci/ai_rebase.py --dirty $DRY --comment
          fi
