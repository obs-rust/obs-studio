name: AI rebase

# Rebases conflicting (DIRTY) PRs onto master and resolves conflicts with the
# clud agent (--unattended, DeepSeek Flash via OpenRouter) following
# ci/ai_rebase_prompt.md; ci/ai_rebase.py verifies and pushes. How many PRs a run rebases comes
# from ci/backpressure.py's live headroom, not from a setting: when the merge
# queue is backed up or runners are starved, this rebases nothing, since every
# rebase restarts a PR's CI.
#
# Secrets:
#   OPENROUTER_API_KEY  OpenRouter key (DeepSeek Flash by default).
#   AI_REBASE_TOKEN     token that pushes the rebased branch (contents: write,
#                       pull-requests: write, actions: write, checks: read). It must not be GITHUB_TOKEN: a
#                       push/enqueue made with GITHUB_TOKEN starts no workflows, so the
#                       rebased PR would never get CI. A GitHub App
#                       installation token or a fine-grained PAT scoped to
#                       this repo both work.
on:
  push:
    branches: [master]
  workflow_run:
    workflows: [Pull]
    types: [completed]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      prs:
        description: "PR numbers (space separated); empty = every DIRTY PR within headroom"
        required: false
      dry_run:
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  actions: write
  checks: read

jobs:
  capacity-recovery:
    if: >-
      (github.event_name != 'schedule' || github.repository == 'obs-rust/obs-studio') &&
      github.repository == 'obs-rust/obs-studio' &&
      (github.event_name != 'workflow_run' ||
       ((github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'merge_group') &&
        (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Serialize all recovery paths, without waiting behind a 30-minute rebase.
    concurrency:
      group: ai-rebase-capacity
      cancel-in-progress: false
    env:
      HAS_TOKEN: ${{ secrets.AI_REBASE_TOKEN != '' }}
    steps:
      # workflow_run is privileged. Never checkout the triggering head or read
      # its artifacts; inspect only API evidence using default-branch code.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: master
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
      - name: Recover proven hosted capacity failures
        env:
          GH_TOKEN: ${{ secrets.AI_REBASE_TOKEN || github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          # shellcheck disable=SC2086 # DRY is an optional argument
          if [ -n "$RUN_ID" ]; then
            uv run --no-project --script ci/mq_acquire_retry.py --run-id "$RUN_ID" $DRY
          else
            uv run --no-project --script ci/mq_acquire_retry.py $DRY
          fi
      - name: Re-arm infrastructure-ejected PRs
        if: github.event_name != 'workflow_run' && env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.AI_REBASE_TOKEN }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          # Broader existing infrastructure recovery is a backstop only.
          # shellcheck disable=SC2086 # DRY is an optional argument
          uv run --no-project --script ci/ai_rebase.py --requeue-ejected --limit 10 $DRY

  rebase:
    concurrency:
      group: ai-rebase-conflicts
      cancel-in-progress: false
    if: github.event_name != 'workflow_run' && (github.event_name != 'schedule' || github.repository == 'obs-rust/obs-studio')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # GitHub does not allow `secrets` in a job `if:`, so whether the token is
    # set comes through env. Only push/resolution steps need it (#4461).
    env:
      HAS_TOKEN: ${{ secrets.AI_REBASE_TOKEN != '' }}
    steps:
      - name: Skip without AI_REBASE_TOKEN
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::AI_REBASE_TOKEN is not set, so this run rebases nothing."
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          token: ${{ secrets.AI_REBASE_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
      # rustfmt for resolved Rust files (the agent runs `soldr cargo fmt`).
      - uses: zackees/setup-soldr@db9aa035e488f4dde7d31d5c8cb4ec20ec99c6c1 # merge of forge-ci/setup-soldr#676: persistent-root cook store and recipes (#675)
        if: env.HAS_TOKEN == 'true'
        with:
          version: 0.9.54
          build-cache: false
          save-cache-remote: ${{ github.ref == 'refs/heads/master' }}
      # The conflict resolver: the clud agent, unattended, on DeepSeek Flash
      # through OpenRouter, driven by ci/ai_rebase_prompt.md.
      - name: Install clud
        if: env.HAS_TOKEN == 'true'
        run: uv tool install clud
      - name: Rebase
        if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.AI_REBASE_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PRS: ${{ inputs.prs }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          git config user.name "obs-rust ai-rebase"
          git config user.email "ai-rebase@users.noreply.github.com"
          # shellcheck disable=SC2086 # PRS and DRY split into arguments on purpose
          if [ -n "$PRS" ]; then
            uv run --no-project --script ci/ai_rebase.py $PRS $DRY --comment
          else
            uv run --no-project --script ci/ai_rebase.py --dirty $DRY --comment
          fi
