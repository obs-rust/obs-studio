name: Sanitizers
run-name: Sanitizers (${{ inputs.tools || 'all' }}) 🧪
# ASan+UBSan, TSan and valgrind over the cmocka tests and a timed headless OBS
# launch, via rust/tools/sanitize/. Run it from the Actions tab or with
#   gh workflow run sanitizers.yaml -f tools=tsan -f launch_seconds=90
# Runs nightly; PRs that change the harness dispatch it on their branch (#491).
on:
  workflow_dispatch:
    inputs:
      tools:
        description: Which sanitizer passes to run
        type: choice
        default: all
        options:
          - all
          - asan
          - tsan
          - valgrind
      launch_seconds:
        description: Seconds before OBS is sent SIGINT (valgrind gets 4x)
        type: number
        default: 45
      rust_libobs:
        description: Run the tests and app against libobs-with-rust instead of the C libobs
        type: boolean
        default: false
      fail_on_findings:
        description: Fail the job when triage finds an OBS finding
        type: boolean
        default: false
  # Nightly, all passes (#491): ~20 min, so never on PR or push CI
  # (zackees/ci.yml GATE-012). A PR that changes the harness dispatches it
  # on its own branch: gh workflow run sanitizers.yaml --ref <branch>
  schedule:
    - cron: '41 6 * * *'
permissions:
  contents: read
concurrency:
  group: sanitizers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  matrix:
    name: Select passes 🎯
    # Not in forks: a fork's schedule fails there and mails its owner (#1258).
    if: github.event_name != 'schedule' || github.repository == 'obs-rust/obs-studio'
    runs-on: ubuntu-26.04
    outputs:
      tools: ${{ steps.pick.outputs.tools }}
    steps:
      - id: pick
        env:
          TOOLS: ${{ inputs.tools || 'all' }}
        run: |
          if [ "$TOOLS" = all ]; then
            echo 'tools=["asan","tsan","valgrind"]' >>"$GITHUB_OUTPUT"
          else
            echo "tools=[\"$TOOLS\"]" >>"$GITHUB_OUTPUT"
          fi

  sanitize:
    name: ${{ matrix.tool }} 🧪
    needs: matrix
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.matrix.outputs.tools) }}
    defaults:
      run:
        shell: bash
    env:
      SAN_OUT: ${{ github.workspace }}/.sanitize
      ZCCACHE_CACHE_DIR: ${{ github.workspace }}/.sanitize-zccache
      RUST_LIBOBS: ${{ inputs.rust_libobs && 'ON' || 'OFF' }}
    steps:
      # fetch-depth 0: versionconfig.cmake derives the OBS version from tags.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install dependencies 📦
        run: rust/tools/sanitize/install-ubuntu-deps.sh

      # Builds with different -fsanitize flags share nothing, so each pass has
      # its own cache. Only master saves, so PRs can restore it.
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ github.workspace }}/.sanitize-zccache
          key: zccache-sanitize-${{ matrix.tool }}-${{ env.RUST_LIBOBS }}-${{ github.sha }}
          restore-keys: zccache-sanitize-${{ matrix.tool }}-${{ env.RUST_LIBOBS }}-

      - name: Build, test and launch under ${{ matrix.tool }} 🔬
        env:
          LAUNCH_SECONDS: ${{ inputs.launch_seconds || 45 }}
        run: rust/tools/sanitize/sanitize.sh "${{ matrix.tool }}" "$LAUNCH_SECONDS"

      - name: Save zccache 💾
        if: always() && github.ref == 'refs/heads/master'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ github.workspace }}/.sanitize-zccache
          key: zccache-sanitize-${{ matrix.tool }}-${{ env.RUST_LIBOBS }}-${{ github.sha }}

      - name: Triage 🩺
        if: always()
        env:
          FAIL: ${{ inputs.fail_on_findings && '--fail-on-findings' || '' }}
        run: |
          [ -d "$SAN_OUT/${{ matrix.tool }}" ] || { echo "No results (build failed?)" >>"$GITHUB_STEP_SUMMARY"; exit 1; }
          uv run rust/tools/sanitize/triage.py "$SAN_OUT/${{ matrix.tool }}" ${FAIL:+"$FAIL"} | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload logs 📤
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sanitize-${{ matrix.tool }}
          path: ${{ github.workspace }}/.sanitize/${{ matrix.tool }}
          retention-days: 14
