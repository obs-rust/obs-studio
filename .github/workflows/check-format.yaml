name: Check Code Formatting 🛠️
on:
  workflow_call:
permissions:
  contents: read
# A newer run of the same ref cancels the one it supersedes, so a pushed fix
# does not queue behind the format checks of the commit it replaces (WF-002,
# #962). The literal prefix keeps the group distinct from the calling
# workflow's own group.
concurrency:
  group: check-format-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
env:
  # The ci/ self-tests this workflow runs (ci/local_gate.py --only self-test,
  # and the children it starts) read UTF-8 files; a Windows runner's Python
  # would decode them with the ANSI code page (#2757). A no-op elsewhere.
  PYTHONUTF8: "1"
jobs:
  # One runner for every cheap check (#992): each separate job queued for its
  # own runner on the Free plan, 5-10 minutes each. On a PR the clang-format
  # and gersemi checks run in the Fast Gate's lint lane (same pinned tools,
  # same files), so they run here only on pushes.
  checks:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.diff.outputs.swift }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The same full history fetch-depth: 0 gave, without its one log line per
      # branch and tag (1018 of the job's 2769 lines, #2235).
      - name: Fetch History 📜
        run: git fetch --quiet --unshallow --tags origin '+refs/heads/*:refs/remotes/origin/*'
      # The local gate's pinned uvx tool and file set (#427): brew update,
      # brew install zsh and the formatter took about 75 s to format in 0.3 s.
      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          # A PR save carries a delimited pr-<N> key so the janitor can delete it
          # when the PR closes (CACHE-013, #962).
          cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}
      # swift-format needs a macOS runner, one of the 5 the plan allows; take it
      # only when a Swift file changed (#427).
      - name: Check for Swift Changes 🔎
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: uv run --no-project ci/swift_changes.py
      - name: clang-format Check 🐉
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: uv run --no-project ci/local_gate.py --only clang-format
      - name: gersemi Check 🎛️
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: uv run --no-project ci/local_gate.py --only gersemi
      - name: Flatpak Manifest Check 📦
        id: flatpak-check
        uses: ./.github/actions/flatpak-manifest-validator
        with:
          failCondition: error
      - name: Qt XML Check 🖼️
        id: qt-xml-check
        uses: ./.github/actions/qt-xml-validator
        with:
          failCondition: error
      # The 373 plain-Python ci/ tests need nothing from the 26.04 runner (#427).
      - name: ci/ Self-Tests 🧪
        run: uv run --no-project ci/local_gate.py --only self-test

  swift-format:
    timeout-minutes: 20
    runs-on: macos-26
    needs: checks
    if: needs.checks.outputs.swift == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: swift-format Check 🔥
        id: swift-format
        uses: ./.github/actions/run-swift-format
        with:
          failCondition: error
