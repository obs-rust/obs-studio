name: Build Project
on:
  workflow_call:
    inputs:
      mq-heavy-labels:
        description: Capacity-checked merge-queue labels for Linux heavy jobs; empty uses hosted runners
        type: string
        default: ''
      mq-event-labels:
        description: Ready merge-queue lease labels or an empty value for hosted Event Data
        type: string
        default: ''
      native-cache-measurement-only:
        description: Measure only native cache protocols and lightweight gates on trusted manual master runs
        type: boolean
        default: false
      native-cache-measurement-conflict:
        description: Internal caller validation for incompatible additional measurement protocols
        type: boolean
        default: false
      flatpak-measurement-only:
        description: Restrict the manual build matrix to complete Flatpak and lightweight gates
        type: boolean
        default: false
      flatpak-compiler-diagnostics:
        description: Record bounded compiler cache reasons and log spans (manual diagnostic, no raw command upload)
        type: boolean
        default: false
      flatpak-runtime-test:
        description: Run the exported Flatpak with saved capture/browser sources and Debug extension (extra qualification cost)
        type: boolean
        default: false
      flatpak-dependency-transfer-probe:
        description: Also transfer actual OSTree cache state (requires compiler transfer probe; extra storage/build cost)
        type: boolean
        default: false
      flatpak-compiler-transfer-probe:
        description: Transfer an experimental compiler artifact to one fresh Flatpak builder (extra storage/build cost)
        type: boolean
        default: false
      flatpak-pruned-build-probe:
        description: Validate dependency-only application rebuild and subsequent compiler reuse
        type: boolean
        default: false
      flatpak-expect-compiler-reuse:
        description: Fail the Flatpak Zccache Stats step on zero hits (set only when the compiler cache is known warm)
        type: boolean
        default: false
      full:
        # obs-rust/obs-studio#436: the release gate. PRs and master pushes (the
        # dev cycle) skip Flatpak, the macOS/Windows OBS builds, Ubuntu with
        # Rust libobs and Tier 2 macOS/Windows; release-rust.yaml runs them all
        # with full: true and won't publish unless they pass. Tags, schedule,
        # workflow_dispatch are full too; so is a PR whose paths need it (ci/ci_scope.py).
        description: Run every build, including the release-gating ones
        type: boolean
        required: false
        default: false
      flatpak-cache-probe:
        description: Measure isolated Flatpak downloads and proxy compression after Flatpak output validation
        type: boolean
        default: false
      native-cache-reuse-source:
        description: Qualify real native builds from this exact release-cache producer SHA (manual master only)
        type: string
        default: ''
      native-cache-transport-probe:
        description: Qualify bounded native cache release transport on master (writes cache-only prereleases)
        type: boolean
        default: false
      native-cache-probe:
        description: Opt-in manual Windows compiler-cache budget measurement; does not replace full validation
        type: boolean
        required: false
        default: false
    secrets:
      GPU_PRIORITY_VAL:
        required: false
      MACOS_KEYCHAIN_PASSWORD:
        required: false
      MACOS_NOTARIZATION_PASSWORD:
        required: false
      MACOS_NOTARIZATION_USERNAME:
        required: false
      MACOS_SIGNING_CERT:
        required: false
      MACOS_SIGNING_CERT_PASSWORD:
        required: false
      MACOS_SIGNING_IDENTITY:
        required: false
      MACOS_SIGNING_PROVISIONING_PROFILE:
        required: false
      RESTREAM_CLIENTID:
        required: false
      RESTREAM_HASH:
        required: false
      FLEET_CACHE_TOKEN:
        required: false
      SOLDR_S3_CACHE_ACCESS_KEY:
        required: false
      SOLDR_S3_CACHE_SECRET_KEY:
        required: false
      TWITCH_CLIENT_ID:
        required: false
      TWITCH_HASH:
        required: false
      YOUTUBE_CLIENTID:
        required: false
      YOUTUBE_CLIENTID_HASH:
        required: false
      YOUTUBE_SECRET:
        required: false
      YOUTUBE_SECRET_HASH:
        required: false
    outputs:
      skip_checks:
        description: Immutable-base client admission skip_checks
        value: ${{ jobs.ci-mode.outputs.skip_checks }}
      skip_swift-format:
        description: Immutable-base client admission skip_swift-format
        value: ${{ jobs.ci-mode.outputs.skip_swift-format }}
      skip_validate-data:
        description: Immutable-base client admission skip_validate-data
        value: ${{ jobs.ci-mode.outputs.skip_validate-data }}
      admission:
        description: Immutable-base client admission admission
        value: ${{ jobs.ci-mode.outputs.admission }}
      data:
        description: Data validator selection from immutable Event Data diff
        value: ${{ jobs.check-event.outputs.data }}
      swift:
        description: Swift selection from Event Data, independent of Format allocation
        value: ${{ jobs.check-event.outputs.swift }}
      core:
        description: Whether the batch changes libobs or the Rust workspace
        value: ${{ jobs.check-event.outputs.core }}
      tier2-linux-proof:
        description: Tier 2 Linux lane-proof name when this run built the lane; ci.yml publishes it after CI Gate (#3018)
        value: ${{ jobs.rust-linux-tier2-build.outputs.tier2-linux-proof }}
# Keep all application and utility job tokens read-only. Only the guarded
# transport publisher below overrides this default. Caller grants are ceilings.
permissions:
  actions: read
  contents: read
# A newer run of the same ref cancels the one it supersedes, so a pushed fix
# does not queue behind the builds of the commit it replaces (WF-002, #962).
# The literal prefix keeps the group distinct from the calling workflow's own
# group — inside a called workflow `github.workflow` is the caller's name.
concurrency:
  group: build-project-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
env:
  # Pinned soldr can replay stale Rust output (zackees/zccache#1943).
  # Keep cook/target reuse and standalone C/C++ compiler caching enabled.
  SOLDR_RUSTC_WRAPPER: none
  # Queue validation executes commands; compiler artifacts may still be restored.
  SOLDR_VERDICTS: ${{ (github.event_name == 'merge_group' || github.event_name == 'pull_request') && 'off' || 'auto' }}
  # A Windows runner's Python decodes with the ANSI code page, so the ci/
  # self-tests this workflow runs (ci/local_gate.py, and the children it
  # starts) raise UnicodeDecodeError on the UTF-8 workflow files (#2757).
  # A no-op on Linux and macOS, where UTF-8 is already the default.
  PYTHONUTF8: "1"
  # Tier 3 parity proptest depth (#2593, rust/obs-c-oracle/src/parity.rs):
  # PR, merge queue and master push run ~10% of each module's cases;
  # schedule, workflow_dispatch, tags and release branches run them all.
  OBS_PARITY_CASES: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) && 'reduced' || 'full' }}
  # setup-soldr's persistent-root (#4954 P3) auto-detects the Dell's
  # /var/cache/obs-runner/.persistent-cache and keeps the toolchain, CARGO_HOME
  # and soldr's zccache in the runner's slot with no Actions-cache round trip;
  # GitHub-hosted runners are unchanged. Kill switch without a commit: set the
  # repository variable SETUP_SOLDR_PROFILE=hosted.
  SETUP_SOLDR_PROFILE: ${{ vars.SETUP_SOLDR_PROFILE }}
jobs:
  check-event:
    timeout-minutes: 10
    name: Event Data 🔎
    # Wait for a ready lease or run hosted so an unclaimed pool job cannot
    # indefinitely block scheduling every lane.
    runs-on: ${{ inputs.mq-event-labels != '' && fromJSON(inputs.mq-event-labels) || 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
    outputs:
      package: ${{ steps.setup.outputs.package }}
      codesign: ${{ steps.setup.outputs.codesign }}
      notarize: ${{ steps.setup.outputs.notarize }}
      config: ${{ steps.setup.outputs.config }}
      commitHash: ${{ steps.setup.outputs.commitHash }}
      full: ${{ steps.native.outputs.full }}
      core: ${{ steps.native.outputs.core }}
      macos: ${{ steps.native.outputs.macos }}
      windows: ${{ steps.native.outputs.windows }}
      platform_os: ${{ steps.native.outputs.platform_os }}
      deferred: ${{ steps.native.outputs.deferred }}
      qt: ${{ steps.native.outputs.qt }}
      tier2: ${{ steps.native.outputs.tier2 }}
      tier2_matrix: ${{ steps.tier2-matrix.outputs.matrix }}
      tier2_image: ${{ steps.tier2-image.outputs.image }}
      tier2_prebaked: ${{ steps.tier2-image.outputs.prebaked }}
      linux_targets: ${{ steps.native.outputs.linux_targets }}
      qt_sdk: ${{ steps.native.outputs.qt_sdk }}
      docs_only: ${{ steps.native.outputs.docs_only }}
      cross_targets: ${{ steps.native.outputs.cross_targets }}
      cross_lint: ${{ steps.native.outputs.cross_lint }}
      windows_link: ${{ steps.native.outputs.windows_link }}
      cmocka_link: ${{ steps.native.outputs.cmocka_link }}
      swift: ${{ steps.swift.outputs.swift }}
      data: ${{ steps.swift.outputs.data }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}

      # Read names as data, never execute PR code for an allocation decision.
      # Unknown diffs conservatively request Swift; the gate rejects bad scope.
      - name: Select Swift from Immutable Event Diff
        id: swift
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          swift=true data=true
          if [[ "$BASE" =~ ^[0-9a-f]{40}$ && "$HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            if git diff --no-ext-diff --name-only "$BASE" "$HEAD" -- '*.swift' > "$RUNNER_TEMP/swift-paths"; then
              [[ -s "$RUNNER_TEMP/swift-paths" ]] || swift=false
            fi
          fi
          if [[ "$BASE" =~ ^[0-9a-f]{40}$ && "$HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            if git diff --no-ext-diff --name-only "$BASE" "$HEAD" -- 'plugins/win-capture/data/*.json' 'plugins/rtmp-services/data/*.json' > "$RUNNER_TEMP/data-paths"; then
              [[ -s "$RUNNER_TEMP/data-paths" ]] || data=false
            fi
          fi
          echo "swift=$swift" >> "$GITHUB_OUTPUT"
          echo "data=$data" >> "$GITHUB_OUTPUT"

      - name: Select Tier 2 Container Image
        id: tier2-image
        env:
          MQ_RUNNER_LABELS: ${{ inputs.mq-heavy-labels }}
        run: uv run --no-project ci/tier2_image.py select

      - name: Select Tier 2 Scheduling
        id: tier2-matrix
        env:
          TIER2_FULL: ${{ inputs.full }}
        run: uv run --no-project ci/tier2_matrix.py

      - name: Check Experimental Flatpak Inputs
        if: inputs.flatpak-dependency-transfer-probe
        run: test '${{ inputs.flatpak-compiler-transfer-probe }}' = true

      - name: Check Event Data ☑️
        id: setup
        env:
          NATIVE_REUSE_SOURCE: ${{ inputs.native-cache-reuse-source }}
          NATIVE_TRANSPORT_PROBE: ${{ inputs.native-cache-transport-probe }}
          NATIVE_BUDGET_PROBE: ${{ inputs.native-cache-probe }}
          GH_TOKEN: ${{ github.token }}
        run: |
          : Check Event Data ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          if [[ -n "$NATIVE_REUSE_SOURCE" ]]; then
            [[ "$GITHUB_REPOSITORY" == obs-rust/obs-studio && "$GITHUB_REF" == refs/heads/master && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
            [[ "$NATIVE_REUSE_SOURCE" =~ ^[0-9a-f]{40}$ ]]
            [[ "$NATIVE_TRANSPORT_PROBE" != true && "$NATIVE_BUDGET_PROBE" != true ]]
          fi

          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              config_data=('codesign:false' 'notarize:false' 'package:false' 'config:RelWithDebInfo')
              if gh pr view ${{ github.event.number }} --json labels \
                | jq -e -r '.labels[] | select(.name == "Seeking Testers")' > /dev/null; then
                config_data[0]='codesign:true'
                config_data[2]='package:true'
              fi
              ;;
            push)
              config_data=('codesign:true' 'notarize:false' 'package:true' 'config:RelWithDebInfo')
              if [[ ${GITHUB_REF_NAME} =~ [0-9]+.[0-9]+.[0-9]+(-(rc|beta).+)? ]]; then
                config_data[1]='notarize:true'
                config_data[3]='config:Release'
              fi
              ;;
            workflow_dispatch)
              config_data=('codesign:true' 'notarize:false' 'package:false' 'config:RelWithDebInfo')
              ;;
            schedule)
              config_data=('codesign:true' 'notarize:false' 'package:true' 'config:RelWithDebInfo')
              ;;
            *) ;;
          esac

          for config in "${config_data[@]}"; do
            IFS=':' read -r key value <<< "${config}"
            echo "${key}=${value}" >> $GITHUB_OUTPUT
          done
          echo "commitHash=${GITHUB_SHA:0:9}" >> $GITHUB_OUTPUT

      # A PR must not move a submodule pointer backwards (#693): stale
      # checkouts reverted merged obs-websocket fixes (#492, #496, #503, #615).
      # `submodule:` in the PR title allows a deliberate move back.
      - name: Check Submodule Pointers 🧭
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.merge_group.base_sha || format('origin/{0}', github.base_ref) }}
        run: uv run --no-project ci/submodule_direction.py "${BASE}"

      # What this change needs (#436, ci/ci_scope.py): the Linux Rust tests
      # and Tier 2 always run; macOS or Windows code, or shared build/CI
      # config, adds that platform's Rust tests and Tier 2. Every OBS app
      # build (Ubuntu, macOS, Windows, Flatpak) is release-gating: `full`
      # (the release gate in release-rust.yaml, tags, release branches,
      # schedule, workflow_dispatch, or paths that need them: build-aux/, plugin submodule moves).
      - name: Check Change Scope 🧭
        id: native
        env:
          FLATPAK_MEASUREMENT_ONLY: ${{ inputs.flatpak-measurement-only }}
          NATIVE_MEASUREMENT_ONLY: ${{ inputs.native-cache-measurement-only }}
          NATIVE_MEASUREMENT_CONFLICT: ${{ inputs.native-cache-measurement-conflict || inputs.flatpak-measurement-only || inputs.flatpak-compiler-diagnostics || inputs.flatpak-runtime-test || inputs.flatpak-dependency-transfer-probe || inputs.flatpak-compiler-transfer-probe || inputs.flatpak-cache-probe || inputs.flatpak-pruned-build-probe }}
          NATIVE_TRANSPORT_PROBE: ${{ inputs.native-cache-transport-probe }}
          NATIVE_REUSE_SOURCE: ${{ inputs.native-cache-reuse-source }}
          NATIVE_BUDGET_PROBE: ${{ inputs.native-cache-probe }}
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          : Check Change Scope 🧭
          # A reusable caller cannot use this manual observation mode to omit gates.
          if [[ "$FLATPAK_MEASUREMENT_ONLY" == true ]]; then
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && '${{ inputs.full }}' != true ]]
          fi
          # Native observations cannot substitute for a release/full validation.
          # Reject conflicting protocols before selecting any expensive matrix.
          if [[ "$NATIVE_MEASUREMENT_ONLY" == true ]]; then
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && '${{ inputs.full }}' != true ]]
            [[ "$GITHUB_REPOSITORY" == obs-rust/obs-studio && "$GITHUB_REF" == refs/heads/master ]]
            [[ "$NATIVE_MEASUREMENT_CONFLICT" != true && "$FLATPAK_MEASUREMENT_ONLY" != true && "$NATIVE_BUDGET_PROBE" != true ]]
            if [[ "$NATIVE_TRANSPORT_PROBE" == true ]]; then
              [[ -z "$NATIVE_REUSE_SOURCE" ]]
            else
              [[ "$NATIVE_REUSE_SOURCE" =~ ^[0-9a-f]{40}$ ]]
            fi
          fi
          # No label changes what runs (#992). Schedule, workflow_dispatch,
          # tags, release branches and the release gate (inputs.full) run
          # everything (#436); a master push runs its paths' lanes plus the
          # ones a PR defers (below); a PR or merge-queue run runs the
          # lanes its changed paths select (ci/ci_scope.py's LANES table).
          event_full=false
          if [[ "${{ inputs.full }}" == true ]] \
            || [[ "${GITHUB_EVENT_NAME}" == schedule || "${GITHUB_EVENT_NAME}" == workflow_dispatch ]] \
            || [[ "${GITHUB_REF_TYPE}" == tag || "${GITHUB_REF_NAME}" == release/* ]]; then
            event_full=true
          fi
          if [[ "${event_full}" == true ]]; then
            full=true core=true macos=true windows=true qt=true tier2=true qt_sdk=true linux_targets=
            cross_targets=mac-arm64,win-x64
          else
            if [[ "${GITHUB_EVENT_NAME}" == pull_request ]]; then
              base="$PR_BASE"
            elif [[ "${GITHUB_EVENT_NAME}" == merge_group ]]; then
              base="${{ github.event.merge_group.base_sha }}"
            elif [[ "${GITHUB_EVENT_NAME}" == push && "${GITHUB_REF_NAME}" == master ]]; then
              # Pending master builds coalesce. Include paths from every
              # push since the last successful build, including skipped pushes.
              base="$(uv run --no-project ci/master_scope_base.py)"
            else
              # A merge-queue push can carry several commits. Warm every
              # selected path in the push, not only its final commit.
              base="${{ github.event.before || 'HEAD^1' }}"
            fi
            if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
              [[ "$PR_BASE" =~ ^[0-9a-f]{40}$ && "$PR_HEAD" =~ ^[0-9a-f]{40}$ ]]
              # The selector and its only executable dependency come from BASE.
              # The head's manifests/source names are data, never imported code.
              policy_dir="$RUNNER_TEMP/base-scope"
              mkdir -p "$policy_dir"
              git show "$PR_BASE:ci/ci_scope.py" > "$policy_dir/ci_scope.py"
              git show "$PR_BASE:ci/platform_paths.py" > "$policy_dir/platform_paths.py"
              cat > "$policy_dir/scope_runner.py" <<'PY_SCOPE'
          import os, subprocess
          from pathlib import Path
          import ci_scope
          ci_scope.REPO = Path.cwd()
          ci_scope.changed_files = lambda _: [p for p in subprocess.run(
              ["git", "diff", "--no-ext-diff", "--no-renames", "--name-only", "-z",
               os.environ["PR_BASE"], os.environ["PR_HEAD"], "--"],
              check=True, text=True, capture_output=True).stdout.split("\0") if p]
          raise SystemExit(ci_scope.main())
          PY_SCOPE
              scope=$(uv run --no-project --script "$policy_dir/scope_runner.py" "$base" --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF_NAME")
            else
              scope=$(uv run --no-project ci/ci_scope.py "${base}" --event "${GITHUB_EVENT_NAME}" --ref "${GITHUB_REF_NAME}")
            fi
            eval "${scope}"
          fi
          # Fast PR path (#992): a PR or merge-queue run that no path escalates
          # to the full builds runs only the lanes its paths select; the
          # workspace tests and the unselected lanes run on master.
          deferred=false
          if [[ "${full}" != true ]] \
            && [[ "${GITHUB_EVENT_NAME}" == pull_request || "${GITHUB_EVENT_NAME}" == merge_group ]]; then
            deferred=true
          fi
          # master pushes run every lane the scope would skip on a PR,
          # Fast Gate included even for a docs-only change (#2079).
          if [[ "${deferred}" != true ]]; then
            qt=true tier2=true docs_only=false
          fi
          # Measurement jobs keep their app builds and Fast Gate, not unrelated matrices.
          if [[ "$FLATPAK_MEASUREMENT_ONLY" == true || "$NATIVE_MEASUREMENT_ONLY" == true ]]; then
            core=false macos=false windows=false qt=false tier2=false qt_sdk=false linux_targets= cross_targets=
          fi
          os=()
          [[ "${macos}" == true ]] && os+=('"macos-26"')
          [[ "${windows}" == true ]] && os+=('"windows-2025-vs2026"')
          {
            echo "full=${full}"
            echo "deferred=${deferred}"
            echo "core=${core}"
            echo "macos=${macos}"
            echo "windows=${windows}"
            echo "qt=${qt:-false}"
            echo "tier2=${tier2:-false}"
            echo "linux_targets=${linux_targets:-}"
            echo "qt_sdk=${qt_sdk:-false}"
            echo "docs_only=${docs_only:-false}"
            echo "cross_targets=${cross_targets:-}"
            echo "windows_link=${windows_link:-true}"
            echo "cmocka_link=${cmocka_link:-true}"
            echo "platform_os=[$(IFS=,; echo "${os[*]}")]"
          } >> "${GITHUB_OUTPUT}"
          echo "full=${full} core=${core} macos=${macos} windows=${windows} qt=${qt} tier2=${tier2}"

  # ASan runs nightly only (maintainer directive 2026-11-09): sanitizers.yaml
  # keeps its schedule and workflow_dispatch; no PR or merge-queue run builds
  # it (the former ratchet-PR `Sanitize 🧪` job, #2923, is gone).

  macos-build:
    timeout-minutes: 90
    name: macOS 🍏
    runs-on: macos-26
    needs: check-event
    # OBS app builds are release-gating (#436): release gate, tags, schedule,
    # dispatch and path-triggered full PRs only.
    if: ${{ !inputs.flatpak-measurement-only && fromJSON(needs.check-event.outputs.full) }}
    strategy:
      fail-fast: false
      matrix:
        target: [arm64, x86_64]
    defaults:
      run:
        shell: zsh --no-rcs --errexit --pipefail {0}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up Environment 🔧
        id: setup
        run: |
          : Set Up Environment 🔧
          if (( ${+RUNNER_DEBUG} )) setopt XTRACE

          print '::group::Enable Xcode 26.5'
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          print '::endgroup::'

          print '::group::Clean Homebrew Environment'
          local -a unwanted_formulas=()
          local -a remove_formulas=()
          for formula (${unwanted_formulas}) {
            if [[ -d ${HOMEBREW_PREFIX}/Cellar/${formula} ]] remove_formulas+=(${formula})
          }

          if (( #remove_formulas )) brew uninstall --ignore-dependencies ${remove_formulas}
          print '::endgroup::'

          local -A arch_names=(x86_64 intel arm64 apple)
          print "cpuName=${arch_names[${{ matrix.target }}]}" >> $GITHUB_OUTPUT

          local xcode_cas_path="${HOME}/Library/Developer/Xcode/DerivedData/CompilationCache.noindex"

          if ! [[ -d ${xcode_cas_path} ]] mkdir -p ${xcode_cas_path}

          print "xcodeCasPath=${xcode_cas_path}" >> $GITHUB_OUTPUT

      - name: Set Up uv for Native Release Reuse
        if: inputs.native-cache-reuse-source != ''
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}

      - name: Prepare Native Release Reuse
        id: native-reuse
        if: inputs.native-cache-reuse-source != ''
        shell: bash
        env:
          NATIVE_REUSE_SOURCE: ${{ inputs.native-cache-reuse-source }}
          NATIVE_CACHE_JOB_TOKEN: ${{ github.token }}
        run: |
          uv run --no-project ci/native_cache_identity.py --platform macos --architecture '${{ matrix.target }}' --configuration '${{ needs.check-event.outputs.config }}' --output "$RUNNER_TEMP/native-reuse-identity.json" --diagnostics "$RUNNER_TEMP/native-reuse-identity-diagnostics.json"
          uv run --no-project ci/native_cache_transport.py consume --require-hit --expected-source "$NATIVE_REUSE_SOURCE" --identity "$RUNNER_TEMP/native-reuse-identity.json" --destination "$RUNNER_TEMP/native-reuse-cache" --report "$RUNNER_TEMP/native-reuse-consume.json"
          uv run --no-project ci/native_cache_freshness.py prepare --root "$GITHUB_WORKSPACE" --state "$RUNNER_TEMP/native-reuse-state.json" --report "$RUNNER_TEMP/native-reuse-prepare.json"
          echo "cache_path=$RUNNER_TEMP/native-reuse-cache" >> "$GITHUB_OUTPUT"

      # No Actions cache for the Xcode CAS: phase A of #1801 moved the app-build
      # caches out of the 10 GiB budget, so every app build starts cold.

      - name: Set Up Code Signing 🔑
        uses: ./.github/actions/setup-macos-codesigning
        if: fromJSON(needs.check-event.outputs.codesign)
        id: codesign
        with:
          codesignIdentity: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          codesignCertificate: ${{ secrets.MACOS_SIGNING_CERT }}
          certificatePassword: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          keychainPassword: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          provisioningProfile: ${{ secrets.MACOS_SIGNING_PROVISIONING_PROFILE }}
          notarizationUser: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
          notarizationPassword: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}

      # The GPU status light links Rust into every frontend build (#946), so
      # this job needs the Rust toolchain. setup-soldr provisions the one
      # rust-toolchain.toml pins and puts `soldr` on PATH; #2650 rewrote the
      # step below to `soldr rustup` without adding this, and both app builds
      # then died with `command not found: soldr` (#2699).
      - name: Set Up soldr 🦀
        uses: zackees/setup-soldr@c1bfc684de8c5f97b178c8837e3e8e6a7383676c # merge of forge-ci/setup-soldr#701: the fleet-cache tier (forge-ci/cache)
        with:
          # One scope for every caller (push.yaml, ci.yml), so PRs replay
          # the verdicts master publishes (forge-ci/setup-soldr#604).
          verdict-scope: build-project
          version: 0.9.54
          build-cache: false
          # Fleet cache (forge-ci/cache): the tier that a merge_group run may
          # publish to, which actions/cache structurally cannot. Inert unless
          # vars.FLEET_CACHE_URL is set, so this is a no-op until the store is
          # reachable; the identity is derived by the action, not passed here.
          fleet-cache: auto
          fleet-cache-family: app
          # Cook the workspace dependencies the app build compiles anyway.
          prebuild-deps-flags: --release
          save-cache-remote: ${{ github.ref == 'refs/heads/master' }}
          shims: true
          # The x86_64 leg adds a target std library after setup (#507/#969).
          solo-toolchain-cache: false
          # S3 remote cache: bucket forge-ci on DO Spaces nyc3; the 50G watermark is
          # enforced only on the merge_group singleton. No bucket/creds = feature off.
          s3-bucket: forge-ci
          s3-endpoint: nyc3.digitaloceanspaces.com
          s3-region: nyc3
          s3-cache-limit: 50G
        env:
          SOLDR_S3_CACHE_ACCESS_KEY: ${{ secrets.SOLDR_S3_CACHE_ACCESS_KEY }}
          SOLDR_S3_CACHE_SECRET_KEY: ${{ secrets.SOLDR_S3_CACHE_SECRET_KEY }}
          FLEET_CACHE_URL: ${{ vars.FLEET_CACHE_URL }}
          FLEET_CACHE_TOKEN: ${{ secrets.FLEET_CACHE_TOKEN }}

      # The x86_64 leg cross-builds on an arm64 runner and needs that
      # target's standard library too.
      - name: Add the Rust x86_64 macOS target 🦀
        if: matrix.target == 'x86_64'
        run: soldr rustup target add x86_64-apple-darwin

      - name: Build OBS Studio 🧱
        uses: ./.github/actions/build-obs
        env:
          TWITCH_CLIENTID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_HASH: ${{ secrets.TWITCH_HASH }}
          RESTREAM_CLIENTID: ${{ secrets.RESTREAM_CLIENTID }}
          RESTREAM_HASH: ${{ secrets.RESTREAM_HASH }}
          YOUTUBE_CLIENTID: ${{ secrets.YOUTUBE_CLIENTID }}
          YOUTUBE_CLIENTID_HASH: ${{ secrets.YOUTUBE_CLIENTID_HASH }}
          YOUTUBE_SECRET: ${{ secrets.YOUTUBE_SECRET }}
          YOUTUBE_SECRET_HASH: ${{ secrets.YOUTUBE_SECRET_HASH }}
          XCODE_CAS_PATH: ${{ steps.native-reuse.outputs.cache_path || steps.setup.outputs.xcodeCasPath }}
        with:
          target: ${{ matrix.target }}
          config: ${{ needs.check-event.outputs.config }}
          codesign: ${{ fromJSON(needs.check-event.outputs.codesign) }}
          codesignIdent: ${{ steps.codesign.outputs.codesignIdent }}
          codesignTeam: ${{ steps.codesign.outputs.codesignTeam }}
          provisioningProfileUUID: ${{ steps.codesign.outputs.provisioningProfileUUID }}

      # The native-reuse uv step above is conditional; the report is not.
      - name: Set Up uv for the soldr Cache Report
        if: always() && inputs.native-cache-reuse-source == ''
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}

      # Cache observability: nothing else in CI says whether the compiler cache
      # is helping. Fail-open: an unavailable report prints one line.
      - name: Report soldr cache 📊
        if: always()
        shell: bash
        run: uv run --no-project ci/soldr_cache_report.py >> "$GITHUB_STEP_SUMMARY" || echo "soldr cache report unavailable" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Native Installed Binary Freshness
        if: inputs.native-cache-reuse-source != ''
        shell: bash
        run: |
          uv run --no-project ci/native_cache_identity.py --platform macos --architecture '${{ matrix.target }}' --configuration '${{ needs.check-event.outputs.config }}' --expected "$RUNNER_TEMP/native-reuse-identity.json" --output "$RUNNER_TEMP/native-reuse-final-identity.json" --diagnostics "$RUNNER_TEMP/native-reuse-final-identity-diagnostics.json"
          uv run --no-project ci/native_cache_freshness.py verify --root "$GITHUB_WORKSPACE" --state "$RUNNER_TEMP/native-reuse-state.json" --platform macos --architecture '${{ matrix.target }}' --report "$RUNNER_TEMP/native-reuse-freshness.json"

      - name: Restore Native Freshness Source
        if: always() && inputs.native-cache-reuse-source != ''
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/native-reuse-state.json" ]]; then
            uv run --no-project ci/native_cache_freshness.py restore --root "$GITHUB_WORKSPACE" --state "$RUNNER_TEMP/native-reuse-state.json" --report "$RUNNER_TEMP/native-reuse-restore.json"
          fi

      - name: Upload Native Build Reuse Evidence
        if: always() && inputs.native-cache-reuse-source != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-build-reuse-macos-${{ matrix.target }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-reuse-*.json
          retention-days: 1
          if-no-files-found: warn

      - name: Package OBS Studio 📀
        uses: ./.github/actions/package-obs
        if: ${{ inputs.native-cache-reuse-source == '' && fromJSON(needs.check-event.outputs.package) }}
        with:
          target: ${{ matrix.target }}
          config: ${{ needs.check-event.outputs.config }}
          package: ${{ fromJSON(needs.check-event.outputs.package) }}
          codesign: ${{ fromJSON(needs.check-event.outputs.codesign) && fromJSON(steps.codesign.outputs.haveCodesignIdent) }}
          codesignIdent: ${{ steps.codesign.outputs.codesignIdent }}
          notarize: ${{ fromJSON(needs.check-event.outputs.notarize) && fromJSON(steps.codesign.outputs.haveNotarizationUser) }}
          codesignUser: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
          codesignPass: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.native-cache-reuse-source == '' && fromJSON(needs.check-event.outputs.package) }}
        with:
          name: obs-studio-macos-${{ matrix.target }}-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/build_macos/obs-studio-*-macos-${{ steps.setup.outputs.cpuName }}.*

      - name: Upload Debug Symbol Artifacts 🪲
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ needs.check-event.outputs.config == 'Release' }}
        with:
          name: obs-studio-macos-${{ matrix.target }}-${{ needs.check-event.outputs.commitHash }}-dSYMs
          path: ${{ github.workspace }}/build_macos/obs-studio-*-macos-${{ steps.setup.outputs.cpuName }}-dSYMs.tar.xz

      # Identity evidence only; the separate manual publisher has its own token.
      - name: Set Up uv for Native Transport Identity
        if: inputs.native-cache-transport-probe
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}

      - name: Record Native Transport Identity
        if: inputs.native-cache-transport-probe
        run: >-
          uv run --no-project ci/native_cache_identity.py --platform macos
          --architecture '${{ matrix.target }}' --configuration '${{ needs.check-event.outputs.config }}'
          --output '${{ runner.temp }}/native-cache-identity.json'
          --diagnostics '${{ runner.temp }}/native-cache-identity-diagnostics.json'

      - name: Bind Native Transport Seed
        id: native-seed
        if: inputs.native-cache-transport-probe
        shell: bash
        run: >-
          uv run --no-project ci/native_cache_seed.py
          --identity '${{ runner.temp }}/native-cache-identity.json'
          --source-sha '${{ github.sha }}' --output "$GITHUB_OUTPUT"

      - name: Qualify Local Native Cache Archive
        shell: bash
        if: inputs.native-cache-transport-probe
        env:
          CACHE_SOURCE: ${{ steps.setup.outputs.xcodeCasPath }}
        run: >-
          uv run --no-project ci/native_cache_transport.py verify-local
          --identity '${{ runner.temp }}/native-cache-identity.json' --source "$CACHE_SOURCE"
          --report '${{ runner.temp }}/native-cache-local.json'

      # The transport job of this run publishes the seed (#782). It travels as
      # an artifact: the Actions cache has no room for it (#1801).
      - name: Upload Qualified Native Transport Seed
        if: inputs.native-cache-reuse-source == '' && inputs.native-cache-transport-probe && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-cache-seed-macos-${{ steps.native-seed.outputs.suffix }}
          path: ${{ steps.setup.outputs.xcodeCasPath }}
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload Local Native Cache Evidence
        if: always() && inputs.native-cache-transport-probe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-cache-local-macos-${{ matrix.target }}
          path: ${{ runner.temp }}/native-cache-local.json
          retention-days: 1
          if-no-files-found: warn

      - name: Upload Native Transport Identity
        if: inputs.native-cache-transport-probe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-cache-identity-macos-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/native-cache-identity.json
            ${{ runner.temp }}/native-cache-identity-diagnostics.json
          retention-days: 1
          if-no-files-found: error

  ubuntu-build:
    timeout-minutes: 90
    name: Ubuntu 🐧 ${{ matrix.rust == 'ON' && '(OBS-Studio-Rust) ' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04]
        # One production application: hybrid libobs, with OBS-Studio-Rust identity.
        # C reference coverage remains in the explicit Tier 2 jobs.
        rust: ['ON']
    runs-on: ${{ matrix.os }}
    needs: check-event
    # The full OBS app build is release-gating, not dev-cycle CI: it runs in
    # the release gate (release-rust.yaml), tags, schedule, dispatch and
    # path-triggered full runs. PRs and pushes build and test the Rust workspace and Tier 2
    # (libobs + cmocka) on Linux instead.
    if: ${{ !inputs.flatpak-measurement-only && !inputs.native-cache-measurement-only && fromJSON(needs.check-event.outputs.full) }}
    defaults:
      run:
        shell: bash
    env:
      # zccache is the ubuntu-ci preset's compiler launcher (setup_zccache).
      ZCCACHE_CACHE_DIR: ${{ github.workspace }}/.zccache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      # The mirror step runs before every package install, and it is Python
      # now: this job has no other step that installs uv, so without this the
      # step fails with `uv: command not found` (exit 127).
      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}

      - name: Configure Host apt Mirrors
        run: sudo -E "$(command -v uv)" run --no-project ci/host_apt_mirrors.py

      # No Actions cache for zccache here: phase A of #1801 moved the app-build
      # caches out of the 10 GiB budget, so the build starts cold.
      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}

      # This full-build job is outside PR/merge-group admission. Capture
      # structured miss evidence without publishing raw compiler arguments.
      - name: Start Native Cache Journal
        id: native-cache-journal
        continue-on-error: true
        run: |
          uv run --no-project rust/tools/linux-validate/install_zccache.py "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          uv run --no-project ci/native_cache_journal.py start \
            --tool "${HOME}/.local/bin/zccache" --cache-dir "${ZCCACHE_CACHE_DIR}" \
            --workspace "${GITHUB_WORKSPACE}" \
            --journal "${RUNNER_TEMP}/native-cache-${{ matrix.rust }}.jsonl"

      - name: Build OBS Studio 🧱
        id: ubuntu-native-build
        uses: ./.github/actions/build-obs
        env:
          ENABLE_RUST_LIBOBS: ${{ matrix.rust }}
          TWITCH_CLIENTID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_HASH: ${{ secrets.TWITCH_HASH }}
          RESTREAM_CLIENTID: ${{ secrets.RESTREAM_CLIENTID }}
          RESTREAM_HASH: ${{ secrets.RESTREAM_HASH }}
          YOUTUBE_CLIENTID: ${{ secrets.YOUTUBE_CLIENTID }}
          YOUTUBE_CLIENTID_HASH: ${{ secrets.YOUTUBE_CLIENTID_HASH }}
          YOUTUBE_SECRET: ${{ secrets.YOUTUBE_SECRET }}
          YOUTUBE_SECRET_HASH: ${{ secrets.YOUTUBE_SECRET_HASH }}
        with:
          target: x86_64
          config: ${{ needs.check-event.outputs.config }}

      - name: Summarize Native Cache Journal
        id: native-cache-summary
        if: always() && steps.native-cache-journal.outcome == 'success'
        continue-on-error: true
        run: |
          echo 'ZCCACHE_SESSION_ID=' >> "${GITHUB_ENV}"
          uv run --no-project ci/native_cache_journal.py summarize \
            --workspace "${GITHUB_WORKSPACE}" \
            --cache-dir "${ZCCACHE_CACHE_DIR}" \
            --journal "${RUNNER_TEMP}/native-cache-${{ matrix.rust }}.jsonl" \
            --build-outcome "${{ steps.ubuntu-native-build.outcome }}" \
            --output "${RUNNER_TEMP}/native-cache-${{ matrix.rust }}.json"

      - name: Upload Native Cache Diagnostics
        if: always() && steps.native-cache-summary.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-cache-ubuntu-${{ matrix.rust }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-cache-${{ matrix.rust }}.json
          retention-days: 2

      - name: Smoke Test OBS-Studio-Rust 🦀
        if: matrix.rust == 'ON'
        run: |
          : Smoke Test OBS-Studio-Rust 🦀
          prefix="${GITHUB_WORKSPACE}/build_ubuntu/install/${{ needs.check-event.outputs.config }}"
          version=$(LD_LIBRARY_PATH="${prefix}/lib:${prefix}/lib/x86_64-linux-gnu" "${prefix}/bin/obs-studio-rust-gui" --version)
          echo "${version}"
          # Only an ENABLE_RUST_LIBOBS build names itself OBS-Studio-Rust (#112).
          [[ "${version}" == OBS-Studio-Rust* ]]

      - name: Package OBS Studio 📀
        uses: ./.github/actions/package-obs
        if: ${{ fromJSON(needs.check-event.outputs.package) }}
        with:
          target: x86_64
          config: ${{ needs.check-event.outputs.config }}
          package: ${{ fromJSON(needs.check-event.outputs.package) }}

      - name: Upload Source Tarball 🗜️
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ fromJSON(needs.check-event.outputs.package) }}
        with:
          name: obs-studio-${{ matrix.os }}${{ matrix.rust == 'ON' && '-rust' || '' }}-sources-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/build_ubuntu/obs-studio-*-sources.*

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ fromJSON(needs.check-event.outputs.package) }}
        with:
          name: obs-studio-${{ matrix.os }}${{ matrix.rust == 'ON' && '-rust' || '' }}-x86_64-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/build_ubuntu/obs-studio-*-x86_64-ubuntu-gnu.*

      - name: Upload Debug Symbol Artifacts 🪲
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ fromJSON(needs.check-event.outputs.package) }}
        with:
          name: obs-studio-${{ matrix.os }}${{ matrix.rust == 'ON' && '-rust' || '' }}-x86_64-${{ needs.check-event.outputs.commitHash }}-dbgsym
          path: ${{ github.workspace }}/build_ubuntu/obs-studio-*-x86_64-ubuntu-gnu-dbgsym.ddeb

      # The GPU status light must not call llvmpipe green (#846, #940). The
      # runner has no GPU, so OBS renders on llvmpipe; the check also forces
      # it. Installed into /usr, the prefix the Rust build is configured for,
      # so OBS finds its data and plugins; after packaging and uploads, so the
      # system-wide install cannot leak into the package.
      - name: Tier 4 GPU Acceleration Check 🎮
        if: matrix.rust == 'ON'
        timeout-minutes: 10
        run: |
          : Tier 4 GPU Acceleration Check 🎮
          sudo cmake --install build_ubuntu --config ${{ needs.check-event.outputs.config }} > /dev/null
          command -v xvfb-run > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends xvfb; }
          uv run --no-project --with websockets==13.1 test/websocket-tier4/run_tier4.py --only gpu --obs /usr/bin/obs-studio-rust-gui

      # The whole black-box obs-websocket suite against the real app with Rust
      # libobs (#140): auth handshake, every request type, scene collections,
      # inputs and a recording. Full and release-gate runs only (this job
      # never runs on a PR), so it stays off the critical path.
      - name: Tier 4 Suite (Rust libobs app) 🔌
        if: matrix.rust == 'ON'
        timeout-minutes: 15
        run: uv run --no-project --with websockets==13.1 test/websocket-tier4/run_tier4.py --obs /usr/bin/obs-studio-rust-gui


  flatpak-build:
    timeout-minutes: 120
    name: Flatpak 📦
    runs-on: ubuntu-26.04
    needs: check-event
    if: ${{ !inputs.native-cache-measurement-only && fromJSON(needs.check-event.outputs.full) }}
    defaults:
      run:
        shell: bash
    env:
      FLATPAK_BUILD_SHARE_PATH: flatpak_app/files/share
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
      volumes:
        - /usr/local/lib/android:/to_clean/android
        - /opt/hostedtoolcache/CodeQL:/to_clean/codeql
        - /usr/local/.ghcup:/to_clean/ghcup
        - /opt/hostedtoolcache/Python:/to_clean/python
        - /usr/share/swift:/to_clean/swift
        - /usr/share/dotnet:/to_clean/dotnet
    steps:
      - name: Prepare build space
        shell: bash
        run: |
          : Prepare build space

          echo ::group::Available storage
          df -h
          echo ::endgroup::

          # The build peaks at about 16 GiB (measured in #428 on a runner with
          # 84 GiB free). Deleting the runner's preinstalled tools takes 1-2
          # minutes, so do it only when free space is short of that with a margin.
          required_gib=40
          avail_gib=$(df --output=avail -BG /__w | tail -1 | tr -dc 0-9)
          if (( avail_gib >= required_gib )); then
            echo "${avail_gib} GiB free, ${required_gib} GiB needed: skipping cleanup"
            exit 0
          fi

          echo ::group::Remove Android stuff
          rm -rf /to_clean/android/*
          echo ::endgroup::

          echo ::group::Remove CodeQL stuff
          rm -rf /to_clean/codeql/*
          echo ::endgroup::

          echo ::group::Remove GHCup stuff
          rm -rf /to_clean/ghcup/*
          echo ::endgroup::

          echo ::group::Remove Python stuff
          rm -rf /to_clean/python/*
          echo ::endgroup::

          echo ::group::Remove Swift stuff
          rm -rf /to_clean/swift/*
          echo ::endgroup::

          echo ::group::Remove .NET stuff
          rm -rf /to_clean/dotnet/*
          echo ::endgroup::

          echo ::group::Available storage
          df -h
          echo ::endgroup::

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0
          set-safe-directory: ${{ env.GITHUB_WORKSPACE }}

      - name: Set Up Environment 🔧
        id: setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : Set Up Environment 🔧
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}
      - name: Prepare offline Flatpak Rust dependencies
        run: |
          # Supply the pinned compiler in the manifest; soldr vendors Cargo inputs
          # before flatpak-builder enters its network-isolated build sandbox.
          cmake -P cmake/common/prepare-flatpak-soldr.cmake
      - name: Vendor Flatpak Cargo sources
        run: uv run --script build-aux/prepare_flatpak_rust.py

      - name: Configure Flatpak Compiler Diagnostics
        id: flatpak-compiler-diagnostic-config
        if: inputs.flatpak-compiler-diagnostics
        run: uv run --no-project ci/flatpak_compiler_diagnostics.py configure --manifest build-aux/io.github.obs_rust.OBSStudioRust.json

      - name: Validate Flatpak manifest
        uses: ./.github/actions/flatpak-builder-lint
        with:
          artifact: manifest
          path: build-aux/io.github.obs_rust.OBSStudioRust.json

      - name: Reset Flatpak Compiler Counters
        run: uv run --no-project ci/flatpak_compiler_cache.py reset --cache .flatpak-builder/ccache/obs-zccache

      - name: Build Flatpak Manifest 🧾
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          # `flatpak build-bundle` takes ~4 of the ~16 minutes and only testers
          # download the result (#651). Routine master pushes skip it; the
          # daily schedule, tags, release branches and Seeking Testers PRs
          # still build and upload it.
          build-bundle: ${{ fromJSON(needs.check-event.outputs.package) && (github.event_name != 'push' || github.ref_type == 'tag' || startsWith(github.ref_name, 'release/')) }}
          bundle: obs-studio-flatpak-${{ needs.check-event.outputs.commitHash }}.flatpak
          manifest-path: ${{ github.workspace }}/build-aux/io.github.obs_rust.OBSStudioRust.json
          # Keep SDK ccache wrappers for dependency modules. OBS selects the
          # real compilers and uses zccache inside the writable /run/ccache mount.
          cache: true
          # No Actions cache for the builder state (#1801 phase A).
          restore-cache: false
          save-cache: false
          mirror-screenshots-url: https://dl.flathub.org/media
          # Keep the module-local diagnostic log until its sanitized summary.
          keep-build-dirs: ${{ inputs.flatpak-compiler-diagnostics }}

      - name: Summarize Flatpak Compiler Diagnostics
        if: ${{ !cancelled() && inputs.flatpak-compiler-diagnostics && steps.flatpak-compiler-diagnostic-config.outcome == 'success' }}
        run: uv run --no-project ci/flatpak_compiler_diagnostics.py summarize --output "$RUNNER_TEMP/flatpak-compiler-diagnostics.json"

      - name: Upload Flatpak Compiler Diagnostics
        if: ${{ !cancelled() && inputs.flatpak-compiler-diagnostics && steps.flatpak-compiler-diagnostic-config.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: flatpak-compiler-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/flatpak-compiler-diagnostics.json
          retention-days: 2
          if-no-files-found: error

      - name: Report Flatpak Cache Contents
        if: always()
        timeout-minutes: 2
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ ! -d .flatpak-builder ]; then
            echo "flatpak-cache state=absent job_status=${JOB_STATUS}"
            exit 0
          fi
          echo "flatpak-cache phase=after-builder job_status=${JOB_STATUS} units=apparent-bytes"
          echo '::group::Flatpak builder state contents (apparent bytes)'
          LC_ALL=C du --apparent-size --block-size=1 --max-depth=2 -- .flatpak-builder | LC_ALL=C sort -nr
          echo '::endgroup::'

      - name: Zccache Stats 📊
        run: uv run --no-project ci/flatpak_compiler_cache.py report --cache .flatpak-builder/ccache/obs-zccache --app flatpak_app/files ${{ inputs.flatpak-expect-compiler-reuse && '--expect-reuse' || '' }}

      - name: Validate AppStream
        uses: ./.github/actions/flatpak-builder-lint
        with:
          artifact: appstream
          path: ${{ env.FLATPAK_BUILD_SHARE_PATH }}/metainfo/io.github.obs_rust.OBSStudioRust.metainfo.xml

      - name: Verify Icon and Metadata in app-info
        working-directory: ${{ env.FLATPAK_BUILD_SHARE_PATH }}
        run: |
          : Verify Icon and Metadata in app-info
          test -f app-info/icons/flatpak/128x128/io.github.obs_rust.OBSStudioRust.png || { echo "::error::Missing 128x128 icon in app-info"; exit 1; }
          test -f app-info/xmls/io.github.obs_rust.OBSStudioRust.xml.gz || { echo "::error::Missing io.github.obs_rust.OBSStudioRust.xml.gz in app-info"; exit 1; }

      - name: Validate build directory
        uses: ./.github/actions/flatpak-builder-lint
        with:
          artifact: builddir
          path: flatpak_app

      - name: Validate repository
        uses: ./.github/actions/flatpak-builder-lint
        with:
          artifact: repo
          path: repo

      - name: Measure Flatpak Cache Capacity
        if: inputs.flatpak-cache-probe
        timeout-minutes: 15
        run: |
          uv run --no-project ci/flatpak_cache_probe.py \
            --manifest build-aux/flatpak-github-action-modified-io.github.obs_rust.OBSStudioRust.json \
            --temp-root "${RUNNER_TEMP}" --output "${RUNNER_TEMP}/flatpak-cache-probe.json"

      - name: Upload Flatpak Cache Measurement
        if: ${{ !cancelled() && inputs.flatpak-cache-probe }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-cache-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/flatpak-cache-probe.json
          if-no-files-found: error
          retention-days: 7

      - name: Probe Pruned Flatpak Rebuild
        if: inputs.flatpak-pruned-build-probe
        timeout-minutes: 40
        run: |
          uv run --no-project ci/flatpak_pruned_build_probe.py --compiler-reuse \
            --manifest build-aux/flatpak-github-action-modified-io.github.obs_rust.OBSStudioRust.json \
            --temp-root "${RUNNER_TEMP}" --output "${RUNNER_TEMP}/flatpak-pruned-build.json"

      - name: Upload Pruned Flatpak Evidence
        if: ${{ !cancelled() && inputs.flatpak-pruned-build-probe }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-pruned-build-${{ github.run_id }}
          path: ${{ runner.temp }}/flatpak-pruned-build.json
          if-no-files-found: error
          retention-days: 7

      - name: Pack Experimental Flatpak Dependency Artifact
        if: inputs.flatpak-dependency-transfer-probe
        run: |
          timeout 600s uv run --no-project ci/flatpak_dependency_cache.py pack --manifest build-aux/io.github.obs_rust.OBSStudioRust.json \
            --cache .flatpak-builder/cache --artifact "$RUNNER_TEMP/flatpak-dependency-transfer"
      - name: Upload Experimental Flatpak Dependency Artifact
        if: inputs.flatpak-dependency-transfer-probe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-dependency-transfer-${{ github.run_id }}
          path: ${{ runner.temp }}/flatpak-dependency-transfer
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Pack Experimental Flatpak Compiler Artifact
        if: inputs.flatpak-compiler-transfer-probe
        run: |
          uv run --no-project ci/flatpak_compiler_cache.py pack --manifest build-aux/io.github.obs_rust.OBSStudioRust.json \
            --cache .flatpak-builder/ccache/obs-zccache --artifact "$RUNNER_TEMP/flatpak-compiler-transfer"
      - name: Upload Experimental Flatpak Compiler Artifact
        if: inputs.flatpak-compiler-transfer-probe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-compiler-transfer-${{ github.run_id }}
          path: ${{ runner.temp }}/flatpak-compiler-transfer
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Archive Exported Flatpak for Runtime Qualification
        if: inputs.flatpak-runtime-test && !inputs.flatpak-dependency-transfer-probe
        run: |
          tar -cf "$RUNNER_TEMP/flatpak-runtime-repo.tar" repo
          stat -c 'qualification-export-bytes=%s' "$RUNNER_TEMP/flatpak-runtime-repo.tar"

      - name: Upload Exported Flatpak for Runtime Qualification
        if: inputs.flatpak-runtime-test && !inputs.flatpak-dependency-transfer-probe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-runtime-repo
          path: ${{ runner.temp }}/flatpak-runtime-repo.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  flatpak-compiler-consumer:
    name: Flatpak Compiler Consumer 🧪
    if: inputs.flatpak-compiler-transfer-probe
    needs: flatpak-build
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
      volumes:
        - /usr/local/lib/android:/to_clean/android
        - /opt/hostedtoolcache/CodeQL:/to_clean/codeql
        - /usr/local/.ghcup:/to_clean/ghcup
        - /opt/hostedtoolcache/Python:/to_clean/python
        - /usr/share/swift:/to_clean/swift
        - /usr/share/dotnet:/to_clean/dotnet
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare build space
        shell: bash
        run: |
          : Prepare build space

          echo ::group::Available storage
          df -h
          echo ::endgroup::

          # The build peaks at about 16 GiB (measured in #428 on a runner with
          # 84 GiB free). Deleting the runner's preinstalled tools takes 1-2
          # minutes, so do it only when free space is short of that with a margin.
          required_gib=40
          avail_gib=$(df --output=avail -BG /__w | tail -1 | tr -dc 0-9)
          if (( avail_gib >= required_gib )); then
            echo "${avail_gib} GiB free, ${required_gib} GiB needed: skipping cleanup"
            exit 0
          fi

          echo ::group::Remove Android stuff
          rm -rf /to_clean/android/*
          echo ::endgroup::

          echo ::group::Remove CodeQL stuff
          rm -rf /to_clean/codeql/*
          echo ::endgroup::

          echo ::group::Remove GHCup stuff
          rm -rf /to_clean/ghcup/*
          echo ::endgroup::

          echo ::group::Remove Python stuff
          rm -rf /to_clean/python/*
          echo ::endgroup::

          echo ::group::Remove Swift stuff
          rm -rf /to_clean/swift/*
          echo ::endgroup::

          echo ::group::Remove .NET stuff
          rm -rf /to_clean/dotnet/*
          echo ::endgroup::

          echo ::group::Available storage
          df -h
          echo ::endgroup::

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
          save-cache: ${{ github.ref == 'refs/heads/master' }}
      - name: Prepare Compiler Consumer Sources
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -P cmake/common/prepare-flatpak-soldr.cmake
      - name: Vendor Flatpak Compiler Consumer Sources
        run: uv run --script build-aux/prepare_flatpak_rust.py
      - name: Download Experimental Compiler Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flatpak-compiler-transfer-${{ github.run_id }}
          path: ${{ runner.temp }}/flatpak-compiler-transfer
      - name: Prepare Compiler Consumer SDK
        run: |
          # The producer's builder updates the image SDK before compilation.
          # Use the same dependency preparation before comparing identities;
          # any remaining SDK/compiler drift must still reject the archive.
          timeout 300s flatpak-builder --install-deps-only --install-deps-from=flathub \
            --arch=x86_64 --state-dir "$RUNNER_TEMP/flatpak-sdk-prep" flatpak_app build-aux/io.github.obs_rust.OBSStudioRust.json
      - name: Download Experimental Dependency Artifact
        if: inputs.flatpak-dependency-transfer-probe
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flatpak-dependency-transfer-${{ github.run_id }}
          path: ${{ runner.temp }}/flatpak-dependency-transfer
      - name: Restore Experimental Dependency Artifact
        if: inputs.flatpak-dependency-transfer-probe
        run: |
          timeout 600s uv run --no-project ci/flatpak_dependency_cache.py restore --manifest build-aux/io.github.obs_rust.OBSStudioRust.json \
            --cache .flatpak-builder/cache --artifact "$RUNNER_TEMP/flatpak-dependency-transfer"
      - name: Verify and Restore Compiler Artifact Last
        run: |
          uv run --no-project ci/flatpak_compiler_cache.py restore --manifest build-aux/io.github.obs_rust.OBSStudioRust.json \
            --cache .flatpak-builder/ccache/obs-zccache --artifact "$RUNNER_TEMP/flatpak-compiler-transfer" \
            > "$RUNNER_TEMP/flatpak-compiler-transfer/consumer-restore.json"
          uv run --no-project ci/flatpak_compiler_cache.py reset --cache .flatpak-builder/ccache/obs-zccache
      - name: Force Application Work Without Changing Compiler Inputs
        run: |
          uv run --no-project ci/flatpak_compiler_cache.py force --manifest build-aux/io.github.obs_rust.OBSStudioRust.json \
            --cache .flatpak-builder/ccache/obs-zccache --artifact "$RUNNER_TEMP/flatpak-compiler-transfer"
      - name: Record Experimental Dependency Reuse
        if: inputs.flatpak-dependency-transfer-probe
        run: |
          uv run --no-project ci/flatpak_dependency_cache.py instrument --manifest build-aux/io.github.obs_rust.OBSStudioRust.json \
            --cache .flatpak-builder/cache --artifact "$RUNNER_TEMP/flatpak-dependency-transfer" >> "$GITHUB_PATH"
      - name: Build Full Flatpak Compiler Consumer
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: ${{ github.workspace }}/build-aux/io.github.obs_rust.OBSStudioRust.json
          build-bundle: false
          cache: true
          restore-cache: false
          save-cache: false
          mirror-screenshots-url: https://dl.flathub.org/media
      - name: Verify All Dependency Modules Were Reused
        if: inputs.flatpak-dependency-transfer-probe
        run: |
          uv run --no-project ci/flatpak_dependency_cache.py verify --manifest build-aux/io.github.obs_rust.OBSStudioRust.json \
            --cache .flatpak-builder/cache --artifact "$RUNNER_TEMP/flatpak-dependency-transfer"
      - name: Compiler Consumer Zccache Stats 📊
        run: uv run --no-project ci/flatpak_compiler_cache.py report --cache .flatpak-builder/ccache/obs-zccache --app flatpak_app/files --expect-reuse
      - name: Verify Substantial Cross Runner Compiler Reuse
        run: |
          uv run --no-project ci/flatpak_compiler_cache.py verify --manifest build-aux/io.github.obs_rust.OBSStudioRust.json \
            --cache .flatpak-builder/ccache/obs-zccache --app flatpak_app/files --artifact "$RUNNER_TEMP/flatpak-compiler-transfer"
      - name: Validate Compiler Consumer AppStream
        uses: ./.github/actions/flatpak-builder-lint
        with:
          artifact: appstream
          path: flatpak_app/files/share/metainfo/io.github.obs_rust.OBSStudioRust.metainfo.xml
      - name: Validate Compiler Consumer Build Directory
        uses: ./.github/actions/flatpak-builder-lint
        with:
          artifact: builddir
          path: flatpak_app
      - name: Validate Compiler Consumer Repository
        uses: ./.github/actions/flatpak-builder-lint
        with:
          artifact: repo
          path: repo
      - name: Archive Compiler Consumer for Runtime Qualification
        if: inputs.flatpak-runtime-test && inputs.flatpak-dependency-transfer-probe
        run: |
          tar -cf "$RUNNER_TEMP/flatpak-runtime-repo.tar" repo
          stat -c 'qualification-consumer-export-bytes=%s' "$RUNNER_TEMP/flatpak-runtime-repo.tar"
      - name: Upload Compiler Consumer for Runtime Qualification
        if: inputs.flatpak-runtime-test && inputs.flatpak-dependency-transfer-probe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-runtime-repo
          path: ${{ runner.temp }}/flatpak-runtime-repo.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Stage Compiler Consumer Measurements
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/flatpak-compiler-result"
          shopt -s nullglob
          for report in "$RUNNER_TEMP/flatpak-compiler-transfer/"*.json "$RUNNER_TEMP/flatpak-dependency-transfer/"*.json; do
            cp -- "$report" "$RUNNER_TEMP/flatpak-compiler-result/"
          done
          if [[ -f "$RUNNER_TEMP/flatpak-dependency-transfer/builder.log" ]]; then
            cp -- "$RUNNER_TEMP/flatpak-dependency-transfer/builder.log" "$RUNNER_TEMP/flatpak-compiler-result/"
          fi
      - name: Upload Compiler Consumer Measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-compiler-consumer-${{ github.run_id }}
          path: ${{ runner.temp }}/flatpak-compiler-result
          if-no-files-found: error
          retention-days: 7

  flatpak-runtime-test:
    name: Flatpak Saved Profile 🧪
    if: ${{ !cancelled() && inputs.flatpak-runtime-test && needs.flatpak-build.result == 'success' && (!inputs.flatpak-dependency-transfer-probe || needs.flatpak-compiler-consumer.result == 'success') }}
    needs: [flatpak-build, flatpak-compiler-consumer]
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flatpak-runtime-repo
          path: ${{ runner.temp }}/flatpak-runtime-input
      - name: Install Runtime Test Infrastructure
        run: |
          sudo -E "$(command -v uv)" run --no-project ci/host_apt_mirrors.py
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update -qq
          sudo apt-get install -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -y --no-install-recommends flatpak xvfb dbus-daemon pipewire wireplumber \
            pipewire-pulse pipewire-bin pulseaudio-utils gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-pipewire libgl1-mesa-dri gcc pkg-config libglib2.0-dev libpipewire-0.3-dev \
            libpulse-dev libcurl4-openssl-dev ffmpeg gdb binutils
      - name: Run Installed Flatpak with Saved Capture Profile
        run: |
          tar -xf "$RUNNER_TEMP/flatpak-runtime-input/flatpak-runtime-repo.tar" -C "$RUNNER_TEMP/flatpak-runtime-input"
          # The release ships this bundle (#2400), so the test installs the
          # app from it, the way a user does; the Debug extension comes from
          # the repo. --runtime-repo lets `flatpak install` find the runtime.
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            "$RUNNER_TEMP/flatpak-runtime-input/repo" "$RUNNER_TEMP/obs-studio-rust-x86_64.flatpak" \
            io.github.obs_rust.OBSStudioRust master
          uv run --no-project ci/flatpak_runtime.py --repo "$RUNNER_TEMP/flatpak-runtime-input/repo" \
            --bundle "$RUNNER_TEMP/obs-studio-rust-x86_64.flatpak" \
            --output "$RUNNER_TEMP/flatpak-runtime-result"
      - name: Upload Tested Flatpak Bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-bundle
          path: ${{ runner.temp }}/obs-studio-rust-x86_64.flatpak
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Upload Flatpak Runtime Evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-runtime-evidence
          path: |
            ${{ runner.temp }}/flatpak-runtime-result/result.json
            ${{ runner.temp }}/flatpak-runtime-result/*.log
            ${{ runner.temp }}/flatpak-runtime-result/profile/obs-studio-rust/logs/*.txt
            ${{ runner.temp }}/flatpak-runtime-result/recordings/*.mkv
          if-no-files-found: error
          retention-days: 7

  windows-build:
    timeout-minutes: 90
    name: Windows 🪟
    strategy:
      # A missing qualification profile must not cancel the other axis.
      fail-fast: ${{ inputs.native-cache-reuse-source == '' }}
      matrix:
        architecture: [x64, arm64]
    runs-on: windows-2025-vs2026
    needs: check-event
    # OBS app builds are release-gating (#436): release gate, tags, schedule,
    # dispatch and path-triggered full PRs only.
    if: ${{ !inputs.flatpak-measurement-only && fromJSON(needs.check-event.outputs.full) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up uv for Native Release Reuse
        if: inputs.native-cache-reuse-source != ''
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}

      - name: Prepare Native Release Reuse
        id: native-reuse
        if: inputs.native-cache-reuse-source != ''
        shell: bash
        env:
          NATIVE_REUSE_SOURCE: ${{ inputs.native-cache-reuse-source }}
          NATIVE_CACHE_JOB_TOKEN: ${{ github.token }}
        run: |
          uv run --no-project ci/native_cache_identity.py --platform windows --architecture '${{ matrix.architecture }}' --configuration '${{ needs.check-event.outputs.config }}' --output "$RUNNER_TEMP/native-reuse-identity.json" --diagnostics "$RUNNER_TEMP/native-reuse-identity-diagnostics.json"
          uv run --no-project ci/native_cache_transport.py consume --require-hit --expected-source "$NATIVE_REUSE_SOURCE" --identity "$RUNNER_TEMP/native-reuse-identity.json" --destination "$RUNNER_TEMP/native-reuse-cache" --report "$RUNNER_TEMP/native-reuse-consume.json"
          uv run --no-project ci/native_cache_freshness.py prepare --root "$GITHUB_WORKSPACE" --state "$RUNNER_TEMP/native-reuse-state.json" --report "$RUNNER_TEMP/native-reuse-prepare.json"
          echo "cache_path=$RUNNER_TEMP/native-reuse-cache" >> "$GITHUB_OUTPUT"

      # Compiler cache: ccache masquerading as cl.exe through MSBuild's
      # CLToolExe (cmake/windows/compilerconfig.cmake, ENABLE_CCACHE in the
      # windows-ci presets). zccache and sccache cannot serve the Visual Studio
      # generator: neither runs as a cl.exe stand-in, and zccache 1.15.2 also
      # refuses every compile that carries /Fd, which CMake always passes.
      # No Actions cache for it: phase A of #1801 moved the app-build caches
      # out of the 10 GiB budget, so ccache starts empty in every build.

      - name: Set Up ccache 🗄️
        id: ccache
        env:
          NATIVE_REUSE_CACHE_PATH: ${{ steps.native-reuse.outputs.cache_path }}
        run: |
          # Set Up ccache 🗄️
          $Version = '4.14.1'
          $Hash = '6219f3865ca59aec41ee4b678df171d5d35855ecb2b6dbbbd20690b3a68af7b4'
          $Name = "ccache-${Version}-windows-x86_64"
          $Zip = "${env:RUNNER_TEMP}/${Name}.zip"

          Invoke-WebRequest -Uri "https://github.com/ccache/ccache/releases/download/v${Version}/${Name}.zip" -OutFile $Zip
          if ( (Get-FileHash -Algorithm SHA256 -Path $Zip).Hash -ne $Hash ) { throw "${Name}.zip checksum mismatch" }
          Expand-Archive -Path $Zip -DestinationPath $env:RUNNER_TEMP

          $CcacheHome = Join-Path $env:RUNNER_TEMP $Name
          $env:CCACHE_DIR = if ($env:NATIVE_REUSE_CACHE_PATH) { $env:NATIVE_REUSE_CACHE_PATH } else { Join-Path $env:GITHUB_WORKSPACE '.ccache' }
          $CcacheHome >> $env:GITHUB_PATH
          @(
            "CCACHE_DIR=${env:CCACHE_DIR}"
            'CCACHE_MAXSIZE=2G'
            'CCACHE_COMPILERCHECK=content'
            'CCACHE_SLOPPINESS=include_file_mtime,include_file_ctime'
          ) >> $env:GITHUB_ENV

          & (Join-Path $CcacheHome 'ccache.exe') --version | Select-Object -First 1
          & (Join-Path $CcacheHome 'ccache.exe') --zero-stats
          "epoch=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_OUTPUT

      # The GPU status light links Rust into every frontend build (#946), so
      # this job needs the Rust toolchain. setup-soldr provisions the one
      # rust-toolchain.toml pins and puts `soldr` on PATH; #2650 rewrote the
      # step below to `soldr rustup` without adding this, and both app builds
      # then died with `The term 'soldr' is not recognized` (#2699).
      - name: Set Up soldr 🦀
        uses: zackees/setup-soldr@c1bfc684de8c5f97b178c8837e3e8e6a7383676c # merge of forge-ci/setup-soldr#701: the fleet-cache tier (forge-ci/cache)
        with:
          # One scope for every caller (push.yaml, ci.yml), so PRs replay
          # the verdicts master publishes (forge-ci/setup-soldr#604).
          verdict-scope: build-project
          version: 0.9.54
          build-cache: false
          # Cook the workspace dependencies the app build compiles anyway.
          prebuild-deps-flags: --release
          save-cache-remote: ${{ github.ref == 'refs/heads/master' }}
          shims: true
          # The arm64 leg adds a target std library after setup (#507/#969).
          solo-toolchain-cache: false
          # Fleet cache (forge-ci/cache): same tier as macos-build -- inert unless
          # vars.FLEET_CACHE_URL is set. S3 stays configured; the fleet tier runs
          # first and a hit skips the S3 restore, so the two cannot fight.
          fleet-cache: auto
          fleet-cache-family: app
          # S3 remote cache: bucket forge-ci on DO Spaces nyc3; the 50G watermark is
          # enforced only on the merge_group singleton. No bucket/creds = feature off.
          s3-bucket: forge-ci
          s3-endpoint: nyc3.digitaloceanspaces.com
          s3-region: nyc3
          s3-cache-limit: 50G
        env:
          SOLDR_S3_CACHE_ACCESS_KEY: ${{ secrets.SOLDR_S3_CACHE_ACCESS_KEY }}
          SOLDR_S3_CACHE_SECRET_KEY: ${{ secrets.SOLDR_S3_CACHE_SECRET_KEY }}
          FLEET_CACHE_URL: ${{ vars.FLEET_CACHE_URL }}
          FLEET_CACHE_TOKEN: ${{ secrets.FLEET_CACHE_TOKEN }}

      # The arm64 leg cross-builds on an x64 runner and needs that target's
      # standard library too.
      - name: Add the Rust arm64 Windows target 🦀
        if: matrix.architecture == 'arm64'
        run: soldr rustup target add aarch64-pc-windows-msvc

      - name: Build OBS Studio 🧱
        uses: ./.github/actions/build-obs
        env:
          TWITCH_CLIENTID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_HASH: ${{ secrets.TWITCH_HASH }}
          RESTREAM_CLIENTID: ${{ secrets.RESTREAM_CLIENTID }}
          RESTREAM_HASH: ${{ secrets.RESTREAM_HASH }}
          YOUTUBE_CLIENTID: ${{ secrets.YOUTUBE_CLIENTID }}
          YOUTUBE_CLIENTID_HASH: ${{ secrets.YOUTUBE_CLIENTID_HASH }}
          YOUTUBE_SECRET: ${{ secrets.YOUTUBE_SECRET }}
          YOUTUBE_SECRET_HASH: ${{ secrets.YOUTUBE_SECRET_HASH }}
          GPU_PRIORITY_VAL: ${{ secrets.GPU_PRIORITY_VAL }}
        with:
          target: ${{ matrix.architecture }}
          config: ${{ needs.check-event.outputs.config }}

      - name: Verify Native Installed Binary Freshness
        if: inputs.native-cache-reuse-source != ''
        shell: bash
        run: |
          uv run --no-project ci/native_cache_identity.py --platform windows --architecture '${{ matrix.architecture }}' --configuration '${{ needs.check-event.outputs.config }}' --expected "$RUNNER_TEMP/native-reuse-identity.json" --output "$RUNNER_TEMP/native-reuse-final-identity.json" --diagnostics "$RUNNER_TEMP/native-reuse-final-identity-diagnostics.json"
          uv run --no-project ci/native_cache_freshness.py verify --root "$GITHUB_WORKSPACE" --state "$RUNNER_TEMP/native-reuse-state.json" --platform windows --architecture '${{ matrix.architecture }}' --report "$RUNNER_TEMP/native-reuse-freshness.json"

      - name: Restore Native Freshness Source
        if: always() && inputs.native-cache-reuse-source != ''
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/native-reuse-state.json" ]]; then
            uv run --no-project ci/native_cache_freshness.py restore --root "$GITHUB_WORKSPACE" --state "$RUNNER_TEMP/native-reuse-state.json" --report "$RUNNER_TEMP/native-reuse-restore.json"
          fi

      - name: Upload Native Build Reuse Evidence
        if: always() && inputs.native-cache-reuse-source != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-build-reuse-windows-${{ matrix.architecture }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-reuse-*.json
          retention-days: 1
          if-no-files-found: warn

      - name: Set Up uv for Cache Probe 🐍
        if: github.event_name == 'workflow_dispatch' && inputs.native-cache-probe
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}

      - name: Measure Windows Cache Budgets
        if: github.event_name == 'workflow_dispatch' && inputs.native-cache-probe
        run: uv run --no-project ci/native_cache_probe.py --target '${{ matrix.architecture }}' --config '${{ needs.check-event.outputs.config }}' --output '${{ runner.temp }}/native-cache-probe-${{ matrix.architecture }}'

      - name: Upload Windows Cache Probe
        if: always() && github.event_name == 'workflow_dispatch' && inputs.native-cache-probe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-cache-budget-${{ matrix.architecture }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-cache-probe-${{ matrix.architecture }}/report.json
          retention-days: 2
          if-no-files-found: error

      # Drop entries this build did not use so the saved cache stays the size
      # of one build.
      - name: Prune ccache 🧹
        if: inputs.native-cache-reuse-source == '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          # Prune ccache 🧹
          $Age = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - ${{ steps.ccache.outputs.epoch }} + 60
          ccache --evict-older-than "${Age}s"
          ccache --show-stats

      - name: Package OBS Studio 📀
        uses: ./.github/actions/package-obs
        if: ${{ inputs.native-cache-reuse-source == '' && fromJSON(needs.check-event.outputs.package) }}
        with:
          target: ${{ matrix.architecture }}
          config: ${{ needs.check-event.outputs.config }}
          package: ${{ fromJSON(needs.check-event.outputs.package) }}

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.native-cache-reuse-source == '' && fromJSON(needs.check-event.outputs.package) }}
        with:
          name: obs-studio-windows-${{ matrix.architecture }}-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/build_${{ matrix.architecture }}/obs-studio-*-windows-${{ matrix.architecture }}.zip

      # Identity evidence only; the separate manual publisher has its own token.
      - name: Set Up uv for Native Transport Identity
        if: inputs.native-cache-transport-probe
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}

      - name: Record Native Transport Identity
        if: inputs.native-cache-transport-probe
        run: >-
          uv run --no-project ci/native_cache_identity.py --platform windows
          --architecture '${{ matrix.architecture }}' --configuration '${{ needs.check-event.outputs.config }}'
          --output '${{ runner.temp }}/native-cache-identity.json'
          --diagnostics '${{ runner.temp }}/native-cache-identity-diagnostics.json'

      - name: Bind Native Transport Seed
        id: native-seed
        if: inputs.native-cache-transport-probe
        shell: bash
        run: >-
          uv run --no-project ci/native_cache_seed.py
          --identity '${{ runner.temp }}/native-cache-identity.json'
          --source-sha '${{ github.sha }}' --output "$GITHUB_OUTPUT"

      - name: Qualify Local Native Cache Archive
        shell: bash
        if: inputs.native-cache-transport-probe
        env:
          CACHE_SOURCE: ${{ github.workspace }}/.ccache
        run: >-
          uv run --no-project ci/native_cache_transport.py verify-local
          --identity '${{ runner.temp }}/native-cache-identity.json' --source "$CACHE_SOURCE"
          --report '${{ runner.temp }}/native-cache-local.json'

      # The transport job of this run publishes the seed (#782). It travels as
      # an artifact: the Actions cache has no room for it (#1801).
      - name: Upload Qualified Native Transport Seed
        if: inputs.native-cache-reuse-source == '' && inputs.native-cache-transport-probe && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-cache-seed-windows-${{ steps.native-seed.outputs.suffix }}
          path: ${{ github.workspace }}/.ccache
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload Local Native Cache Evidence
        if: always() && inputs.native-cache-transport-probe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-cache-local-windows-${{ matrix.architecture }}
          path: ${{ runner.temp }}/native-cache-local.json
          retention-days: 1
          if-no-files-found: warn

      - name: Upload Native Transport Identity
        if: inputs.native-cache-transport-probe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-cache-identity-windows-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/native-cache-identity.json
            ${{ runner.temp }}/native-cache-identity-diagnostics.json
          retention-days: 1
          if-no-files-found: error

  # zackees/ci.yml GATE-008/010: single immutable-base verifier. Unknown/old output contracts run real CI.
  ci-mode:
    name: CI Mode 🛂
    # Keep the successful dependency node on merge groups without a checkout.
    runs-on: ${{ github.event_name == 'merge_group' && vars.FORGE_QUICK_LABELS != '' && fromJSON(vars.FORGE_QUICK_LABELS) || 'ubuntu-latest' }}
    timeout-minutes: ${{ github.event_name == 'merge_group' && vars.FORGE_QUICK_LABELS != '' && 2 || 5 }}
    outputs:
      rust-test_hit: 'false'
      cross_hit: 'false'
      tier2-linux_hit: 'false'
      rust-test_name: ''
      cross_name: ''
      tier2-linux_name: ''
      trusted: ${{ steps.gate.outputs.trusted }}
      fast_path: ${{ steps.gate.outputs.fast_path }}
      admission: ${{ steps.gate.outputs.admission }}
      skip_checks: ${{ steps.gate.outputs.skip_checks }}
      skip_swift-format: ${{ steps.gate.outputs.skip_swift-format }}
      skip_validate-data: ${{ steps.gate.outputs.skip_validate-data }}
      skip_rust-tests-linux: ${{ steps.gate.outputs.skip_rust-tests-linux }}
      skip_rust-linux-tier2: ${{ steps.gate.outputs.skip_rust-linux-tier2 }}
      skip_rust-tier2-windows: ${{ steps.gate.outputs.skip_rust-tier2-windows }}
      skip_rust-tier2-macos: ${{ steps.gate.outputs.skip_rust-tier2-macos }}
      skip_rust-tests-windows: ${{ steps.gate.outputs.skip_rust-tests-windows }}
      skip_rust-tests-macos: ${{ steps.gate.outputs.skip_rust-tests-macos }}
      skip_rust-cross-lint: ${{ steps.gate.outputs.skip_rust-cross-lint }}
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' && !inputs.full
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set Up uv 🐍
        if: github.event_name == 'pull_request' && !inputs.full
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}
      - name: Verify Client Admission from Immutable Base 🛂
        id: gate
        if: github.event_name == 'pull_request' && !inputs.full
        # A broken verifier cannot grant a skip: all consumers compare to 'true'.
        continue-on-error: true
        run: |
          [[ "$BASE" =~ ^[0-9a-f]{40}$ && "$HEAD" =~ ^[0-9a-f]{40}$ && "$PR_NUMBER" =~ ^[0-9]+$ ]]
          git fetch -q --no-tags origin "$HEAD"
          git show "$BASE:ci/pr_attestation.py" > "$RUNNER_TEMP/pr-attestation.py"
          GITHUB_OUTPUT="$RUNNER_TEMP/admission-outputs" uv run --no-project --script "$RUNNER_TEMP/pr-attestation.py" --base "$BASE" --head "$HEAD" --number "$PR_NUMBER" > "$RUNNER_TEMP/admission.json"
          jq . "$RUNNER_TEMP/admission.json"
          # An older base verifier's legacy outputs are diagnostic only.
          if jq -e '.admission_version == 1 and .queue_policy == "heavy-v1"' "$RUNNER_TEMP/admission.json" > /dev/null; then
            cat "$RUNNER_TEMP/admission-outputs" >> "$GITHUB_OUTPUT"
          fi

  rust-tests-linux:
    # Fast Gate runs 7.7-11.3 min; 2x bounds a dead runner at 20 instead of
    # letting it hold the queue for an hour (#2593 A).
    timeout-minutes: 20
    name: Fast Gate ⚡
    runs-on: ${{ inputs.mq-heavy-labels != '' && fromJSON(inputs.mq-heavy-labels) || 'ubuntu-26.04' }}
    needs: [check-event, ci-mode]
    # A docs-only PR or queue run changes no Rust, C or CMake: skipped, and
    # passing CI Gate; the Format job still runs the ci/ self-tests (#2079).
    if: (github.event_name == 'merge_group' || needs.ci-mode.outputs.skip_rust-tests-linux != 'true') && needs.check-event.outputs.docs_only != 'true'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Fast gate (#992): one runner for the PR path: format checks, rustfmt,
      # clippy, Dylint, then the unit tests of the crates the diff touches
      # (ci/rust_scope.py). No Qt: cargo test never needs it; the Qt job owns
      # Qt. The full workspace tests and the windows-gnu link run on master.
      # platform-nix.c includes uuid/uuid.h. This runner does not ship it.
      # The oracle compile and the Rust libuuid link both need the package.
      # The obs-util D-Bus and portal inhibitors link GIO. The portal oracle
      # needs the headers even when the gio Cargo feature is off.
      # The mirror step runs before soldr and before every package install, and
      # it is Python now: this job has no earlier step that installs uv.
      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}

      - name: Install libuuid and GIO
        run: |
          sudo -E "$(command -v uv)" run --no-project ci/host_apt_mirrors.py
          # Match runner-images' bounded mirror failover (#1269). CLI options
          # take precedence over older images' late apt.conf.d overrides.
          apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get install "${apt_options[@]}" -y uuid-dev libglib2.0-dev libxkbcommon-dev

      # Same soldr-wrapped commands as docs/rust-port/testing-policy.md.
      # setup-soldr provisions the toolchain (with the clippy/rustfmt
      # components) from rust-toolchain.toml and restores its dependency cook
      # cache and cargo registry. Remote saves only warm master; PR and
      # merge-group runs restore. Local act/act2 saves stay enabled.
      - name: Set Up soldr 🦀
        id: setup-soldr
        uses: zackees/setup-soldr@dd26c92eb35c553b208bb741326b6d54cf611436 # setup-soldr#707
        with:
          # One scope for every caller (push.yaml, ci.yml), so PRs replay
          # the verdicts master publishes (forge-ci/setup-soldr#604).
          verdict-scope: build-project
          # soldr 0.9.54 embeds zccache 1.15.14+ (has zackees/zccache#1937).
          version: 0.9.54
          build-cache: false
          # Fast Gate's consumer is `cargo test`, so cook the `test` profile
          # it compiles in: a `--release` cook on core runs left that build
          # rebuilding from scratch (1m09s-1m37s, #2661).
          prebuild-deps-flags: --profile dev -- --tests
          # Host/container archive paths have different Actions-cache versions.
          # Explicit identities stop the janitor treating them as duplicates.
          cache-key-suffix: linux-host-v3
          save-cache-remote: ${{ github.ref == 'refs/heads/master' }}
          # The lanes add x86_64-pc-windows-gnu mid-job; the toolchain cache
          # would save it without its std (zackees/setup-soldr#507, #969).
          solo-toolchain-cache: false
          # S3 remote cache: bucket forge-ci on DO Spaces nyc3; the 50G watermark is
          # enforced only on the merge_group singleton. No bucket/creds = feature off.
          s3-bucket: forge-ci
          s3-endpoint: nyc3.digitaloceanspaces.com
          s3-region: nyc3
          s3-cache-limit: 50G
        env:
          SETUP_SOLDR_PERSISTENT_CHECKPOINT: ${{ runner.environment == 'self-hosted' && 'boot' || '' }}
          SOLDR_S3_CACHE_ACCESS_KEY: ${{ (github.event_name != 'pull_request' || inputs.mq-heavy-labels == '') && secrets.SOLDR_S3_CACHE_ACCESS_KEY || '' }}
          SOLDR_S3_CACHE_SECRET_KEY: ${{ (github.event_name != 'pull_request' || inputs.mq-heavy-labels == '') && secrets.SOLDR_S3_CACHE_SECRET_KEY || '' }}

      # GATE-001 mirror (local-gate.toml): exactly the local gate's lint and
      # rust-test lanes (./lint, ./unittest), i.e. rustfmt, clippy -D warnings,
      # clang-format, gersemi and soldr cargo test --workspace --locked.
      # The ci/ self-tests run in the Checks job on the standard pool (#427).
      - name: Local Gate (lint) 🧪
        id: local-gate
        if: github.event_name != 'merge_group'
        env:
          OBS_GATE_SKIP_SELF_TEST: "1"
          BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.sha }}
        run: |
          uv run --no-project ci/local_gate.py --lane lint --lane dylint
          git fetch -q --depth=1 origin "${BASE}"
          # Writes key=/name= to $GITHUB_OUTPUT; surfaces touched by the change
          # leave name= empty, which skips the upload below.
          uv run --no-project ci/lane_proof.py key --lane dylint --base "${BASE}"
          touch "${{ runner.temp }}/dylint-lane-proof"

      - name: Local Gate (queue checks) 🧪
        if: github.event_name == 'merge_group'
        env:
          OBS_GATE_SKIP_SELF_TEST: "1"
        run: uv run --no-project ci/local_gate.py --lane lint --queue-checks

      - name: Upload Dylint Lane Proof 🧾
        if: github.event_name != 'merge_group' && steps.local-gate.outputs.name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.local-gate.outputs.name }}
          path: ${{ runner.temp }}/dylint-lane-proof
          retention-days: 3
          if-no-files-found: error

      - name: Unit Tests (changed crates) 🧪
        if: needs.check-event.outputs.deferred == 'true' && (github.event_name == 'merge_group' || needs.ci-mode.outputs.rust-test_hit != 'true')
        env:
          BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          # nextest comes through the authenticated API, not the anonymous URL (#4209).
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch -q --depth=1 origin "${BASE}"
          uv run --no-project ci/local_gate.py --test-diff "${BASE}"

      # Step 3 (#992): only the plugin/shared modules the diff touches, on
      # Linux, one configure with ENABLE_FRONTEND=OFF (no Qt). Master and full
      # runs build everything in the Ubuntu app builds instead.
      # Scoped master pushes also warm this exact configuration for later PRs.
      - name: Restore ccache 💾
        if: needs.check-event.outputs.linux_targets != '' && (needs.check-event.outputs.deferred == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/master'))
        uses: ./.github/actions/cache
        with:
          mode: restore
          path: ${{ github.workspace }}/.targets-ccache
          key: targets-ccache-linux-${{ github.sha }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}
          restore-keys: targets-ccache-linux-
      # The host package set differs from the Tier 2 container. Keep only
      # host .debs in a workspace-relative archive; PRs restore, master saves.
      - name: Prepare Touched Target apt Directory
        id: target-apt
        if: needs.check-event.outputs.linux_targets != '' && (needs.check-event.outputs.deferred == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/master'))
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/.targets-apt"
          echo "image=${ImageVersion:-ubuntu2604}" >> "$GITHUB_OUTPUT"
      - name: Restore Touched Target apt Downloads
        if: needs.check-event.outputs.linux_targets != '' && (needs.check-event.outputs.deferred == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/master'))
        uses: ./.github/actions/cache
        with:
          mode: restore
          path: ${{ github.workspace }}/.targets-apt/*.deb
          key: targets-apt-ubuntu2604-${{ steps.target-apt.outputs.image }}-${{ hashFiles('rust/tools/linux-validate/apt-packages.txt') }}-${{ github.sha }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}
          restore-keys: targets-apt-ubuntu2604-${{ steps.target-apt.outputs.image }}-${{ hashFiles('rust/tools/linux-validate/apt-packages.txt') }}-
      - name: Build Touched Linux Targets 🧱
        if: needs.check-event.outputs.linux_targets != '' && (needs.check-event.outputs.deferred == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/master'))
        env:
          TARGETS: ${{ needs.check-event.outputs.linux_targets }}
          CCACHE_DIR: ${{ github.workspace }}/.targets-ccache
          APT_ARCHIVES: ${{ github.workspace }}/.targets-apt
        run: |
          git submodule update --init --recursive -q
          sudo apt-get update -qq
          shopt -s nullglob
          packages=("$APT_ARCHIVES"/*.deb)
          echo "apt archives available: ${#packages[@]}"
          # Distro Qt headers only so configure passes: plugins/frontend-tools is a
          # core module that calls find_package(Qt6 REQUIRED). Nothing Qt is built
          # or tested here (only the touched targets); that is the Qt lane's job.
          grep -v '^#' rust/tools/linux-validate/apt-packages.txt |
            xargs "${GITHUB_WORKSPACE}/.github/scripts/retry" sudo apt-get install -o "Dir::Cache::archives=$APT_ARCHIVES" -o Binary::apt-get::APT::Keep-Downloaded-Packages=true -y --no-install-recommends
          # The launcher below; apt-packages.txt no longer lists it (#957, #1183).
          "${GITHUB_WORKSPACE}/.github/scripts/retry" sudo apt-get install -o "Dir::Cache::archives=$APT_ARCHIVES" -o Binary::apt-get::APT::Keep-Downloaded-Packages=true -y --no-install-recommends ccache
          packages=("$APT_ARCHIVES"/*.deb)
          echo "apt archive retained packages: ${#packages[@]}"
          if [ "${#packages[@]}" -gt 0 ]; then du -ch "${packages[@]}" | tail -1; fi
          ccache --max-size=250M
          ccache --zero-stats
          cmake -S . -B "${RUNNER_TEMP}/targets" -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DENABLE_FRONTEND=OFF -DENABLE_SCRIPTING=OFF -DENABLE_BROWSER=OFF -DENABLE_WEBSOCKET=OFF \
            -DENABLE_AJA=OFF -DENABLE_WEBRTC=OFF -DENABLE_QSV11=OFF -DENABLE_VST=OFF -DENABLE_WAYLAND=OFF \
            -DENABLE_DECKLINK=OFF
          avail=$(cmake --build "${RUNNER_TEMP}/targets" -- -t targets all | cut -d: -f1)
          build=()
          for t in ${TARGETS//,/ }; do
            if grep -qx "$t" <<<"$avail"; then build+=("$t"); else echo "no Linux target $t: skipped"; fi
          done
          [ "${#build[@]}" -eq 0 ] || cmake --build "${RUNNER_TEMP}/targets" --target "${build[@]}"
          ccache --show-stats --verbose
          du -sh "$CCACHE_DIR"

      - name: Save Touched Target ccache 💾
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.check-event.outputs.linux_targets != ''
        uses: ./.github/actions/cache
        with:
          mode: save
          path: ${{ github.workspace }}/.targets-ccache
          key: targets-ccache-linux-${{ github.sha }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}

      - name: Check Touched Target apt Snapshot
        id: target-apt-size
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.check-event.outputs.linux_targets != ''
        env:
          APT_ARCHIVES: ${{ github.workspace }}/.targets-apt
        run: |
          size_mib=$(sudo du -sm "$APT_ARCHIVES" | cut -f1)
          echo "Host apt snapshot: ${size_mib} MiB (200 MiB save limit)"
          if [ "$size_mib" -le 200 ]; then
            echo 'save=true' >> "$GITHUB_OUTPUT"
          else
            echo '::warning::Host apt snapshot exceeds family bound; keeping prior remote entry'
            echo 'save=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Save Touched Target apt Downloads
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.check-event.outputs.linux_targets != '' && steps.target-apt-size.outputs.save == 'true'
        uses: ./.github/actions/cache
        with:
          mode: save
          path: ${{ github.workspace }}/.targets-apt/*.deb
          key: targets-apt-ubuntu2604-${{ steps.target-apt.outputs.image }}-${{ hashFiles('rust/tools/linux-validate/apt-packages.txt') }}-${{ github.sha }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}

      # Skipped when a trusted run already passed these exact inputs.
      - name: Local Gate (rust-test) 🧪
        if: needs.check-event.outputs.deferred != 'true' && (github.event_name == 'merge_group' || needs.ci-mode.outputs.rust-test_hit != 'true')
        env:
          # nextest comes through the authenticated API, not the anonymous URL (#4209).
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-project ci/local_gate.py --lane rust-test

      # Publish the pass as a lane proof (ci/lane_proof.py), only for a lane
      # that ran here and passed; the name carries the lane's input key.
      - name: Mark Lane Proof 🧾
        if: success() && needs.check-event.outputs.deferred != 'true' && needs.ci-mode.outputs.rust-test_name != '' && needs.ci-mode.outputs.rust-test_hit != 'true'
        run: touch "${{ runner.temp }}/lane-proof"
      - name: Upload Lane Proof 🧾
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() && needs.check-event.outputs.deferred != 'true' && needs.ci-mode.outputs.rust-test_name != '' && needs.ci-mode.outputs.rust-test_hit != 'true'
        with:
          name: ${{ needs.ci-mode.outputs.rust-test_name }}
          path: ${{ runner.temp }}/lane-proof
          retention-days: 3
          if-no-files-found: error

      # proptest writes a failing case to rust/<crate>/tests/proptest-regressions/<test>.txt
      # on the runner; a lane that does not keep the directory loses the only copy
      # of the case that made it red (#2993, #2988). Only new or changed entries are
      # echoed into the job summary, so a reader of the red run gets the seed too.
      - name: Note proptest regressions 🗂️
        if: ${{ failure() }}
        shell: bash
        run: |
          : Note proptest regressions 🗂️
          shopt -s nullglob
          for f in rust/*/tests/proptest-regressions/*.txt; do
            [[ -n "$(git status --porcelain --untracked-files=all -- "$f")" ]] || continue
            {
              echo "### New proptest case \`$f\`"
              echo '```'
              cat "$f"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          done

      - name: Upload proptest regressions 🗂️
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proptest-regressions-${{ runner.os }}
          path: rust/*/tests/proptest-regressions/
          if-no-files-found: ignore
          retention-days: 7

      # Cache observability: nothing else in CI says whether the compiler cache
      # is helping. Fail-open: an unavailable report prints one line.
      - name: Report soldr cache 📊
        if: always()
        shell: bash
        run: uv run --no-project ci/soldr_cache_report.py >> "$GITHUB_STEP_SUMMARY" || echo "soldr cache report unavailable" >> "$GITHUB_STEP_SUMMARY"

      # Storage on the Spaces account, with the remote cache's credentials, so the
      # 50G watermark is visible instead of inferred. AWS CLI ships on ubuntu-26.04.
      - name: Report S3 cache size 🗄️
        if: ${{ !cancelled() && github.ref == 'refs/heads/master' }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ (github.event_name != 'pull_request' || inputs.mq-heavy-labels == '') && secrets.SOLDR_S3_CACHE_ACCESS_KEY || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ (github.event_name != 'pull_request' || inputs.mq-heavy-labels == '') && secrets.SOLDR_S3_CACHE_SECRET_KEY || '' }}
          AWS_DEFAULT_REGION: nyc3
        run: |
          if ! command -v aws >/dev/null; then
            echo "S3 cache size unavailable (aws CLI not on this runner)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          out=$(aws s3 ls "s3://forge-ci" --recursive --summarize \
                  --endpoint-url "https://nyc3.digitaloceanspaces.com" 2>/dev/null || true)
          if [ -z "$out" ]; then
            echo "S3 cache size unavailable (credentials or endpoint)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bytes=$(printf '%s\n' "$out" | awk '/Total Size:/ {print $3}')
          objs=$(printf '%s\n' "$out" | awk '/Total Objects:/ {print $3}')
          {
            echo "### S3 cache (forge-ci @ nyc3)"
            echo "- objects: ${objs:-?}"
            echo "- size: ${bytes:-?} bytes ($(( (${bytes:-0}) / 1024 / 1024 / 1024 )) GiB)"
            echo "- watermark: 50 GiB"
          } >> "$GITHUB_STEP_SUMMARY"

      # Per-lane cache ledger; ci/cache_baseline.py rolls these up. Fail-open.
      - name: Cache ledger 📒
        if: always() && hashFiles('.github/actions/job-cache-ledger/action.yaml') != ''
        uses: ./.github/actions/job-cache-ledger
        with:
          lane: fast-gate
          setup-phase-summary: ${{ steps.setup-soldr.outputs.setup-phase-summary }}

  # Compile-only cross check (cmake/cross/, #1294) of the Windows and macOS
  # host groups a change touches, on Linux with soldr's LLVM and SDKs. PR CI
  # builds no Windows or macOS app, so without it a broken host group first
  # fails on the nightly. ci/ci_scope.py picks the aliases (cross_targets).
  cross-compile:
    timeout-minutes: 45
    name: Cross Compile 🧰 (${{ needs.check-event.outputs.cross_targets }})
    runs-on: ${{ inputs.mq-heavy-labels != '' && fromJSON(inputs.mq-heavy-labels) || 'ubuntu-26.04' }}
    needs: [check-event, ci-mode]
    if: ${{ (github.event_name != 'pull_request' || needs.ci-mode.outputs.fast_path != 'true') && !inputs.flatpak-measurement-only && needs.check-event.outputs.cross_targets != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # win-dshow's groups include libdshowcapture; no other submodule is compiled.
      - name: Check Out libdshowcapture 📥
        run: git submodule update --init --depth 1 deps/libdshowcapture/src

      - name: Set Up soldr 🦀
        uses: zackees/setup-soldr@dd26c92eb35c553b208bb741326b6d54cf611436 # setup-soldr#707
        with:
          verdict-scope: build-project
          version: 0.9.54
          build-cache: false
          # Compile-only C/C++ lane; opt-in Rust linking uses a cross-target
          # release tree, not this host dev cook (#3767).
          prebuild-deps: none
          cargo-registry-cache: true
          save-cache-remote: ${{ github.ref == 'refs/heads/master' }}
          # The cross toolchain adds targets mid-job (cmake/common/soldr.cmake).
          solo-toolchain-cache: false
          # S3 remote cache: bucket forge-ci on DO Spaces nyc3; the 50G watermark is
          # enforced only on the merge_group singleton. No bucket/creds = feature off.
          s3-bucket: forge-ci
          s3-endpoint: nyc3.digitaloceanspaces.com
          s3-region: nyc3
          s3-cache-limit: 50G
        env:
          SETUP_SOLDR_PERSISTENT_CHECKPOINT: ${{ runner.environment == 'self-hosted' && 'boot' || '' }}
          SOLDR_S3_CACHE_ACCESS_KEY: ${{ (github.event_name != 'pull_request' || inputs.mq-heavy-labels == '') && secrets.SOLDR_S3_CACHE_ACCESS_KEY || '' }}
          SOLDR_S3_CACHE_SECRET_KEY: ${{ (github.event_name != 'pull_request' || inputs.mq-heavy-labels == '') && secrets.SOLDR_S3_CACHE_SECRET_KEY || '' }}

      # The mirror step runs before every package install, and it is Python
      # now: soldr does not install uv, so without this the step fails with
      # `uv: command not found` (exit 127).
      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}

      - name: Install Build Dependencies 📦
        run: |
          sudo -E "$(command -v uv)" run --no-project ci/host_apt_mirrors.py
          apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          sudo apt-get "${apt_options[@]}" update
          # The cross SDK's host Qt uic links GLib. Hosted images include it;
          # minimal self-hosted queue runners need the runtime explicitly.
          sudo apt-get install "${apt_options[@]}" -y --no-install-recommends cmake ninja-build libglib2.0-0t64

      - name: Cross Compile 🧰
        env:
          CROSS_TARGETS: ${{ needs.check-event.outputs.cross_targets }}
          # The host Qt comes through the authenticated API, not the anonymous URL (#4209).
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          IFS=, read -ra aliases <<< "${CROSS_TARGETS}"
          for alias in "${aliases[@]}"; do
            echo "::group::cross ${alias}"
            OBS_CROSS_TARGET="${alias}" cmake -S cmake/cross -B "build_cross_${alias}" -G Ninja -DOBS_CROSS_TARGET="${alias}"
            OBS_CROSS_TARGET="${alias}" cmake --build "build_cross_${alias}" -- -k 0
            echo "::endgroup::"
          done

  # Clippy and Dylint for Windows and both macOS targets, cross-checked on
  # Linux through soldr (#472). Every PR push runs it unless the head is
  # attested for the same gates (the `cross` local-gate lane).
  rust-cross-lint:
    timeout-minutes: 45
    name: ${{ github.event_name == 'merge_group' && 'Rust Cross Test Link 🔗' || 'Rust Cross Lint 🦀' }} (${{ matrix.target }})
    # Each target gets a fresh disk; two linked test graphs exhaust one runner.
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-apple-darwin]
        # The dedicated Windows Link Check links the same Rust categories on the queue.
        exclude: ${{ fromJSON(github.event_name == 'merge_group' && needs.check-event.outputs.deferred == 'true' && needs.check-event.outputs.windows_link == 'true' && '[{"target":"x86_64-pc-windows-msvc"}]' || '[]') }}
    runs-on: ${{ inputs.mq-heavy-labels != '' && fromJSON(inputs.mq-heavy-labels) || 'ubuntu-26.04' }}
    # Independent of Fast Gate: no outputs/artifacts consumed (Refs #4990).
    needs: [check-event, ci-mode]
    if: ${{ !inputs.flatpak-measurement-only && !inputs.native-cache-measurement-only && always() && !cancelled() && ((github.event_name == 'pull_request' && needs.check-event.outputs.docs_only != 'true' && needs.ci-mode.outputs.skip_rust-cross-lint != 'true') || (github.event_name == 'merge_group' && needs.check-event.outputs.cross_lint == 'true') || (github.event_name != 'pull_request' && github.event_name != 'merge_group' && (needs.check-event.outputs.deferred != 'true' || needs.check-event.outputs.macos == 'true' || needs.check-event.outputs.windows == 'true' || needs.check-event.outputs.cross_lint == 'true'))) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set Up soldr 🦀
        uses: zackees/setup-soldr@dd26c92eb35c553b208bb741326b6d54cf611436 # setup-soldr#707
        with:
          # One scope for every caller (push.yaml, ci.yml), so PRs replay
          # the verdicts master publishes (forge-ci/setup-soldr#604).
          verdict-scope: build-project
          version: 0.9.54
          build-cache: false
          # One Linux layer with Fast Gate: a second profile is a second 1.2 GB
          # entry of the `deps` family (#2661).
          prebuild-deps-flags: --profile dev -- --tests
          # Dell only (persistent root, local cook store): one cook recipe per
          # unit set this job compiles (forge-ci/setup-soldr#675). Blank on
          # hosted runners, so the shared hosted key is unchanged (#2661).
          prebuild-deps-recipes: |
            ${{ inputs.mq-heavy-labels != '' && github.event_name != 'merge_group' && format('--profile dev --target {0} -- --tests --check', matrix.target) || '' }}
            ${{ inputs.mq-heavy-labels != '' && format('--profile dev --target {0} -- --tests', matrix.target) || '' }}
          cache-key-suffix: linux-host-v3
          save-cache-remote: ${{ github.ref == 'refs/heads/master' }}
          # The cross lane adds targets mid-job (see the Rust Tests job, #969).
          solo-toolchain-cache: false
          # S3 remote cache: bucket forge-ci on DO Spaces nyc3; the 50G watermark is
          # enforced only on the merge_group singleton. No bucket/creds = feature off.
          s3-bucket: forge-ci
          s3-endpoint: nyc3.digitaloceanspaces.com
          s3-region: nyc3
          s3-cache-limit: 50G
        env:
          SETUP_SOLDR_PERSISTENT_CHECKPOINT: ${{ runner.environment == 'self-hosted' && 'boot' || '' }}
          SOLDR_S3_CACHE_ACCESS_KEY: ${{ (github.event_name != 'pull_request' || inputs.mq-heavy-labels == '') && secrets.SOLDR_S3_CACHE_ACCESS_KEY || '' }}
          SOLDR_S3_CACHE_SECRET_KEY: ${{ (github.event_name != 'pull_request' || inputs.mq-heavy-labels == '') && secrets.SOLDR_S3_CACHE_SECRET_KEY || '' }}

      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}

      - name: Local Gate (cross) 🧪
        if: github.event_name != 'merge_group'
        run: uv run --no-project ci/local_gate.py --lane cross --cross-target ${{ matrix.target }}

      - name: Local Gate (queue cross test link) 🔗
        if: github.event_name == 'merge_group'
        run: uv run --no-project ci/local_gate.py --lane cross --cross-target ${{ matrix.target }} --queue-checks

  # A proof represents BOTH targets. Never publish it from a single matrix leg.
  rust-cross-proof:
    name: Rust Cross Lane Proof 🧾
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ci-mode, rust-cross-lint]
    if: ${{ github.event_name != 'merge_group' && success() && needs.rust-cross-lint.result == 'success' && needs.ci-mode.outputs.cross_name != '' && needs.ci-mode.outputs.cross_hit != 'true' }}
    steps:
      # Publish the pass as a lane proof (ci/lane_proof.py), only for a lane
      # that ran here and passed; the name carries the lane's input key.
      - name: Mark Lane Proof 🧾
        if: success() && needs.ci-mode.outputs.cross_name != '' && needs.ci-mode.outputs.cross_hit != 'true'
        run: touch "${{ runner.temp }}/lane-proof"
      - name: Upload Lane Proof 🧾
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() && needs.ci-mode.outputs.cross_name != '' && needs.ci-mode.outputs.cross_hit != 'true'
        with:
          name: ${{ needs.ci-mode.outputs.cross_name }}
          path: ${{ runner.temp }}/lane-proof
          retention-days: 3
          if-no-files-found: error

  # The deferred PR/queue tier skips rust-cross-lint and the native Windows
  # lanes, so COFF-only link defects reached master (`undefined symbol:
  # obs_encoder_get_caps`, merge_group 42390201886 green, push 42393067345
  # red). This is only the cross lane's link step for Windows x64: no clippy,
  # Dylint. Selected Tier 2 links run in the independent alias matrix below.
  rust-windows-link:
    timeout-minutes: 30
    name: Windows Link Check 🔗 (x86_64-pc-windows-msvc)
    runs-on: ${{ inputs.mq-heavy-labels != '' && fromJSON(inputs.mq-heavy-labels) || 'ubuntu-26.04' }}
    needs: [check-event, ci-mode]
    # Category links retain their existing member-admission policy.
    if: ${{ (github.event_name != 'pull_request' || needs.ci-mode.outputs.fast_path != 'true') && !inputs.flatpak-measurement-only && !inputs.native-cache-measurement-only && needs.check-event.outputs.deferred == 'true' && needs.check-event.outputs.docs_only != 'true' && needs.check-event.outputs.windows_link == 'true' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set Up soldr 🦀
        uses: zackees/setup-soldr@dd26c92eb35c553b208bb741326b6d54cf611436 # setup-soldr#707
        with:
          # Same scope and layer as rust-cross-lint, so it replays master's cache.
          verdict-scope: build-project
          version: 0.9.54
          build-cache: false
          prebuild-deps-flags: --profile dev -- --tests
          cache-key-suffix: linux-host-v3
          save-cache-remote: ${{ github.ref == 'refs/heads/master' }}
          # The Windows target is added mid-job (see rust-cross-lint, #969).
          solo-toolchain-cache: false
          # S3 remote cache: bucket forge-ci on DO Spaces nyc3; the 50G watermark is
          # enforced only on the merge_group singleton. No bucket/creds = feature off.
          s3-bucket: forge-ci
          s3-endpoint: nyc3.digitaloceanspaces.com
          s3-region: nyc3
          s3-cache-limit: 50G
        env:
          SETUP_SOLDR_PERSISTENT_CHECKPOINT: ${{ runner.environment == 'self-hosted' && 'boot' || '' }}
          SOLDR_S3_CACHE_ACCESS_KEY: ${{ (github.event_name != 'pull_request' || inputs.mq-heavy-labels == '') && secrets.SOLDR_S3_CACHE_ACCESS_KEY || '' }}
          SOLDR_S3_CACHE_SECRET_KEY: ${{ (github.event_name != 'pull_request' || inputs.mq-heavy-labels == '') && secrets.SOLDR_S3_CACHE_SECRET_KEY || '' }}

      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}

      - name: Link Windows Test Binaries 🔗
        env:
          OBS_CMOCKA_LINK: 'false'
        run: uv run --no-project ci/windows_link_check.py

  # The merge queue and PRs run the Windows Rust tests on Linux (#5845, #5843):
  # the x86_64-pc-windows-msvc test binaries are cross-built with soldr and
  # executed under Wine. The native windows-2025-vs2026 lane keeps the full run
  # (clippy, Qt SDK, tests Wine cannot run) on schedule, dispatch and master.
  rust-tests-windows-wine:
    timeout-minutes: 45
    name: Rust Tests 🦀 (windows, wine)
    runs-on: ${{ inputs.mq-heavy-labels != '' && fromJSON(inputs.mq-heavy-labels) || 'ubuntu-26.04' }}
    needs: [check-event, ci-mode]
    if: ${{ (github.event_name != 'pull_request' || needs.ci-mode.outputs.fast_path != 'true') && !inputs.flatpak-measurement-only && !inputs.native-cache-measurement-only && needs.check-event.outputs.deferred == 'true' && needs.check-event.outputs.docs_only != 'true' && needs.check-event.outputs.windows == 'true' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set Up soldr 🦀
        uses: zackees/setup-soldr@dd26c92eb35c553b208bb741326b6d54cf611436 # setup-soldr#707
        with:
          # Same scope and layer as rust-windows-link, so it replays its cache.
          verdict-scope: build-project
          version: 0.9.54
          build-cache: false
          prebuild-deps-flags: --profile dev -- --tests
          cache-key-suffix: linux-host-v3
          save-cache-remote: ${{ github.ref == 'refs/heads/master' }}
          solo-toolchain-cache: false
          s3-bucket: forge-ci
          s3-endpoint: nyc3.digitaloceanspaces.com
          s3-region: nyc3
          s3-cache-limit: 50G
        env:
          SETUP_SOLDR_PERSISTENT_CHECKPOINT: ${{ runner.environment == 'self-hosted' && 'boot' || '' }}
          SOLDR_S3_CACHE_ACCESS_KEY: ${{ (github.event_name != 'pull_request' || inputs.mq-heavy-labels == '') && secrets.SOLDR_S3_CACHE_ACCESS_KEY || '' }}
          SOLDR_S3_CACHE_SECRET_KEY: ${{ (github.event_name != 'pull_request' || inputs.mq-heavy-labels == '') && secrets.SOLDR_S3_CACHE_SECRET_KEY || '' }}

      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}

      # The Dell pool image ships no apt lists, so refresh them first (#5859).
      - name: Install Wine 🍷
        timeout-minutes: 10
        run: |
          command -v wine > /dev/null && exit 0
          sudo -E "$(command -v uv)" run --no-project ci/host_apt_mirrors.py
          timeout --kill-after=10s 240 sudo apt-get -o Acquire::Retries=1 update
          "${GITHUB_WORKSPACE}/.github/scripts/retry" timeout --kill-after=10s 300 sudo apt-get -o Acquire::Retries=1 install -y --no-install-recommends wine wine64 libwine

      - name: Run Windows Rust Tests Under Wine 🍷
        run: uv run --no-project ci/windows_wine_tests.py

  cmocka-link:
    timeout-minutes: 30
    name: Tier 2 Link Check 🔗 (${{ matrix.alias }})
    runs-on: ${{ inputs.mq-heavy-labels != '' && fromJSON(inputs.mq-heavy-labels) || 'ubuntu-26.04' }}
    needs: [check-event, ci-mode]
    # Run both inventories on fallback PRs and on the selected merge groups.
    # No category or other alias dependency: the three link legs can overlap.
    if: ${{ (github.event_name != 'pull_request' || needs.ci-mode.outputs.fast_path != 'true') && !inputs.flatpak-measurement-only && !inputs.native-cache-measurement-only && needs.check-event.outputs.deferred == 'true' && needs.check-event.outputs.docs_only != 'true' && needs.check-event.outputs.cmocka_link == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        alias: [win-x64, mac-arm64]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set Up soldr 🦀
        uses: zackees/setup-soldr@dd26c92eb35c553b208bb741326b6d54cf611436 # setup-soldr#707
        with:
          # Same scope and layer as rust-cross-lint, so it replays master's cache.
          verdict-scope: build-project
          version: 0.9.54
          build-cache: false
          # Cross-release archives and Corrosion use separate target trees (#5224).
          prebuild-deps: none
          cargo-registry-cache: true
          cache-key-suffix: linux-host-v3
          save-cache-remote: ${{ github.ref == 'refs/heads/master' }}
          # The Windows target is added mid-job (see rust-cross-lint, #969).
          solo-toolchain-cache: false
          # S3 remote cache: bucket forge-ci on DO Spaces nyc3; the 50G watermark is
          # enforced only on the merge_group singleton. No bucket/creds = feature off.
          s3-bucket: forge-ci
          s3-endpoint: nyc3.digitaloceanspaces.com
          s3-region: nyc3
          s3-cache-limit: 50G
        env:
          SETUP_SOLDR_PERSISTENT_CHECKPOINT: ${{ runner.environment == 'self-hosted' && 'boot' || '' }}
          SOLDR_S3_CACHE_ACCESS_KEY: ${{ (github.event_name != 'pull_request' || inputs.mq-heavy-labels == '') && secrets.SOLDR_S3_CACHE_ACCESS_KEY || '' }}
          SOLDR_S3_CACHE_SECRET_KEY: ${{ (github.event_name != 'pull_request' || inputs.mq-heavy-labels == '') && secrets.SOLDR_S3_CACHE_SECRET_KEY || '' }}

      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}

      # uv wheels avoid the 165 s apt mirror setup observed in run 44495240642.
      # CMake 3.31 retains clang-cl /showIncludes, understood by pinned ccache;
      # 4.3 forwards -clang:-M* dependency flags which ccache cannot cache.
      - name: Link Tier 2 Fixtures 🔗
        run: uv run --no-project --with cmake==3.31.10 --with ninja==1.13.0 ci/cmocka_link_check.py --alias ${{ matrix.alias }}

  # Windows Tier 2 on Linux (#5844, #5843): the queue cross-builds every cmocka
  # executable plus hybrid obs.dll with soldr's clang-cl SDK and runs them under
  # headless Wine on PRs and in the queue. Native rust-tier2-windows (and its
  # C-reference baseline) runs on master, schedule, dispatch and release.
  rust-tier2-windows-wine:
    timeout-minutes: 45
    name: Rust Tier 2 (windows, wine)
    runs-on: ${{ inputs.mq-heavy-labels != '' && fromJSON(inputs.mq-heavy-labels) || 'ubuntu-26.04' }}
    needs: [check-event, ci-mode]
    if: ${{ (github.event_name != 'pull_request' || needs.ci-mode.outputs.fast_path != 'true') && !inputs.flatpak-measurement-only && !inputs.native-cache-measurement-only && needs.check-event.outputs.deferred == 'true' && needs.check-event.outputs.docs_only != 'true' && needs.check-event.outputs.windows == 'true' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set Up soldr 🦀
        uses: zackees/setup-soldr@dd26c92eb35c553b208bb741326b6d54cf611436 # setup-soldr#707
        with:
          verdict-scope: build-project
          version: 0.9.54
          build-cache: false
          # Cross target tree; no host Rust consumer reuses a cook (#5844).
          prebuild-deps: none
          cargo-registry-cache: true
          cache-key-suffix: linux-host-v3
          save-cache-remote: ${{ github.ref == 'refs/heads/master' }}
          solo-toolchain-cache: false
          s3-bucket: forge-ci
          s3-endpoint: nyc3.digitaloceanspaces.com
          s3-region: nyc3
          s3-cache-limit: 50G
        env:
          SETUP_SOLDR_PERSISTENT_CHECKPOINT: ${{ runner.environment == 'self-hosted' && 'boot' || '' }}
          SOLDR_S3_CACHE_ACCESS_KEY: ${{ (github.event_name != 'pull_request' || inputs.mq-heavy-labels == '') && secrets.SOLDR_S3_CACHE_ACCESS_KEY || '' }}
          SOLDR_S3_CACHE_SECRET_KEY: ${{ (github.event_name != 'pull_request' || inputs.mq-heavy-labels == '') && secrets.SOLDR_S3_CACHE_SECRET_KEY || '' }}

      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      # Wine runs headless: ci/tier2_wine.py unsets DISPLAY/WAYLAND_DISPLAY and
      # creates its prefix itself, with the crash debugger disabled.
      - name: Install Wine 🍷
        timeout-minutes: 10
        run: |
          sudo -E "$(command -v uv)" run --no-project ci/host_apt_mirrors.py
          timeout --kill-after=10s 240 sudo apt-get -o Acquire::Retries=1 update
          timeout --kill-after=10s 300 sudo apt-get -o Acquire::Retries=1 install -y --no-install-recommends wine wine64

      - name: Cross-Build Windows Tier 2 🔗
        run: uv run --no-project --with cmake==3.31.10 --with ninja==1.13.0 ci/cmocka_link_check.py --alias win-x64 --all-tests

      - name: Run Windows Tier 2 Under Wine 🍷
        run: uv run --no-project ci/tier2_wine.py --jobs 4

  rust-cross-lint-release:
    timeout-minutes: 45
    name: Rust Cross Lint 🦀 (release targets)
    # PR fallback and release lint-only targets: Windows arm64, macOS x64 and Linux arm64.
    runs-on: ${{ inputs.mq-heavy-labels != '' && fromJSON(inputs.mq-heavy-labels) || 'ubuntu-26.04' }}
    needs: [check-event, ci-mode]
    if: ${{ !inputs.flatpak-measurement-only && !inputs.native-cache-measurement-only && ((github.event_name == 'pull_request' && needs.check-event.outputs.docs_only != 'true' && needs.ci-mode.outputs.skip_rust-cross-lint != 'true') || (github.event_name != 'merge_group' && needs.check-event.outputs.full == 'true')) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set Up soldr 🦀
        uses: zackees/setup-soldr@dd26c92eb35c553b208bb741326b6d54cf611436 # setup-soldr#707
        with:
          # One scope for every caller (push.yaml, ci.yml), so PRs replay
          # the verdicts master publishes (forge-ci/setup-soldr#604).
          verdict-scope: build-project
          version: 0.9.54
          build-cache: false
          # One Linux layer with Fast Gate: a second profile is a second 1.2 GB
          # entry of the `deps` family (#2661).
          prebuild-deps-flags: --profile dev -- --tests
          # Dell only (persistent root, local cook store): one cook recipe per
          # unit set this job compiles (forge-ci/setup-soldr#675). Blank on
          # hosted runners, so the shared hosted key is unchanged (#2661).
          prebuild-deps-recipes: |
            ${{ inputs.mq-heavy-labels != '' && '--profile dev --target aarch64-pc-windows-msvc -- --tests --check' || '' }}
            ${{ inputs.mq-heavy-labels != '' && '--profile dev --target x86_64-apple-darwin -- --tests --check' || '' }}
            ${{ inputs.mq-heavy-labels != '' && '--profile dev --target aarch64-unknown-linux-gnu -- --tests --check' || '' }}
          cache-key-suffix: linux-host-v3
          save-cache-remote: ${{ github.ref == 'refs/heads/master' }}
          # cross-release installs target std libraries after setup (#507/#969).
          solo-toolchain-cache: false
          # S3 remote cache: bucket forge-ci on DO Spaces nyc3; the 50G watermark is
          # enforced only on the merge_group singleton. No bucket/creds = feature off.
          s3-bucket: forge-ci
          s3-endpoint: nyc3.digitaloceanspaces.com
          s3-region: nyc3
          s3-cache-limit: 50G
        env:
          SETUP_SOLDR_PERSISTENT_CHECKPOINT: ${{ runner.environment == 'self-hosted' && 'boot' || '' }}
          SOLDR_S3_CACHE_ACCESS_KEY: ${{ (github.event_name != 'pull_request' || inputs.mq-heavy-labels == '') && secrets.SOLDR_S3_CACHE_ACCESS_KEY || '' }}
          SOLDR_S3_CACHE_SECRET_KEY: ${{ (github.event_name != 'pull_request' || inputs.mq-heavy-labels == '') && secrets.SOLDR_S3_CACHE_SECRET_KEY || '' }}

      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}

      - name: Local Gate (cross-release) 🧪
        run: uv run --no-project ci/local_gate.py --lane cross-release

  # All Darwin compilation, including runtime native/Qt fixtures, happens on
  # Linux. Per-job heavy routing retains the Dell opt-in and hosted fallback.
  rust-tests-macos-build:
    timeout-minutes: 45
    name: macOS Rust Artifacts 🐧
    runs-on: ${{ inputs.mq-heavy-labels != '' && fromJSON(inputs.mq-heavy-labels) || 'ubuntu-26.04' }}
    needs: [check-event, ci-mode]
    outputs:
      common-parent: ${{ steps.workspace.outputs.common-parent }}
      artifact-id: ${{ steps.bundle.outputs.artifact-id }}
    if: ${{ always() && !cancelled() && (github.event_name == 'merge_group' || needs.ci-mode.outputs.skip_rust-tests-macos != 'true') && needs.check-event.outputs.macos == 'true' }}
    env:
      COMMON_PARENT: /opt/obs-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.14'
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      # /opt resolves identically on Linux and macOS (/tmp does not). Move the
      # real checkout before setup/cook; leave Actions' workspace as an alias.
      - name: Place common checkout
        id: workspace
        run: |
          sudo mkdir -p "${COMMON_PARENT}"
          sudo chown "$(id -u):$(id -g)" "${COMMON_PARENT}"
          uv run --no-project ci/macos_test_workspace.py place --source "${GITHUB_WORKSPACE}" --destination "${COMMON_PARENT}/src"

      - name: Install Linux preparation dependencies
        run: |
          sudo -E "$(command -v uv)" run --no-project ci/host_apt_mirrors.py
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --no-install-recommends cmake ninja-build pkg-config uuid-dev libglib2.0-dev libxkbcommon-dev libncurses6 libtinfo6 libsqlite3-0

      - name: Set Up soldr 🦀
        uses: zackees/setup-soldr@dd26c92eb35c553b208bb741326b6d54cf611436 # setup-soldr#707
        with:
          verdict-scope: build-project
          version: 0.9.54
          build-cache: false
          prebuild-deps-flags: --profile dev -- --tests
          cache-key-suffix: linux-host-v3
          solo-toolchain-cache: false
          save-cache-remote: ${{ github.ref == 'refs/heads/master' }}
          s3-bucket: forge-ci
          s3-endpoint: nyc3.digitaloceanspaces.com
          s3-region: nyc3
          s3-cache-limit: 50G
        env:
          SETUP_SOLDR_PERSISTENT_CHECKPOINT: ${{ runner.environment == 'self-hosted' && 'boot' || '' }}
          SOLDR_S3_CACHE_ACCESS_KEY: ${{ (github.event_name != 'pull_request' || inputs.mq-heavy-labels == '') && secrets.SOLDR_S3_CACHE_ACCESS_KEY || '' }}
          SOLDR_S3_CACHE_SECRET_KEY: ${{ (github.event_name != 'pull_request' || inputs.mq-heavy-labels == '') && secrets.SOLDR_S3_CACHE_SECRET_KEY || '' }}

      - name: Prepare Darwin standard library
        run: uv run --no-project ci/macos_test_artifact.py prepare-target

      - name: Run Clippy 📎
        if: github.event_name != 'merge_group'
        run: soldr cargo clippy --locked --workspace --all-targets --target aarch64-apple-darwin -- -D warnings

      - name: Check Formatting 🎨
        run: soldr cargo fmt --all --check

      # Same changed-crate selector as the former PR consumer; queue/master
      # select the workspace. Build includes doctests and all native variants.
      - name: Prepare selected Darwin tests and fixtures
        if: github.event_name != 'merge_group' && needs.check-event.outputs.deferred == 'true'
        env:
          BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
        run: |
          git fetch -q --depth=1 origin "${BASE}"
          uv run --no-project ci/macos_test_artifact.py build --output "${RUNNER_TEMP}/macos-bundle" --base "${BASE}"

      - name: Prepare workspace Darwin tests and fixtures
        if: github.event_name == 'merge_group' || needs.check-event.outputs.deferred != 'true'
        run: uv run --no-project ci/macos_test_artifact.py build --output "${RUNNER_TEMP}/macos-bundle"

      - name: Prepare published Qt SDK contracts
        if: needs.check-event.outputs.qt_sdk == 'true'
        run: uv run --no-project ci/macos_qt_artifact.py build --work "${RUNNER_TEMP}/macos-qt" --bundle "${RUNNER_TEMP}/macos-bundle"

      - name: Pack complete Darwin bundle
        run: uv run --no-project ci/macos_test_workspace.py pack --bundle "${RUNNER_TEMP}/macos-bundle" --archive "${RUNNER_TEMP}/macos-tests.tar.gz"

      - name: Upload Darwin bundle
        id: bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-rust-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/macos-tests.tar.gz
            ${{ runner.temp }}/macos-tests.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      # Cache diagnostics follow the compilation work onto Linux.
      - name: Cache ledger 📒
        if: always() && hashFiles('.github/actions/job-cache-ledger/action.yaml') != ''
        uses: ./.github/actions/job-cache-ledger
        with:
          lane: rust-tests-macos-build

      # Restore before Actions' checkout/cache post steps and leave no large
      # relocated checkout behind on a persistent Dell runner.
      - name: Restore checkout
        if: always() && steps.workspace.outcome == 'success'
        run: uv run --no-project ci/macos_test_workspace.py restore --source "${GITHUB_WORKSPACE}" --destination "${COMMON_PARENT}/src"

  rust-tests-macos:
    timeout-minutes: 25
    name: Rust Tests 🦀 (macos-26)
    if: ${{ always() && !cancelled() && needs.rust-tests-macos-build.result == 'success' && github.event_name != 'merge_group' && github.event_name != 'pull_request' && needs.ci-mode.outputs.skip_rust-tests-macos != 'true' && needs.check-event.outputs.macos == 'true' }}
    runs-on: macos-26
    needs: [check-event, ci-mode, rust-tests-macos-build]
    env:
      COMMON_PARENT: ${{ needs.rust-tests-macos-build.outputs.common-parent }}
    steps:
      # Source is runtime test data, including source-inventory assertions.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # uv supplies a prebuilt Python for manifest checks and the test helpers.
      # CMake/CTest are already in the runner image; replay only configures
      # language-free projects and executes existing CTest entries.
      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.14'
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      - name: Place common checkout
        id: workspace
        run: |
          sudo mkdir -p "${COMMON_PARENT}"
          sudo chown "$(id -u):$(id -g)" "${COMMON_PARENT}"
          uv run --no-project ci/macos_test_workspace.py place --source "${GITHUB_WORKSPACE}" --destination "${COMMON_PARENT}/src"

      - name: Download Darwin bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.rust-tests-macos-build.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/macos-download

      - name: Verify and unpack Darwin bundle
        run: uv run --no-project ci/macos_test_workspace.py unpack --archive "${RUNNER_TEMP}/macos-download/macos-tests.tar.gz"

      - name: Run prebuilt Darwin tests
        run: uv run --no-project ci/macos_test_artifact.py run --manifest manifest.json ${{ needs.check-event.outputs.qt_sdk == 'true' && '--require-qt' || '' }}

      # proptest writes a failing case to rust/<crate>/tests/proptest-regressions/<test>.txt
      # on the runner; a lane that does not keep the directory loses the only copy
      # of the case that made it red (#2993, #2988). Only new or changed entries are
      # echoed into the job summary, so a reader of the red run gets the seed too.
      - name: Note proptest regressions 🗂️
        if: ${{ failure() }}
        shell: bash
        run: |
          : Note proptest regressions 🗂️
          shopt -s nullglob
          for f in rust/*/tests/proptest-regressions/*.txt; do
            [[ -n "$(git status --porcelain --untracked-files=all -- "$f")" ]] || continue
            {
              echo "### New proptest case \`$f\`"
              echo '```'
              cat "$f"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          done

      - name: Upload proptest regressions 🗂️
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proptest-regressions-${{ runner.os }}
          path: rust/*/tests/proptest-regressions/
          if-no-files-found: ignore
          retention-days: 7

      - name: Restore checkout
        if: always() && steps.workspace.outcome == 'success'
        run: uv run --no-project ci/macos_test_workspace.py restore --source "${GITHUB_WORKSPACE}" --destination "${COMMON_PARENT}/src"

  reserve-tier2-linux-build:
    name: Reserve Tier 2 Linux Build Runner
    needs: [check-event, ci-mode]
    if: ${{ github.event_name == 'merge_group' && needs.check-event.outputs.tier2 == 'true' && vars.FORGE_POOL_LEASE_CLASS != '' && vars.FORGE_POOL_LABELS != '' }}
    runs-on: ${{ vars.FORGE_QUICK_LABELS != '' && fromJSON(vars.FORGE_QUICK_LABELS) || 'ubuntu-latest' }}
    timeout-minutes: 2
    permissions:
      id-token: write
    outputs:
      runs-on: ${{ steps.reserve.outputs.runs-on }}
    steps:
      - id: reserve
        uses: forge-ci/ci.yml/actions/pool-select@52f6ada3ed0cb8622e31f1a16d506fb853b731b0 # ci.yml#569
        with:
          source: lease
          labels: ${{ vars.FORGE_POOL_LABELS }}
          fallback: ubuntu-latest
          lease-class: ${{ vars.FORGE_POOL_LEASE_CLASS }}
          lease-job: rust-linux-tier2-build

  # Tier 2 Linux builds once and fans the tests out (#937, #1065): the build
  # job explicitly builds hybrid libobs and the C reference in one tree, runs the checks
  # (including the enforced C/Rust export comparison, so a mismatch fails
  # before any test) and uploads the tree; mode x shard jobs run one ctest
  # slice each against one libobs (OFF: C reference, ON: hybrid libobs via
  # LD_LIBRARY_PATH) on the same paths; rust-linux-tier2-done publishes the
  # lane proof.
  rust-tests-windows:
    # 2x the 9-14.3 min the lane runs on windows-2025-vs2026 (#2593 A).
    timeout-minutes: 30
    name: Rust Tests 🦀 (windows-2025-vs2026)
    # Only the platforms the change touches (#436); Linux is rust-tests-linux.
    # Native only off the queue and PRs (#5845): those run rust-tests-windows-wine.
    if: ${{ always() && !cancelled() && github.event_name != 'merge_group' && github.event_name != 'pull_request' && needs.ci-mode.outputs.skip_rust-tests-windows != 'true' && needs.check-event.outputs.windows == 'true' }}
    runs-on: windows-2025-vs2026
    # Starts with Fast Gate (#2985); see rust-tests-macos.
    needs: [check-event, ci-mode]
    steps:
      # GitHub's Windows runners default to CRLF, and soldr warns that it can cost
      # recompiles and cache misses (ci/test_windows_lf_checkout.py).
      - name: Check Out With LF 📝
        run: git config --global core.autocrlf input

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Same soldr-wrapped commands as docs/rust-port/testing-policy.md.
      # setup-soldr provisions the toolchain (with the clippy/rustfmt
      # components) from rust-toolchain.toml and restores its dependency cook
      # cache and cargo registry. Remote saves only warm master; PR and
      # merge-group runs restore. Local act/act2 saves stay enabled.
      - name: Set Up soldr 🦀
        id: setup-soldr
        uses: zackees/setup-soldr@db9aa035e488f4dde7d31d5c8cb4ec20ec99c6c1 # merge of forge-ci/setup-soldr#676: persistent-root cook store and recipes (#675)
        with:
          # One scope for every caller (push.yaml, ci.yml), so PRs replay
          # the verdicts master publishes (forge-ci/setup-soldr#604).
          verdict-scope: build-project
          # soldr 0.9.54 embeds zccache 1.15.14+ (has zackees/zccache#1937).
          version: 0.9.54
          build-cache: false
          prebuild-deps-flags: --profile dev -- --tests
          save-cache-remote: ${{ github.ref == 'refs/heads/master' }}
          # S3 remote cache: bucket forge-ci on DO Spaces nyc3; the 50G watermark is
          # enforced only on the merge_group singleton. No bucket/creds = feature off.
          s3-bucket: forge-ci
          s3-endpoint: nyc3.digitaloceanspaces.com
          s3-region: nyc3
          s3-cache-limit: 50G
        env:
          SOLDR_S3_CACHE_ACCESS_KEY: ${{ secrets.SOLDR_S3_CACHE_ACCESS_KEY }}
          SOLDR_S3_CACHE_SECRET_KEY: ${{ secrets.SOLDR_S3_CACHE_SECRET_KEY }}

      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}

      # The OS lane runs the tests of the crates the diff touches on a PR
      # (ci/rust_scope.py selects the feature, ci_scope.py the OS); the
      # workspace on master (#992).
      - name: Run Rust Tests (changed crates) 🧪
        if: github.event_name != 'merge_group' && needs.check-event.outputs.deferred == 'true'
        env:
          BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
        run: |
          # This runner's default shell is PowerShell, where an environment
          # variable is read as $env:BASE: a bash-style brace reference is an
          # unset PowerShell variable, i.e. "", and `--test-diff ""` used to
          # run every lane (#2743).
          git fetch -q --depth=1 origin "$env:BASE"
          uv run --no-project ci/local_gate.py --test-diff "$env:BASE"

      - name: Run Rust Tests 🧪
        if: github.event_name == 'merge_group' || needs.check-event.outputs.deferred != 'true'
        run: soldr cargo test --workspace --locked

      - name: Run Clippy 📎
        if: github.event_name != 'merge_group'
        run: soldr cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Check Formatting 🎨
        run: soldr cargo fmt --all --check

      # rust/obs-build's Qt SDK resolver against the published obs-studio-libs
      # SDK for this runner's OS (#1878). Only Qt SDK paths and full runs
      # select it; no Actions cache: the Windows SDK alone is 163 MB packed,
      # over ci.toml's libs-qt budget.
      - name: Check Published Qt SDK 🧩
        if: needs.check-event.outputs.qt_sdk == 'true'
        # A Qt test app that cannot start can wait on a dialog; bound it.
        timeout-minutes: 15
        env:
          QT_TAG: qt6-6.11.1
        shell: bash
        run: |
          : Check Published Qt SDK 🧩
          if [[ "${RUNNER_OS}" == Windows ]]; then
            asset=qt6-6.11.1-windows-x86_64-relwithdebinfo.tar.zst
            sha=b05c17386d2a1b0564b00755bc1fba152a18eaac34e512d9315922990715b751
            variable=OBS_QT_TEST_WINDOWS_PREFIX
          else
            asset=qt6-6.11.1-darwin-universal2-11.0-release.tar.zst
            sha=85093eae764f83d167f8850c5b057c0ff5d2f928ad7d49fe2544ce0ca20074b0
            variable=OBS_QT_TEST_MACOS_PREFIX
          fi
          start=${SECONDS}
          uv run --no-project ci/fetch_libs_asset.py "${QT_TAG}" "${asset}" "${sha}" "${RUNNER_TEMP}/qt"
          echo "fetched ${asset} in $((SECONDS - start)) s"
          export "${variable}=${RUNNER_TEMP}/qt"
          soldr cargo test -p obs-studio-rust --locked --test obs-tests-app -- --exact qt_sdk::qt_sdk_resolves_published_sdks --show-output 2>&1 | tee "${RUNNER_TEMP}/qt-sdk.log"
          grep -q ": Qt 6\." "${RUNNER_TEMP}/qt-sdk.log"
          # The Qt native test graph (moc, uic, rcc, link, run) against the
          # same SDK; Windows loads the Qt DLLs and the minimal platform plugin
          # from the SDK.
          export OBS_QT_TARGET_PREFIX="${RUNNER_TEMP}/qt" CMAKE_PREFIX_PATH="${RUNNER_TEMP}/qt" QT_PLUGIN_PATH="${RUNNER_TEMP}/qt/plugins"
          if [[ "${RUNNER_OS}" == Windows ]]; then
            export PATH="${RUNNER_TEMP}/qt/bin:${PATH}"
          fi
          # The unchanged remux queue test needs cmocka: brew on macOS; on
          # Windows vcpkg's (as Tier 2) and its pkgconf for the pkg-config crate.
          if [[ "${RUNNER_OS}" == Windows ]]; then
            vcpkg="$(cygpath -u "${VCPKG_INSTALLATION_ROOT}")/installed/x64-windows"
            "${GITHUB_WORKSPACE}/.github/scripts/retry" vcpkg install cmocka:x64-windows pkgconf:x64-windows
            export PKG_CONFIG="${vcpkg}/tools/pkgconf/pkgconf.exe" PKG_CONFIG_PATH="${vcpkg}/lib/pkgconfig"
            export PATH="${vcpkg}/bin:${PATH}"
          else
            "${GITHUB_WORKSPACE}/.github/scripts/retry" brew install cmocka
          fi
          export QT_QPA_PLATFORM_PLUGIN_PATH="${RUNNER_TEMP}/qt/plugins/platforms"
          soldr cargo test -p obs-studio-rust --locked --features libobs-integration --test obs-tests-app -- --exact native_build::native_test_graph_generates_qt_metaobjects native_build::canonical_remux_queue_runs_unchanged native_build::canonical_frontend_product_and_meter_tests_run_unchanged native_build::canonical_frontend_utility_tests_run_unchanged --show-output

      # proptest writes a failing case to rust/<crate>/tests/proptest-regressions/<test>.txt
      # on the runner; a lane that does not keep the directory loses the only copy
      # of the case that made it red (#2993, #2988). Only new or changed entries are
      # echoed into the job summary, so a reader of the red run gets the seed too.
      - name: Note proptest regressions 🗂️
        if: ${{ failure() }}
        shell: bash
        run: |
          : Note proptest regressions 🗂️
          shopt -s nullglob
          for f in rust/*/tests/proptest-regressions/*.txt; do
            [[ -n "$(git status --porcelain --untracked-files=all -- "$f")" ]] || continue
            {
              echo "### New proptest case \`$f\`"
              echo '```'
              cat "$f"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          done

      - name: Upload proptest regressions 🗂️
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proptest-regressions-${{ runner.os }}
          path: rust/*/tests/proptest-regressions/
          if-no-files-found: ignore
          retention-days: 7

      # Per-lane cache ledger; ci/cache_baseline.py rolls these up. Fail-open.
      - name: Cache ledger 📒
        if: always() && hashFiles('.github/actions/job-cache-ledger/action.yaml') != ''
        uses: ./.github/actions/job-cache-ledger
        with:
          lane: rust-tests-windows
          setup-phase-summary: ${{ steps.setup-soldr.outputs.setup-phase-summary }}

  # Tier 2 Linux builds once and fans the tests out (#937, #1065): the build
  # job explicitly builds hybrid libobs and the C reference in one tree, runs the checks
  # (including the enforced C/Rust export comparison, so a mismatch fails
  # before any test) and uploads the tree; mode x shard jobs run one ctest
  # slice each against one libobs (OFF: C reference, ON: hybrid libobs via
  # LD_LIBRARY_PATH) on the same paths; rust-linux-tier2-done publishes the
  # lane proof.
  rust-linux-tier2-build:
    name: Rust Tier 2 Linux 🐧 (build)
    # The pinned container supplies Ubuntu 26.04 packages; only the host pool moves.
    # ubuntu-latest currently maps to 24.04 (actions/runner-images, 2026-11-20).
    runs-on: ${{ needs.reserve-tier2-linux-build.outputs.runs-on != '' && fromJSON(needs.reserve-tier2-linux-build.outputs.runs-on) || (github.event_name != 'merge_group' || vars.FORGE_POOL_LEASE_CLASS == '' || vars.FORGE_POOL_LABELS == '') && inputs.mq-heavy-labels != '' && fromJSON(inputs.mq-heavy-labels) || 'ubuntu-latest' }}
    # Maintainer-approved revisit of #966: prebake packages for Dell only.
    # Same base, root user and install commands; keep #982 runtime coverage.
    # GHCR must be public; anonymous probe errors retain stock Ubuntu.
    container:
      image: ${{ needs.check-event.outputs.tier2_image }}
      # Dell host cache; hosted runners mount an empty directory without the marker.
      volumes:
        - /var/cache/obs-runner:/var/cache/obs-runner
        # The runner's apt mirror list for the bootstrap apt step (#5510). The whole
        # directory: a missing file would make Docker create a directory in
        # its place on a persistent runner.
        - /etc/apt:/run/host-apt:ro
    # A hung test held a runner for 4.5 h without a timeout (#983). The MCP cases (#3319) add a bundled libobs build.
    timeout-minutes: 45
    # Compilation consumes no Fast Gate output and can overlap its runner.
    # Keep proof/scope checks here; OFF/ON execution waits only for this build.
    needs: [check-event, ci-mode, reserve-tier2-linux-build]
    if: ${{ !cancelled() && needs.check-event.result == 'success' && needs.ci-mode.result == 'success' && needs.check-event.outputs.tier2 == 'true' && (github.event_name == 'merge_group' || (needs.ci-mode.outputs.skip_rust-linux-tier2 != 'true' && needs.ci-mode.outputs.tier2-linux_hit != 'true')) }}
    # Empty unless this job ran (a skipped job has no outputs). CI Gate passes
    # only when every shard below passed, so ci.yml's tier2-lane-proof job
    # publishes the proof after the gate, not on its critical path (#3018).
    outputs:
      tier2-linux-proof: ${{ needs.ci-mode.outputs.tier2-linux_name }}
    env:
      TIER2_PREBAKED: ${{ needs.check-event.outputs.tier2_prebaked }}
    defaults:
      run:
        shell: bash
    steps:
      # checkout needs git for tags and submodules; sudo keeps the shared
      # install step below the same as on a plain runner. Every package here
      # and in apt-packages.txt resolves from main/universe of resolute,
      # -updates and -security, so the index fetch skips backports,
      # restricted and multiverse (17 -> 9 downloads, ~8% fewer bytes).
      - name: Install Git 📦
        timeout-minutes: 10
        run: |
          # Bound mirror stalls in this bootstrap and subsequent package installs.
          printf '%s\n' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' \
            'Acquire::Retries "3";' > /etc/apt/apt.conf.d/99-ci-acquire-bounds
          # apt-lists-ready: a prebaked image installs with no index refresh/upgrade
          # (the content-addressed image freezes versions); stock images update below.
          if [ "$TIER2_PREBAKED" = true ]; then
            timeout --kill-after=10s 180 apt-get install -y --no-install-recommends --fix-missing git ca-certificates curl sudo zstd eatmydata
            exit 0
          fi
          src=/etc/apt/sources.list.d/ubuntu.sources
          sed -i -e 's/^Suites: resolute resolute-updates resolute-backports$/Suites: resolute resolute-updates/' \
            -e 's/^Components: main universe restricted multiverse$/Components: main universe/' "$src"
          [ "$(grep -cx 'Components: main universe' "$src")" = 2 ] && grep -qx 'Components: main universe' "$src" ||
            { echo "unexpected $src layout"; cat "$src"; exit 1; }
          # One mirror per attempt (#5510): a mirror that accepts and never
          # answers keeps apt past its bound on every index file, and apt's
          # mirror method never drops it (run 45159376402). First the runner's
          # own (the first plain-HTTP, non-security entry of the host's list,
          # lowest priority first), then the fallbacks. ci/host_apt_mirrors.py
          # holds the same rule and list; test_tier2_apt_cache checks both.
          mirrors=$(awk '$1 ~ /^http:\/\// && $1 !~ /security/ { p = 1000; for (i = 2; i <= NF; i++) if ($i ~ /^priority:[0-9]+$/) p = substr($i, 10) + 0; print p, $1 }' \
            /run/host-apt/apt-mirrors.txt 2>/dev/null | sort -n -s -k1,1 | head -n 1 | cut -d' ' -f2) ||
            mirrors=''  # no list on this runner (pipefail would end the step): the fallbacks
          mirrors=$(printf '%s\n' $mirrors http://archive.ubuntu.com/ubuntu/ http://mirrors.edge.kernel.org/ubuntu/ | awk '!seen[$0]++' | tr '\n' ' ')
          rotate=true
          grep -qx 'URIs: http://security.ubuntu.com/ubuntu/' "$src" ||
            { echo "no security stanza in $src; keeping its sources"; rotate=false; }
          # The package step moves on from the mirror this step ends on when
          # it has to retry (#5518), so keep the order for it.
          [ "$rotate" = true ] && printf '%s\n' $mirrors > /etc/apt/ci-tier2-mirrors
          # A stale index 404s a just-superseded .deb and an archive host can
          # refuse a connection (run 42755735949): refetch the index and retry.
          # A timeout that stops the install in the unpack leaves dpkg
          # interrupted, and apt then refuses every retry (#5504, run
          # 45113911635): recover first, as the Tier 2 package step does. The
          # .debs already downloaded stay in apt's cache for the next attempt.
          for attempt in 1 2 3; do
            if [ "$rotate" = true ]; then
              set -- $mirrors
              shift $(( (attempt - 1) % $# ))
              sed -i "/security\.ubuntu\.com/!s|^URIs: .*|URIs: $1|" "$src"
              echo "apt attempt $attempt: $1"
            fi
            dpkg --configure -a || true
            timeout --kill-after=10s 180 apt-get update -qq &&
              timeout --kill-after=10s 180 apt-get -f install -y &&
              timeout --kill-after=10s 180 apt-get install -y --no-install-recommends --fix-missing git ca-certificates curl sudo zstd eatmydata && break
            [ "$attempt" = 3 ] && exit 1
            echo "apt attempt $attempt failed; retrying in $((attempt * 10)) s"; sleep $((attempt * 10))
          done

      # fetch-depth 0: versionconfig.cmake derives the OBS version from tags.
      # Treeless (#3022): git describe/log/rev-parse read only commits. No
      # submodules: validate.sh initializes the two configure needs at depth 1.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          filter: tree:0

      # One runner owns each slot; job hooks keep host GC away while busy.
      # Persist compiler outputs and .debs only, never test verdicts or module/cost state.
      - name: Select Persistent Cache 🗄️
        id: pcache
        run: |
          root=/var/cache/obs-runner
          if [ -f "$root/.persistent-cache" ] && [ -n "${RUNNER_NAME:-}" ]; then
            slot="$root/slots/$RUNNER_NAME"
            mkdir -p "$slot/tier2-zccache"
            # A killed earlier job can leave dead daemon records. This job
            # owns the slot, so no live daemon can be using them.
            rm -f "$slot"/tier2-zccache/v*/daemon-*.lock \
              "$slot"/tier2-zccache/v*/daemon-*.lock.spawn-failed \
              "$slot"/tier2-zccache/v*/daemon.running-process.json
            echo "zccache=$slot/tier2-zccache" >> "$GITHUB_OUTPUT"
            echo "apt=$root/apt-archives" >> "$GITHUB_OUTPUT"
            # A kept build tree (#4954 P5) only where the host provides
            # trees/ (tmpfs outside the slot cap, emptied at boot), and only
            # for trusted merge-queue runs; PR jobs never read or write it.
            if [ -d "$root/trees" ] && [ "$GITHUB_EVENT_NAME" = merge_group ]; then
              echo "tree=$root/trees/$RUNNER_NAME/tier2" >> "$GITHUB_OUTPUT"
            fi
            # Local tier2-tree handoff to the test jobs (#4954 P7).
            if [ -d "$root/handoff" ]; then
              echo "handoff=$root/handoff" >> "$GITHUB_OUTPUT"
            fi
            echo "persistent cache: $slot ($(du -sm "$slot" | cut -f1) MiB), host $(cat "$root/.persistent-cache")"
          else
            echo "no persistent cache on this runner"
          fi

      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          version: '0.13.5'
          enable-cache: false

      # Reuse the 339 MB of .debs every Tier 2 job downloaded (#1055): keep
      # them (the stock image's docker-clean config deletes them after each
      # install) and restore the archive dir, keyed on the list and the image.
      # zstd is installed above: the cache entry is versioned by compressor.
      # dpkg in this throwaway container needs neither fsync nor docs: with the
      # .debs restored, unpacking 594 packages took 29 s; force-unsafe-io and
      # skipping doc/man/info cut a local run of the same install by 25% (#2072).
      - name: Keep apt Downloads 📦
        run: |
          dir="${{ steps.pcache.outputs.apt }}"
          # Keep the container's original temp path on hosted runners (#3026).
          [ -n "$dir" ] || dir="$GITHUB_WORKSPACE/.tier2-apt-archives"
          mkdir -p "$dir"
          chmod a+rwx "$dir"
          echo "TIER2_APT_ARCHIVES=$dir" >> "$GITHUB_ENV"
          rm -f /etc/apt/apt.conf.d/docker-clean
          printf '%s\n' force-unsafe-io 'path-exclude=/usr/share/doc/*' \
            'path-exclude=/usr/share/man/*' 'path-exclude=/usr/share/info/*' \
            > /etc/dpkg/dpkg.cfg.d/ci-tier2-fast
      - uses: ./.github/actions/cache
        id: apt-cache
        if: steps.pcache.outputs.apt == '' && needs.check-event.outputs.tier2_prebaked != 'true'
        with:
          mode: restore
          path: .tier2-apt-archives/*.deb
          # The archive fills up across runs, so no single exact key ever
          # describes it; the suffix is the .deb count at save time and the
          # prefix restore takes the newest (largest) one.
          key: tier2-apt-ubuntu2604-f144425f-${{ hashFiles('rust/tools/linux-validate/apt-packages.txt') }}-complete
          restore-keys: |
            tier2-apt-ubuntu2604-f144425f-${{ hashFiles('rust/tools/linux-validate/apt-packages.txt') }}-

      # The package list is shared with the local Docker harness (run.sh).
      - name: Install Tier 2 Packages 📦
        timeout-minutes: 10
        env:
          TIER2_APT_SHARED: ${{ steps.pcache.outputs.apt != '' }}
        run: |
          # apt-lists-ready: Install Git already refreshed these lists in this fresh container.
          export TIER2_INSTALL_ARCHIVES="$TIER2_APT_ARCHIVES"
          if [ "${TIER2_APT_SHARED:-false}" = true ]; then
            # Only downloads write the shared Dell archive. Release the flock
            # before dpkg: each container has its own package database (#4997).
            grep -v '^#' rust/tools/linux-validate/apt-packages.txt |
              xargs "${GITHUB_WORKSPACE}/.github/scripts/retry" \
                flock -w 1800 "$TIER2_APT_ARCHIVES/.tier2-install.lock" \
                timeout --kill-after=10s 300 sudo apt-get install --download-only -o "Dir::Cache::archives=$TIER2_APT_ARCHIVES" -y --no-install-recommends
            # apt also writes archives/lock and partial/ during installation.
            # Copy only completed .debs to a private cache; reflink when possible,
            # copy across mounts otherwise. Never share writable package inodes.
            TIER2_INSTALL_ARCHIVES=$(mktemp -d "$RUNNER_TEMP/tier2-apt.XXXXXX")
            chmod a+rx "$TIER2_INSTALL_ARCHIVES"
            for deb in "$TIER2_APT_ARCHIVES"/*.deb; do
              [ -f "$deb" ] || continue
              cp --reflink=auto "$deb" "$TIER2_INSTALL_ARCHIVES/"
            done
          fi
          # force-unsafe-io still syncs dpkg's database per package. eatmydata
          # cuts this throwaway container's HDD install from 468 s to 47 s.
          # An interrupted unpack leaves dpkg half-configured (job 134123589625).
          # Recover inside each attempt. Configure may fail on missing
          # dependencies; let apt's repair install fix them. Hosted jobs keep
          # their original job-local archive and need no separate download pass.
          # A mirror can answer Install Git and then serve the ~400 packages
          # too slowly for the 300 s bound (runs 45187119925, 45194364427), so
          # each retry points the main source at the next mirror in Install
          # Git's order and refetches its index (#5518). The .debs already
          # downloaded stay in the archive directory for the next attempt.
          export TIER2_APT_ATTEMPTS="$RUNNER_TEMP/tier2-apt-attempts"
          : > "$TIER2_APT_ATTEMPTS"
          grep -v '^#' rust/tools/linux-validate/apt-packages.txt |
            xargs "${GITHUB_WORKSPACE}/.github/scripts/retry" bash -ec '
                echo >> "$TIER2_APT_ATTEMPTS"
                order=/etc/apt/ci-tier2-mirrors
                src=/etc/apt/sources.list.d/ubuntu.sources
                if [ "$(wc -l < "$TIER2_APT_ATTEMPTS")" -gt 1 ] && [ -s "$order" ]; then
                  current=$(grep "^URIs: " "$src" | grep -v -m 1 "security\.ubuntu\.com" | cut -d" " -f2)
                  next=$(grep -A 1 -x -F "$current" "$order" | sed -n 2p)
                  [ -n "$next" ] || next=$(head -n 1 "$order")
                  sudo sed -i "/security\.ubuntu\.com/!s|^URIs: .*|URIs: $next|" "$src"
                  echo "apt retry: $next"
                  timeout --kill-after=10s 180 sudo apt-get update -qq
                fi
                sudo eatmydata dpkg --configure -a || true
                timeout --kill-after=10s 300 sudo eatmydata apt-get -f install -y -o "Dir::Cache::archives=$TIER2_INSTALL_ARCHIVES"
                timeout --kill-after=10s 300 sudo eatmydata apt-get install -o "Dir::Cache::archives=$TIER2_INSTALL_ARCHIVES" -y --no-install-recommends "$@"
              ' tier2-apt
      # A slow mirror can stop the install above at the step timeout with every
      # finished .deb already in the archive dir. The cache is immutable, so
      # that progress only survives if each run writes an entry whose key grows
      # with the archive: the suffix is the .deb count, and the restore above
      # takes the newest prefix match. Drop one save per run and the archive
      # never advances past whatever a single timeout window downloaded.
      - name: Count apt Downloads 📦
        id: apt-count
        if: always()
        run: |
          dir="${TIER2_APT_ARCHIVES:-}"
          count=0
          [ -n "$dir" ] && [ -d "$dir" ] && count=$(find "$dir" -maxdepth 1 -type f -name '*.deb' | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "apt archive holds $count downloaded .deb files"
      # One saver, master only: per-PR entries overflowed the 10 GB cache.
      # Actions versions caches by literal path, not just their visible key.
      # With the default checkout path, ../../_temp is runner.temp on both
      # host and container runners. Keep apt's root-owned scratch outside git.
      - name: Save apt Downloads 💾
        if: (!cancelled()) && steps.apt-count.outputs.count != '0' && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.pcache.outputs.apt == '' && needs.check-event.outputs.tier2_prebaked != 'true'
        uses: ./.github/actions/cache
        with:
          mode: save
          path: .tier2-apt-archives/*.deb
          key: tier2-apt-ubuntu2604-f144425f-${{ hashFiles('rust/tools/linux-validate/apt-packages.txt') }}-${{ steps.apt-count.outputs.count }}

      # PRs restore the compiler cache; only master pushes save it (a cache
      # saved from a PR ref is unreachable by other PRs).
      - uses: ./.github/actions/cache
        if: steps.pcache.outputs.zccache == ''
        with:
          mode: restore
          path: ${{ github.workspace }}/.tier2-zccache
          key: zccache-tier2-linux-both-${{ github.sha }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}
          restore-keys: |
            zccache-tier2-linux-both-
            zccache-tier2-linux-
      # zccache has no age-based eviction (ccache --evict-older-than), so a
      # master push drops a restored cache over 2 GiB and rebuilds it cold:
      # the saved cache stays about the size of one build. In this container
      # ${{ github.workspace }} in a script is the unmounted host path, so the
      # bound never ran and the archive grew to 2.1 GB (#3026): use the
      # container's $GITHUB_WORKSPACE, and print the size on every run.
      - name: Bound zccache 🧹
        run: |
          : Bound zccache 🧹
          dir="${{ steps.pcache.outputs.zccache }}"
          [ -n "$dir" ] && { echo "persistent zccache is $(du -sm "$dir" | cut -f1) MiB; the runner hooks cap it"; exit 0; }
          dir="$GITHUB_WORKSPACE/.tier2-zccache"
          [ -d "$dir" ] || { echo "no zccache dir restored"; exit 0; }
          mb=$(du -sm "$dir" | cut -f1)
          echo "zccache dir is ${mb} MiB"
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$GITHUB_REF" = refs/heads/master ] && [ "$mb" -gt 2048 ]; then
            echo "over 2048 MiB on master; starting cold"
            rm -rf "$dir"
          fi

      # Production hybrid libobs builds the Rust ports through Corrosion;
      # the shims put soldr's cargo/rustc (rust-toolchain.toml) on PATH.
      - name: Set Up soldr 🦀
        id: setup-soldr
        uses: zackees/setup-soldr@dd26c92eb35c553b208bb741326b6d54cf611436 # setup-soldr#707
        with:
          # One scope for every caller (push.yaml, ci.yml), so PRs replay
          # the verdicts master publishes (forge-ci/setup-soldr#604).
          verdict-scope: build-project
          version: 0.9.54
          build-cache: false
          # Corrosion builds Rust in its own target dir under the CMake tree,
          # so a cooked workspace target/ is loaded (12 s) and never used
          # (#3027). Keep the crate sources for Corrosion's cargo.
          prebuild-deps: none
          cargo-registry-cache: true
          cache-key-suffix: linux-container-v1
          save-cache-remote: ${{ github.ref == 'refs/heads/master' }}
          shims: true
          # S3 remote cache: bucket forge-ci on DO Spaces nyc3; the 50G watermark is
          # enforced only on the merge_group singleton. No bucket/creds = feature off.
          s3-bucket: forge-ci
          s3-endpoint: nyc3.digitaloceanspaces.com
          s3-region: nyc3
          s3-cache-limit: 50G
        env:
          SETUP_SOLDR_PERSISTENT_CHECKPOINT: ${{ runner.environment == 'self-hosted' && 'boot' || '' }}
          SOLDR_S3_CACHE_ACCESS_KEY: ${{ (github.event_name != 'pull_request' || inputs.mq-heavy-labels == '') && secrets.SOLDR_S3_CACHE_ACCESS_KEY || '' }}
          SOLDR_S3_CACHE_SECRET_KEY: ${{ (github.event_name != 'pull_request' || inputs.mq-heavy-labels == '') && secrets.SOLDR_S3_CACHE_SECRET_KEY || '' }}

      # The libobs lib-module cache (#3264): hosted PRs restore master's modules,
      # only master pushes save. Kept trees never use this second cache.
      - uses: ./.github/actions/cache
        if: steps.pcache.outputs.tree == ''
        with:
          mode: restore
          path: ${{ github.workspace }}/.tier2-modcache
          key: libobs-modules-tier2-linux-${{ github.sha }}
          restore-keys: libobs-modules-tier2-linux-

      # The shard plan uses the test timings the last master run's shards
      # handed back (rust-linux-tier2-done, #930); until that cache exists,
      # the timings the ccache still carries from before the split (#931).
      - uses: ./.github/actions/cache
        with:
          mode: restore
          path: .tier2-cost
          key: tier2-ctest-cost-${{ github.sha }}
          restore-keys: tier2-ctest-cost-
      - name: Seed Tier 2 Test Timings ⏱️
        run: |
          mkdir -p .tier2-cost
          for f in .tier2-ccache/ctest-cost-*.txt; do
            [ -s "$f" ] && [ ! -s ".tier2-cost/${f##*/}" ] && cp "$f" .tier2-cost/
          done
          ls -l .tier2-cost

      # GATE-001 mirror (local-gate.toml): the same validate.sh the local
      # gate's tier2-linux lane runs in Docker (build and test in one go).
      # The compiler launcher validate.sh configures (BUILD.md, #957): the
      # pinned, checksummed zccache release.
      - name: Install zccache 📦
        run: |
          : Install zccache 📦
          uv run --no-project rust/tools/linux-validate/install_zccache.py "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The restored .tier2-zccache carries earlier runs' journals.
      - name: Mark Cache Ledger Start 📒
        run: echo "CACHE_LEDGER_SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # The last trusted run's tree, at the same path, with the source mtimes
      # of unchanged files replayed (zccache replay), so ninja and cargo
      # rebuild only what changed (#4954 P5). Trusted only behind its .clean
      # marker; anything else is discarded and the build starts cold.
      - name: Restore Kept Tier 2 Tree 🌲
        if: steps.pcache.outputs.tree != ''
        env:
          OBS_TIER2_BUILD: ${{ runner.temp }}/tier2
        run: >-
          uv run --no-project ci/tier2_kept_tree.py restore
          --kept "${{ steps.pcache.outputs.tree }}" --build "$OBS_TIER2_BUILD" --src "$GITHUB_WORKSPACE"

      - name: Build Tier 2 (libobs and libobs-c-reference) 🧱
        id: tier2-build
        env:
          OBS_TIER2_SRC: ${{ github.workspace }}
          OBS_TIER2_BUILD: ${{ runner.temp }}/tier2
          OBS_TIER2_PACK: ${{ runner.temp }}/tier2-pack
          # Only the Dell's marker-backed persistent slot bypasses zccache.
          OBS_TIER2_LAUNCHER: ${{ steps.pcache.outputs.zccache == '' && 'zccache' || '' }}
          ZCCACHE_CACHE_DIR: ${{ steps.pcache.outputs.zccache || format('{0}/.tier2-zccache', github.workspace) }}
          # A kept tree outperforms the module cache (0/7 Dell hits); avoid its second configure.
          OBS_LIBOBS_MODULE_CACHE_DIR: ${{ steps.pcache.outputs.tree == '' && format('{0}/.tier2-modcache', github.workspace) || '' }}
          OBS_TIER2_KEEP_CONFIGURE: ${{ steps.pcache.outputs.tree != '' && '1' || '' }}
          OBS_TIER2_COST_DIR: ${{ github.workspace }}/.tier2-cost
          OBS_TIER2_MODES: "OFF ON"
          OBS_TIER2_STAGE: build
          OBS_TIER2_MCP: "1"
        run: uv run --no-project ci/tier2_front_cache.py -- bash rust/tools/linux-validate/validate.sh

      - name: Record Tier 2 Runtime Packages 📦
        run: >-
          uv run --no-project python rust/tools/linux-validate/runtime-packages.py
          "$RUNNER_TEMP/tier2/tree" "$RUNNER_TEMP/tier2-pack/runtime-packages.txt"

      # The tree upload took ~193 s at ~1.2 MB/s from the Dell (#4954 P7). When
      # the test jobs' labels pin this host they read the verified handoff
      # instead, and the upload is skipped; anywhere else it still runs.
      - name: Hand Off Tier 2 Tree 🤝
        id: handoff
        if: steps.pcache.outputs.handoff != ''
        env:
          MQ_RUNNER_LABELS: ${{ inputs.mq-heavy-labels }}
        run: >-
          uv run --no-project ci/tier2_kept_tree.py handoff-put
          --root "${{ steps.pcache.outputs.handoff }}" --key ${{ github.run_id }}
          --pack "$RUNNER_TEMP/tier2-pack" --labels "$MQ_RUNNER_LABELS"
          --marker /var/cache/obs-runner/.persistent-cache

      - name: Upload Tier 2 Tree 🧾
        if: steps.handoff.outputs.local != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tier2-tree
          # One directory avoids multiline host/container path translation.
          path: ${{ runner.temp }}/tier2-pack/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Save Tier 2 Module Cache 💾
        uses: ./.github/actions/cache
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && steps.tier2-build.outcome == 'success' && steps.pcache.outputs.tree == ''
        with:
          mode: save
          path: ${{ github.workspace }}/.tier2-modcache
          key: libobs-modules-tier2-linux-${{ github.sha }}

      # validate.sh stops the zccache daemon on exit, flushing its index.
      - name: Save Tier 2 zccache 💾
        uses: ./.github/actions/cache
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && steps.tier2-build.outputs.cache-healthy != 'false' && steps.pcache.outputs.zccache == ''
        with:
          mode: save
          path: ${{ github.workspace }}/.tier2-zccache
          key: zccache-tier2-linux-both-${{ github.sha }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}

      # Last: snapshot the sources (zccache snapshot), move the tree into the
      # kept slot, sync, then write .clean (#4954 P5). Only after a build that
      # succeeded; a cancelled or killed job leaves no marker.
      - name: Keep Tier 2 Tree 🌲
        if: always() && !cancelled() && steps.pcache.outputs.tree != '' && steps.tier2-build.outcome == 'success'
        env:
          OBS_TIER2_BUILD: ${{ runner.temp }}/tier2
        run: >-
          uv run --no-project ci/tier2_kept_tree.py save
          --kept "${{ steps.pcache.outputs.tree }}" --build "$OBS_TIER2_BUILD" --src "$GITHUB_WORKSPACE"

      # Per-lane cache ledger; ci/cache_baseline.py rolls these up. Fail-open.
      - name: Cache ledger 📒
        if: always() && hashFiles('.github/actions/job-cache-ledger/action.yaml') != ''
        uses: ./.github/actions/job-cache-ledger
        with:
          lane: tier2-linux-build
          setup-phase-summary: ${{ steps.setup-soldr.outputs.setup-phase-summary }}
          cache-dir: ${{ steps.pcache.outputs.zccache || format('{0}/.tier2-zccache', github.workspace) }}
          since: ${{ env.CACHE_LEDGER_SINCE }}

  rust-linux-tier2:
    name: Rust Tier 2 Linux 🐧 (tests ${{ matrix.mode }}${{ matrix.part != 'suite' && format(', {0}', matrix.part) || '' }})
    runs-on: ${{ inputs.mq-heavy-labels != '' && fromJSON(inputs.mq-heavy-labels) || 'ubuntu-latest' }}
    # Load a verified prepared runtime, or install the exact closure in the
    # same pinned stock base. The helper retains original artifact paths.
    timeout-minutes: 30
    needs: [check-event, ci-mode, rust-linux-tier2-build]
    # Tests consume the validated tree, not Fast Gate output. Overlap the
    # remaining lint/Rust work; the caller's required gate still needs both.
    # Failed/skipped builds and workflow cancellation cannot start tests.
    if: ${{ always() && !cancelled() && needs.rust-linux-tier2-build.result == 'success' }}
    # PR/queue: one complete suite per backend; CTest honors RUN_SERIAL.
    # Background/release: retain separate serial runners (#2071, #2072).
    # Scheduling policy lives in ci/tier2_matrix.py, not YAML expressions.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check-event.outputs.tier2_matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      # Execute the prebuilt tree: no OBS configure, version tags or submodule sources.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          version: '0.13.5'
          enable-cache: false

      # Match the master build's exact key AND literal relative path: absolute
      # runner.temp paths change Actions' hidden version across runners. Only
      # completed .debs travel; tests never save and keep apt locks job-local.
      - name: Prepare apt Archive Directory
        run: |
          command -v zstd
          command -v docker
          mkdir -p "$GITHUB_WORKSPACE/.tier2-apt-archives"
          chmod a+rwx "$GITHUB_WORKSPACE/.tier2-apt-archives"
      - uses: ./.github/actions/cache
        id: apt-cache
        if: needs.check-event.outputs.tier2_prebaked != 'true'
        with:
          mode: restore
          path: .tier2-apt-archives/*.deb
          key: tier2-apt-ubuntu2604-f144425f-${{ hashFiles('rust/tools/linux-validate/apt-packages.txt') }}-complete
          restore-keys: |
            tier2-apt-ubuntu2604-f144425f-${{ hashFiles('rust/tools/linux-validate/apt-packages.txt') }}-

      # ctest starts the longest tests first only when it has their past
      # times; with none, the 59 s and 35 s tests started last and one shard
      # took 168 s for 228 s of -j4 work (run 38892442457). Start from the
      # timings the last master run merged (rust-linux-tier2-done, #930).
      - uses: ./.github/actions/cache
        with:
          mode: restore
          path: .tier2-cost
          key: tier2-ctest-cost-${{ github.sha }}
          restore-keys: tier2-ctest-cost-

      # On the Dell the build job left the pack in the host's handoff dir
      # (#4954 P7). Probe it before asking the shared broker to fetch the artifact.
      - name: Take Tier 2 Tree Handoff 🤝
        id: handoff
        run: |
          root=/var/cache/obs-runner/handoff
          if [ -d "$root" ]; then
            uv run --no-project ci/tier2_kept_tree.py handoff-get \
              --root "$root" --key ${{ github.run_id }} --dest "$RUNNER_TEMP/tier2-pack"
          else
            echo "no handoff dir on this runner"
          fi

      - name: Test Tier 2 From Shared Artifact
        id: shared-tier2
        if: steps.handoff.outputs.hit != 'true'
        env:
          OBS_TIER2_ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          [[ -S "${OBS_TIER2_ARTIFACT_SOCKET:-}" ]] || exit 0
          status=0
          uv run --no-project rust/tools/linux-validate/ci-runtime.py \
            --shared-artifact \
            --descriptor rust/tools/linux-validate/prepared-runtime.json \
            --prebaked-image "${{ needs.check-event.outputs.tier2_prebaked == 'true' && needs.check-event.outputs.tier2_image || '' }}" \
            --source "$GITHUB_WORKSPACE" --cost "$GITHUB_WORKSPACE/.tier2-cost" --uv "$(command -v uv)" \
            --archives "$GITHUB_WORKSPACE/.tier2-apt-archives" \
            --state "$RUNNER_TEMP/tier2-runtime" --mode '${{ matrix.mode }}' --part '${{ matrix.part }}' || status=$?
          case "$status" in
            0) echo "used=true" >> "$GITHUB_OUTPUT" ;;
            75) ;;
            *) exit "$status" ;;
          esac

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.shared-tier2.outputs.used != 'true' && steps.handoff.outputs.hit != 'true'
        with:
          name: tier2-tree
          path: ${{ runner.temp }}/tier2-pack

      - name: Select Tier 2 Scratch
        if: steps.shared-tier2.outputs.used != 'true'
        run: |
          build="$RUNNER_TEMP/tier2"
          if [[ -n "${OBS_TIER2_SCRATCH:-}" ]]; then
            if [[ "$(findmnt -n -M "$OBS_TIER2_SCRATCH" -o FSTYPE)" != tmpfs ]]; then
              echo "::error::Tier 2 pilot scratch is not mounted as tmpfs"
              exit 1
            fi
            build=$(mktemp -d "$OBS_TIER2_SCRATCH/tier2.XXXXXXXX")
            chmod 0755 "$build"
            echo "Tier 2 scratch filesystem and capacity:"
            df -h "$build"
          fi
          echo "OBS_TIER2_TEST_BUILD=$build" >> "$GITHUB_ENV"

      - name: Unpack Tier 2 Tree 📂
        if: steps.shared-tier2.outputs.used != 'true'
        run: |
          mkdir -p "$OBS_TIER2_TEST_BUILD"
          if ! tar --zstd -xf "$RUNNER_TEMP/tier2-pack/tier2-tree.tar.zst" -C "$OBS_TIER2_TEST_BUILD"; then
            df -h "$OBS_TIER2_TEST_BUILD"
            echo "::error::Tier 2 tree extraction failed. Check the tar error and available scratch capacity."
            exit 1
          fi

      - name: Test Tier 2 (${{ matrix.mode }}) ✅
        if: steps.shared-tier2.outputs.used != 'true'
        run: |
          uv run --no-project rust/tools/linux-validate/ci-runtime.py \
            --descriptor rust/tools/linux-validate/prepared-runtime.json \
            --prebaked-image "${{ needs.check-event.outputs.tier2_prebaked == 'true' && needs.check-event.outputs.tier2_image || '' }}" \
            --packages "$RUNNER_TEMP/tier2-pack/runtime-packages.txt" \
            --source "$GITHUB_WORKSPACE" --build "$OBS_TIER2_TEST_BUILD" \
            --cost "$GITHUB_WORKSPACE/.tier2-cost" --uv "$(command -v uv)" \
            --archives "$GITHUB_WORKSPACE/.tier2-apt-archives" \
            --state "$RUNNER_TEMP/tier2-runtime" --mode '${{ matrix.mode }}' --part '${{ matrix.part }}'
      - name: Upload Runtime Setup Measurement
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: tier2-runtime-${{ matrix.mode }}-${{ matrix.part }}
          path: ${{ runner.temp }}/tier2-runtime/runtime-measurement.json
          retention-days: 1
          if-no-files-found: warn
      - name: Upload Test Timings ⏱️
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          name: tier2-cost-${{ matrix.mode }}-${{ matrix.part }}
          path: .tier2-cost/ctest-cost-${{ matrix.mode }}.txt
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

      - name: Release Tier 2 Scratch
        if: always()
        run: |
          case "${OBS_TIER2_TEST_BUILD:-}" in
            "${OBS_TIER2_SCRATCH:-/nonexistent}"/tier2.*)
              scratch_name=${OBS_TIER2_TEST_BUILD##*/}
              [[ "$OBS_TIER2_TEST_BUILD" == "$OBS_TIER2_SCRATCH/$scratch_name" ]]
              [[ -d "$OBS_TIER2_TEST_BUILD" && ! -L "$OBS_TIER2_TEST_BUILD" ]] || exit 0
              df -h "$OBS_TIER2_TEST_BUILD"
              # CTest creates directories as root inside the jobs container.
              sudo -n chown -hR -- "$(id -u):$(id -g)" "$OBS_TIER2_TEST_BUILD"
              uv run --no-project python -c 'import shutil, sys; shutil.rmtree(sys.argv[1])' "$OBS_TIER2_TEST_BUILD"
              ;;
          esac

  rust-linux-tier2-done:
    name: Rust Tier 2 Linux 🐧
    runs-on: ubuntu-latest
    needs: [rust-linux-tier2]
    # Master pushes only: PRs never save timing caches, and the lane proof is
    # published after CI Gate by ci.yml's tier2-lane-proof job (#3018), so PR
    # and queue runs no longer wait 8-54 s for this runner before the gate.
    # Matrix failures still fail the reusable workflow and required CI Gate.
    if: ${{ needs.rust-linux-tier2.result == 'success' && (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
    timeout-minutes: 5
    steps:
      # Cache the test run's timings per mode for the next run's ctest
      # ordering (#930). Master only, like the compiler cache.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          # The save step below calls the local CACHE-001 wrapper, and a sparse
          # checkout rewrites the worktree to the cone: without it here the step
          # dies with "Can't find 'action.yml' ... under .github/actions/cache"
          # (#2764).
          sparse-checkout: |
            rust/tools/linux-validate
            .github/actions/cache
      # `merge_costs.py` is a PEP 723 uv script (`uv run --script`), and this
      # job has no other step that installs uv: without this the master-only
      # step fails with `uv: command not found` (exit 127) and takes the whole
      # gate down for every later run.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          pattern: tier2-cost*
          path: ${{ runner.temp }}/tier2-cost-shards
      - name: Merge Test Timings ⏱️
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          mkdir -p .tier2-cost
          shopt -s nullglob
          for mode in OFF ON; do
            # v8 flattens one matching artifact; multiple matches get subdirectories.
            set -- "$RUNNER_TEMP"/tier2-cost-shards/ctest-cost-"$mode".[t]xt "$RUNNER_TEMP"/tier2-cost-shards/tier2-cost*/ctest-cost-"$mode".txt
            [ "$#" -gt 0 ] || continue
            uv run --script rust/tools/linux-validate/merge_costs.py "$@" >".tier2-cost/ctest-cost-$mode.txt"
            echo "$mode: $(grep -c -v -e '^---$' ".tier2-cost/ctest-cost-$mode.txt") lines"
          done
          uv run --script rust/tools/linux-validate/check-costs.py .tier2-cost
      - uses: ./.github/actions/cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          mode: save
          path: .tier2-cost
          key: tier2-ctest-cost-${{ github.sha }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}

  # Qt frontend on the Linux fast path (#992): configure, build and link the
  # obs-studio app against PREBUILT Qt and FFmpeg (obs-rust/obs-studio-libs,
  # pinned by tag and sha256, never compiled here), then run the Qt-linked
  # cmocka tests. Runs when frontend/Qt code or a Qt-linked test changed
  # (ci/ci_scope.py), on master and full runs; skipped, and passing CI Gate,
  # otherwise.
  linux-qt-frontend:
    name: Qt Frontend Linux 🐧
    runs-on: ${{ inputs.mq-heavy-labels != '' && fromJSON(inputs.mq-heavy-labels) || 'ubuntu-26.04' }}
    # Independent runner: overlap frontend compilation/tests with Fast Gate.
    # The reusable workflow still fails if either selected job fails; this
    # can spend extra Qt runner time when Fast Gate fails (#1581).
    needs: [check-event, ci-mode]
    if: ${{ (github.event_name != 'pull_request' || needs.ci-mode.outputs.fast_path != 'true') && !cancelled() && needs.check-event.result == 'success' && fromJSON(needs.check-event.outputs.qt) }}
    timeout-minutes: 30
    env:
      QT_TAG: qt6-6.11.1
      QT_ASSET: qt6-6.11.1-linux-x86_64-glibc2.28-release-testlib.tar.zst
      QT_SHA256: 021cb3b0f3890851a6787c127f2b94ad0da7c5a20bc3402f09a76656c277dc6e
      FFMPEG_TAG: ffmpeg-8.1.2
      FFMPEG_ASSET: ffmpeg-8.1.2-linux-x86_64-glibc2.28-release.tar.zst
      FFMPEG_SHA256: 8796ecdb273688c21f90b75a4e84acfc84ab35e69cacb551a6d8ed452961fcb4
      CCACHE_DIR: ${{ github.workspace }}/.qt-ccache
      # Post-pruning warm working set is ~508 MB (#1269/#1696). Keep >25%
      # growth room below ci.toml's 750 MB archive allowance.
      CCACHE_MAXSIZE: 650M
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}

      # Unpacked prefixes, keyed on the pinned sha256: a warm run skips the
      # download.
      - name: Cache Prebuilt Qt 💾
        id: qt-libs-cache
        uses: ./.github/actions/cache
        with:
          mode: restore
          path: ${{ runner.temp }}/qt
          key: libs-qt-${{ env.QT_SHA256 }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}
          restore-keys: libs-qt-${{ env.QT_SHA256 }}
      - name: Cache Prebuilt FFmpeg 💾
        id: ffmpeg-libs-cache
        uses: ./.github/actions/cache
        with:
          mode: restore
          path: ${{ runner.temp }}/ffmpeg
          key: libs-ffmpeg-${{ env.FFMPEG_SHA256 }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}
          restore-keys: libs-ffmpeg-${{ env.FFMPEG_SHA256 }}
      - name: Fetch Prebuilt Libs 📦
        run: |
          uv run --no-project ci/fetch_libs_asset.py "${QT_TAG}" "${QT_ASSET}" "${QT_SHA256}" "${{ runner.temp }}/qt"
          uv run --no-project ci/fetch_libs_asset.py "${FFMPEG_TAG}" "${FFMPEG_ASSET}" "${FFMPEG_SHA256}" "${{ runner.temp }}/ffmpeg"

      # No distro Qt, FFmpeg or codec dev packages: the prebuilt prefixes
      # supply them.
      - name: Install Build Dependencies 📦
        run: |
          sudo -E "$(command -v uv)" run --no-project ci/host_apt_mirrors.py
          # Preserve the runner's fallback routes, but bound each failed acquire
          # before fallback. Installation errors still fail the job (#1269).
          apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get install "${apt_options[@]}" -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config ccache git curl zstd \
            libcurl4-openssl-dev libjansson-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-randr0-dev libxcb-shm0-dev libxcb-xinerama0-dev libxcb-composite0-dev \
            libxcb-xfixes0-dev libxcb-xinput-dev libxinerama-dev libxcomposite-dev libxdamage-dev \
            libgl-dev libglvnd-dev libgles2-mesa-dev libwayland-dev libxkbcommon-dev \
            libpulse-dev libasound2-dev libpipewire-0.3-dev libpci-dev libdrm-dev libudev-dev \
            libv4l-dev libva-dev libfontconfig-dev libfreetype-dev libspeexdsp-dev libsimde-dev \
            uthash-dev nlohmann-json3-dev libwebsocketpp-dev libasio-dev libqrcodegencpp-dev \
            libcmocka-dev libxss-dev extra-cmake-modules xvfb xauth weston libdbus-1-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xkb1 libxkbcommon-x11-0 libxcb-shape0 libxcb-sync1 libegl1

      # Publication identity only: ccache still validates every compilation,
      # and the build/tests always run. Ignore docs and unrelated CI metadata,
      # but retain this workflow and the Qt build driver as publication inputs.
      - name: Qt Compiler Snapshot Identity
        id: qt-cache-identity
        run: |
          inputs="$RUNNER_TEMP/qt-compiler-inputs"
          git ls-files --stage -z -- . ':!docs/**' ':!*.md' ':!**/*.md' ':!.github/**' ':!ci/**' ':!ci.toml' > "$inputs"
          git ls-files --stage -z -- .github/workflows/build-project.yaml ci/linux_qt_frontend.py >> "$inputs"
          printf '\nimage=%s\nqt=%s\nffmpeg=%s\n' "${ImageVersion:-unknown}" "$QT_SHA256" "$FFMPEG_SHA256" >> "$inputs"
          cc --version >> "$inputs"
          c++ --version >> "$inputs"
          cmake --version >> "$inputs"
          ccache --version >> "$inputs"
          ninja --version >> "$inputs"
          digest=$(sha256sum "$inputs" | cut -d' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Older snapshots remain useful fallbacks when actual inputs change.
      - uses: ./.github/actions/cache
        id: qt-compiler-cache
        with:
          mode: restore
          path: ${{ github.workspace }}/.qt-ccache
          key: qt-ccache-linux-inputs-v2-${{ steps.qt-cache-identity.outputs.digest }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}
          restore-keys: qt-ccache-linux-

      - name: Set Qt Cache Limit 🗄️
        id: qt-cache-epoch
        run: |
          echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          ccache --max-size="$CCACHE_MAXSIZE"
          ccache --zero-stats
          ccache --version | head -1
          du -sh "$CCACHE_DIR"

      - name: Build Frontend and Run Qt Tests 🏗️
        run: uv run --no-project ci/linux_qt_frontend.py "${{ runner.temp }}/qt" "${{ runner.temp }}/ffmpeg" "${{ runner.temp }}/qt-build"

      - name: Report Qt Cache 🗄️
        if: always()
        env:
          QT_CACHE_EPOCH: ${{ steps.qt-cache-epoch.outputs.epoch }}
        run: |
          echo "qt-cache phase=before bytes=$(du -sb "$CCACHE_DIR" | cut -f1)"
          if [ -n "$QT_CACHE_EPOCH" ]; then
            # Keep entries accessed by this build, with a one-minute margin.
            # This only trims the runner's local copy; remote writes stay master-only.
            age=$(( $(date +%s) - QT_CACHE_EPOCH + 60 ))
            if [ "$age" -lt 60 ]; then age=60; fi
            ccache --evict-older-than "${age}s"
          fi
          ccache --cleanup
          echo "qt-cache phase=after bytes=$(du -sb "$CCACHE_DIR" | cut -f1)"
          ccache --show-stats --verbose
          du -sh "$CCACHE_DIR"

      - name: Save Qt ccache 💾
        uses: ./.github/actions/cache
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && steps.qt-compiler-cache.outputs.cache-hit != 'true'
        with:
          mode: save
          path: ${{ github.workspace }}/.qt-ccache
          key: qt-ccache-linux-inputs-v2-${{ steps.qt-cache-identity.outputs.digest }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}

      - name: Save Prebuilt Qt 💾
        if: github.ref == 'refs/heads/master' && steps.qt-libs-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/cache
        with:
          mode: save
          path: ${{ runner.temp }}/qt
          key: libs-qt-${{ env.QT_SHA256 }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}

      - name: Save Prebuilt FFmpeg 💾
        if: github.ref == 'refs/heads/master' && steps.ffmpeg-libs-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/cache
        with:
          mode: save
          path: ${{ runner.temp }}/ffmpeg
          key: libs-ffmpeg-${{ env.FFMPEG_SHA256 }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}

  # Linux producer of the run-only macOS Tier 2 bundle (#5009, #5843): every
  # CMake/CTest artifact is cross-built and signed here with soldr's Darwin
  # LLVM; the macOS consumer below only verifies the seal and runs CTest.
  rust-tier2-macos-build:
    timeout-minutes: 60
    name: macOS Tier 2 Artifacts 🐧
    runs-on: ${{ inputs.mq-heavy-labels != '' && fromJSON(inputs.mq-heavy-labels) || 'ubuntu-26.04' }}
    needs: [check-event, ci-mode]
    outputs:
      common-parent: ${{ steps.workspace.outputs.common-parent }}
      artifact-id: ${{ steps.bundle.outputs.artifact-id }}
    if: ${{ always() && !cancelled() && github.event_name != 'merge_group' && github.event_name != 'pull_request' && needs.ci-mode.outputs.skip_rust-tier2-macos != 'true' && needs.check-event.outputs.macos == 'true' }}
    env:
      COMMON_PARENT: /opt/obs-ci-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.14'
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      # CTest records absolute build and source paths: build and run at the same
      # real path (/opt resolves identically on Linux and macOS).
      - name: Place common checkout
        id: workspace
        run: |
          sudo mkdir -p "${COMMON_PARENT}"
          sudo chown "$(id -u):$(id -g)" "${COMMON_PARENT}"
          uv run --no-project ci/macos_test_workspace.py place --source "${GITHUB_WORKSPACE}" --destination "${COMMON_PARENT}/src"

      - name: Set Up soldr 🦀
        uses: zackees/setup-soldr@dd26c92eb35c553b208bb741326b6d54cf611436 # setup-soldr#707
        with:
          verdict-scope: build-project
          version: 0.9.54
          build-cache: false
          prebuild-deps: none
          cargo-registry-cache: true
          cache-key-suffix: linux-host-v3
          save-cache-remote: ${{ github.ref == 'refs/heads/master' }}
          solo-toolchain-cache: false
          s3-bucket: forge-ci
          s3-endpoint: nyc3.digitaloceanspaces.com
          s3-region: nyc3
          s3-cache-limit: 50G
        env:
          SOLDR_S3_CACHE_ACCESS_KEY: ${{ secrets.SOLDR_S3_CACHE_ACCESS_KEY }}
          SOLDR_S3_CACHE_SECRET_KEY: ${{ secrets.SOLDR_S3_CACHE_SECRET_KEY }}

      - name: Cross-build and sign the Tier 2 closure 🔗
        run: uv run --no-project --with cmake==3.31.10 --with ninja==1.13.0 ci/cmocka_link_check.py --alias mac-arm64 --build "${GITHUB_WORKSPACE}/build_cmocka_link_mac-arm64"

      - name: Seal and pack the run-only bundle 📦
        run: |
          uv run --no-project ci/macos_tier2_bundle.py stage --work "${GITHUB_WORKSPACE}/build_cmocka_link_mac-arm64" --output "${RUNNER_TEMP}/macos-tier2-bundle" --source-sha "${GITHUB_SHA}"
          uv run --no-project ci/macos_test_workspace.py pack --bundle "${RUNNER_TEMP}/macos-tier2-bundle" --archive "${RUNNER_TEMP}/macos-tier2.tar.gz"

      - name: Upload Tier 2 bundle
        id: bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-tier2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/macos-tier2.tar.gz
            ${{ runner.temp }}/macos-tier2.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Restore checkout
        if: always() && steps.workspace.outcome == 'success'
        run: uv run --no-project ci/macos_test_workspace.py restore --source "${GITHUB_WORKSPACE}" --destination "${COMMON_PARENT}/src"

  # Run-only: nothing compiles on macOS. The existing CTest registry runs against
  # the C reference libobs, then the hybrid libobs, from the Linux bundle.
  rust-tier2-macos-ctest:
    timeout-minutes: 30
    name: Rust Tier 2 CTest (macos-26)
    runs-on: macos-26
    needs: [check-event, ci-mode, rust-tier2-macos-build]
    if: ${{ always() && !cancelled() && needs.rust-tier2-macos-build.result == 'success' && github.event_name != 'merge_group' && github.event_name != 'pull_request' }}
    env:
      COMMON_PARENT: ${{ needs.rust-tier2-macos-build.outputs.common-parent }}
    steps:
      # Source files are runtime test data.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.14'
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      - name: Place common checkout
        id: workspace
        run: |
          sudo mkdir -p "${COMMON_PARENT}"
          sudo chown "$(id -u):$(id -g)" "${COMMON_PARENT}"
          uv run --no-project ci/macos_test_workspace.py place --source "${GITHUB_WORKSPACE}" --destination "${COMMON_PARENT}/src"

      - name: Download Tier 2 bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.rust-tier2-macos-build.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/macos-tier2-download

      - name: Verify and unpack Tier 2 bundle
        run: uv run --no-project ci/macos_test_workspace.py unpack --archive "${RUNNER_TEMP}/macos-tier2-download/macos-tier2.tar.gz"

      - name: Run prebuilt Tier 2 CTest
        run: uv run --no-project ci/macos_tier2_bundle.py run --source-sha "${GITHUB_SHA}" --jobs 3

      - name: Restore checkout
        if: always() && steps.workspace.outcome == 'success'
        run: uv run --no-project ci/macos_test_workspace.py restore --source "${GITHUB_WORKSPACE}" --destination "${COMMON_PARENT}/src"

  rust-tier2-macos:
    # 2x the 17-24 min the lane now runs; 25 timed out on master (#5415, #2593 A).
    timeout-minutes: 45
    name: Rust Tier 2 (macos-26)
    runs-on: macos-26
    # Starts with Fast Gate (#2985), like the other platform lanes.
    needs: [check-event, ci-mode]
    # Only the platforms the change touches (#436); Linux Tier 2 always runs
    # (rust-linux-tier2).
    if: ${{ always() && !cancelled() && github.event_name != 'merge_group' && github.event_name != 'pull_request' && needs.ci-mode.outputs.skip_rust-tier2-macos != 'true' && needs.check-event.outputs.macos == 'true' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      # Production hybrid libobs builds Rust ports through Corrosion; shims select
      # pinned soldr. Native C/C++ caches remain separate from the Rust bypass.
      - name: Set Up soldr 🦀
        uses: zackees/setup-soldr@db9aa035e488f4dde7d31d5c8cb4ec20ec99c6c1 # merge of forge-ci/setup-soldr#676: persistent-root cook store and recipes (#675)
        with:
          # One scope for every caller (push.yaml, ci.yml), so PRs replay
          # the verdicts master publishes (forge-ci/setup-soldr#604).
          verdict-scope: build-project
          # soldr 0.9.54 embeds zccache 1.15.14+, which names MSVC staticlib
          # outputs <crate>-<hash>.lib (zackees/zccache#1937).
          version: 0.9.54
          build-cache: false
          # validate.sh/.ps1 build Rust with --target <triple> into
          # build/cargo-native-* and through Corrosion, so a cooked workspace
          # target/release (20-22 s) is never read (#3034). Keep the crate
          # sources for those builds.
          prebuild-deps: none
          cargo-registry-cache: true
          save-cache-remote: ${{ github.ref == 'refs/heads/master' }}
          shims: true
          # S3 remote cache: bucket forge-ci on DO Spaces nyc3; the 50G watermark is
          # enforced only on the merge_group singleton. No bucket/creds = feature off.
          s3-bucket: forge-ci
          s3-endpoint: nyc3.digitaloceanspaces.com
          s3-region: nyc3
          s3-cache-limit: 50G
        env:
          SOLDR_S3_CACHE_ACCESS_KEY: ${{ secrets.SOLDR_S3_CACHE_ACCESS_KEY }}
          SOLDR_S3_CACHE_SECRET_KEY: ${{ secrets.SOLDR_S3_CACHE_SECRET_KEY }}

      # validate.sh builds through the macos-ci preset's Xcode compilation
      # cache; it started empty every run, so every build compiled cold
      # (about 6.5 of 10 min in run 38908431573, #930). As for the macOS OBS
      # build, PR and queue runs restore master's CAS; master runs (push,
      # schedule, dispatch: a push runs this job only for macOS paths) build
      # cold and save, so the CAS holds only what the tree uses (it cannot be
      # pruned by age).
      - name: Restore Tier 2 Xcode Cache 🗄️
        if: runner.os == 'macOS' && !(github.event_name != 'pull_request' && github.ref == 'refs/heads/master')
        uses: ./.github/actions/cache
        with:
          mode: restore
          path: ${{ github.workspace }}/.tier2-xcas
          key: macos-tier2-xcas-${{ github.sha }}
          restore-keys: macos-tier2-xcas-

      - name: Set Up uv 🐍
        if: runner.os == 'macOS'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.14'
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      - name: Validate Tier 2 on macOS (libobs C vs with Rust) 🍏
        if: runner.os == 'macOS'
        shell: bash
        env:
          XCODE_CAS_PATH: ${{ github.workspace }}/.tier2-xcas
          OBS_CTEST_JOBS: 3
        run: |
          "${GITHUB_WORKSPACE}/.github/scripts/retry" brew install cmocka
          bash rust/tools/tier2-validate/validate.sh
          du -sh "$XCODE_CAS_PATH"

      - name: Save Tier 2 Xcode Cache 💾
        if: runner.os == 'macOS' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: ./.github/actions/cache
        with:
          mode: save
          path: ${{ github.workspace }}/.tier2-xcas
          key: macos-tier2-xcas-${{ github.sha }}

      # The windows-ci-x64 preset enables ccache (ENABLE_CCACHE) whenever it is
      # on PATH, as the Windows OBS build does; without it both Tier 2 builds
      # compiled cold, about 5.5 of 9.1 min (#1038). Only master pushes save.
      - name: Restore Tier 2 ccache 🗄️
        if: runner.os == 'Windows'
        uses: ./.github/actions/cache
        with:
          mode: restore
          path: ${{ github.workspace }}/.ccache
          key: windows-tier2-ccache-${{ github.sha }}
          restore-keys: windows-tier2-ccache-

      - name: Set Up ccache 🗄️
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Set Up ccache 🗄️ (same pinned build as windows-build)
          $Version = '4.14.1'
          $Hash = '6219f3865ca59aec41ee4b678df171d5d35855ecb2b6dbbbd20690b3a68af7b4'
          $Name = "ccache-${Version}-windows-x86_64"
          $Zip = "${env:RUNNER_TEMP}/${Name}.zip"

          Invoke-WebRequest -Uri "https://github.com/ccache/ccache/releases/download/v${Version}/${Name}.zip" -OutFile $Zip
          if ( (Get-FileHash -Algorithm SHA256 -Path $Zip).Hash -ne $Hash ) { throw "${Name}.zip checksum mismatch" }
          Expand-Archive -Path $Zip -DestinationPath $env:RUNNER_TEMP

          $CcacheHome = Join-Path $env:RUNNER_TEMP $Name
          $env:CCACHE_DIR = Join-Path $env:GITHUB_WORKSPACE '.ccache'
          $CcacheHome >> $env:GITHUB_PATH
          @(
            "CCACHE_DIR=${env:CCACHE_DIR}"
            'CCACHE_MAXSIZE=2G'
            'CCACHE_COMPILERCHECK=content'
            'CCACHE_SLOPPINESS=include_file_mtime,include_file_ctime'
          ) >> $env:GITHUB_ENV
          & (Join-Path $CcacheHome 'ccache.exe') --zero-stats

      # cmocka took 37 s to build from source through vcpkg every run.
      - name: Cache vcpkg Binaries 🗄️
        id: cmocka-cache
        if: runner.os == 'Windows'
        uses: ./.github/actions/cache
        with:
          mode: restore
          path: ${{ github.workspace }}/.vcpkg-bin
          key: vcpkg-bin-cmocka-x64-windows-v1

      - name: Validate Tier 2 on Windows (libobs C vs with Rust) 🪟
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-bin,readwrite
          OBS_CTEST_JOBS: 4
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/.vcpkg-bin" | Out-Null
          vcpkg install cmocka:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed ($LASTEXITCODE)" }
          ./rust/tools/tier2-validate/validate.ps1 -CMockaPrefix "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows"
          ccache --show-stats

      - name: Save Tier 2 ccache 💾
        if: runner.os == 'Windows' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: ./.github/actions/cache
        with:
          mode: save
          path: ${{ github.workspace }}/.ccache
          key: windows-tier2-ccache-${{ github.sha }}

      - name: Save vcpkg Binaries 💾
        if: runner.os == 'Windows' && github.ref == 'refs/heads/master' && steps.cmocka-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/cache
        with:
          mode: save
          path: ${{ github.workspace }}/.vcpkg-bin
          key: vcpkg-bin-cmocka-x64-windows-v1

  # Manual candidate only. Existing application jobs keep read-only tokens.
  # Use the job GITHUB_TOKEN: its release/tag writes do not recursively trigger
  # product workflows. No PAT, Actions artifact cache transport or PR writer.
  rust-tier2-windows:
