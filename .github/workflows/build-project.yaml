name: Build Project
on:
  workflow_call:
    inputs:
      native-cache-measurement-only:
        description: Measure only native cache protocols and lightweight gates on trusted manual master runs
        type: boolean
        default: false
      native-cache-measurement-conflict:
        description: Internal caller validation for incompatible additional measurement protocols
        type: boolean
        default: false
      flatpak-measurement-only:
        description: Restrict the manual build matrix to complete Flatpak and lightweight gates
        type: boolean
        default: false
      flatpak-compiler-diagnostics:
        description: Record bounded compiler cache reasons and log spans (manual diagnostic, no raw command upload)
        type: boolean
        default: false
      flatpak-runtime-test:
        description: Run the exported Flatpak with saved capture/browser sources and Debug extension (extra qualification cost)
        type: boolean
        default: false
      flatpak-dependency-transfer-probe:
        description: Also transfer actual OSTree cache state (requires compiler transfer probe; extra storage/build cost)
        type: boolean
        default: false
      flatpak-compiler-transfer-probe:
        description: Transfer an experimental compiler artifact to one fresh Flatpak builder (extra storage/build cost)
        type: boolean
        default: false
      flatpak-cold-build:
        description: Measure a fresh Flatpak builder and compiler cache without restoring or publishing either cache
        type: boolean
        default: false
      flatpak-pruned-build-probe:
        description: Validate dependency-only application rebuild and subsequent compiler reuse
        type: boolean
        default: false
      full:
        # obs-rust/obs-studio#436: the release gate. PRs and master pushes (the
        # dev cycle) skip Flatpak, the macOS/Windows OBS builds, Ubuntu with
        # Rust libobs and Tier 2 macOS/Windows; release-rust.yaml runs them all
        # with full: true and won't publish unless they pass. Tags, schedule,
        # workflow_dispatch are full too; so is a PR whose paths need it (ci/ci_scope.py).
        description: Run every build, including the release-gating ones
        type: boolean
        required: false
        default: false
      flatpak-cache-probe:
        description: Measure isolated Flatpak downloads and proxy compression after Flatpak output validation
        type: boolean
        default: false
      native-cache-reuse-source:
        description: Qualify real native builds from this exact release-cache producer SHA (manual master only)
        type: string
        default: ''
      native-cache-transport-probe:
        description: Qualify bounded native cache release transport on master (writes cache-only prereleases)
        type: boolean
        default: false
      native-cache-probe:
        description: Opt-in manual Windows compiler-cache budget measurement; does not replace full validation
        type: boolean
        required: false
        default: false
# Keep all application and utility job tokens read-only. Only the guarded
# transport publisher below overrides this default. Caller grants are ceilings.
permissions:
  actions: read
  contents: read
# A newer run of the same ref cancels the one it supersedes, so a pushed fix
# does not queue behind the builds of the commit it replaces (WF-002, #962).
# The literal prefix keeps the group distinct from the calling workflow's own
# group — inside a called workflow `github.workflow` is the caller's name.
concurrency:
  group: build-project-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
env:
  # Pinned soldr can replay stale Rust output (zackees/zccache#1943).
  # Keep cook/target reuse and standalone C/C++ compiler caching enabled.
  SOLDR_RUSTC_WRAPPER: none
jobs:
  check-event:
    timeout-minutes: 10
    name: Event Data 🔎
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash
    outputs:
      package: ${{ steps.setup.outputs.package }}
      codesign: ${{ steps.setup.outputs.codesign }}
      notarize: ${{ steps.setup.outputs.notarize }}
      config: ${{ steps.setup.outputs.config }}
      commitHash: ${{ steps.setup.outputs.commitHash }}
      full: ${{ steps.native.outputs.full }}
      core: ${{ steps.native.outputs.core }}
      macos: ${{ steps.native.outputs.macos }}
      windows: ${{ steps.native.outputs.windows }}
      platform_os: ${{ steps.native.outputs.platform_os }}
      deferred: ${{ steps.native.outputs.deferred }}
      qt: ${{ steps.native.outputs.qt }}
      tier2: ${{ steps.native.outputs.tier2 }}
      linux_targets: ${{ steps.native.outputs.linux_targets }}
      qt_sdk: ${{ steps.native.outputs.qt_sdk }}
      docs_only: ${{ steps.native.outputs.docs_only }}
      cross_targets: ${{ steps.native.outputs.cross_targets }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      - name: Check Experimental Flatpak Inputs
        if: inputs.flatpak-dependency-transfer-probe
        run: test '${{ inputs.flatpak-compiler-transfer-probe }}' = true

      - name: Check Event Data ☑️
        id: setup
        env:
          NATIVE_REUSE_SOURCE: ${{ inputs.native-cache-reuse-source }}
          NATIVE_TRANSPORT_PROBE: ${{ inputs.native-cache-transport-probe }}
          NATIVE_BUDGET_PROBE: ${{ inputs.native-cache-probe }}
          GH_TOKEN: ${{ github.token }}
        run: |
          : Check Event Data ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          if [[ -n "$NATIVE_REUSE_SOURCE" ]]; then
            [[ "$GITHUB_REPOSITORY" == obs-rust/obs-studio && "$GITHUB_REF" == refs/heads/master && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
            [[ "$NATIVE_REUSE_SOURCE" =~ ^[0-9a-f]{40}$ ]]
            [[ "$NATIVE_TRANSPORT_PROBE" != true && "$NATIVE_BUDGET_PROBE" != true ]]
          fi

          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              config_data=('codesign:false' 'notarize:false' 'package:false' 'config:RelWithDebInfo')
              if gh pr view ${{ github.event.number }} --json labels \
                | jq -e -r '.labels[] | select(.name == "Seeking Testers")' > /dev/null; then
                config_data[0]='codesign:true'
                config_data[2]='package:true'
              fi
              ;;
            push)
              config_data=('codesign:true' 'notarize:false' 'package:true' 'config:RelWithDebInfo')
              if [[ ${GITHUB_REF_NAME} =~ [0-9]+.[0-9]+.[0-9]+(-(rc|beta).+)? ]]; then
                config_data[1]='notarize:true'
                config_data[3]='config:Release'
              fi
              ;;
            workflow_dispatch)
              config_data=('codesign:true' 'notarize:false' 'package:false' 'config:RelWithDebInfo')
              ;;
            schedule)
              config_data=('codesign:true' 'notarize:false' 'package:true' 'config:RelWithDebInfo')
              ;;
            *) ;;
          esac

          for config in "${config_data[@]}"; do
            IFS=':' read -r key value <<< "${config}"
            echo "${key}=${value}" >> $GITHUB_OUTPUT
          done
          echo "commitHash=${GITHUB_SHA:0:9}" >> $GITHUB_OUTPUT

      # A PR must not move a submodule pointer backwards (#693): stale
      # checkouts reverted merged obs-websocket fixes (#492, #496, #503, #615).
      # `submodule:` in the PR title allows a deliberate move back.
      - name: Check Submodule Pointers 🧭
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.merge_group.base_sha || format('origin/{0}', github.base_ref) }}
        run: uv run --no-project ci/submodule_direction.py "${BASE}"

      # What this change needs (#436, ci/ci_scope.py): the Linux Rust tests
      # and Tier 2 always run; macOS or Windows code, or shared build/CI
      # config, adds that platform's Rust tests and Tier 2. Every OBS app
      # build (Ubuntu, macOS, Windows, Flatpak) is release-gating: `full`
      # (the release gate in release-rust.yaml, tags, release branches,
      # schedule, workflow_dispatch, or paths that need them: build-aux/, plugin submodule moves).
      - name: Check Change Scope 🧭
        id: native
        env:
          FLATPAK_MEASUREMENT_ONLY: ${{ inputs.flatpak-measurement-only }}
          NATIVE_MEASUREMENT_ONLY: ${{ inputs.native-cache-measurement-only }}
          NATIVE_MEASUREMENT_CONFLICT: ${{ inputs.native-cache-measurement-conflict || inputs.flatpak-measurement-only || inputs.flatpak-compiler-diagnostics || inputs.flatpak-runtime-test || inputs.flatpak-cold-build || inputs.flatpak-dependency-transfer-probe || inputs.flatpak-compiler-transfer-probe || inputs.flatpak-cache-probe || inputs.flatpak-pruned-build-probe }}
          NATIVE_TRANSPORT_PROBE: ${{ inputs.native-cache-transport-probe }}
          NATIVE_REUSE_SOURCE: ${{ inputs.native-cache-reuse-source }}
          NATIVE_BUDGET_PROBE: ${{ inputs.native-cache-probe }}
          GH_TOKEN: ${{ github.token }}
        run: |
          : Check Change Scope 🧭
          # A reusable caller cannot use this manual observation mode to omit gates.
          if [[ "$FLATPAK_MEASUREMENT_ONLY" == true ]]; then
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && '${{ inputs.full }}' != true ]]
          fi
          # Native observations cannot substitute for a release/full validation.
          # Reject conflicting protocols before selecting any expensive matrix.
          if [[ "$NATIVE_MEASUREMENT_ONLY" == true ]]; then
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && '${{ inputs.full }}' != true ]]
            [[ "$GITHUB_REPOSITORY" == obs-rust/obs-studio && "$GITHUB_REF" == refs/heads/master ]]
            [[ "$NATIVE_MEASUREMENT_CONFLICT" != true && "$FLATPAK_MEASUREMENT_ONLY" != true && "$NATIVE_BUDGET_PROBE" != true ]]
            if [[ "$NATIVE_TRANSPORT_PROBE" == true ]]; then
              [[ -z "$NATIVE_REUSE_SOURCE" ]]
            else
              [[ "$NATIVE_REUSE_SOURCE" =~ ^[0-9a-f]{40}$ ]]
            fi
          fi
          # No label changes what runs (#992). Schedule, workflow_dispatch,
          # tags, release branches and the release gate (inputs.full) run
          # everything (#436); a master push runs its paths' lanes plus the
          # ones a PR defers (below); a PR or merge-queue run runs the
          # lanes its changed paths select (ci/ci_scope.py's LANES table).
          event_full=false
          if [[ "${{ inputs.full }}" == true ]] \
            || [[ "${GITHUB_EVENT_NAME}" == schedule || "${GITHUB_EVENT_NAME}" == workflow_dispatch ]] \
            || [[ "${GITHUB_REF_TYPE}" == tag || "${GITHUB_REF_NAME}" == release/* ]]; then
            event_full=true
          fi
          if [[ "${event_full}" == true ]]; then
            full=true core=true macos=true windows=true qt=true tier2=true qt_sdk=true linux_targets=
            cross_targets=mac-arm64,win-x64
          else
            if [[ "${GITHUB_EVENT_NAME}" == pull_request ]]; then
              base="origin/${GITHUB_BASE_REF}"
            elif [[ "${GITHUB_EVENT_NAME}" == merge_group ]]; then
              base="${{ github.event.merge_group.base_sha }}"
            elif [[ "${GITHUB_EVENT_NAME}" == push && "${GITHUB_REF_NAME}" == master ]]; then
              # Pending master builds coalesce. Include paths from every
              # push since the last successful build, including skipped pushes.
              base="$(uv run --no-project ci/master_scope_base.py)"
            else
              # A merge-queue push can carry several commits. Warm every
              # selected path in the push, not only its final commit.
              base="${{ github.event.before || 'HEAD^1' }}"
            fi
            eval "$(uv run --no-project ci/ci_scope.py "${base}")"
          fi
          # Fast PR path (#992): a PR or merge-queue run that no path escalates
          # to the full builds runs only the lanes its paths select; the
          # workspace tests and the unselected lanes run on master.
          deferred=false
          if [[ "${full}" != true ]] \
            && [[ "${GITHUB_EVENT_NAME}" == pull_request || "${GITHUB_EVENT_NAME}" == merge_group ]]; then
            deferred=true
          fi
          # master pushes run every lane the scope would skip on a PR,
          # Fast Gate included even for a docs-only change (#2079).
          if [[ "${deferred}" != true ]]; then
            qt=true tier2=true docs_only=false
          fi
          # Measurement jobs keep their app builds and Fast Gate, not unrelated matrices.
          if [[ "$FLATPAK_MEASUREMENT_ONLY" == true || "$NATIVE_MEASUREMENT_ONLY" == true ]]; then
            core=false macos=false windows=false qt=false tier2=false qt_sdk=false linux_targets= cross_targets=
          fi
          os=()
          [[ "${macos}" == true ]] && os+=('"macos-26"')
          [[ "${windows}" == true ]] && os+=('"windows-2025-vs2026"')
          {
            echo "full=${full}"
            echo "deferred=${deferred}"
            echo "core=${core}"
            echo "macos=${macos}"
            echo "windows=${windows}"
            echo "qt=${qt:-false}"
            echo "tier2=${tier2:-false}"
            echo "linux_targets=${linux_targets:-}"
            echo "qt_sdk=${qt_sdk:-false}"
            echo "docs_only=${docs_only:-false}"
            echo "cross_targets=${cross_targets:-}"
            echo "platform_os=[$(IFS=,; echo "${os[*]}")]"
          } >> "${GITHUB_OUTPUT}"
          echo "full=${full} core=${core} macos=${macos} windows=${windows} qt=${qt} tier2=${tier2}"

  macos-build:
    timeout-minutes: 90
    name: macOS 🍏
    runs-on: macos-26
    needs: check-event
    # OBS app builds are release-gating (#436): release gate, tags, schedule,
    # dispatch and path-triggered full PRs only.
    if: ${{ !inputs.flatpak-measurement-only && fromJSON(needs.check-event.outputs.full) }}
    strategy:
      fail-fast: false
      matrix:
        target: [arm64, x86_64]
    defaults:
      run:
        shell: zsh --no-rcs --errexit --pipefail {0}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up Environment 🔧
        id: setup
        run: |
          : Set Up Environment 🔧
          if (( ${+RUNNER_DEBUG} )) setopt XTRACE

          print '::group::Enable Xcode 26.5'
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          print '::endgroup::'

          print '::group::Clean Homebrew Environment'
          local -a unwanted_formulas=()
          local -a remove_formulas=()
          for formula (${unwanted_formulas}) {
            if [[ -d ${HOMEBREW_PREFIX}/Cellar/${formula} ]] remove_formulas+=(${formula})
          }

          if (( #remove_formulas )) brew uninstall --ignore-dependencies ${remove_formulas}
          print '::endgroup::'

          local -A arch_names=(x86_64 intel arm64 apple)
          print "cpuName=${arch_names[${{ matrix.target }}]}" >> $GITHUB_OUTPUT

          local xcode_cas_path="${HOME}/Library/Developer/Xcode/DerivedData/CompilationCache.noindex"

          if ! [[ -d ${xcode_cas_path} ]] mkdir -p ${xcode_cas_path}

          print "xcodeCasPath=${xcode_cas_path}" >> $GITHUB_OUTPUT

      - name: Set Up uv for Native Release Reuse
        if: inputs.native-cache-reuse-source != ''
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      - name: Prepare Native Release Reuse
        id: native-reuse
        if: inputs.native-cache-reuse-source != ''
        shell: bash
        env:
          NATIVE_REUSE_SOURCE: ${{ inputs.native-cache-reuse-source }}
          NATIVE_CACHE_JOB_TOKEN: ${{ github.token }}
        run: |
          uv run --no-project ci/native_cache_identity.py --platform macos --architecture '${{ matrix.target }}' --configuration '${{ needs.check-event.outputs.config }}' --output "$RUNNER_TEMP/native-reuse-identity.json" --diagnostics "$RUNNER_TEMP/native-reuse-identity-diagnostics.json"
          uv run --no-project ci/native_cache_transport.py consume --require-hit --expected-source "$NATIVE_REUSE_SOURCE" --identity "$RUNNER_TEMP/native-reuse-identity.json" --destination "$RUNNER_TEMP/native-reuse-cache" --report "$RUNNER_TEMP/native-reuse-consume.json"
          uv run --no-project ci/native_cache_freshness.py prepare --root "$GITHUB_WORKSPACE" --state "$RUNNER_TEMP/native-reuse-state.json" --report "$RUNNER_TEMP/native-reuse-prepare.json"
          echo "cache_path=$RUNNER_TEMP/native-reuse-cache" >> "$GITHUB_OUTPUT"

      # Compiler cache policy (zackees/ci.yml): only master pushes save, keyed by
      # commit so the cache follows master instead of freezing at its first save.
      # Master pushes build cold so the saved Xcode CAS holds only what the
      # current tree uses (the CAS cannot be pruned by age like ccache).
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: macos-compiler-cache
        if: ${{ inputs.native-cache-reuse-source == '' && !(github.event_name == 'push' && github.ref == 'refs/heads/master') }}
        with:
          path: ${{ steps.setup.outputs.xcodeCasPath }}
          key: ${{ runner.os }}-xcode-${{ matrix.target }}-${{ needs.check-event.outputs.config }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ matrix.target }}-${{ needs.check-event.outputs.config }}-
            ${{ runner.os }}-xcode-${{ matrix.target }}-

      - name: Set Up Code Signing 🔑
        uses: ./.github/actions/setup-macos-codesigning
        if: fromJSON(needs.check-event.outputs.codesign)
        id: codesign
        with:
          codesignIdentity: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          codesignCertificate: ${{ secrets.MACOS_SIGNING_CERT }}
          certificatePassword: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          keychainPassword: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          provisioningProfile: ${{ secrets.MACOS_SIGNING_PROVISIONING_PROFILE }}
          notarizationUser: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
          notarizationPassword: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}

      # The GPU status light links Rust into every frontend build (#946).
      # Install the toolchain rust-toolchain.toml pins (rustup's auto-install
      # is deprecated); the x86_64 leg cross-builds on an arm64 runner and
      # needs that target's standard library too.
      - name: Install the Rust toolchain 🦀
        run: |
          soldr rustup toolchain install
          if [[ '${{ matrix.target }}' == x86_64 ]] soldr rustup target add x86_64-apple-darwin

      - name: Build OBS Studio 🧱
        uses: ./.github/actions/build-obs
        env:
          TWITCH_CLIENTID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_HASH: ${{ secrets.TWITCH_HASH }}
          RESTREAM_CLIENTID: ${{ secrets.RESTREAM_CLIENTID }}
          RESTREAM_HASH: ${{ secrets.RESTREAM_HASH }}
          YOUTUBE_CLIENTID: ${{ secrets.YOUTUBE_CLIENTID }}
          YOUTUBE_CLIENTID_HASH: ${{ secrets.YOUTUBE_CLIENTID_HASH }}
          YOUTUBE_SECRET: ${{ secrets.YOUTUBE_SECRET }}
          YOUTUBE_SECRET_HASH: ${{ secrets.YOUTUBE_SECRET_HASH }}
          XCODE_CAS_PATH: ${{ steps.native-reuse.outputs.cache_path || steps.setup.outputs.xcodeCasPath }}
        with:
          target: ${{ matrix.target }}
          config: ${{ needs.check-event.outputs.config }}
          codesign: ${{ fromJSON(needs.check-event.outputs.codesign) }}
          codesignIdent: ${{ steps.codesign.outputs.codesignIdent }}
          codesignTeam: ${{ steps.codesign.outputs.codesignTeam }}
          provisioningProfileUUID: ${{ steps.codesign.outputs.provisioningProfileUUID }}

      - name: Verify Native Installed Binary Freshness
        if: inputs.native-cache-reuse-source != ''
        shell: bash
        run: |
          uv run --no-project ci/native_cache_identity.py --platform macos --architecture '${{ matrix.target }}' --configuration '${{ needs.check-event.outputs.config }}' --expected "$RUNNER_TEMP/native-reuse-identity.json" --output "$RUNNER_TEMP/native-reuse-final-identity.json" --diagnostics "$RUNNER_TEMP/native-reuse-final-identity-diagnostics.json"
          uv run --no-project ci/native_cache_freshness.py verify --root "$GITHUB_WORKSPACE" --state "$RUNNER_TEMP/native-reuse-state.json" --platform macos --architecture '${{ matrix.target }}' --report "$RUNNER_TEMP/native-reuse-freshness.json"

      - name: Restore Native Freshness Source
        if: always() && inputs.native-cache-reuse-source != ''
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/native-reuse-state.json" ]]; then
            uv run --no-project ci/native_cache_freshness.py restore --root "$GITHUB_WORKSPACE" --state "$RUNNER_TEMP/native-reuse-state.json" --report "$RUNNER_TEMP/native-reuse-restore.json"
          fi

      - name: Upload Native Build Reuse Evidence
        if: always() && inputs.native-cache-reuse-source != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-build-reuse-macos-${{ matrix.target }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-reuse-*.json
          retention-days: 1
          if-no-files-found: warn

      - name: Package OBS Studio 📀
        uses: ./.github/actions/package-obs
        if: ${{ inputs.native-cache-reuse-source == '' && fromJSON(needs.check-event.outputs.package) }}
        with:
          target: ${{ matrix.target }}
          config: ${{ needs.check-event.outputs.config }}
          package: ${{ fromJSON(needs.check-event.outputs.package) }}
          codesign: ${{ fromJSON(needs.check-event.outputs.codesign) && fromJSON(steps.codesign.outputs.haveCodesignIdent) }}
          codesignIdent: ${{ steps.codesign.outputs.codesignIdent }}
          notarize: ${{ fromJSON(needs.check-event.outputs.notarize) && fromJSON(steps.codesign.outputs.haveNotarizationUser) }}
          codesignUser: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
          codesignPass: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.native-cache-reuse-source == '' && fromJSON(needs.check-event.outputs.package) }}
        with:
          name: obs-studio-macos-${{ matrix.target }}-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/build_macos/obs-studio-*-macos-${{ steps.setup.outputs.cpuName }}.*

      - name: Upload Debug Symbol Artifacts 🪲
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ needs.check-event.outputs.config == 'Release' }}
        with:
          name: obs-studio-macos-${{ matrix.target }}-${{ needs.check-event.outputs.commitHash }}-dSYMs
          path: ${{ github.workspace }}/build_macos/obs-studio-*-macos-${{ steps.setup.outputs.cpuName }}-dSYMs.tar.xz

      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        if: ${{ inputs.native-cache-reuse-source == '' && !inputs.native-cache-transport-probe && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && steps.macos-compiler-cache.outputs.cache-hit != 'true' }}
        with:
          path: ${{ steps.setup.outputs.xcodeCasPath }}
          key: ${{ runner.os }}-xcode-${{ matrix.target }}-${{ needs.check-event.outputs.config }}-${{ github.sha }}

      # Identity evidence only; the separate manual publisher has its own token.
      - name: Set Up uv for Native Transport Identity
        if: inputs.native-cache-transport-probe
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      - name: Record Native Transport Identity
        if: inputs.native-cache-transport-probe
        run: >-
          uv run --no-project ci/native_cache_identity.py --platform macos
          --architecture '${{ matrix.target }}' --configuration '${{ needs.check-event.outputs.config }}'
          --output '${{ runner.temp }}/native-cache-identity.json'
          --diagnostics '${{ runner.temp }}/native-cache-identity-diagnostics.json'

      - name: Bind Native Transport Seed
        id: native-seed
        if: inputs.native-cache-transport-probe
        shell: bash
        run: >-
          uv run --no-project ci/native_cache_seed.py
          --identity '${{ runner.temp }}/native-cache-identity.json'
          --source-sha '${{ github.sha }}' --output "$GITHUB_OUTPUT"

      - name: Qualify Local Native Cache Archive
        shell: bash
        if: inputs.native-cache-transport-probe
        env:
          CACHE_SOURCE: ${{ steps.setup.outputs.xcodeCasPath }}
        run: >-
          uv run --no-project ci/native_cache_transport.py verify-local
          --identity '${{ runner.temp }}/native-cache-identity.json' --source "$CACHE_SOURCE"
          --report '${{ runner.temp }}/native-cache-local.json'

      - name: Save Qualified Native Transport Seed
        if: inputs.native-cache-reuse-source == '' && inputs.native-cache-transport-probe && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.setup.outputs.xcodeCasPath }}
          key: macOS-xcode-${{ steps.native-seed.outputs.suffix }}

      - name: Upload Local Native Cache Evidence
        if: always() && inputs.native-cache-transport-probe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-cache-local-macos-${{ matrix.target }}
          path: ${{ runner.temp }}/native-cache-local.json
          retention-days: 1
          if-no-files-found: warn

      - name: Upload Native Transport Identity
        if: inputs.native-cache-transport-probe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-cache-identity-macos-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/native-cache-identity.json
            ${{ runner.temp }}/native-cache-identity-diagnostics.json
          retention-days: 1
          if-no-files-found: error

  ubuntu-build:
    timeout-minutes: 90
    name: Ubuntu 🐧 ${{ matrix.rust == 'ON' && '(OBS-Studio-Rust) ' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04]
        # One production application: hybrid libobs, with OBS-Studio-Rust identity.
        # C reference coverage remains in the explicit Tier 2 jobs.
        rust: ['ON']
    runs-on: ${{ matrix.os }}
    needs: check-event
    # The full OBS app build is release-gating, not dev-cycle CI: it runs in
    # the release gate (release-rust.yaml), tags, schedule, dispatch and
    # path-triggered full runs. PRs and pushes build and test the Rust workspace and Tier 2
    # (libobs + cmocka) on Linux instead.
    if: ${{ !inputs.flatpak-measurement-only && !inputs.native-cache-measurement-only && fromJSON(needs.check-event.outputs.full) }}
    defaults:
      run:
        shell: bash
    env:
      # zccache is the ubuntu-ci preset's compiler launcher (setup_zccache).
      ZCCACHE_CACHE_DIR: ${{ github.workspace }}/.zccache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      # The mirror step runs before every package install, and it is Python
      # now: this job has no other step that installs uv, so without this the
      # step fails with `uv: command not found` (exit 127).
      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      - name: Configure Host apt Mirrors
        run: sudo -E "$(command -v uv)" run --no-project ci/host_apt_mirrors.py

      # Compiler cache policy (zackees/ci.yml): only master pushes save, keyed by
      # commit so the cache follows master instead of freezing at its first save.
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: ubuntu-compiler-cache
        with:
          path: ${{ github.workspace }}/.zccache
          key: zccache-ubuntu-${{ matrix.os }}-x86_64-rust${{ matrix.rust }}-${{ needs.check-event.outputs.config }}-${{ github.sha }}
          restore-keys: |
            zccache-ubuntu-${{ matrix.os }}-x86_64-rust${{ matrix.rust }}-${{ needs.check-event.outputs.config }}-

      # Keep modes/configurations separate: the measured ON-to-OFF fallback
      # produced 9526 MiB and prevented OFF from saving under the 8192 MiB cap.
      # Consume restored objects before sizing the next snapshot. A normal
      # PCH build occupies 5-6 GiB uncompressed; purging at 2 GiB discarded
      # useful restored archives before every build (#1286).
      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      # This full-build job is outside PR/merge-group admission. Capture
      # structured miss evidence without publishing raw compiler arguments.
      - name: Start Native Cache Journal
        id: native-cache-journal
        continue-on-error: true
        run: |
          uv run --no-project rust/tools/linux-validate/install_zccache.py "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          uv run --no-project ci/native_cache_journal.py start \
            --tool "${HOME}/.local/bin/zccache" --cache-dir "${ZCCACHE_CACHE_DIR}" \
            --workspace "${GITHUB_WORKSPACE}" \
            --journal "${RUNNER_TEMP}/native-cache-${{ matrix.rust }}.jsonl"

      - name: Build OBS Studio 🧱
        id: ubuntu-native-build
        uses: ./.github/actions/build-obs
        env:
          ENABLE_RUST_LIBOBS: ${{ matrix.rust }}
          TWITCH_CLIENTID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_HASH: ${{ secrets.TWITCH_HASH }}
          RESTREAM_CLIENTID: ${{ secrets.RESTREAM_CLIENTID }}
          RESTREAM_HASH: ${{ secrets.RESTREAM_HASH }}
          YOUTUBE_CLIENTID: ${{ secrets.YOUTUBE_CLIENTID }}
          YOUTUBE_CLIENTID_HASH: ${{ secrets.YOUTUBE_CLIENTID_HASH }}
          YOUTUBE_SECRET: ${{ secrets.YOUTUBE_SECRET }}
          YOUTUBE_SECRET_HASH: ${{ secrets.YOUTUBE_SECRET_HASH }}
        with:
          target: x86_64
          config: ${{ needs.check-event.outputs.config }}

      - name: Summarize Native Cache Journal
        id: native-cache-summary
        if: always() && steps.native-cache-journal.outcome == 'success'
        continue-on-error: true
        run: |
          echo 'ZCCACHE_SESSION_ID=' >> "${GITHUB_ENV}"
          uv run --no-project ci/native_cache_journal.py summarize \
            --workspace "${GITHUB_WORKSPACE}" \
            --journal "${RUNNER_TEMP}/native-cache-${{ matrix.rust }}.jsonl" \
            --build-outcome "${{ steps.ubuntu-native-build.outcome }}" \
            --output "${RUNNER_TEMP}/native-cache-${{ matrix.rust }}.json"

      - name: Upload Native Cache Diagnostics
        if: always() && steps.native-cache-summary.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-cache-ubuntu-${{ matrix.rust }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-cache-${{ matrix.rust }}.json
          retention-days: 2

      - name: Smoke Test OBS-Studio-Rust 🦀
        if: matrix.rust == 'ON'
        run: |
          : Smoke Test OBS-Studio-Rust 🦀
          prefix="${GITHUB_WORKSPACE}/build_ubuntu/install/${{ needs.check-event.outputs.config }}"
          version=$(LD_LIBRARY_PATH="${prefix}/lib:${prefix}/lib/x86_64-linux-gnu" "${prefix}/bin/obs-studio-rust-gui" --version)
          echo "${version}"
          # Only an ENABLE_RUST_LIBOBS build names itself OBS-Studio-Rust (#112).
          [[ "${version}" == OBS-Studio-Rust* ]]

      - name: Package OBS Studio 📀
        uses: ./.github/actions/package-obs
        if: ${{ fromJSON(needs.check-event.outputs.package) }}
        with:
          target: x86_64
          config: ${{ needs.check-event.outputs.config }}
          package: ${{ fromJSON(needs.check-event.outputs.package) }}

      - name: Upload Source Tarball 🗜️
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ fromJSON(needs.check-event.outputs.package) }}
        with:
          name: obs-studio-${{ matrix.os }}${{ matrix.rust == 'ON' && '-rust' || '' }}-sources-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/build_ubuntu/obs-studio-*-sources.*

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ fromJSON(needs.check-event.outputs.package) }}
        with:
          name: obs-studio-${{ matrix.os }}${{ matrix.rust == 'ON' && '-rust' || '' }}-x86_64-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/build_ubuntu/obs-studio-*-x86_64-ubuntu-gnu.*

      - name: Upload Debug Symbol Artifacts 🪲
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ fromJSON(needs.check-event.outputs.package) }}
        with:
          name: obs-studio-${{ matrix.os }}${{ matrix.rust == 'ON' && '-rust' || '' }}-x86_64-${{ needs.check-event.outputs.commitHash }}-dbgsym
          path: ${{ github.workspace }}/build_ubuntu/obs-studio-*-x86_64-ubuntu-gnu-dbgsym.ddeb

      # The GPU status light must not call llvmpipe green (#846, #940). The
      # runner has no GPU, so OBS renders on llvmpipe; the check also forces
      # it. Installed into /usr, the prefix the Rust build is configured for,
      # so OBS finds its data and plugins; after packaging and uploads, so the
      # system-wide install cannot leak into the package.
      - name: Tier 4 GPU Acceleration Check 🎮
        if: matrix.rust == 'ON'
        timeout-minutes: 10
        run: |
          : Tier 4 GPU Acceleration Check 🎮
          sudo cmake --install build_ubuntu --config ${{ needs.check-event.outputs.config }} > /dev/null
          command -v xvfb-run > /dev/null || sudo apt-get install -y --no-install-recommends xvfb
          uv run --no-project --with websockets==13.1 test/websocket-tier4/run_tier4.py --only gpu --obs /usr/bin/obs-studio-rust-gui

      # The whole black-box obs-websocket suite against the real app with Rust
      # libobs (#140): auth handshake, every request type, scene collections,
      # inputs and a recording. Full and release-gate runs only (this job
      # never runs on a PR), so it stays off the critical path.
      - name: Tier 4 Suite (Rust libobs app) 🔌
        if: matrix.rust == 'ON'
        timeout-minutes: 15
        run: uv run --no-project --with websockets==13.1 test/websocket-tier4/run_tier4.py --obs /usr/bin/obs-studio-rust-gui

      # build-obs's summary step stopped the zccache daemon, flushing its index.
      # If accumulated objects exceed a normal build plus margin, keep the
      # previous remote snapshot rather than deleting the cache we just used.
      - name: Check Ubuntu Compiler Snapshot Size
        id: cache-size
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          CACHE_DIR: ${{ github.workspace }}/.zccache
        run: |
          dir="$CACHE_DIR"
          if [ ! -d "$dir" ]; then
            echo 'save=false' >> "$GITHUB_OUTPUT"
          else
            size_mib=$(du -sm "$dir" | cut -f1)
            echo "Ubuntu compiler snapshot: ${size_mib} MiB (8192 MiB save limit)"
            if [ "$size_mib" -gt 8192 ]; then
              echo '::warning::Compiler snapshot exceeds save limit; retaining previous remote entry'
              echo 'save=false' >> "$GITHUB_OUTPUT"
            else
              echo 'save=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && steps.cache-size.outputs.save == 'true' && steps.ubuntu-compiler-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ github.workspace }}/.zccache
          key: zccache-ubuntu-${{ matrix.os }}-x86_64-rust${{ matrix.rust }}-${{ needs.check-event.outputs.config }}-${{ github.sha }}

  flatpak-build:
    timeout-minutes: 120
    name: Flatpak 📦
    runs-on: ubuntu-26.04
    needs: check-event
    if: ${{ !inputs.native-cache-measurement-only && fromJSON(needs.check-event.outputs.full) }}
    defaults:
      run:
        shell: bash
    env:
      FLATPAK_BUILD_SHARE_PATH: flatpak_app/files/share
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
      volumes:
        - /usr/local/lib/android:/to_clean/android
        - /opt/hostedtoolcache/CodeQL:/to_clean/codeql
        - /usr/local/.ghcup:/to_clean/ghcup
        - /opt/hostedtoolcache/Python:/to_clean/python
        - /usr/share/swift:/to_clean/swift
        - /usr/share/dotnet:/to_clean/dotnet
    steps:
      - name: Prepare build space
        shell: bash
        run: |
          : Prepare build space

          echo ::group::Available storage
          df -h
          echo ::endgroup::

          # The build peaks at about 16 GiB (measured in #428 on a runner with
          # 84 GiB free). Deleting the runner's preinstalled tools takes 1-2
          # minutes, so do it only when free space is short of that with a margin.
          required_gib=40
          avail_gib=$(df --output=avail -BG /__w | tail -1 | tr -dc 0-9)
          if (( avail_gib >= required_gib )); then
            echo "${avail_gib} GiB free, ${required_gib} GiB needed: skipping cleanup"
            exit 0
          fi

          echo ::group::Remove Android stuff
          rm -rf /to_clean/android/*
          echo ::endgroup::

          echo ::group::Remove CodeQL stuff
          rm -rf /to_clean/codeql/*
          echo ::endgroup::

          echo ::group::Remove GHCup stuff
          rm -rf /to_clean/ghcup/*
          echo ::endgroup::

          echo ::group::Remove Python stuff
          rm -rf /to_clean/python/*
          echo ::endgroup::

          echo ::group::Remove Swift stuff
          rm -rf /to_clean/swift/*
          echo ::endgroup::

          echo ::group::Remove .NET stuff
          rm -rf /to_clean/dotnet/*
          echo ::endgroup::

          echo ::group::Available storage
          df -h
          echo ::endgroup::

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0
          set-safe-directory: ${{ env.GITHUB_WORKSPACE }}

      - name: Set Up Environment 🔧
        id: setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : Set Up Environment 🔧
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

          cache_key='flatpak-builder-x86_64-${{ hashFiles('build-aux/io.github.obs_rust.OBSStudioRust.json') }}'

          echo "cacheKey=${cache_key}" >> $GITHUB_OUTPUT

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
      - name: Prepare offline Flatpak Rust dependencies
        run: |
          # Supply the pinned compiler in the manifest; soldr vendors Cargo inputs
          # before flatpak-builder enters its network-isolated build sandbox.
          cmake -P cmake/common/prepare-flatpak-soldr.cmake
      - name: Vendor Flatpak Cargo sources
        run: uv run --script build-aux/prepare_flatpak_rust.py

      - name: Configure Flatpak Compiler Diagnostics
        id: flatpak-compiler-diagnostic-config
        if: inputs.flatpak-compiler-diagnostics
        run: uv run --no-project ci/flatpak_compiler_diagnostics.py configure --manifest build-aux/io.github.obs_rust.OBSStudioRust.json

      - name: Validate Flatpak manifest
        uses: ./.github/actions/flatpak-builder-lint
        with:
          artifact: manifest
          path: build-aux/io.github.obs_rust.OBSStudioRust.json

      # New snapshots keep OSTree and compiler state together, omitting
      # downloaded inputs and transient build directories. Refresh by source
      # generation so compiler direct manifests do not freeze at first save.
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: flatpak-state-cache
        if: ${{ !inputs.flatpak-cold-build }}
        with:
          path: |
            .flatpak-builder/cache
            .flatpak-builder/ccache
          key: flatpak-builder-state-v1-x86_64-${{ hashFiles('build-aux/io.github.obs_rust.OBSStudioRust.json') }}-${{ github.sha }}
          restore-keys: |
            flatpak-builder-state-v1-x86_64-${{ hashFiles('build-aux/io.github.obs_rust.OBSStudioRust.json') }}-
            flatpak-builder-state-v1-x86_64-

      - name: Record Start Time ⏱️
        id: start
        run: echo "epoch=$(date +%s)" >> "${GITHUB_OUTPUT}"

      - name: Reset Flatpak Compiler Counters
        run: |
          # The image already supplies this manifest's SDK. Reset only after
          # the projected archive is restored, so old stats cannot replace the reset.
          ccache_dir="${PWD}/.flatpak-builder/ccache"
          mkdir -p "${ccache_dir}"
          sdk="org.freedesktop.Sdk//$(sed -n 's/^ *"runtime-version": *"\([^" ]*\)".*/\1/p' build-aux/io.github.obs_rust.OBSStudioRust.json)"
          flatpak run --command=ccache --filesystem="${ccache_dir}" --env=CCACHE_DIR="${ccache_dir}" "${sdk}" --zero-stats

      - name: Build Flatpak Manifest 🧾
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          # `flatpak build-bundle` takes ~4 of the ~16 minutes and only testers
          # download the result (#651). Routine master pushes skip it; the
          # daily schedule, tags, release branches and Seeking Testers PRs
          # still build and upload it.
          build-bundle: ${{ fromJSON(needs.check-event.outputs.package) && (github.event_name != 'push' || github.ref_type == 'tag' || startsWith(github.ref_name, 'release/')) }}
          bundle: obs-studio-flatpak-${{ needs.check-event.outputs.commitHash }}.flatpak
          manifest-path: ${{ github.workspace }}/build-aux/io.github.obs_rust.OBSStudioRust.json
          # Always on: the action passes `--ccache` to flatpak-builder only
          # when `cache` is true. It used to be off for a PR whose manifest
          # hash had no master cache, so a full PR compiled all ~700 files
          # without ccache (~9 min instead of ~1.5 min, #651). The restore
          # uses a projected snapshot or the explicit legacy bridge above.
          # flatpak-builder only reuses a module whose own manifest entry and
          # source checksums are unchanged.
          cache: true
          # Already restored above; avoid overwriting newer compiler manifests.
          restore-cache: false
          # Publish the pruned projection explicitly after validators below.
          save-cache: false
          cache-key: ${{ steps.setup.outputs.cacheKey }}
          mirror-screenshots-url: https://dl.flathub.org/media
          # Keep the module-local diagnostic log until its sanitized summary.
          # Build directories are excluded from the projected cache publisher.
          keep-build-dirs: ${{ inputs.flatpak-compiler-diagnostics }}

      # The pinned action snapshots this state immediately after building.
      # Measure its composition before considering any cache-content changes.
      - name: Summarize Flatpak Compiler Diagnostics
        if: ${{ !cancelled() && inputs.flatpak-compiler-diagnostics && steps.flatpak-compiler-diagnostic-config.outcome == 'success' }}
        run: uv run --no-project ci/flatpak_compiler_diagnostics.py summarize --output "$RUNNER_TEMP/flatpak-compiler-diagnostics.json"

      - name: Upload Flatpak Compiler Diagnostics
        if: ${{ !cancelled() && inputs.flatpak-compiler-diagnostics && steps.flatpak-compiler-diagnostic-config.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: flatpak-compiler-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/flatpak-compiler-diagnostics.json
          retention-days: 2
          if-no-files-found: error

      - name: Report Flatpak Cache Contents
        if: always()
        timeout-minutes: 2
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ ! -d .flatpak-builder ]; then
            echo "flatpak-cache state=absent job_status=${JOB_STATUS}"
            exit 0
          fi
          echo "flatpak-cache phase=after-builder job_status=${JOB_STATUS} units=apparent-bytes"
          echo '::group::Flatpak builder state contents (apparent bytes)'
          LC_ALL=C du --apparent-size --block-size=1 --max-depth=2 -- .flatpak-builder | LC_ALL=C sort -nr
          echo '::endgroup::'

      # The SDK's own ccache reads the cache flatpak-builder wrote. On master
      # pushes it also drops entries this build did not use, so the saved cache
      # stays the size of one build.
      - name: Ccache Stats 📊
        id: ccache-stats
        continue-on-error: true
        env:
          PRUNE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
        run: |
          : Ccache Stats 📊
          ccache_dir="${PWD}/.flatpak-builder/ccache"
          sdk="org.freedesktop.Sdk//$(sed -n 's/^ *"runtime-version": *"\([^"]*\)".*/\1/p' build-aux/io.github.obs_rust.OBSStudioRust.json)"
          run_ccache() {
            flatpak run --command=ccache --filesystem="${ccache_dir}" --env=CCACHE_DIR="${ccache_dir}" "${sdk}" "$@"
          }
          if [[ "${PRUNE}" == true ]]; then
            run_ccache --evict-older-than "$(( $(date +%s) - ${{ steps.start.outputs.epoch }} + 60 ))s"
          fi
          {
            echo '### Flatpak Ccache Stats (this build)'
            echo '```'
            run_ccache --show-stats --verbose
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY}"
          du -sh "${ccache_dir}"

      - name: Validate AppStream
        uses: ./.github/actions/flatpak-builder-lint
        with:
          artifact: appstream
          path: ${{ env.FLATPAK_BUILD_SHARE_PATH }}/metainfo/io.github.obs_rust.OBSStudioRust.metainfo.xml

      - name: Verify Icon and Metadata in app-info
        working-directory: ${{ env.FLATPAK_BUILD_SHARE_PATH }}
        run: |
          : Verify Icon and Metadata in app-info
          test -f app-info/icons/flatpak/128x128/io.github.obs_rust.OBSStudioRust.png || { echo "::error::Missing 128x128 icon in app-info"; exit 1; }
          test -f app-info/xmls/io.github.obs_rust.OBSStudioRust.xml.gz || { echo "::error::Missing io.github.obs_rust.OBSStudioRust.xml.gz in app-info"; exit 1; }

      - name: Validate build directory
        uses: ./.github/actions/flatpak-builder-lint
        with:
          artifact: builddir
          path: flatpak_app

      - name: Validate repository
        uses: ./.github/actions/flatpak-builder-lint
        with:
          artifact: repo
          path: repo

      # The existing master-only ccache eviction keeps this to one useful build.
      # The existing builder-family allocation/backend remain unchanged.
      - name: Publish Flatpak Projected State
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        if: ${{ !inputs.flatpak-cold-build && github.ref == 'refs/heads/master' && steps.ccache-stats.outcome == 'success' && steps.flatpak-state-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            .flatpak-builder/cache
            .flatpak-builder/ccache
          key: flatpak-builder-state-v1-x86_64-${{ hashFiles('build-aux/io.github.obs_rust.OBSStudioRust.json') }}-${{ github.sha }}

      - name: Measure Flatpak Cache Capacity
        if: inputs.flatpak-cache-probe
        timeout-minutes: 15
        run: |
          uv run --no-project ci/flatpak_cache_probe.py \
            --manifest build-aux/flatpak-github-action-modified-io.github.obs_rust.OBSStudioRust.json \
            --temp-root "${RUNNER_TEMP}" --output "${RUNNER_TEMP}/flatpak-cache-probe.json"

      - name: Upload Flatpak Cache Measurement
        if: ${{ !cancelled() && inputs.flatpak-cache-probe }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-cache-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/flatpak-cache-probe.json
          if-no-files-found: error
          retention-days: 7

      - name: Probe Pruned Flatpak Rebuild
        if: inputs.flatpak-pruned-build-probe
        timeout-minutes: 40
        run: |
          uv run --no-project ci/flatpak_pruned_build_probe.py --compiler-reuse \
            --manifest build-aux/flatpak-github-action-modified-io.github.obs_rust.OBSStudioRust.json \
            --temp-root "${RUNNER_TEMP}" --output "${RUNNER_TEMP}/flatpak-pruned-build.json"

      - name: Upload Pruned Flatpak Evidence
        if: ${{ !cancelled() && inputs.flatpak-pruned-build-probe }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-pruned-build-${{ github.run_id }}
          path: ${{ runner.temp }}/flatpak-pruned-build.json
          if-no-files-found: error
          retention-days: 7


      - name: Pack Experimental Flatpak Dependency Artifact
        if: inputs.flatpak-dependency-transfer-probe
        run: |
          timeout 600s uv run --no-project ci/flatpak_dependency_cache.py pack --manifest build-aux/io.github.obs_rust.OBSStudioRust.json \
            --cache .flatpak-builder/cache --artifact "$RUNNER_TEMP/flatpak-dependency-transfer"
      - name: Upload Experimental Flatpak Dependency Artifact
        if: inputs.flatpak-dependency-transfer-probe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-dependency-transfer-${{ github.run_id }}
          path: ${{ runner.temp }}/flatpak-dependency-transfer
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Pack Experimental Flatpak Compiler Artifact
        if: inputs.flatpak-compiler-transfer-probe
        run: |
          uv run --no-project ci/flatpak_compiler_cache.py pack --manifest build-aux/io.github.obs_rust.OBSStudioRust.json \
            --cache .flatpak-builder/ccache --artifact "$RUNNER_TEMP/flatpak-compiler-transfer"
      - name: Upload Experimental Flatpak Compiler Artifact
        if: inputs.flatpak-compiler-transfer-probe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-compiler-transfer-${{ github.run_id }}
          path: ${{ runner.temp }}/flatpak-compiler-transfer
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Archive Exported Flatpak for Runtime Qualification
        if: inputs.flatpak-runtime-test && !inputs.flatpak-dependency-transfer-probe
        run: |
          tar -cf "$RUNNER_TEMP/flatpak-runtime-repo.tar" repo
          stat -c 'qualification-export-bytes=%s' "$RUNNER_TEMP/flatpak-runtime-repo.tar"

      - name: Upload Exported Flatpak for Runtime Qualification
        if: inputs.flatpak-runtime-test && !inputs.flatpak-dependency-transfer-probe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-runtime-repo
          path: ${{ runner.temp }}/flatpak-runtime-repo.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  flatpak-compiler-consumer:
    name: Flatpak Compiler Consumer 🧪
    if: inputs.flatpak-compiler-transfer-probe
    needs: flatpak-build
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
      volumes:
        - /usr/local/lib/android:/to_clean/android
        - /opt/hostedtoolcache/CodeQL:/to_clean/codeql
        - /usr/local/.ghcup:/to_clean/ghcup
        - /opt/hostedtoolcache/Python:/to_clean/python
        - /usr/share/swift:/to_clean/swift
        - /usr/share/dotnet:/to_clean/dotnet
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare build space
        shell: bash
        run: |
          : Prepare build space

          echo ::group::Available storage
          df -h
          echo ::endgroup::

          # The build peaks at about 16 GiB (measured in #428 on a runner with
          # 84 GiB free). Deleting the runner's preinstalled tools takes 1-2
          # minutes, so do it only when free space is short of that with a margin.
          required_gib=40
          avail_gib=$(df --output=avail -BG /__w | tail -1 | tr -dc 0-9)
          if (( avail_gib >= required_gib )); then
            echo "${avail_gib} GiB free, ${required_gib} GiB needed: skipping cleanup"
            exit 0
          fi

          echo ::group::Remove Android stuff
          rm -rf /to_clean/android/*
          echo ::endgroup::

          echo ::group::Remove CodeQL stuff
          rm -rf /to_clean/codeql/*
          echo ::endgroup::

          echo ::group::Remove GHCup stuff
          rm -rf /to_clean/ghcup/*
          echo ::endgroup::

          echo ::group::Remove Python stuff
          rm -rf /to_clean/python/*
          echo ::endgroup::

          echo ::group::Remove Swift stuff
          rm -rf /to_clean/swift/*
          echo ::endgroup::

          echo ::group::Remove .NET stuff
          rm -rf /to_clean/dotnet/*
          echo ::endgroup::

          echo ::group::Available storage
          df -h
          echo ::endgroup::

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
          save-cache: ${{ github.ref == 'refs/heads/master' }}
      - name: Prepare Compiler Consumer Sources
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -P cmake/common/prepare-flatpak-soldr.cmake
      - name: Vendor Flatpak Compiler Consumer Sources
        run: uv run --script build-aux/prepare_flatpak_rust.py
      - name: Restore Dependency State Before Compiler Artifact
        if: ${{ !inputs.flatpak-dependency-transfer-probe }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .flatpak-builder
          key: flatpak-builder-x86_64-${{ hashFiles('build-aux/io.github.obs_rust.OBSStudioRust.json') }}-x86_64
          restore-keys: flatpak-builder-x86_64
      - name: Download Experimental Compiler Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flatpak-compiler-transfer-${{ github.run_id }}
          path: ${{ runner.temp }}/flatpak-compiler-transfer
      - name: Prepare Compiler Consumer SDK
        run: |
          # The producer's builder updates the image SDK before compilation.
          # Use the same dependency preparation before comparing identities;
          # any remaining SDK/compiler drift must still reject the archive.
          timeout 300s flatpak-builder --install-deps-only --install-deps-from=flathub \
            --arch=x86_64 --state-dir "$RUNNER_TEMP/flatpak-sdk-prep" flatpak_app build-aux/io.github.obs_rust.OBSStudioRust.json
      - name: Download Experimental Dependency Artifact
        if: inputs.flatpak-dependency-transfer-probe
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flatpak-dependency-transfer-${{ github.run_id }}
          path: ${{ runner.temp }}/flatpak-dependency-transfer
      - name: Restore Experimental Dependency Artifact
        if: inputs.flatpak-dependency-transfer-probe
        run: |
          timeout 600s uv run --no-project ci/flatpak_dependency_cache.py restore --manifest build-aux/io.github.obs_rust.OBSStudioRust.json \
            --cache .flatpak-builder/cache --artifact "$RUNNER_TEMP/flatpak-dependency-transfer"
      - name: Verify and Restore Compiler Artifact Last
        run: |
          uv run --no-project ci/flatpak_compiler_cache.py restore --manifest build-aux/io.github.obs_rust.OBSStudioRust.json \
            --cache .flatpak-builder/ccache --artifact "$RUNNER_TEMP/flatpak-compiler-transfer" \
            > "$RUNNER_TEMP/flatpak-compiler-transfer/consumer-restore.json"
          uv run --no-project ci/flatpak_compiler_cache.py reset --manifest build-aux/io.github.obs_rust.OBSStudioRust.json \
            --cache .flatpak-builder/ccache --artifact "$RUNNER_TEMP/flatpak-compiler-transfer"
      - name: Force Application Work Without Changing Compiler Inputs
        run: |
          uv run --no-project ci/flatpak_compiler_cache.py force --manifest build-aux/io.github.obs_rust.OBSStudioRust.json \
            --cache .flatpak-builder/ccache --artifact "$RUNNER_TEMP/flatpak-compiler-transfer"
      - name: Record Experimental Dependency Reuse
        if: inputs.flatpak-dependency-transfer-probe
        run: |
          uv run --no-project ci/flatpak_dependency_cache.py instrument --manifest build-aux/io.github.obs_rust.OBSStudioRust.json \
            --cache .flatpak-builder/cache --artifact "$RUNNER_TEMP/flatpak-dependency-transfer" >> "$GITHUB_PATH"
      - name: Build Full Flatpak Compiler Consumer
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: ${{ github.workspace }}/build-aux/io.github.obs_rust.OBSStudioRust.json
          build-bundle: false
          cache: true
          restore-cache: false
          save-cache: false
          mirror-screenshots-url: https://dl.flathub.org/media
      - name: Verify All Dependency Modules Were Reused
        if: inputs.flatpak-dependency-transfer-probe
        run: |
          uv run --no-project ci/flatpak_dependency_cache.py verify --manifest build-aux/io.github.obs_rust.OBSStudioRust.json \
            --cache .flatpak-builder/cache --artifact "$RUNNER_TEMP/flatpak-dependency-transfer"
      - name: Verify Substantial Cross Runner Compiler Reuse
        run: |
          uv run --no-project ci/flatpak_compiler_cache.py verify --manifest build-aux/io.github.obs_rust.OBSStudioRust.json \
            --cache .flatpak-builder/ccache --artifact "$RUNNER_TEMP/flatpak-compiler-transfer"
      - name: Validate Compiler Consumer AppStream
        uses: ./.github/actions/flatpak-builder-lint
        with:
          artifact: appstream
          path: flatpak_app/files/share/metainfo/io.github.obs_rust.OBSStudioRust.metainfo.xml
      - name: Validate Compiler Consumer Build Directory
        uses: ./.github/actions/flatpak-builder-lint
        with:
          artifact: builddir
          path: flatpak_app
      - name: Validate Compiler Consumer Repository
        uses: ./.github/actions/flatpak-builder-lint
        with:
          artifact: repo
          path: repo
      - name: Archive Compiler Consumer for Runtime Qualification
        if: inputs.flatpak-runtime-test && inputs.flatpak-dependency-transfer-probe
        run: |
          tar -cf "$RUNNER_TEMP/flatpak-runtime-repo.tar" repo
          stat -c 'qualification-consumer-export-bytes=%s' "$RUNNER_TEMP/flatpak-runtime-repo.tar"
      - name: Upload Compiler Consumer for Runtime Qualification
        if: inputs.flatpak-runtime-test && inputs.flatpak-dependency-transfer-probe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-runtime-repo
          path: ${{ runner.temp }}/flatpak-runtime-repo.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Stage Compiler Consumer Measurements
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/flatpak-compiler-result"
          shopt -s nullglob
          for report in "$RUNNER_TEMP/flatpak-compiler-transfer/"*.json "$RUNNER_TEMP/flatpak-dependency-transfer/"*.json; do
            cp -- "$report" "$RUNNER_TEMP/flatpak-compiler-result/"
          done
          if [[ -f "$RUNNER_TEMP/flatpak-dependency-transfer/builder.log" ]]; then
            cp -- "$RUNNER_TEMP/flatpak-dependency-transfer/builder.log" "$RUNNER_TEMP/flatpak-compiler-result/"
          fi
      - name: Upload Compiler Consumer Measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-compiler-consumer-${{ github.run_id }}
          path: ${{ runner.temp }}/flatpak-compiler-result
          if-no-files-found: error
          retention-days: 7

  flatpak-runtime-test:
    name: Flatpak Saved Profile 🧪
    if: ${{ !cancelled() && inputs.flatpak-runtime-test && needs.flatpak-build.result == 'success' && (!inputs.flatpak-dependency-transfer-probe || needs.flatpak-compiler-consumer.result == 'success') }}
    needs: [flatpak-build, flatpak-compiler-consumer]
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flatpak-runtime-repo
          path: ${{ runner.temp }}/flatpak-runtime-input
      - name: Install Runtime Test Infrastructure
        run: |
          sudo -E "$(command -v uv)" run --no-project ci/host_apt_mirrors.py
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update -qq
          sudo apt-get install -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -y --no-install-recommends flatpak xvfb dbus-daemon pipewire wireplumber \
            pipewire-pulse pipewire-bin pulseaudio-utils gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-pipewire libgl1-mesa-dri gcc pkg-config libglib2.0-dev libpipewire-0.3-dev \
            libpulse-dev libcurl4-openssl-dev ffmpeg gdb binutils
      - name: Run Installed Flatpak with Saved Capture Profile
        run: |
          tar -xf "$RUNNER_TEMP/flatpak-runtime-input/flatpak-runtime-repo.tar" -C "$RUNNER_TEMP/flatpak-runtime-input"
          # The release ships this bundle (#2400), so the test installs the
          # app from it, the way a user does; the Debug extension comes from
          # the repo. --runtime-repo lets `flatpak install` find the runtime.
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            "$RUNNER_TEMP/flatpak-runtime-input/repo" "$RUNNER_TEMP/obs-studio-rust-x86_64.flatpak" \
            io.github.obs_rust.OBSStudioRust master
          uv run --no-project ci/flatpak_runtime.py --repo "$RUNNER_TEMP/flatpak-runtime-input/repo" \
            --bundle "$RUNNER_TEMP/obs-studio-rust-x86_64.flatpak" \
            --output "$RUNNER_TEMP/flatpak-runtime-result"
      - name: Upload Tested Flatpak Bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-bundle
          path: ${{ runner.temp }}/obs-studio-rust-x86_64.flatpak
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Upload Flatpak Runtime Evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-runtime-evidence
          path: |
            ${{ runner.temp }}/flatpak-runtime-result/result.json
            ${{ runner.temp }}/flatpak-runtime-result/*.log
            ${{ runner.temp }}/flatpak-runtime-result/profile/obs-studio-rust/logs/*.txt
            ${{ runner.temp }}/flatpak-runtime-result/recordings/*.mkv
          if-no-files-found: error
          retention-days: 7

  windows-build:
    timeout-minutes: 90
    name: Windows 🪟
    strategy:
      # A missing qualification profile must not cancel the other axis.
      fail-fast: ${{ inputs.native-cache-reuse-source == '' }}
      matrix:
        architecture: [x64, arm64]
    runs-on: windows-2025-vs2026
    needs: check-event
    # OBS app builds are release-gating (#436): release gate, tags, schedule,
    # dispatch and path-triggered full PRs only.
    if: ${{ !inputs.flatpak-measurement-only && fromJSON(needs.check-event.outputs.full) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up uv for Native Release Reuse
        if: inputs.native-cache-reuse-source != ''
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      - name: Prepare Native Release Reuse
        id: native-reuse
        if: inputs.native-cache-reuse-source != ''
        shell: bash
        env:
          NATIVE_REUSE_SOURCE: ${{ inputs.native-cache-reuse-source }}
          NATIVE_CACHE_JOB_TOKEN: ${{ github.token }}
        run: |
          uv run --no-project ci/native_cache_identity.py --platform windows --architecture '${{ matrix.architecture }}' --configuration '${{ needs.check-event.outputs.config }}' --output "$RUNNER_TEMP/native-reuse-identity.json" --diagnostics "$RUNNER_TEMP/native-reuse-identity-diagnostics.json"
          uv run --no-project ci/native_cache_transport.py consume --require-hit --expected-source "$NATIVE_REUSE_SOURCE" --identity "$RUNNER_TEMP/native-reuse-identity.json" --destination "$RUNNER_TEMP/native-reuse-cache" --report "$RUNNER_TEMP/native-reuse-consume.json"
          uv run --no-project ci/native_cache_freshness.py prepare --root "$GITHUB_WORKSPACE" --state "$RUNNER_TEMP/native-reuse-state.json" --report "$RUNNER_TEMP/native-reuse-prepare.json"
          echo "cache_path=$RUNNER_TEMP/native-reuse-cache" >> "$GITHUB_OUTPUT"

      # Compiler cache: ccache masquerading as cl.exe through MSBuild's
      # CLToolExe (cmake/windows/compilerconfig.cmake, ENABLE_CCACHE in the
      # windows-ci presets). zccache and sccache cannot serve the Visual Studio
      # generator: neither runs as a cl.exe stand-in, and zccache 1.15.2 also
      # refuses every compile that carries /Fd, which CMake always passes.
      # Policy (zackees/ci.yml): only master pushes save, keyed by commit.
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: windows-compiler-cache
        if: inputs.native-cache-reuse-source == ''
        with:
          path: ${{ github.workspace }}/.ccache
          key: windows-ccache-${{ matrix.architecture }}-${{ needs.check-event.outputs.config }}-${{ github.sha }}
          restore-keys: windows-ccache-${{ matrix.architecture }}-${{ needs.check-event.outputs.config }}-

      - name: Set Up ccache 🗄️
        id: ccache
        env:
          NATIVE_REUSE_CACHE_PATH: ${{ steps.native-reuse.outputs.cache_path }}
        run: |
          # Set Up ccache 🗄️
          $Version = '4.14.1'
          $Hash = '6219f3865ca59aec41ee4b678df171d5d35855ecb2b6dbbbd20690b3a68af7b4'
          $Name = "ccache-${Version}-windows-x86_64"
          $Zip = "${env:RUNNER_TEMP}/${Name}.zip"

          Invoke-WebRequest -Uri "https://github.com/ccache/ccache/releases/download/v${Version}/${Name}.zip" -OutFile $Zip
          if ( (Get-FileHash -Algorithm SHA256 -Path $Zip).Hash -ne $Hash ) { throw "${Name}.zip checksum mismatch" }
          Expand-Archive -Path $Zip -DestinationPath $env:RUNNER_TEMP

          $CcacheHome = Join-Path $env:RUNNER_TEMP $Name
          $env:CCACHE_DIR = if ($env:NATIVE_REUSE_CACHE_PATH) { $env:NATIVE_REUSE_CACHE_PATH } else { Join-Path $env:GITHUB_WORKSPACE '.ccache' }
          $CcacheHome >> $env:GITHUB_PATH
          @(
            "CCACHE_DIR=${env:CCACHE_DIR}"
            'CCACHE_MAXSIZE=2G'
            'CCACHE_COMPILERCHECK=content'
            'CCACHE_SLOPPINESS=include_file_mtime,include_file_ctime'
          ) >> $env:GITHUB_ENV

          & (Join-Path $CcacheHome 'ccache.exe') --version | Select-Object -First 1
          & (Join-Path $CcacheHome 'ccache.exe') --zero-stats
          "epoch=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_OUTPUT

      # The GPU status light links Rust into every frontend build (#946).
      # Install the toolchain rust-toolchain.toml pins (rustup's auto-install
      # is deprecated); the arm64 leg cross-builds on an x64 runner and needs
      # that target's standard library too.
      - name: Install the Rust toolchain 🦀
        run: |
          soldr rustup toolchain install
          if ( '${{ matrix.architecture }}' -eq 'arm64' ) { soldr rustup target add aarch64-pc-windows-msvc }

      - name: Build OBS Studio 🧱
        uses: ./.github/actions/build-obs
        env:
          TWITCH_CLIENTID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_HASH: ${{ secrets.TWITCH_HASH }}
          RESTREAM_CLIENTID: ${{ secrets.RESTREAM_CLIENTID }}
          RESTREAM_HASH: ${{ secrets.RESTREAM_HASH }}
          YOUTUBE_CLIENTID: ${{ secrets.YOUTUBE_CLIENTID }}
          YOUTUBE_CLIENTID_HASH: ${{ secrets.YOUTUBE_CLIENTID_HASH }}
          YOUTUBE_SECRET: ${{ secrets.YOUTUBE_SECRET }}
          YOUTUBE_SECRET_HASH: ${{ secrets.YOUTUBE_SECRET_HASH }}
          GPU_PRIORITY_VAL: ${{ secrets.GPU_PRIORITY_VAL }}
        with:
          target: ${{ matrix.architecture }}
          config: ${{ needs.check-event.outputs.config }}

      - name: Verify Native Installed Binary Freshness
        if: inputs.native-cache-reuse-source != ''
        shell: bash
        run: |
          uv run --no-project ci/native_cache_identity.py --platform windows --architecture '${{ matrix.architecture }}' --configuration '${{ needs.check-event.outputs.config }}' --expected "$RUNNER_TEMP/native-reuse-identity.json" --output "$RUNNER_TEMP/native-reuse-final-identity.json" --diagnostics "$RUNNER_TEMP/native-reuse-final-identity-diagnostics.json"
          uv run --no-project ci/native_cache_freshness.py verify --root "$GITHUB_WORKSPACE" --state "$RUNNER_TEMP/native-reuse-state.json" --platform windows --architecture '${{ matrix.architecture }}' --report "$RUNNER_TEMP/native-reuse-freshness.json"

      - name: Restore Native Freshness Source
        if: always() && inputs.native-cache-reuse-source != ''
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/native-reuse-state.json" ]]; then
            uv run --no-project ci/native_cache_freshness.py restore --root "$GITHUB_WORKSPACE" --state "$RUNNER_TEMP/native-reuse-state.json" --report "$RUNNER_TEMP/native-reuse-restore.json"
          fi

      - name: Upload Native Build Reuse Evidence
        if: always() && inputs.native-cache-reuse-source != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-build-reuse-windows-${{ matrix.architecture }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-reuse-*.json
          retention-days: 1
          if-no-files-found: warn

      - name: Set Up uv for Cache Probe 🐍
        if: github.event_name == 'workflow_dispatch' && inputs.native-cache-probe
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      - name: Measure Windows Cache Budgets
        if: github.event_name == 'workflow_dispatch' && inputs.native-cache-probe
        run: uv run --no-project ci/native_cache_probe.py --target '${{ matrix.architecture }}' --config '${{ needs.check-event.outputs.config }}' --output '${{ runner.temp }}/native-cache-probe-${{ matrix.architecture }}'

      - name: Upload Windows Cache Probe
        if: always() && github.event_name == 'workflow_dispatch' && inputs.native-cache-probe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-cache-budget-${{ matrix.architecture }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-cache-probe-${{ matrix.architecture }}/report.json
          retention-days: 2
          if-no-files-found: error

      # Drop entries this build did not use so the saved cache stays the size
      # of one build.
      - name: Prune ccache 🧹
        if: inputs.native-cache-reuse-source == '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          # Prune ccache 🧹
          $Age = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - ${{ steps.ccache.outputs.epoch }} + 60
          ccache --evict-older-than "${Age}s"
          ccache --show-stats

      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        if: ${{ inputs.native-cache-reuse-source == '' && !inputs.native-cache-transport-probe && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && steps.windows-compiler-cache.outputs.cache-hit != 'true' }}
        with:
          path: ${{ github.workspace }}/.ccache
          key: windows-ccache-${{ matrix.architecture }}-${{ needs.check-event.outputs.config }}-${{ github.sha }}

      - name: Package OBS Studio 📀
        uses: ./.github/actions/package-obs
        if: ${{ inputs.native-cache-reuse-source == '' && fromJSON(needs.check-event.outputs.package) }}
        with:
          target: ${{ matrix.architecture }}
          config: ${{ needs.check-event.outputs.config }}
          package: ${{ fromJSON(needs.check-event.outputs.package) }}

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.native-cache-reuse-source == '' && fromJSON(needs.check-event.outputs.package) }}
        with:
          name: obs-studio-windows-${{ matrix.architecture }}-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/build_${{ matrix.architecture }}/obs-studio-*-windows-${{ matrix.architecture }}.zip

      # Identity evidence only; the separate manual publisher has its own token.
      - name: Set Up uv for Native Transport Identity
        if: inputs.native-cache-transport-probe
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      - name: Record Native Transport Identity
        if: inputs.native-cache-transport-probe
        run: >-
          uv run --no-project ci/native_cache_identity.py --platform windows
          --architecture '${{ matrix.architecture }}' --configuration '${{ needs.check-event.outputs.config }}'
          --output '${{ runner.temp }}/native-cache-identity.json'
          --diagnostics '${{ runner.temp }}/native-cache-identity-diagnostics.json'

      - name: Bind Native Transport Seed
        id: native-seed
        if: inputs.native-cache-transport-probe
        shell: bash
        run: >-
          uv run --no-project ci/native_cache_seed.py
          --identity '${{ runner.temp }}/native-cache-identity.json'
          --source-sha '${{ github.sha }}' --output "$GITHUB_OUTPUT"

      - name: Qualify Local Native Cache Archive
        shell: bash
        if: inputs.native-cache-transport-probe
        env:
          CACHE_SOURCE: ${{ github.workspace }}/.ccache
        run: >-
          uv run --no-project ci/native_cache_transport.py verify-local
          --identity '${{ runner.temp }}/native-cache-identity.json' --source "$CACHE_SOURCE"
          --report '${{ runner.temp }}/native-cache-local.json'

      - name: Save Qualified Native Transport Seed
        if: inputs.native-cache-reuse-source == '' && inputs.native-cache-transport-probe && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ github.workspace }}/.ccache
          key: windows-ccache-${{ steps.native-seed.outputs.suffix }}

      - name: Upload Local Native Cache Evidence
        if: always() && inputs.native-cache-transport-probe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-cache-local-windows-${{ matrix.architecture }}
          path: ${{ runner.temp }}/native-cache-local.json
          retention-days: 1
          if-no-files-found: warn

      - name: Upload Native Transport Identity
        if: inputs.native-cache-transport-probe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-cache-identity-windows-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/native-cache-identity.json
            ${{ runner.temp }}/native-cache-identity-diagnostics.json
          retention-days: 1
          if-no-files-found: error

  # zackees/ci.yml GATE-008/010: an attested, in-policy PR head (local-gate.toml,
  # ci-attestations.yml) skips the Linux unit-test jobs the local gate already
  # ran. Pushes and merge-queue runs never skip: the queue commit is the merge
  # result, not the stamped head (#692).
  ci-mode:
    name: CI Mode 🛂
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      trusted: ${{ steps.gate.outputs.trusted }}
      skip_rust-tests-linux: ${{ steps.gate.outputs.skip_rust-tests-linux }}
      skip_rust-linux-tier2: ${{ steps.gate.outputs.skip_rust-linux-tier2 }}
      skip_rust-cross-lint: ${{ steps.gate.outputs.skip_rust-cross-lint }}
      rust-test_hit: ${{ steps.rust-test.outputs.hit }}
      rust-test_name: ${{ steps.rust-test.outputs.name }}
      cross_hit: ${{ steps.cross.outputs.hit }}
      cross_name: ${{ steps.cross.outputs.name }}
      tier2-linux_hit: ${{ steps.tier2-linux.outputs.hit }}
      tier2-linux_name: ${{ steps.tier2-linux.outputs.name }}
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
      # Lane proofs (#699) are for PRs and the merge queue only, never a
      # push, schedule, dispatch or full run (#992 folded that job in here).
      PROOFS: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !inputs.full }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: zackees/ci.yml
          ref: a1917ce76598904ce515cd7eec83450c317ea6f2
          path: .ci-lint
          persist-credentials: false
          sparse-checkout: ci_lint
      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      - name: Local Gate Attestation 🛂
        id: gate
        if: github.event_name != 'merge_group'
        run: PYTHONPATH=.ci-lint uv run --no-project python -m ci_lint local-gate verify --repo . --trust --github-output

      # Lane proofs (#699): a lane whose exact inputs already passed in a
      # trusted run of this workflow is skipped (ci/lane_proof.py). Keys come
      # from local-gate.toml as committed on the BASE, so a merge-queue
      # rebuild after an unrelated master change reuses the pass. Fails open:
      # no output, no skip. Runs on the merge ref, not the PR head.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: env.PROOFS == 'true'
        with:
          path: merge
          persist-credentials: false
      - name: Fetch Base
        if: env.PROOFS == 'true'
        working-directory: merge
        continue-on-error: true
        run: git fetch -q --depth=1 origin "${BASE}"
      - name: rust-test
        id: rust-test
        if: env.PROOFS == 'true'
        working-directory: merge
        continue-on-error: true
        run: uv run --no-project ci/lane_proof.py check --lane rust-test --base "${BASE}" --repo "${GITHUB_REPOSITORY}"
      - name: cross
        id: cross
        if: env.PROOFS == 'true'
        working-directory: merge
        continue-on-error: true
        run: uv run --no-project ci/lane_proof.py check --lane cross --base "${BASE}" --repo "${GITHUB_REPOSITORY}"
      - name: tier2-linux
        id: tier2-linux
        if: env.PROOFS == 'true'
        working-directory: merge
        continue-on-error: true
        run: uv run --no-project ci/lane_proof.py check --lane tier2-linux --base "${BASE}" --repo "${GITHUB_REPOSITORY}"

  rust-tests-linux:
    # Fast Gate runs 7.7-11.3 min; 2x bounds a dead runner at 20 instead of
    # letting it hold the queue for an hour (#2593 A).
    timeout-minutes: 20
    name: Fast Gate ⚡
    runs-on: ubuntu-26.04
    needs: [check-event, ci-mode]
    # A docs-only PR or queue run changes no Rust, C or CMake: skipped, and
    # passing CI Gate; the Format job still runs the ci/ self-tests (#2079).
    if: needs.ci-mode.outputs.skip_rust-tests-linux != 'true' && needs.check-event.outputs.docs_only != 'true'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Fast gate (#992): one runner for the PR path: format checks, rustfmt,
      # clippy, Dylint, then the unit tests of the crates the diff touches
      # (ci/rust_scope.py). No Qt: cargo test never needs it; the Qt job owns
      # Qt. The full workspace tests and the windows-gnu link run on master.
      # platform-nix.c includes uuid/uuid.h. This runner does not ship it.
      # The oracle compile and the Rust libuuid link both need the package.
      # The obs-util D-Bus and portal inhibitors link GIO. The portal oracle
      # needs the headers even when the gio Cargo feature is off.
      # The mirror step runs before soldr and before every package install, and
      # it is Python now: this job has no earlier step that installs uv.
      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      - name: Install libuuid and GIO
        run: |
          sudo -E "$(command -v uv)" run --no-project ci/host_apt_mirrors.py
          # Match runner-images' bounded mirror failover (#1269). CLI options
          # take precedence over older images' late apt.conf.d overrides.
          apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get install "${apt_options[@]}" -y uuid-dev libglib2.0-dev

      # Same soldr-wrapped commands as docs/rust-port/testing-policy.md.
      # setup-soldr provisions the toolchain (with the clippy/rustfmt
      # components) from rust-toolchain.toml and restores its dependency cook
      # cache and cargo registry. Remote saves only warm master; PR and
      # merge-group runs restore. Local act/act2 saves stay enabled.
      - name: Set Up soldr 🦀
        uses: zackees/setup-soldr@71e6b565d05e546781eb9b0668bee02e574de7c9 # v0.9.88
        with:
          # One scope for every caller (push.yaml, ci.yml), so PRs replay
          # the verdicts master publishes (forge-ci/setup-soldr#604).
          verdict-scope: build-project
          # soldr 0.9.43 embeds zccache 1.15.5+ (has zackees/zccache#1937).
          version: 0.9.43
          build-cache: false
          prebuild-deps-flags: ${{ needs.check-event.outputs.core == 'true' && '--release' || '--profile dev -- --tests' }}
          # Host/container archive paths have different Actions-cache versions.
          # Explicit identities stop the janitor treating them as duplicates.
          cache-key-suffix: linux-host-v1
          save-cache-remote: ${{ github.ref == 'refs/heads/master' }}
          # The lanes add x86_64-pc-windows-gnu mid-job; the toolchain cache
          # would save it without its std (zackees/setup-soldr#507, #969).
          solo-toolchain-cache: false

      # The lint lane pins clang-format and gersemi through uvx.
      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      # GATE-001 mirror (local-gate.toml): exactly the local gate's lint and
      # rust-test lanes (./lint, ./unittest), i.e. rustfmt, clippy -D warnings,
      # clang-format, gersemi and soldr cargo test --workspace --locked.
      # The ci/ self-tests run in the Checks job on the standard pool (#427).
      - name: Local Gate (lint) 🧪
        env:
          OBS_GATE_SKIP_SELF_TEST: "1"
        run: uv run --no-project ci/local_gate.py --lane lint

      - name: Unit Tests (changed crates) 🧪
        if: needs.check-event.outputs.deferred == 'true' && needs.ci-mode.outputs.rust-test_hit != 'true'
        env:
          BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
        run: |
          git fetch -q --depth=1 origin "${BASE}"
          uv run --no-project ci/local_gate.py --test-diff "${BASE}"

      # Step 3 (#992): only the plugin/shared modules the diff touches, on
      # Linux, one configure with ENABLE_FRONTEND=OFF (no Qt). Master and full
      # runs build everything in the Ubuntu app builds instead.
      # Scoped master pushes also warm this exact configuration for later PRs.
      - name: Restore ccache 💾
        if: needs.check-event.outputs.linux_targets != '' && (needs.check-event.outputs.deferred == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/master'))
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ github.workspace }}/.targets-ccache
          key: targets-ccache-linux-${{ github.sha }}
          restore-keys: targets-ccache-linux-
      # The host package set differs from the Tier 2 container. Keep only
      # host .debs in a workspace-relative archive; PRs restore, master saves.
      - name: Prepare Touched Target apt Directory
        id: target-apt
        if: needs.check-event.outputs.linux_targets != '' && (needs.check-event.outputs.deferred == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/master'))
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/.targets-apt"
          echo "image=${ImageVersion:-ubuntu2604}" >> "$GITHUB_OUTPUT"
      - name: Restore Touched Target apt Downloads
        if: needs.check-event.outputs.linux_targets != '' && (needs.check-event.outputs.deferred == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/master'))
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ github.workspace }}/.targets-apt/*.deb
          key: targets-apt-ubuntu2604-${{ steps.target-apt.outputs.image }}-${{ hashFiles('rust/tools/linux-validate/apt-packages.txt') }}-${{ github.sha }}
          restore-keys: targets-apt-ubuntu2604-${{ steps.target-apt.outputs.image }}-${{ hashFiles('rust/tools/linux-validate/apt-packages.txt') }}-
      - name: Build Touched Linux Targets 🧱
        if: needs.check-event.outputs.linux_targets != '' && (needs.check-event.outputs.deferred == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/master'))
        env:
          TARGETS: ${{ needs.check-event.outputs.linux_targets }}
          CCACHE_DIR: ${{ github.workspace }}/.targets-ccache
          APT_ARCHIVES: ${{ github.workspace }}/.targets-apt
        run: |
          git submodule update --init --recursive -q
          sudo apt-get update -qq
          shopt -s nullglob
          packages=("$APT_ARCHIVES"/*.deb)
          echo "apt archives available: ${#packages[@]}"
          # Distro Qt headers only so configure passes: plugins/frontend-tools is a
          # core module that calls find_package(Qt6 REQUIRED). Nothing Qt is built
          # or tested here (only the touched targets); that is the Qt lane's job.
          grep -v '^#' rust/tools/linux-validate/apt-packages.txt |
            xargs "${GITHUB_WORKSPACE}/.github/scripts/retry" sudo apt-get install -o "Dir::Cache::archives=$APT_ARCHIVES" -o Binary::apt-get::APT::Keep-Downloaded-Packages=true -y --no-install-recommends
          # The launcher below; apt-packages.txt no longer lists it (#957, #1183).
          "${GITHUB_WORKSPACE}/.github/scripts/retry" sudo apt-get install -o "Dir::Cache::archives=$APT_ARCHIVES" -o Binary::apt-get::APT::Keep-Downloaded-Packages=true -y --no-install-recommends ccache
          packages=("$APT_ARCHIVES"/*.deb)
          echo "apt archive retained packages: ${#packages[@]}"
          if [ "${#packages[@]}" -gt 0 ]; then du -ch "${packages[@]}" | tail -1; fi
          ccache --max-size=250M
          ccache --zero-stats
          cmake -S . -B "${RUNNER_TEMP}/targets" -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DENABLE_FRONTEND=OFF -DENABLE_SCRIPTING=OFF -DENABLE_BROWSER=OFF -DENABLE_WEBSOCKET=OFF \
            -DENABLE_AJA=OFF -DENABLE_WEBRTC=OFF -DENABLE_QSV11=OFF -DENABLE_VST=OFF -DENABLE_WAYLAND=OFF \
            -DENABLE_DECKLINK=OFF
          avail=$(cmake --build "${RUNNER_TEMP}/targets" -- -t targets all | cut -d: -f1)
          build=()
          for t in ${TARGETS//,/ }; do
            if grep -qx "$t" <<<"$avail"; then build+=("$t"); else echo "no Linux target $t: skipped"; fi
          done
          [ "${#build[@]}" -eq 0 ] || cmake --build "${RUNNER_TEMP}/targets" --target "${build[@]}"
          ccache --show-stats --verbose
          du -sh "$CCACHE_DIR"

      - name: Save Touched Target ccache 💾
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.check-event.outputs.linux_targets != ''
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ github.workspace }}/.targets-ccache
          key: targets-ccache-linux-${{ github.sha }}

      - name: Check Touched Target apt Snapshot
        id: target-apt-size
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.check-event.outputs.linux_targets != ''
        env:
          APT_ARCHIVES: ${{ github.workspace }}/.targets-apt
        run: |
          size_mib=$(sudo du -sm "$APT_ARCHIVES" | cut -f1)
          echo "Host apt snapshot: ${size_mib} MiB (200 MiB save limit)"
          if [ "$size_mib" -le 200 ]; then
            echo 'save=true' >> "$GITHUB_OUTPUT"
          else
            echo '::warning::Host apt snapshot exceeds family bound; keeping prior remote entry'
            echo 'save=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Save Touched Target apt Downloads
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.check-event.outputs.linux_targets != '' && steps.target-apt-size.outputs.save == 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ github.workspace }}/.targets-apt/*.deb
          key: targets-apt-ubuntu2604-${{ steps.target-apt.outputs.image }}-${{ hashFiles('rust/tools/linux-validate/apt-packages.txt') }}-${{ github.sha }}

      # Skipped when a trusted run already passed these exact inputs.
      - name: Local Gate (rust-test) 🧪
        if: needs.check-event.outputs.deferred != 'true' && needs.ci-mode.outputs.rust-test_hit != 'true'
        run: uv run --no-project ci/local_gate.py --lane rust-test

      # Publish the pass as a lane proof (ci/lane_proof.py), only for a lane
      # that ran here and passed; the name carries the lane's input key.
      - name: Mark Lane Proof 🧾
        if: success() && needs.check-event.outputs.deferred != 'true' && needs.ci-mode.outputs.rust-test_name != '' && needs.ci-mode.outputs.rust-test_hit != 'true'
        run: touch "${{ runner.temp }}/lane-proof"
      - name: Upload Lane Proof 🧾
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() && needs.check-event.outputs.deferred != 'true' && needs.ci-mode.outputs.rust-test_name != '' && needs.ci-mode.outputs.rust-test_hit != 'true'
        with:
          name: ${{ needs.ci-mode.outputs.rust-test_name }}
          path: ${{ runner.temp }}/lane-proof
          retention-days: 3
          if-no-files-found: error

  # Compile-only cross check (cmake/cross/, #1294) of the Windows and macOS
  # host groups a change touches, on Linux with soldr's LLVM and SDKs. PR CI
  # builds no Windows or macOS app, so without it a broken host group first
  # fails on the nightly. ci/ci_scope.py picks the aliases (cross_targets).
  cross-compile:
    timeout-minutes: 45
    name: Cross Compile 🧰 (${{ needs.check-event.outputs.cross_targets }})
    runs-on: ubuntu-26.04
    needs: check-event
    if: ${{ !inputs.flatpak-measurement-only && needs.check-event.outputs.cross_targets != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # win-dshow's groups include libdshowcapture; no other submodule is compiled.
      - name: Check Out libdshowcapture 📥
        run: git submodule update --init --depth 1 deps/libdshowcapture/src

      - name: Set Up soldr 🦀
        uses: zackees/setup-soldr@71e6b565d05e546781eb9b0668bee02e574de7c9 # v0.9.88
        with:
          verdict-scope: build-project
          version: 0.9.43
          build-cache: false
          prebuild-deps-flags: --profile dev
          cache-key-suffix: cross-compile-v1
          save-cache-remote: ${{ github.ref == 'refs/heads/master' }}
          # The cross toolchain adds targets mid-job (cmake/common/soldr.cmake).
          solo-toolchain-cache: false

      # The mirror step runs before every package install, and it is Python
      # now: soldr does not install uv, so without this the step fails with
      # `uv: command not found` (exit 127).
      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      - name: Install Build Dependencies 📦
        run: |
          sudo -E "$(command -v uv)" run --no-project ci/host_apt_mirrors.py
          apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get install "${apt_options[@]}" -y --no-install-recommends cmake ninja-build

      - name: Cross Compile 🧰
        env:
          CROSS_TARGETS: ${{ needs.check-event.outputs.cross_targets }}
        run: |
          IFS=, read -ra aliases <<< "${CROSS_TARGETS}"
          for alias in "${aliases[@]}"; do
            echo "::group::cross ${alias}"
            OBS_CROSS_TARGET="${alias}" cmake -S cmake/cross -B "build_cross_${alias}" -G Ninja -DOBS_CROSS_TARGET="${alias}"
            OBS_CROSS_TARGET="${alias}" cmake --build "build_cross_${alias}" -- -k 0
            echo "::endgroup::"
          done

  # Clippy and Dylint for Windows and both macOS targets, cross-checked on
  # Linux through soldr (#472). Every PR push runs it unless the head is
  # attested for the same gates (the `cross` local-gate lane).
  rust-cross-lint:
    timeout-minutes: 45
    name: Rust Cross Lint 🦀 (Windows, macOS)
    runs-on: ubuntu-26.04
    needs: [check-event, ci-mode, rust-tests-linux]
    if: ${{ !inputs.flatpak-measurement-only && !inputs.native-cache-measurement-only && always() && !cancelled() && needs.rust-tests-linux.result != 'failure' && ((needs.check-event.outputs.deferred != 'true' || needs.check-event.outputs.macos == 'true' || needs.check-event.outputs.windows == 'true') && needs.ci-mode.outputs.skip_rust-cross-lint != 'true' && needs.ci-mode.outputs.cross_hit != 'true') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set Up soldr 🦀
        uses: zackees/setup-soldr@71e6b565d05e546781eb9b0668bee02e574de7c9 # v0.9.88
        with:
          # One scope for every caller (push.yaml, ci.yml), so PRs replay
          # the verdicts master publishes (forge-ci/setup-soldr#604).
          verdict-scope: build-project
          version: 0.9.43
          build-cache: false
          prebuild-deps-flags: --profile dev
          cache-key-suffix: linux-host-v1
          save-cache-remote: ${{ github.ref == 'refs/heads/master' }}
          # The cross lane adds targets mid-job (see the Rust Tests job, #969).
          solo-toolchain-cache: false

      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      - name: Local Gate (cross) 🧪
        run: uv run --no-project ci/local_gate.py --lane cross

      # Publish the pass as a lane proof (ci/lane_proof.py), only for a lane
      # that ran here and passed; the name carries the lane's input key.
      - name: Mark Lane Proof 🧾
        if: success() && needs.ci-mode.outputs.cross_name != '' && needs.ci-mode.outputs.cross_hit != 'true'
        run: touch "${{ runner.temp }}/lane-proof"
      - name: Upload Lane Proof 🧾
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() && needs.ci-mode.outputs.cross_name != '' && needs.ci-mode.outputs.cross_hit != 'true'
        with:
          name: ${{ needs.ci-mode.outputs.cross_name }}
          path: ${{ runner.temp }}/lane-proof
          retention-days: 3
          if-no-files-found: error

  rust-cross-lint-release:
    timeout-minutes: 45
    name: Rust Cross Lint 🦀 (release targets)
    # Release gate only (#955): Windows arm64, macOS x64 and Linux arm64 on top
    # of the PR gate's targets.
    runs-on: ubuntu-26.04
    needs: check-event
    if: ${{ !inputs.flatpak-measurement-only && !inputs.native-cache-measurement-only && needs.check-event.outputs.full == 'true' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set Up soldr 🦀
        uses: zackees/setup-soldr@71e6b565d05e546781eb9b0668bee02e574de7c9 # v0.9.88
        with:
          # One scope for every caller (push.yaml, ci.yml), so PRs replay
          # the verdicts master publishes (forge-ci/setup-soldr#604).
          verdict-scope: build-project
          version: 0.9.43
          build-cache: false
          prebuild-deps-flags: --profile dev
          cache-key-suffix: linux-host-v1
          save-cache-remote: ${{ github.ref == 'refs/heads/master' }}
          # cross-release installs target std libraries after setup (#507/#969).
          solo-toolchain-cache: false

      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      - name: Local Gate (cross-release) 🧪
        run: uv run --no-project ci/local_gate.py --lane cross-release

  rust-tests:
    # 2x the 9-14.3 min the lane runs: windows 30, macos-26 25 (#2593 A).
    timeout-minutes: ${{ matrix.os == 'windows-2025-vs2026' && 30 || 25 }}
    name: Rust Tests 🦀
    # Only the platforms the change touches (#436); Linux is rust-tests-linux.
    if: ${{ always() && !cancelled() && needs.rust-tests-linux.result != 'failure' && (needs.check-event.outputs.platform_os != '[]') }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.check-event.outputs.platform_os) }}
    runs-on: ${{ matrix.os }}
    needs: [check-event, rust-tests-linux]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Same soldr-wrapped commands as docs/rust-port/testing-policy.md.
      # setup-soldr provisions the toolchain (with the clippy/rustfmt
      # components) from rust-toolchain.toml and restores its dependency cook
      # cache and cargo registry. Remote saves only warm master; PR and
      # merge-group runs restore. Local act/act2 saves stay enabled.
      - name: Set Up soldr 🦀
        uses: zackees/setup-soldr@71e6b565d05e546781eb9b0668bee02e574de7c9 # v0.9.88
        with:
          # One scope for every caller (push.yaml, ci.yml), so PRs replay
          # the verdicts master publishes (forge-ci/setup-soldr#604).
          verdict-scope: build-project
          # soldr 0.9.43 embeds zccache 1.15.5+ (has zackees/zccache#1937).
          version: 0.9.43
          build-cache: false
          prebuild-deps-flags: --profile dev -- --tests
          save-cache-remote: ${{ github.ref == 'refs/heads/master' }}

      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      # The OS lane runs the tests of the crates the diff touches on a PR
      # (ci/rust_scope.py selects the feature, ci_scope.py the OS); the
      # workspace on master (#992).
      - name: Run Rust Tests (changed crates) 🧪
        if: needs.check-event.outputs.deferred == 'true'
        env:
          BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
        run: |
          git fetch -q --depth=1 origin "${BASE}"
          uv run --no-project ci/local_gate.py --test-diff "${BASE}"

      - name: Run Rust Tests 🧪
        if: needs.check-event.outputs.deferred != 'true'
        run: soldr cargo test --workspace --locked

      - name: Run Clippy 📎
        run: soldr cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Check Formatting 🎨
        run: soldr cargo fmt --all --check

      # rust/obs-build's Qt SDK resolver against the published obs-studio-libs
      # SDK for this runner's OS (#1878). Only Qt SDK paths and full runs
      # select it; no Actions cache: the Windows SDK alone is 163 MB packed,
      # over ci.toml's libs-qt budget.
      - name: Check Published Qt SDK 🧩
        if: needs.check-event.outputs.qt_sdk == 'true'
        # A Qt test app that cannot start can wait on a dialog; bound it.
        timeout-minutes: 15
        env:
          QT_TAG: qt6-6.11.1
        run: |
          : Check Published Qt SDK 🧩
          if [[ "${RUNNER_OS}" == Windows ]]; then
            asset=qt6-6.11.1-windows-x86_64-relwithdebinfo.tar.zst
            sha=b05c17386d2a1b0564b00755bc1fba152a18eaac34e512d9315922990715b751
            variable=OBS_QT_TEST_WINDOWS_PREFIX
          else
            asset=qt6-6.11.1-darwin-universal2-11.0-release.tar.zst
            sha=85093eae764f83d167f8850c5b057c0ff5d2f928ad7d49fe2544ce0ca20074b0
            variable=OBS_QT_TEST_MACOS_PREFIX
          fi
          start=${SECONDS}
          uv run --no-project ci/fetch_libs_asset.py "${QT_TAG}" "${asset}" "${sha}" "${RUNNER_TEMP}/qt"
          echo "fetched ${asset} in $((SECONDS - start)) s"
          export "${variable}=${RUNNER_TEMP}/qt"
          soldr cargo test -p obs-studio-rust --locked --test obs-tests-app -- --exact qt_sdk::qt_sdk_resolves_published_sdks --show-output 2>&1 | tee "${RUNNER_TEMP}/qt-sdk.log"
          grep -q ": Qt 6\." "${RUNNER_TEMP}/qt-sdk.log"
          # The Qt native test graph (moc, uic, rcc, link, run) against the
          # same SDK; Windows loads the Qt DLLs and the minimal platform plugin
          # from the SDK.
          export OBS_QT_TARGET_PREFIX="${RUNNER_TEMP}/qt" CMAKE_PREFIX_PATH="${RUNNER_TEMP}/qt" QT_PLUGIN_PATH="${RUNNER_TEMP}/qt/plugins"
          if [[ "${RUNNER_OS}" == Windows ]]; then
            export PATH="${RUNNER_TEMP}/qt/bin:${PATH}"
          fi
          # The unchanged remux queue test needs cmocka: brew on macOS; on
          # Windows vcpkg's (as Tier 2) and its pkgconf for the pkg-config crate.
          if [[ "${RUNNER_OS}" == Windows ]]; then
            vcpkg="$(cygpath -u "${VCPKG_INSTALLATION_ROOT}")/installed/x64-windows"
            "${GITHUB_WORKSPACE}/.github/scripts/retry" vcpkg install cmocka:x64-windows pkgconf:x64-windows
            export PKG_CONFIG="${vcpkg}/tools/pkgconf/pkgconf.exe" PKG_CONFIG_PATH="${vcpkg}/lib/pkgconfig"
            export PATH="${vcpkg}/bin:${PATH}"
          else
            "${GITHUB_WORKSPACE}/.github/scripts/retry" brew install cmocka
          fi
          export QT_QPA_PLATFORM_PLUGIN_PATH="${RUNNER_TEMP}/qt/plugins/platforms"
          soldr cargo test -p obs-studio-rust --locked --features libobs-integration --test obs-tests-app -- --exact native_build::native_test_graph_generates_qt_metaobjects native_build::canonical_remux_queue_runs_unchanged --show-output

  # Tier 2 Linux builds once and fans the tests out (#937, #1065): the build
  # job explicitly builds hybrid libobs and the C reference in one tree, runs the checks
  # (including the enforced C/Rust export comparison, so a mismatch fails
  # before any test) and uploads the tree; mode x shard jobs run one ctest
  # slice each against one libobs (OFF: C reference, ON: hybrid libobs via
  # LD_LIBRARY_PATH) on the same paths; rust-linux-tier2-done publishes the
  # lane proof.
  rust-linux-tier2-build:
    name: Rust Tier 2 Linux 🐧 (build)
    runs-on: ubuntu-26.04
    # A stock image, no Dockerfile or image build (#966): run directly on the
    # runner, two group tests failed while passing in a container with the
    # same libraries, compiler, flags and CPU (#982). Packages install below.
    container:
      image: ubuntu:26.04@sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7
    # A hung test held a runner for 4.5 h without a timeout (#983).
    timeout-minutes: 30
    # Compilation consumes no Fast Gate output and can overlap its runner.
    # Keep proof/scope checks here; OFF/ON execution waits only for this build.
    needs: [check-event, ci-mode]
    if: ${{ needs.check-event.outputs.tier2 == 'true' && needs.ci-mode.outputs.skip_rust-linux-tier2 != 'true' && needs.ci-mode.outputs.tier2-linux_hit != 'true' }}
    defaults:
      run:
        shell: bash
    steps:
      # checkout needs git for tags and submodules; sudo keeps the shared
      # install step below the same as on a plain runner.
      - name: Install Git 📦
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates curl sudo zstd

      # fetch-depth 0: versionconfig.cmake derives the OBS version from tags.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          version: '0.13.5'
          enable-cache: false

      # Reuse the 339 MB of .debs every Tier 2 job downloaded (#1055): keep
      # them (the stock image's docker-clean config deletes them after each
      # install) and restore the archive dir, keyed on the list and the image.
      # zstd is installed above: the cache entry is versioned by compressor.
      # dpkg in this throwaway container needs neither fsync nor docs: with the
      # .debs restored, unpacking 594 packages took 29 s; force-unsafe-io and
      # skipping doc/man/info cut a local run of the same install by 25% (#2072).
      - name: Keep apt Downloads 📦
        run: |
          rm -f /etc/apt/apt.conf.d/docker-clean
          printf '%s\n' force-unsafe-io 'path-exclude=/usr/share/doc/*' \
            'path-exclude=/usr/share/man/*' 'path-exclude=/usr/share/info/*' \
            > /etc/dpkg/dpkg.cfg.d/ci-tier2-fast
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: apt-cache
        with:
          path: /var/cache/apt/archives
          key: tier2-apt-ubuntu2604-f144425f-${{ hashFiles('rust/tools/linux-validate/apt-packages.txt') }}

      # The package list is shared with the local Docker harness (run.sh).
      - name: Install Tier 2 Packages 📦
        run: |
          # Install Git already refreshed these lists in this fresh container.
          grep -v '^#' rust/tools/linux-validate/apt-packages.txt |
            xargs "${GITHUB_WORKSPACE}/.github/scripts/retry" sudo apt-get install -y --no-install-recommends
      # One saver, master only: per-PR entries overflowed the 10 GB cache.
      - name: Save apt Downloads 💾
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /var/cache/apt/archives
          key: tier2-apt-ubuntu2604-f144425f-${{ hashFiles('rust/tools/linux-validate/apt-packages.txt') }}

      # PRs restore the compiler cache; only master pushes save it (a cache
      # saved from a PR ref is unreachable by other PRs).
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ github.workspace }}/.tier2-zccache
          key: zccache-tier2-linux-both-${{ github.sha }}
          restore-keys: |
            zccache-tier2-linux-both-
            zccache-tier2-linux-
      # zccache has no age-based eviction (ccache --evict-older-than), so a
      # master push drops a restored cache over 2 GiB and rebuilds it cold:
      # the saved cache stays about the size of one build.
      - name: Bound zccache 🧹
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          : Bound zccache 🧹
          dir="${{ github.workspace }}/.tier2-zccache"
          if [ -d "$dir" ] && [ "$(du -sm "$dir" | cut -f1)" -gt 2048 ]; then
            echo "zccache dir is $(du -sh "$dir" | cut -f1); starting cold"
            rm -rf "$dir"
          fi

      # Production hybrid libobs builds the Rust ports through Corrosion;
      # the shims put soldr's cargo/rustc (rust-toolchain.toml) on PATH.
      - name: Set Up soldr 🦀
        uses: zackees/setup-soldr@71e6b565d05e546781eb9b0668bee02e574de7c9 # v0.9.88
        with:
          # One scope for every caller (push.yaml, ci.yml), so PRs replay
          # the verdicts master publishes (forge-ci/setup-soldr#604).
          verdict-scope: build-project
          version: 0.9.43
          build-cache: false
          prebuild-deps-flags: --release
          cache-key-suffix: linux-container-v1
          save-cache-remote: ${{ github.ref == 'refs/heads/master' }}
          shims: true

      # The shard plan uses the test timings the last master run's shards
      # handed back (rust-linux-tier2-done, #930); until that cache exists,
      # the timings the ccache still carries from before the split (#931).
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .tier2-cost
          key: tier2-ctest-cost-${{ github.sha }}
          restore-keys: tier2-ctest-cost-
      - name: Seed Tier 2 Test Timings ⏱️
        run: |
          mkdir -p .tier2-cost
          for f in .tier2-ccache/ctest-cost-*.txt; do
            [ -s "$f" ] && [ ! -s ".tier2-cost/${f##*/}" ] && cp "$f" .tier2-cost/
          done
          ls -l .tier2-cost

      # GATE-001 mirror (local-gate.toml): the same validate.sh the local
      # gate's tier2-linux lane runs in Docker (build and test in one go).
      # The compiler launcher validate.sh configures (BUILD.md, #957): the
      # pinned, checksummed zccache release.
      - name: Install zccache 📦
        run: |
          : Install zccache 📦
          uv run --no-project rust/tools/linux-validate/install_zccache.py "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build Tier 2 (libobs and libobs-c-reference) 🧱
        id: tier2-build
        env:
          OBS_TIER2_SRC: ${{ github.workspace }}
          OBS_TIER2_BUILD: ${{ runner.temp }}/tier2
          OBS_TIER2_PACK: ${{ runner.temp }}/tier2-pack
          ZCCACHE_CACHE_DIR: ${{ github.workspace }}/.tier2-zccache
          OBS_TIER2_COST_DIR: ${{ github.workspace }}/.tier2-cost
          OBS_TIER2_MODES: "OFF ON"
          OBS_TIER2_STAGE: build
        run: bash rust/tools/linux-validate/validate.sh

      - name: Record Tier 2 Runtime Packages 📦
        run: >-
          uv run --no-project python rust/tools/linux-validate/runtime-packages.py
          "$RUNNER_TEMP/tier2/tree" "$RUNNER_TEMP/tier2-pack/runtime-packages.txt"

      - name: Upload Tier 2 Tree 🧾
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tier2-tree
          # One directory avoids multiline host/container path translation.
          path: ${{ runner.temp }}/tier2-pack/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      # validate.sh stops the zccache daemon on exit, flushing its index.
      - name: Save Tier 2 zccache 💾
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && steps.tier2-build.outputs.cache-healthy != 'false'
        with:
          path: ${{ github.workspace }}/.tier2-zccache
          key: zccache-tier2-linux-both-${{ github.sha }}

  rust-linux-tier2:
    name: Rust Tier 2 Linux 🐧 (tests ${{ matrix.mode }}${{ matrix.part != 'suite' && format(', {0}', matrix.part) || '' }})
    runs-on: ubuntu-26.04
    # Load a verified prepared runtime, or install the exact closure in the
    # same pinned stock base. The helper retains original artifact paths.
    timeout-minutes: 30
    needs: [check-event, ci-mode, rust-linux-tier2-build]
    # Tests consume the validated tree, not Fast Gate output. Overlap the
    # remaining lint/Rust work; the caller's required gate still needs both.
    # Failed/skipped builds and workflow cancellation cannot start tests.
    if: ${{ always() && !cancelled() && needs.rust-linux-tier2-build.result == 'success' }}
    # One suite per backend (#1662), less its RUN_SERIAL tests, which run
    # on runners of their own: inside the suite the deinterlace test held
    # the runner alone for 146 of 238 s (#1643, #2071). Its five rate entries
    # run on two runners (#2072).
    strategy:
      fail-fast: false
      matrix:
        mode: ["OFF", "ON"]
        part: ["suite", "serial-1-of-2", "serial-2-of-2"]
    defaults:
      run:
        shell: bash
    steps:
      # Execute the prebuilt tree: no OBS configure, version tags or submodule sources.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          version: '0.13.5'
          enable-cache: false

      # Restore the existing apt family for a stock fallback; tests never save it.
      - name: Prepare apt Archive Directory
        run: |
          command -v zstd
          command -v docker
          sudo mkdir -p /var/cache/apt/archives
          sudo chmod a+rwx /var/cache/apt/archives
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: apt-cache
        with:
          path: /var/cache/apt/archives
          key: tier2-apt-ubuntu2604-f144425f-${{ hashFiles('rust/tools/linux-validate/apt-packages.txt') }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tier2-tree
          path: ${{ runner.temp }}/tier2-pack

      - name: Unpack Tier 2 Tree 📂
        run: |
          mkdir -p "$RUNNER_TEMP/tier2"
          tar --zstd -xf "$RUNNER_TEMP/tier2-pack/tier2-tree.tar.zst" -C "$RUNNER_TEMP/tier2"

      # ctest starts the longest tests first only when it has their past
      # times; with none, the 59 s and 35 s tests started last and one shard
      # took 168 s for 228 s of -j4 work (run 38892442457). Start from the
      # timings the last master run merged (rust-linux-tier2-done, #930).
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .tier2-cost
          key: tier2-ctest-cost-${{ github.sha }}
          restore-keys: tier2-ctest-cost-

      - name: Test Tier 2 (${{ matrix.mode }}) ✅
        run: |
          uv run --no-project rust/tools/linux-validate/ci-runtime.py \
            --descriptor rust/tools/linux-validate/prepared-runtime.json \
            --packages "$RUNNER_TEMP/tier2-pack/runtime-packages.txt" \
            --source "$GITHUB_WORKSPACE" --build "$RUNNER_TEMP/tier2" \
            --cost "$GITHUB_WORKSPACE/.tier2-cost" --uv "$(command -v uv)" \
            --archives /var/cache/apt/archives \
            --state "$RUNNER_TEMP/tier2-runtime" --mode '${{ matrix.mode }}' --part '${{ matrix.part }}'
      - name: Upload Runtime Setup Measurement
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: tier2-runtime-${{ matrix.mode }}-${{ matrix.part }}
          path: ${{ runner.temp }}/tier2-runtime/runtime-measurement.json
          retention-days: 1
          if-no-files-found: warn
      - name: Upload Test Timings ⏱️
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          name: tier2-cost-${{ matrix.mode }}-${{ matrix.part }}
          path: .tier2-cost/ctest-cost-${{ matrix.mode }}.txt
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  rust-linux-tier2-done:
    name: Rust Tier 2 Linux 🐧
    runs-on: ubuntu-latest
    needs: [ci-mode, rust-linux-tier2]
    # Surface changes can disable lane proofs; PRs never save timing caches.
    # Skip before requesting a runner when every work step would be skipped.
    # Matrix failures still fail the reusable workflow and required CI Gate.
    if: ${{ needs.rust-linux-tier2.result == 'success' && ((needs.ci-mode.outputs.tier2-linux_name != '' && needs.ci-mode.outputs.tier2-linux_hit != 'true') || (github.event_name == 'push' && github.ref == 'refs/heads/master')) }}
    timeout-minutes: 5
    steps:
      # Publish the pass as a lane proof (ci/lane_proof.py), only for a lane
      # that ran here and passed; the name carries the lane's input key.
      - name: Mark Lane Proof 🧾
        if: success() && needs.ci-mode.outputs.tier2-linux_name != '' && needs.ci-mode.outputs.tier2-linux_hit != 'true'
        run: touch "${{ runner.temp }}/lane-proof"
      - name: Upload Lane Proof 🧾
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() && needs.ci-mode.outputs.tier2-linux_name != '' && needs.ci-mode.outputs.tier2-linux_hit != 'true'
        with:
          name: ${{ needs.ci-mode.outputs.tier2-linux_name }}
          path: ${{ runner.temp }}/lane-proof
          retention-days: 3
          if-no-files-found: error

      # Cache the test run's timings per mode for the next run's ctest
      # ordering (#930). Master only, like the compiler cache.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          sparse-checkout: rust/tools/linux-validate
      # `merge_costs.py` is a PEP 723 uv script (`uv run --script`), and this
      # job has no other step that installs uv: without this the master-only
      # step fails with `uv: command not found` (exit 127) and takes the whole
      # gate down for every later run.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          pattern: tier2-cost*
          path: ${{ runner.temp }}/tier2-cost-shards
      - name: Merge Test Timings ⏱️
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          mkdir -p .tier2-cost
          shopt -s nullglob
          for mode in OFF ON; do
            # v8 flattens one matching artifact; multiple matches get subdirectories.
            set -- "$RUNNER_TEMP"/tier2-cost-shards/ctest-cost-"$mode".[t]xt "$RUNNER_TEMP"/tier2-cost-shards/tier2-cost*/ctest-cost-"$mode".txt
            [ "$#" -gt 0 ] || continue
            uv run --script rust/tools/linux-validate/merge_costs.py "$@" >".tier2-cost/ctest-cost-$mode.txt"
            echo "$mode: $(grep -c -v -e '^---$' ".tier2-cost/ctest-cost-$mode.txt") lines"
          done
          uv run --script rust/tools/linux-validate/check-costs.py .tier2-cost
      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          path: .tier2-cost
          key: tier2-ctest-cost-${{ github.sha }}

  # Qt frontend on the Linux fast path (#992): configure, build and link the
  # obs-studio app against PREBUILT Qt and FFmpeg (obs-rust/obs-studio-libs,
  # pinned by tag and sha256, never compiled here), then run the Qt-linked
  # cmocka tests. Runs when frontend/Qt code or a Qt-linked test changed
  # (ci/ci_scope.py), on master and full runs; skipped, and passing CI Gate,
  # otherwise.
  linux-qt-frontend:
    name: Qt Frontend Linux 🐧
    runs-on: ubuntu-26.04
    # Independent runner: overlap frontend compilation/tests with Fast Gate.
    # The reusable workflow still fails if either selected job fails; this
    # can spend extra Qt runner time when Fast Gate fails (#1581).
    needs: [check-event]
    if: ${{ !cancelled() && needs.check-event.result == 'success' && fromJSON(needs.check-event.outputs.qt) }}
    timeout-minutes: 30
    env:
      QT_TAG: qt6-6.11.1
      QT_ASSET: qt6-6.11.1-linux-x86_64-glibc2.28-release.tar.zst
      QT_SHA256: f0edfc3432bd57058bbb9a2cf18aacceb55a2564b018346778c34eb0e3369dbf
      FFMPEG_TAG: ffmpeg-8.1.2
      FFMPEG_ASSET: ffmpeg-8.1.2-linux-x86_64-glibc2.28-release.tar.zst
      FFMPEG_SHA256: 8796ecdb273688c21f90b75a4e84acfc84ab35e69cacb551a6d8ed452961fcb4
      CCACHE_DIR: ${{ github.workspace }}/.qt-ccache
      # Post-pruning warm working set is ~508 MB (#1269/#1696). Keep >25%
      # growth room below ci.toml's 750 MB archive allowance.
      CCACHE_MAXSIZE: 650M
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      # Unpacked prefixes, keyed on the pinned sha256: a warm run skips the
      # download.
      - name: Cache Prebuilt Qt 💾
        id: qt-libs-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/qt
          key: libs-qt-${{ env.QT_SHA256 }}
      - name: Cache Prebuilt FFmpeg 💾
        id: ffmpeg-libs-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: libs-ffmpeg-${{ env.FFMPEG_SHA256 }}
      - name: Fetch Prebuilt Libs 📦
        run: |
          uv run --no-project ci/fetch_libs_asset.py "${QT_TAG}" "${QT_ASSET}" "${QT_SHA256}" "${{ runner.temp }}/qt"
          uv run --no-project ci/fetch_libs_asset.py "${FFMPEG_TAG}" "${FFMPEG_ASSET}" "${FFMPEG_SHA256}" "${{ runner.temp }}/ffmpeg"

      # No distro Qt, FFmpeg or codec dev packages: the prebuilt prefixes
      # supply them.
      - name: Install Build Dependencies 📦
        run: |
          sudo -E "$(command -v uv)" run --no-project ci/host_apt_mirrors.py
          # Preserve the runner's fallback routes, but bound each failed acquire
          # before fallback. Installation errors still fail the job (#1269).
          apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get install "${apt_options[@]}" -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config ccache git curl zstd \
            libcurl4-openssl-dev libjansson-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-randr0-dev libxcb-shm0-dev libxcb-xinerama0-dev libxcb-composite0-dev \
            libxcb-xfixes0-dev libxcb-xinput-dev libxinerama-dev libxcomposite-dev libxdamage-dev \
            libgl-dev libglvnd-dev libgles2-mesa-dev libwayland-dev libxkbcommon-dev \
            libpulse-dev libasound2-dev libpipewire-0.3-dev libpci-dev libdrm-dev libudev-dev \
            libv4l-dev libva-dev libfontconfig-dev libfreetype-dev libspeexdsp-dev libsimde-dev \
            uthash-dev nlohmann-json3-dev libwebsocketpp-dev libasio-dev libqrcodegencpp-dev \
            libcmocka-dev libxss-dev extra-cmake-modules xvfb xauth weston libdbus-1-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xkb1 libxkbcommon-x11-0 libxcb-shape0 libxcb-sync1 libegl1

      # Publication identity only: ccache still validates every compilation,
      # and the build/tests always run. Ignore docs and unrelated CI metadata,
      # but retain this workflow and the Qt build driver as publication inputs.
      - name: Qt Compiler Snapshot Identity
        id: qt-cache-identity
        run: |
          inputs="$RUNNER_TEMP/qt-compiler-inputs"
          git ls-files --stage -z -- . ':!docs/**' ':!*.md' ':!**/*.md' ':!.github/**' ':!ci/**' ':!ci.toml' > "$inputs"
          git ls-files --stage -z -- .github/workflows/build-project.yaml ci/linux_qt_frontend.py >> "$inputs"
          printf '\nimage=%s\nqt=%s\nffmpeg=%s\n' "${ImageVersion:-unknown}" "$QT_SHA256" "$FFMPEG_SHA256" >> "$inputs"
          cc --version >> "$inputs"
          c++ --version >> "$inputs"
          cmake --version >> "$inputs"
          ccache --version >> "$inputs"
          ninja --version >> "$inputs"
          digest=$(sha256sum "$inputs" | cut -d' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Older snapshots remain useful fallbacks when actual inputs change.
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: qt-compiler-cache
        with:
          path: ${{ github.workspace }}/.qt-ccache
          key: qt-ccache-linux-inputs-v2-${{ steps.qt-cache-identity.outputs.digest }}
          restore-keys: qt-ccache-linux-

      - name: Set Qt Cache Limit 🗄️
        id: qt-cache-epoch
        run: |
          echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          ccache --max-size="$CCACHE_MAXSIZE"
          ccache --zero-stats
          ccache --version | head -1
          du -sh "$CCACHE_DIR"

      - name: Build Frontend and Run Qt Tests 🏗️
        run: uv run --no-project ci/linux_qt_frontend.py "${{ runner.temp }}/qt" "${{ runner.temp }}/ffmpeg" "${{ runner.temp }}/qt-build"

      - name: Report Qt Cache 🗄️
        if: always()
        env:
          QT_CACHE_EPOCH: ${{ steps.qt-cache-epoch.outputs.epoch }}
        run: |
          echo "qt-cache phase=before bytes=$(du -sb "$CCACHE_DIR" | cut -f1)"
          if [ -n "$QT_CACHE_EPOCH" ]; then
            # Keep entries accessed by this build, with a one-minute margin.
            # This only trims the runner's local copy; remote writes stay master-only.
            age=$(( $(date +%s) - QT_CACHE_EPOCH + 60 ))
            if [ "$age" -lt 60 ]; then age=60; fi
            ccache --evict-older-than "${age}s"
          fi
          ccache --cleanup
          echo "qt-cache phase=after bytes=$(du -sb "$CCACHE_DIR" | cut -f1)"
          ccache --show-stats --verbose
          du -sh "$CCACHE_DIR"

      - name: Save Qt ccache 💾
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && steps.qt-compiler-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ github.workspace }}/.qt-ccache
          key: qt-ccache-linux-inputs-v2-${{ steps.qt-cache-identity.outputs.digest }}

      - name: Save Prebuilt Qt 💾
        if: github.ref == 'refs/heads/master' && steps.qt-libs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/qt
          key: libs-qt-${{ env.QT_SHA256 }}

      - name: Save Prebuilt FFmpeg 💾
        if: github.ref == 'refs/heads/master' && steps.ffmpeg-libs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: libs-ffmpeg-${{ env.FFMPEG_SHA256 }}

  rust-tier2:
    # 2x the 10-15 min the lane runs; bounds a dead runner at 25 (#2593 A).
    timeout-minutes: 25
    name: Rust Tier 2 ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.check-event.outputs.platform_os) }}
    runs-on: ${{ matrix.os }}
    needs: [check-event, rust-tests-linux]
    # Only the platforms the change touches (#436); Linux Tier 2 always runs
    # (rust-linux-tier2).
    if: ${{ always() && !cancelled() && needs.rust-tests-linux.result != 'failure' && (needs.check-event.outputs.platform_os != '[]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      # Production hybrid libobs builds Rust ports through Corrosion; shims select
      # pinned soldr. Native C/C++ caches remain separate from the Rust bypass.
      - name: Set Up soldr 🦀
        uses: zackees/setup-soldr@71e6b565d05e546781eb9b0668bee02e574de7c9 # v0.9.88
        with:
          # One scope for every caller (push.yaml, ci.yml), so PRs replay
          # the verdicts master publishes (forge-ci/setup-soldr#604).
          verdict-scope: build-project
          # soldr 0.9.43 embeds zccache 1.15.5+, which names MSVC staticlib
          # outputs <crate>-<hash>.lib (zackees/zccache#1937).
          version: 0.9.43
          build-cache: false
          prebuild-deps-flags: --release
          save-cache-remote: ${{ github.ref == 'refs/heads/master' }}
          shims: true

      # validate.sh builds through the macos-ci preset's Xcode compilation
      # cache; it started empty every run, so every build compiled cold
      # (about 6.5 of 10 min in run 38908431573, #930). As for the macOS OBS
      # build, PR and queue runs restore master's CAS; master runs (push,
      # schedule, dispatch: a push runs this job only for macOS paths) build
      # cold and save, so the CAS holds only what the tree uses (it cannot be
      # pruned by age).
      - name: Restore Tier 2 Xcode Cache 🗄️
        if: runner.os == 'macOS' && !(github.event_name != 'pull_request' && github.ref == 'refs/heads/master')
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ github.workspace }}/.tier2-xcas
          key: macos-tier2-xcas-${{ github.sha }}
          restore-keys: macos-tier2-xcas-

      - name: Validate Tier 2 on macOS (libobs C vs with Rust) 🍏
        if: runner.os == 'macOS'
        shell: bash
        env:
          XCODE_CAS_PATH: ${{ github.workspace }}/.tier2-xcas
          OBS_CTEST_JOBS: 3
        run: |
          "${GITHUB_WORKSPACE}/.github/scripts/retry" brew install cmocka
          bash rust/tools/tier2-validate/validate.sh
          du -sh "$XCODE_CAS_PATH"

      - name: Save Tier 2 Xcode Cache 💾
        if: runner.os == 'macOS' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ github.workspace }}/.tier2-xcas
          key: macos-tier2-xcas-${{ github.sha }}

      # The windows-ci-x64 preset enables ccache (ENABLE_CCACHE) whenever it is
      # on PATH, as the Windows OBS build does; without it both Tier 2 builds
      # compiled cold, about 5.5 of 9.1 min (#1038). Only master pushes save.
      - name: Restore Tier 2 ccache 🗄️
        if: runner.os == 'Windows'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ github.workspace }}/.ccache
          key: windows-tier2-ccache-${{ github.sha }}
          restore-keys: windows-tier2-ccache-

      - name: Set Up ccache 🗄️
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Set Up ccache 🗄️ (same pinned build as windows-build)
          $Version = '4.14.1'
          $Hash = '6219f3865ca59aec41ee4b678df171d5d35855ecb2b6dbbbd20690b3a68af7b4'
          $Name = "ccache-${Version}-windows-x86_64"
          $Zip = "${env:RUNNER_TEMP}/${Name}.zip"

          Invoke-WebRequest -Uri "https://github.com/ccache/ccache/releases/download/v${Version}/${Name}.zip" -OutFile $Zip
          if ( (Get-FileHash -Algorithm SHA256 -Path $Zip).Hash -ne $Hash ) { throw "${Name}.zip checksum mismatch" }
          Expand-Archive -Path $Zip -DestinationPath $env:RUNNER_TEMP

          $CcacheHome = Join-Path $env:RUNNER_TEMP $Name
          $env:CCACHE_DIR = Join-Path $env:GITHUB_WORKSPACE '.ccache'
          $CcacheHome >> $env:GITHUB_PATH
          @(
            "CCACHE_DIR=${env:CCACHE_DIR}"
            'CCACHE_MAXSIZE=2G'
            'CCACHE_COMPILERCHECK=content'
            'CCACHE_SLOPPINESS=include_file_mtime,include_file_ctime'
          ) >> $env:GITHUB_ENV
          & (Join-Path $CcacheHome 'ccache.exe') --zero-stats

      # cmocka took 37 s to build from source through vcpkg every run.
      - name: Cache vcpkg Binaries 🗄️
        id: cmocka-cache
        if: runner.os == 'Windows'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ github.workspace }}/.vcpkg-bin
          key: vcpkg-bin-cmocka-x64-windows-v1

      - name: Validate Tier 2 on Windows (libobs C vs with Rust) 🪟
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-bin,readwrite
          OBS_CTEST_JOBS: 4
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/.vcpkg-bin" | Out-Null
          vcpkg install cmocka:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed ($LASTEXITCODE)" }
          ./rust/tools/tier2-validate/validate.ps1 -CMockaPrefix "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows"
          ccache --show-stats

      - name: Save Tier 2 ccache 💾
        if: runner.os == 'Windows' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ github.workspace }}/.ccache
          key: windows-tier2-ccache-${{ github.sha }}

      - name: Save vcpkg Binaries 💾
        if: runner.os == 'Windows' && github.ref == 'refs/heads/master' && steps.cmocka-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ github.workspace }}/.vcpkg-bin
          key: vcpkg-bin-cmocka-x64-windows-v1

  # Manual candidate only. Existing application jobs keep read-only tokens.
  # Use the job GITHUB_TOKEN: its release/tag writes do not recursively trigger
  # product workflows. No PAT, Actions artifact cache transport or PR writer.
  native-cache-transport:
    name: Native Cache Transport (${{ matrix.platform }} ${{ matrix.architecture }})
    if: github.repository == 'obs-rust/obs-studio' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.native-cache-transport-probe
    needs: [macos-build, windows-build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    concurrency:
      group: native-cache-release-${{ matrix.platform }}-${{ matrix.architecture }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: windows, architecture: x64, runner: windows-2025-vs2026}
          - {platform: windows, architecture: arm64, runner: windows-2025-vs2026}
          - {platform: macos, architecture: arm64, runner: macos-26}
          - {platform: macos, architecture: x86_64, runner: macos-26}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
      - name: Select Matching Xcode
        if: matrix.platform == 'macos'
        run: sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-cache-identity-${{ matrix.platform }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/native-cache-build-identity
      - name: Record Transport Copier Identity
        run: >-
          uv run --no-project ci/native_cache_identity.py --platform '${{ matrix.platform }}'
          --architecture '${{ matrix.architecture }}' --configuration RelWithDebInfo
          --output '${{ runner.temp }}/native-cache-current-identity.json'
          --diagnostics '${{ runner.temp }}/native-cache-current-identity-diagnostics.json'
      - name: Bind Native Transport Seed
        id: native-seed
        run: >-
          uv run --no-project ci/native_cache_seed.py
          --identity '${{ runner.temp }}/native-cache-build-identity/native-cache-identity.json'
          --source-sha '${{ github.sha }}' --output "$GITHUB_OUTPUT"
      - name: Select Native Cache Path
        id: path
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            echo "cache=$HOME/Library/Developer/Xcode/DerivedData/CompilationCache.noindex" >> "$GITHUB_OUTPUT"
          else
            echo "cache=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore Exact Completed Windows Seed
        if: matrix.platform == 'windows'
        id: windows-seed
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.path.outputs.cache }}
          key: windows-ccache-${{ steps.native-seed.outputs.suffix }}
          fail-on-cache-miss: true
      - name: Restore Exact Completed macOS Seed
        if: matrix.platform == 'macos'
        id: macos-seed
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.path.outputs.cache }}
          key: macOS-xcode-${{ steps.native-seed.outputs.suffix }}
          fail-on-cache-miss: true
      - name: Require Exact Seed
        if: (matrix.platform == 'windows' && steps.windows-seed.outputs.cache-hit != 'true') || (matrix.platform == 'macos' && steps.macos-seed.outputs.cache-hit != 'true')
        run: exit 1
      - name: Publish Bounded Cache Generation
        env:
          NATIVE_CACHE_JOB_TOKEN: ${{ github.token }}
          CACHE_SOURCE: ${{ steps.path.outputs.cache }}
        run: >-
          uv run --no-project ci/native_cache_transport.py publish
          --identity '${{ runner.temp }}/native-cache-build-identity/native-cache-identity.json' --source "$CACHE_SOURCE"
          --report '${{ runner.temp }}/native-cache-publish.json'
      - name: Upload Native Transport Evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-cache-transport-${{ matrix.platform }}-${{ matrix.architecture }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/native-cache-*.json
          retention-days: 1
          if-no-files-found: warn
