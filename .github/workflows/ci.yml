name: Pull
run-name: ${{ github.event.pull_request.title || github.ref_name }} pull request run 🚀
# Every PR runs (no paths-ignore): `CI Gate ✅` is a required check, and the
# master merge queue (merge_group) reruns it on the merge result (#692).
on:
  workflow_dispatch:
    inputs:
      native-cache-measurement-only:
        description: Measure only native cache protocols and lightweight gates on trusted manual master runs
        type: boolean
        default: false
      flatpak-measurement-only:
        description: Restrict the manual build matrix to complete Flatpak and lightweight gates
        type: boolean
        default: false
      flatpak-compiler-diagnostics:
        description: Record bounded compiler cache reasons and log spans (manual diagnostic, no raw command upload)
        type: boolean
        default: false
      flatpak-runtime-reuse-run:
        description: Recheck an existing Flatpak export with the current test harness only (same-repository run ID)
        type: string
        default: ''
      flatpak-runtime-test:
        description: Run the exported Flatpak with saved capture/browser sources and Debug extension (extra qualification cost)
        type: boolean
        default: false
      flatpak-dependency-transfer-probe:
        description: Also transfer actual OSTree cache state (requires compiler transfer probe; extra storage/build cost)
        type: boolean
        default: false
      flatpak-compiler-transfer-probe:
        description: Transfer an experimental compiler artifact to one fresh Flatpak builder (extra storage/build cost)
        type: boolean
        default: false
      flatpak-cold-build:
        description: Measure a fresh Flatpak builder and compiler cache without restoring or publishing either cache
        type: boolean
        default: false
      flatpak-pruned-build-probe:
        description: Validate dependency-only application rebuild and subsequent compiler reuse
        type: boolean
        default: false
      tier2-setup-probe:
        description: Measure cold prepared-environment transfer against locked stock setup (one producer and six fresh consumers)
        type: boolean
        default: false
      flatpak-cache-probe:
        description: Measure isolated Flatpak downloads and proxy compression after Flatpak output validation
        type: boolean
        default: false
      native-cache-reuse-source:
        description: Qualify real native builds from this exact release-cache producer SHA (manual master only)
        type: string
        default: ''
      native-cache-transport-probe:
        description: Qualify bounded native cache release transport on master (writes cache-only prereleases)
        type: boolean
        default: false
      native-cache-probe:
        description: Measure isolated Windows cache budgets after the full build (extra clean rebuilds)
        type: boolean
        default: false
  pull_request:
    branches: [master]
    types: [ opened, synchronize, reopened ]
  merge_group:
permissions:
  contents: read
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true
jobs:
  # Run the pre-work entry point for every PR and queue run. Its cache janitor
  # job runs only with a trusted queue token. No CI job waits for pre-work.
  ci-pre:
    name: CI Pre 🧹
    uses: ./.github/workflows/ci-pre.yml
    permissions:
      actions: write
      contents: read

  # When master moves, GitHub starts a new queue run per queued PR, but a
  # queue ref carries the base commit, so the concurrency group above never
  # pairs it with the old one, which would keep waiting for a runner (#986).
  cancel-superseded:
    name: Cancel Superseded Queue Runs 🧹
    if: ${{ !cancelled() && github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: ci
          persist-credentials: false
      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}
      - name: Cancel 🧹
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project ci/cancel_superseded.py

  check-format:
    name: Format 🔍
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  build-project:
    name: Build 🧱
    if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && inputs.flatpak-runtime-reuse-run != '' && !inputs.native-cache-measurement-only) }}
    uses: ./.github/workflows/build-project.yaml
    with:
      native-cache-measurement-only: ${{ github.event_name == 'workflow_dispatch' && inputs.native-cache-measurement-only }}
      native-cache-measurement-conflict: ${{ github.event_name == 'workflow_dispatch' && (inputs.flatpak-runtime-reuse-run != '' || inputs.tier2-setup-probe) }}
      flatpak-measurement-only: ${{ github.event_name == 'workflow_dispatch' && inputs.flatpak-measurement-only }}
      flatpak-compiler-diagnostics: ${{ github.event_name == 'workflow_dispatch' && inputs.flatpak-compiler-diagnostics }}
      flatpak-runtime-test: ${{ github.event_name == 'workflow_dispatch' && inputs.flatpak-runtime-test }}
      flatpak-cold-build: ${{ github.event_name == 'workflow_dispatch' && inputs.flatpak-cold-build }}
      flatpak-dependency-transfer-probe: ${{ github.event_name == 'workflow_dispatch' && inputs.flatpak-dependency-transfer-probe }}
      flatpak-compiler-transfer-probe: ${{ github.event_name == 'workflow_dispatch' && inputs.flatpak-compiler-transfer-probe }}
      flatpak-cache-probe: ${{ github.event_name == 'workflow_dispatch' && inputs.flatpak-cache-probe }}
      flatpak-pruned-build-probe: ${{ github.event_name == 'workflow_dispatch' && inputs.flatpak-pruned-build-probe }}
      native-cache-reuse-source: ${{ github.event_name == 'workflow_dispatch' && inputs.native-cache-reuse-source || '' }}
      native-cache-transport-probe: ${{ github.event_name == 'workflow_dispatch' && inputs.native-cache-transport-probe }}
      native-cache-probe: ${{ github.event_name == 'workflow_dispatch' && inputs.native-cache-probe }}
    secrets: inherit
    permissions:
      actions: read
      contents: write

  flatpak-runtime-reuse:
    name: Recheck Flatpak Saved Profile 🧪
    if: github.event_name == 'workflow_dispatch' && inputs.flatpak-runtime-reuse-run != '' && !inputs.native-cache-measurement-only
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          enable-cache: false
      - name: Record Export Provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.flatpak-runtime-reuse-run }}
        run: uv run --no-project --script ${{ github.workspace }}/ci/ci_gate_steps.py record-export-provenance
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flatpak-runtime-repo
          run-id: ${{ inputs.flatpak-runtime-reuse-run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/flatpak-runtime-input
      - name: Install Runtime Test Infrastructure
        run: uv run --no-project --script ${{ github.workspace }}/ci/ci_gate_steps.py install-runtime-deps
      - name: Run Installed Flatpak with Saved Capture Profile
        run: uv run --no-project --script ${{ github.workspace }}/ci/ci_gate_steps.py run-saved-capture-profile
      - name: Upload Flatpak Runtime Evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-runtime-evidence
          path: |
            ${{ runner.temp }}/flatpak-runtime-result/result.json
            ${{ runner.temp }}/flatpak-runtime-result/*.log
            ${{ runner.temp }}/flatpak-runtime-result/profile/obs-studio-rust/logs/*.txt
            ${{ runner.temp }}/flatpak-runtime-result/recordings/*.mkv
          if-no-files-found: error
          retention-days: 7

  # Opt-in evidence only: normal build/test selection stays intact; the gate also checks the probe.
  # A short-lived Actions artifact avoids registry publication or credentials.
  tier2-setup-producer:
    name: Tier 2 Setup Producer 📦
    # An unrelated platform failure must not suppress valid Linux evidence.
    # Missing/invalid Tier 2 artifacts still fail the producer; the final gate
    # independently requires the normal build-project result.
    if: always() && !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.tier2-setup-probe && !inputs.native-cache-measurement-only
    needs: build-project
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.13.5'
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          enable-cache: false
      - name: Download Locked Tier 2 Inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tier2-tree
          path: ${{ runner.temp }}/tier2-input
      - name: Prepare apt Archive Directory
        run: sudo install -d -m 0777 /var/cache/apt/archives
      - name: Restore apt Archives
        uses: ./.github/actions/cache
        with:
          mode: restore
          path: /var/cache/apt/archives
          key: tier2-apt-ubuntu2604-f144425f-${{ hashFiles('rust/tools/linux-validate/apt-packages.txt') }}
      - name: Produce Immutable Environment
        run: >-
          uv run --no-project python ci/tier2_setup_probe.py produce
          --packages "$RUNNER_TEMP/tier2-input/runtime-packages.txt"
          --bundle "$RUNNER_TEMP/setup-bundle" --archives /var/cache/apt/archives
      - name: Upload Environment Metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tier2-setup-metadata
          path: ${{ runner.temp }}/setup-bundle/bundle.json
          retention-days: 1
          if-no-files-found: error
      - name: Upload Prepared Image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tier2-setup-image
          path: ${{ runner.temp }}/setup-bundle/image.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  tier2-setup-consumer:
    if: ${{ !inputs.native-cache-measurement-only }}
    name: Tier 2 Setup (${{ matrix.variant }}, trial ${{ matrix.trial }})
    # Reads the producer's tier2-setup-metadata/-image artifacts, so the
    # cascade from a skipped producer is required, not accidental (WF-004,
    # #2953). Both jobs are the #1592 measurement probe.
    needs: tier2-setup-producer
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [stock, prepared]
        trial: [1, 2, 3]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.13.5'
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          enable-cache: false
      - name: Download Environment Metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tier2-setup-metadata
          path: ${{ runner.temp }}/setup-bundle
      - name: Prepare apt Archive Directory
        if: matrix.variant == 'stock'
        run: sudo install -d -m 0777 /var/cache/apt/archives
      - name: Restore apt Archives
        if: matrix.variant == 'stock'
        uses: ./.github/actions/cache
        with:
          mode: restore
          path: /var/cache/apt/archives
          key: tier2-apt-ubuntu2604-f144425f-${{ hashFiles('rust/tools/linux-validate/apt-packages.txt') }}
      - name: Download Prepared Image
        if: matrix.variant == 'prepared'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tier2-setup-image
          path: ${{ runner.temp }}/setup-bundle
      - name: Measure Setup
        env:
          VARIANT: ${{ matrix.variant }}
        run: >-
          uv run --no-project python ci/tier2_setup_probe.py "$VARIANT"
          --bundle "$RUNNER_TEMP/setup-bundle" --archives /var/cache/apt/archives
      # Validate the prepared image itself with both unchanged complete suites.
      # Coverage is recorded separately from setup, once per experimental image.
      - name: Download Coverage Tree
        if: matrix.variant == 'prepared' && matrix.trial == 1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tier2-tree
          path: ${{ runner.temp }}/tier2-input
      - name: Validate Prepared OFF and ON Suites
        if: matrix.variant == 'prepared' && matrix.trial == 1
        run: uv run --no-project --script ${{ github.workspace }}/ci/ci_gate_steps.py validate-prepared-suites
      - name: Upload Setup Evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tier2-setup-${{ matrix.variant }}-${{ matrix.trial }}
          path: |
            ${{ runner.temp }}/setup-bundle/*-measurement.json
            ${{ runner.temp }}/tier2/*.ctest-*.log
          retention-days: 7
          if-no-files-found: warn

  # One runner for both data validators (#992); each step skips itself when
  # its files did not change.
  validate-data:
    timeout-minutes: 10
    name: Validate Data 🕵️
    if: ${{ !cancelled() && github.base_ref == 'master' }}
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Check for Changed Compatibility Files ✅
        uses: ./.github/actions/check-changes
        id: compat
        with:
          baseRef: origin/${{ github.base_ref }}
          checkGlob: plugins/win-capture/data/*.json

      - name: Check for Invalid Compatibility Data 📉
        if: fromJSON(steps.compat.outputs.hasChangedFiles)
        uses: ./.github/actions/compatibility-validator

      - name: Check for Changed Services Files ✅
        uses: ./.github/actions/check-changes
        id: services
        with:
          baseRef: origin/${{ github.base_ref }}
          checkGlob: plugins/rtmp-services/data/*.json

      - name: Check Services JSON Schema 📉
        if: fromJSON(steps.services.outputs.hasChangedFiles)
        uses: ./.github/actions/services-validator
        with:
          repositorySecret: ${{ secrets.GITHUB_TOKEN }}
          runSchemaChecks: true
          runServiceChecks: false

  update-documentation:
    timeout-minutes: 20
    name: Update Documentation 📖
    if: ${{ !cancelled() && github.repository_owner == 'obsproject' && github.base_ref == 'master' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Check for Changed Files ✅
        uses: ./.github/actions/check-changes
        id: checks
        with:
          baseRef: origin/${{ github.base_ref }}
          checkGlob: docs/sphinx

      - uses: ./.github/actions/generate-docs
        if: fromJSON(steps.checks.outputs.hasChangedFiles)

  # Packaged-app portability and release validation run in the scheduled
  # release-rust workflow, with manual/tag runs available outside PR CI.
  # PR/merge-group admission covers compilation and integrity (#1286).

  # The one required check (master ruleset, #692): fails when any job above
  # failed or was cancelled; skipped jobs (out of scope, or attested by the
  # local gate on a PR) pass.
  # Transport verification needs no native compiler. Its own read-only token
  # avoids shared unauthenticated API limits without exposing publisher writes.
  # Run surviving axes even when another publisher failed; the gate still fails.
  native-cache-consumer:
    name: Native Cache Consumer (${{ matrix.platform }} ${{ matrix.architecture }})
    if: always() && !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.native-cache-transport-probe && (!inputs.native-cache-measurement-only || needs.build-project.result == 'success')
    needs: build-project
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: windows, architecture: x64}
          - {platform: windows, architecture: arm64}
          - {platform: macos, architecture: arm64}
          - {platform: macos, architecture: x86_64}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-cache-identity-${{ matrix.platform }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/native-cache-build-identity
      - name: Verify Read-only Transport Round Trip
        env:
          NATIVE_CACHE_JOB_TOKEN: ${{ github.token }}
        run: >-
          uv run --no-project ci/native_cache_transport.py consume --require-hit --expected-source '${{ github.sha }}'
          --identity '${{ runner.temp }}/native-cache-build-identity/native-cache-identity.json'
          --destination '${{ runner.temp }}/native-cache-roundtrip'
          --report '${{ runner.temp }}/native-cache-consume.json'
      - name: Upload Native Consumer Evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-cache-consumer-${{ matrix.platform }}-${{ matrix.architecture }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-cache-consume.json
          retention-days: 1
          if-no-files-found: warn

  ci-gate:
    timeout-minutes: 10
    name: CI Gate ✅
    if: always()
    needs: [cancel-superseded, check-format, build-project, validate-data, update-documentation, tier2-setup-producer, tier2-setup-consumer, native-cache-consumer, flatpak-runtime-reuse]
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
    steps:
      # Queue wall time, runner time and rebuilds in the job summary (#930
      # E1), so a regression or a bypass that rebuilt the queue shows up.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: ci
          persist-credentials: false
      - name: Set Up uv 🐍
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}
      - name: Report Queue Run 📊
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project ci/queue_report.py
      - name: Check Job Results ✅
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      # needs.*.result misses a job cancelled inside a reusable workflow,
      # such as a macOS job no hosted runner acquired (#1793).
      - name: Check Run Jobs ✅
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project ci/gate_jobs.py
      - run: echo 'All required jobs passed or were skipped.'
  # Last job of the merge queue run (#1854, zackees/ci.yml#405 GEN-022). The
  # queue serializes master's cache writes, so this sweep has the cache to
  # itself and sees what the run saved. It evicts least recently used entries
  # down to ci.toml's [cache].budget so GitHub's own eviction never picks.
  # CI Gate does not wait on it: a failed sweep never ejects the PR.
  cache-janitor:
    name: Cache Janitor 🧹
    if: always() && github.event_name == 'merge_group'
    needs: [ci-pre, ci-gate]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # One sweep at a time, repo-wide; a running sweep is never cancelled.
    concurrency:
      group: cache-janitor
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
    steps:
      # The janitor reads only ci.toml from this repository.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: ci.toml
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}
      - name: Sweep Caches 🧹
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uvx --from git+https://github.com/zackees/ci.yml@a1917ce76598904ce515cd7eec83450c317ea6f2 ci-lint cache janitor --repo . --default-branch master
