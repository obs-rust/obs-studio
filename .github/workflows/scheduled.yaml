name: Scheduled
run-name: Scheduled Repository Actions ⏰
on:
  workflow_dispatch:
  schedule:
    - cron: 17 0 * * *
# Read-only at the top level: the jobs that write (services-availability,
# build-project, report-nightly-failure, analyze-project, codeql) mint their
# grant on the job itself (SEC-002). The two no-block jobs, upload-language-files
# and steam-upload, are upstream-only, gated on `repository_owner == 'obsproject'`.
permissions:
  contents: read
concurrency:
  group: '${{ github.workflow }} @ ${{ github.head_ref || github.ref }}'
  cancel-in-progress: true
jobs:
  services-availability:
    timeout-minutes: 30
    name: Check Service Availability 🛜
    if: github.repository_owner == 'obsproject'
    runs-on: macos-26
    permissions:
      checks: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Check for Defunct Services 📉
        uses: ./.github/actions/services-validator
        with:
          repositorySecret: ${{ secrets.GITHUB_TOKEN }}
          checkApiSecret: ${{ secrets.CHECK_SERVERS_API_KEY }}
          checkApiServers: ${{ secrets.CHECK_SERVERS_LIST }}
          runSchemaChecks: false
          runServiceChecks: true
          createPullRequest: true

  # Queue/master janitor owns cache retention through ci.toml. Nightly
  # builds reuse those caches rather than purging them before every build.
  cef-support:
    timeout-minutes: 10
    name: CEF Chromium Support 🌐
    # Chrome's release data changes without a commit here, so this runs on
    # the schedule (#2380): a pinned CEF older than extended stable fails.
    if: github.event_name != 'schedule' || github.repository == 'obs-rust/obs-studio'
    # Fails while a pinned CEF is older than extended stable (#2380), which is
    # #1864's remaining work. It stays red with its annotations but no longer
    # fails the run: a failed run marks every code scanning configuration
    # "Workflow runs failing", which hides a real CodeQL or clang-analyze
    # failure (#3144). Remove this line when #1864 lands, or keep it if the
    # check should only warn from then on.
    continue-on-error: true
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
      - name: Compare the CEF pins with Chrome's extended stable 🔍
        run: uv run --no-project ci/cef_support.py

  # Is the S3 remote cache actually reachable? Nothing else in CI proves it:
  # the compile lanes run with build-cache: false, so the bucket is configured
  # but never exercised. This writes a canary, reads it back, and reports the
  # bucket's object count and size - the numbers that tell us whether the store
  # is filling and whether the 50G watermark is near.
  s3-cache-canary:
    timeout-minutes: 10
    name: S3 Cache Canary 🗄️
    runs-on: ubuntu-latest
    # Never blocks the nightly: a cache probe that fails to authenticate is
    # information, not a build failure. The summary says which case it hit.
    continue-on-error: true
    steps:
      - name: Probe the soldr S3 cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SOLDR_S3_CACHE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SOLDR_S3_CACHE_SECRET_KEY }}
          AWS_DEFAULT_REGION: nyc3
          BUCKET: forge-ci
          ENDPOINT: https://nyc3.digitaloceanspaces.com
        run: |
          set -o pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::warning::S3 cache credentials are not configured; the remote cache is off"
            echo "S3 cache: credentials missing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          key="ci-canary/$(date -u +%Y%m%dT%H%M%SZ).txt"
          echo "canary $(date -u)" > /tmp/canary.txt
          if ! aws s3 cp /tmp/canary.txt "s3://$BUCKET/$key" --endpoint-url "$ENDPOINT" >/dev/null 2>&1; then
            echo "::error::S3 cache write failed (bucket $BUCKET at $ENDPOINT)"
            echo "S3 cache: write FAILED" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          aws s3 cp "s3://$BUCKET/$key" /tmp/canary.read --endpoint-url "$ENDPOINT" >/dev/null 2>&1
          if cmp -s /tmp/canary.txt /tmp/canary.read; then
            readback=ok
          else
            readback=MISMATCH
          fi
          totals=$(aws s3 ls "s3://$BUCKET" --recursive --summarize --endpoint-url "$ENDPOINT" 2>/dev/null || true)
          objects=$(printf '%s\n' "$totals" | awk '/Total Objects:/ {print $3}')
          bytes=$(printf '%s\n' "$totals" | awk '/Total Size:/ {print $3}')
          {
            echo "### S3 cache canary"
            echo "- write/read: **$readback** (object \`$key\`)"
            echo "- bucket: \`$BUCKET\` @ nyc3"
            echo "- objects: ${objects:-?}"
            echo "- size: ${bytes:-?} bytes ($(( (${bytes:-0}) / 1024 / 1024 / 1024 )) GiB of 50 GiB)"
          } >> "$GITHUB_STEP_SUMMARY"
          aws s3 rm "s3://$BUCKET/$key" --endpoint-url "$ENDPOINT" >/dev/null 2>&1 || true
          [ "$readback" = ok ] || exit 1

  build-project:
    name: Build 🧱
    uses: ./.github/workflows/build-project.yaml
    permissions:
      actions: read
      contents: write
    if: github.event_name != 'schedule' || github.repository == 'obs-rust/obs-studio'
    secrets: inherit

  report-nightly-failure:
    timeout-minutes: 10
    name: Report Nightly Failure 🚨
    # The fast PR path (#992) skips Rust tests, Tier 2 and the app builds, so
    # this nightly full run is what catches a break that slipped through.
    # On failure, open an issue, or comment on the open one.
    # A skipped `needs:` (non-schedule event, fork schedule) skips this job
    # too, which is what `event_name == 'schedule'` below wants (WF-004, #2953).
    needs: [build-project, analyze-project, codeql]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      - name: Open or Update the Nightly Failure Issue 📝
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: uv run --no-project --script ${{ github.workspace }}/ci/scheduled_steps.py report-nightly-failure

  analyze-project:
    name: Analyze 🔬
    uses: ./.github/workflows/analyze-project.yaml
    if: github.event_name != 'schedule' || github.repository == 'obs-rust/obs-studio'
    secrets: inherit
    permissions:
      contents: read
      security-events: write

  # Explicit security scans belong to nightly/manual runs, never PR/merge_group.
  codeql:
    timeout-minutes: 60
    name: Nightly CodeQL (${{ matrix.language }})
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (github.event_name != 'schedule' || github.repository == 'obs-rust/obs-studio')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, c-cpp, python, rust]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: github/codeql-action/init@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          category: nightly-${{ matrix.language }}

  upload-language-files:
    timeout-minutes: 30
    name: Upload Language Files 🌐
    if: github.repository_owner == 'obsproject' && github.ref_name == 'master'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      - name: Check Nightly Runs ☑️
        id: nightly-checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --script ${{ github.workspace }}/ci/scheduled_steps.py check-nightly-runs

      - name: Check for Changed Files ✅
        if: fromJSON(steps.nightly-checks.outputs.passed)
        uses: ./.github/actions/check-changes
        id: checks
        with:
          baseRef: ${{ steps.nightly-checks.outputs.lastNightly }}
          checkGlob: '**/en-US.ini'

      - name: Upload US English Language Files 🇺🇸
        if: steps.checks.outcome == 'success' && fromJSON(steps.checks.outputs.hasChangedFiles)
        uses: obsproject/obs-crowdin-sync/upload@4b488c7ced03aa109d9f12529bd91c26c54b3e89
        env:
          CROWDIN_PAT: ${{ secrets.CROWDIN_SYNC_CROWDIN_PAT }}
          GITHUB_EVENT_BEFORE: ${{ steps.nightly-checks.outputs.lastNightly }}

  steam-upload:
    timeout-minutes: 60
    name: Upload Steam Builds 🚂
    # Upstream-only: a skipped `needs:` skips it here regardless, which matches
    # the owner test below (WF-004, #2953).
    needs: [build-project]
    if: github.repository_owner == 'obsproject'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      - name: Check Nightly Runs ☑️
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --script ${{ github.workspace }}/ci/scheduled_steps.py check-nightly-runs

      - uses: ./.github/actions/steam-upload
        if: fromJSON(steps.checks.outputs.passed)
        with:
          steamSecret: ${{ secrets.STEAM_SHARED_SECRET }}
          steamUser: ${{ secrets.STEAM_USER }}
          steamPassword: ${{ secrets.STEAM_PASSWORD }}
          workflowSecret: ${{ secrets.GITHUB_TOKEN }}
          preview: ${{ github.repository_owner != 'obsproject' }}
