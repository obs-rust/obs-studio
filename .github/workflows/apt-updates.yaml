name: Apt Updates
run-name: Resolve Tier 2 package versions 📦
# apt-packages.txt names packages, not versions, so the same image tag can be
# rebuilt into different content as -updates and -security move. This job
# resolves the list against the current archive weekly and opens a pull request
# when the lock moves, which is a cheap place to see a bump that breaks the
# build instead of finding it inside a red merge queue.
on:
  schedule:
    - cron: 23 5 * * 1
  workflow_dispatch:
# Read-only at the top level; the job that opens the pull request mints its own
# grant (SEC-002).
permissions:
  contents: read
concurrency:
  group: apt-updates
  cancel-in-progress: false
jobs:
  resolve:
    timeout-minutes: 20
    name: Resolve Package Versions 📦
    if: github.event_name != 'schedule' || github.repository == 'obs-rust/obs-studio'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          enable-cache: false
      - name: Refresh the Package Lock 📦
        run: uv run --no-project ci/apt_updates.py resolve > rust/tools/linux-validate/apt-versions.txt
      - name: Detect Package Drift 🔍
        id: drift
        run: |
          path=rust/tools/linux-validate/apt-versions.txt
          if git diff --quiet -- "$path"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'the lock already matches the archive'
          else
            git diff --stat -- "$path"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Open Package Update PR 📦
        if: steps.drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: chore/apt-package-updates
          delete-branch: true
          title: 'ci: refresh the Tier 2 package version lock'
          commit-message: 'ci: refresh the Tier 2 package version lock'
          body: |
            `ci/apt_updates.py resolve` found the archive has moved since the
            committed `rust/tools/linux-validate/apt-versions.txt`.

            Reviewing the diff is the cheap moment to see a version bump that
            breaks the Tier 2 build, rather than meeting it in a red merge
            queue. Merging rebuilds the prebaked image under a new identity.

            Generated by `.github/workflows/apt-updates.yaml`; do not edit the
            lock by hand.
