name: Contributor leaderboard

# Regenerates leaderboard.json + leaderboard.jpg, and conversion.json +
# conversion.svg (tools/conversion, #2242), and commits them to the
# `leaderboard` branch only (served by GitHub Pages). Nothing here touches
# master, so the OBS build workflows are not triggered.
#
# Runs every 4 hours (at minute 17, off the top-of-hour rush), and on demand.
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

# Read-only at the top level: the tree is measured here and nothing else in the
# workflow needs it. The one write scope sits on the job that pushes to the
# `leaderboard` branch (SEC-002); the top-level block stays read-only.
permissions:
  contents: read

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  update:
    # Not in forks: a fork's schedule fails there and mails its owner (#1258).
    if: github.event_name != 'schedule' || github.repository == 'obs-rust/obs-studio'
    # The commit that pushes to the `leaderboard` branch is the only thing that
    # writes, so the write scope is minted here, not at the top level (SEC-002);
    # the job is listed in ci.toml's [allow].permissions.
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # tools/conversion measures the whole tree (#2242), so no sparse
          # checkout, and the submodules (obs-websocket, obs-browser) count.
          submodules: true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: leaderboard
          path: data
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
      - name: Generate
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project ci/leaderboard.py generate --repo "${{ github.repository }}" --data data
      - name: Measure Rust conversion
        run: uv run --no-project --python 3.12 tools/conversion/measure.py --json data/conversion.json --svg data/conversion.svg
      - name: Render JPEG
        run: uv run --no-project ci/leaderboard.py render --data data
      - name: Commit to leaderboard branch
        run: uv run --no-project ci/leaderboard.py commit --data data
