name: Contributor leaderboard

# Regenerates leaderboard.json + leaderboard.jpg, and conversion.json +
# conversion.svg (tools/conversion, #2242), and commits them to the
# `leaderboard` branch only (served by GitHub Pages). Nothing here touches
# master, so the OBS build workflows are not triggered.
#
# Runs every 4 hours (at minute 17, off the top-of-hour rush), and on demand.
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  update:
    # Not in forks: a fork's schedule fails there and mails its owner (#1258).
    if: github.event_name != 'schedule' || github.repository == 'obs-rust/obs-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # tools/conversion measures the whole tree (#2242), so no sparse
          # checkout, and the submodules (obs-websocket, obs-browser) count.
          submodules: true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: leaderboard
          path: data
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
      - name: Generate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp tools/leaderboard/site/* data/
          touch data/.nojekyll
          uv run --no-project --python 3.12 tools/leaderboard/generate.py --repo "${{ github.repository }}" --out data/leaderboard.json
      - name: Measure Rust conversion
        run: uv run --no-project --python 3.12 tools/conversion/measure.py --json data/conversion.json --svg data/conversion.svg
      - name: Render JPEG
        run: |
          uv run --python 3.12 --with playwright==1.49.1 playwright install --with-deps chromium
          uv run --no-project --python 3.12 --with playwright==1.49.1 tools/leaderboard/render.py data
          uv run --no-project --python 3.12 --with playwright==1.49.1 tools/leaderboard/render.py data conversion.html conversion.jpg
          uv run --no-project --python 3.12 --with playwright==1.49.1 tools/leaderboard/render.py data conversion-minimal.html conversion-minimal.jpg 640x100
      - name: Commit to leaderboard branch
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "leaderboard: update $(date -u +%FT%H:%MZ)"
          git push origin HEAD:leaderboard
