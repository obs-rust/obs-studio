name: Claim bot

# Claims are assignments, run by the org's reusable claim bot
# (obs-rust/.github: .github/workflows/claim-bot.yml, workflow/claims.py,
# rules in WORKFLOW.md). This file only routes this repo's events to it.
on:
  issue_comment:
    types: [created]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

# Only what routing the events needs: the comment/assignment scopes sit on the
# work itself (the `claim` job below), which is where the token that writes them
# is minted (ci-lint SEC-002). The top-level block asks for no more than the
# repository max grant (contents: read, actions: read).
permissions:
  contents: read

concurrency:
  group: claim-bot-${{ github.event.issue.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  claim:
    # Not in forks: a fork's schedule fails there and mails its owner (#1258).
    if: github.event_name != 'schedule' || github.repository == 'obs-rust/obs-studio'
    # The claim bot assigns the issue (issues: write) and reads its pull request
    # (pull-requests: read); both scopes sit on this job, the file's only
    # consumer, and are listed in ci.toml's [allow].permissions (SEC-002).
    permissions:
      issues: write
      pull-requests: read
    uses: obs-rust/.github/.github/workflows/claim-bot.yml@master
