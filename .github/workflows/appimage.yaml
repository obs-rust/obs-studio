name: AppImage
run-name: AppImage build and portability test (${{ github.ref_name }}) 📦
# Builds the AppImage, proves it runs in stock containers, and then:
#   push of a tag   -> that tag's release carries it (created if missing)
#   workflow_call   -> release-rust.yaml builds it for the daily beta and, with
#                      publish_continuous, refreshes the rolling "continuous"
#                      pre-release (daily, not per master push: #436)
#   dispatch        -> artifact only; PRs and merge groups never call it.
# Packaging validation runs nightly through release-rust.yaml (#1286).
on:
  push:
    tags:
      - '*'
    paths-ignore:
      - '**.md'
  workflow_call:
    inputs:
      rust_libobs:
        description: Build as OBS-Studio-Rust (ENABLE_RUST_LIBOBS identity; libobs uses the hybrid backend)
        type: boolean
        required: false
        default: true
      ref:
        description: The commit to build (defaults to the caller's)
        type: string
        required: false
        default: ''
      publish_continuous:
        description: Publish the build as the rolling "continuous" pre-release
        type: boolean
        required: false
        default: false
      rust_version:
        description: Full OBS-Studio-Rust release string to embed (e.g. 0.1.0-beta.20261013) and expect from --version
        type: string
        required: false
        default: ''
      platform_tests:
        description: Run the built AppImage on the release-gate distributions (slow; release-rust.yaml only)
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      rust_libobs:
        description: Build as OBS-Studio-Rust (ENABLE_RUST_LIBOBS identity; libobs uses the hybrid backend)
        type: boolean
        default: true
      qsv:
        description: Include the Intel QSV plugin (probes the Intel GPU through the host's libvpl runtime at startup; off until verified on real hardware)
        type: boolean
        default: false
      platform_tests:
        description: Run the built AppImage on the release-gate distributions (slow)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: appimage-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    timeout-minutes: 120
    name: Build AppImage 🧱
    runs-on: ubuntu-26.04
    outputs:
      rust: ${{ steps.configure.outputs.rust }}
    env:
      # zccache is the ubuntu-ci preset's compiler launcher (build.py deps).
      ZCCACHE_CACHE_DIR: ${{ github.workspace }}/.zccache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }} # empty outside workflow_call: the event's own commit
          submodules: recursive
          fetch-depth: 0 # `git describe` needs the release tags to derive the OBS version
          persist-credentials: false

      # Caches are restored on every run and saved even when a later step fails, so a
      # red build still leaves its compiled objects behind for the next attempt.
      # Keys carry the run id (caches are immutable); restore-keys pick the newest.
      - name: Restore zccache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .zccache
          key: zccache-appimage-${{ github.run_id }}
          restore-keys: zccache-appimage-

      - name: Restore cargo
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build_ubuntu/cargo
          key: cargo-appimage-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            cargo-appimage-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            cargo-appimage-

      # The build steps live in build-aux/appimage/build.py (one call per step, the
      # same scripts), so `bosn run --task appimage` can run them locally (#899).
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      # The glibc 2.28 build image (#926): AlmaLinux 8 packages plus the prebuilt
      # dependencies from obs-rust/obs-studio-libs (deps.lock.json); every build
      # step below runs in it through manylinux/run.sh.
      # A stalled mirror or registry fails one attempt, not the run; the second
      # attempt reuses every layer the first one finished (#2182).
      - name: Build the glibc 2.28 image 🐳
        timeout-minutes: 45
        run: |
          for attempt in 1 2; do
            timeout 20m docker build -f build-aux/appimage/manylinux/Dockerfile -t obs-appimage-228 . && exit 0
            echo "::warning::image build attempt $attempt failed"
            [ "$attempt" = 2 ] || sleep 30
          done
          exit 1

      - name: Configure 🔧
        id: configure
        env:
          # Keep absent inputs (push, tag, pull_request) distinct from explicit
          # false: loose Boolean equality would treat both as zero.
          RUST_LIBOBS: ${{ format('{0}', inputs.rust_libobs) != 'false' }}
          # qsv exists only as a workflow_dispatch input; called from release-rust.yaml
          # (workflow_call) it is absent, which must mean false, never ''.
          QSV: ${{ inputs.qsv == true }}
          OBS_RUST_VERSION: ${{ inputs.rust_version }}
        # Determine version 🏷️ + Configure: the OBS version is only used here.
        run: |
          build-aux/appimage/manylinux/run.sh uv run --no-project build-aux/appimage/build.py --base manylinux --steps version,configure \
            --rust-libobs "$RUST_LIBOBS" --qsv "$QSV" --rust-version "$OBS_RUST_VERSION"

      - name: Build 🧱
        run: build-aux/appimage/manylinux/run.sh uv run --no-project build-aux/appimage/build.py --base manylinux --steps build

      # Each compilation's hit or miss, its miss reason and which inputs
      # differed, per source (#2182). Diagnostics only.
      - name: Summarize the compiler cache journal
        if: always()
        continue-on-error: true
        run: |
          uv run --no-project ci/native_cache_journal.py summarize \
            --workspace "${GITHUB_WORKSPACE}" \
            --journal "${RUNNER_TEMP}/appimage-zccache.jsonl" \
            --output "${RUNNER_TEMP}/appimage-zccache.json"
          jq -r '.records[] | select(.outcome != "hit")
            | "\(.outcome) \(.miss_reason // "-") [\(.miss_diff_fields | join(","))] \(.source_candidates | join(" "))"' \
            "${RUNNER_TEMP}/appimage-zccache.json" | sort | uniq -c | sort -rn | head -200

      # The build container runs as root and zccache keeps its directory
      # private, so the save below (the runner user) could not read it and
      # saved nothing (#1832).
      - name: Return zccache to the runner user
        if: always() && github.ref == 'refs/heads/master'
        run: if [ -d .zccache ]; then sudo chown -R "$(id -u):$(id -g)" .zccache; fi

      - name: Save zccache
        if: always() && github.ref == 'refs/heads/master'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .zccache
          key: zccache-appimage-${{ github.run_id }}

      - name: Save cargo
        if: always() && github.ref == 'refs/heads/master'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build_ubuntu/cargo
          key: cargo-appimage-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}

      - name: Assemble AppDir 📁
        run: build-aux/appimage/manylinux/run.sh uv run --no-project build-aux/appimage/build.py --base manylinux --steps appdir

      - name: Create AppImage 📀
        env:
          PUBLISH_CONTINUOUS: ${{ inputs.publish_continuous == true }}
        run: build-aux/appimage/manylinux/run.sh uv run --no-project build-aux/appimage/build.py --base manylinux --steps appimage --publish-continuous "$PUBLISH_CONTINUOUS"

      - name: Test the host-library loader 🧪
        # hostlib/ (#959): the libva shims with the host's libva, without it,
        # with bad candidates, and the required-library preflight (exit 127).
        run: build-aux/appimage/manylinux/run.sh bash build-aux/appimage/hostlib/test-hostlib.sh

      - name: Build the test helper 🧰
        # Run by test-appimage.sh next to obs, with (through the same relative
        # DT_RPATH obs has) the AppImage's own libraries: runtime probes, a fake
        # ScreenCast/Camera portal and the test tone. Built in the glibc 2.28
        # image so they run on every host the AppImage does.
        run: |
          build-aux/appimage/manylinux/run.sh sh -c '
            gcc -O2 -Wall -Wextra -Werror -fPIE -pie -o obs-appimage-testkit build-aux/appimage/testkit.c \
              $(pkg-config --cflags --libs gio-unix-2.0 libpipewire-0.3 libpulse libcurl) -lm -ldl \
              -Wl,--disable-new-dtags -Wl,-rpath,"\$ORIGIN/../lib"
            gcc -O2 -Wall -Wextra -Werror -fPIE -pie -o obs-appimage-gpu-test build-aux/appimage/gpu-test.c \
              $(pkg-config --cflags --libs gbm egl glesv2 libavcodec libavformat libavutil) \
              -Wl,--disable-new-dtags -Wl,-rpath,"\$ORIGIN/../lib"
            gcc -O2 -Wall -Wextra -Werror -shared -fPIC -o obs-appimage-fake-nvml.so build-aux/appimage/fake-nvml.c -ldl'
          sudo apt-get install -y --no-install-recommends ffmpeg >/dev/null
          ffmpeg -v error -f lavfi -i testsrc2=size=128x72:rate=12 -frames:v 12 \
            -c:v libx264 -pix_fmt yuv420p -bf 0 -crf 18 gpu-h264.mp4
          ffmpeg -v error -i gpu-h264.mp4 -pix_fmt yuv420p -f rawvideo gpu-reference.yuv
          # The container wrote as root; the upload and cache steps read as the runner.
          sudo chown -R "$(id -u):$(id -g)" .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: obs-appimage-gpu-test
          path: |
            obs-appimage-gpu-test
            gpu-h264.mp4
            gpu-reference.yuv
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: obs-studio-appimage
          path: |
            OBS-Studio-*-linux-x86_64.AppImage
            OBS-Studio-*-linux-x86_64.AppImage.zsync
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: obs-appimage-testkit
          path: |
            obs-appimage-testkit
            obs-appimage-fake-nvml.so
          if-no-files-found: error

  # The release gate: the AppImage built once above, run as shipped on each
  # distribution. Slow, so never in PR CI: only when a release is being made
  # (release-rust.yaml passes platform_tests, and a tag push publishes).
  test:
    timeout-minutes: 90
    name: Test on ${{ matrix.image }} 🧪
    needs: build
    if: github.event_name == 'push' || inputs.platform_tests
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # None with OBS dependencies installed. The AppImage is built against glibc 2.28
        # and bundles none (#926): AlmaLinux 8 (2.28, the oldest supported), Ubuntu 22.04
        # (2.35, an older LTS), Ubuntu 24.04 (2.39, the LTS upstream OBS 33 dropped, #2353),
        # and Arch Linux (rolling: the newest glibc and Mesa). NixOS
        # (no FHS at all) is the test-nixos job below.
        # AlmaLinux 8 runs the bundle and first-start scenarios: its desktop is
        # PulseAudio/X11 with PipeWire 0.3.6 and no session manager, so the PipeWire
        # capture/camera scenarios have no desktop to imitate there. Its job is the
        # floor: every bundled library loads on glibc 2.28 and OBS starts.
        # first-start-no-libva: OBS starts on a host without libva (#959).
        include:
          - image: almalinux:8
            scenarios: bundle first-start first-start-no-libva
          - image: ubuntu:22.04
            scenarios: bundle first-start first-start-no-libva probes saved-profile saved-profile-custom saved-profile-existing
          - image: ubuntu:24.04
            scenarios: bundle first-start first-start-no-libva probes saved-profile saved-profile-custom saved-profile-existing
          - image: archlinux:latest
            scenarios: bundle first-start probes saved-profile saved-profile-custom saved-profile-existing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: build-aux/appimage

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: obs-studio-appimage

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: obs-appimage-testkit

      # Package downloads of the test infrastructure (X server, Mesa, ...) are cached per image.
      - name: Restore test-infrastructure packages
        id: pkgcache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: pkgcache
          key: testpkgs-${{ matrix.image }}-${{ hashFiles('build-aux/appimage/test-appimage.sh') }}

      # One fresh container per scenario, so nothing one scenario starts or
      # leaves behind can affect another; each also fails if it leaves anything
      # running. Every scenario runs even after one fails.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      - name: Install host GPU runtime for metadata check
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_SUSPEND: '1'
        run: |
          # The actual frontend loads the unbundled GPU libraries even for --version.
          # Provide the same host driver stack as the distro runtime scenarios.
          mkdir -p results pkgcache/apt pkgcache/lists pkgcache/dnf pkgcache/pacman
          sudo apt-get update -qq
          sudo -E apt-get install -y --no-install-recommends -o DPkg::Lock::Timeout=120 \
            libgl1-mesa-dri libglx-mesa0 libegl-mesa0 libgl1 libegl1 libgbm1 libdrm2 \
            libva2 libva-drm2 libva-x11-2 libopengl0 libwayland-client0 libwayland-egl1 libvulkan1

      - name: Verify AppImage identity and updater metadata
        env:
          REQUIRE_UPDATE: ${{ inputs.publish_continuous }}
        run: |
          set -euo pipefail
          chmod +x OBS-Studio-*-linux-x86_64.AppImage
          options=()
          [ "$REQUIRE_UPDATE" != true ] || options=(--require-update)
          uv run --no-project build-aux/appimage/asset_metadata.py verify \
            OBS-Studio-*-linux-x86_64.AppImage --repository "$GITHUB_REPOSITORY" "${options[@]}"

      # Docker Hub can refuse a pull for a moment ("failed to resolve
      # reference", run 40131480584); retry with backoff before the scenarios,
      # which then use the local image (#2182).
      - name: Pull the stock image 🐳
        timeout-minutes: 10
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          for attempt in 1 2 3 4 5; do
            docker pull -q "$IMAGE" && exit 0
            echo "::warning::pull of $IMAGE failed (attempt $attempt)"
            [ "$attempt" = 5 ] || sleep $((attempt * 15))
          done
          exit 1

      - name: Run the AppImage in stock containers 🐳
        run: |
          mkdir -p results pkgcache/apt pkgcache/lists pkgcache/dnf pkgcache/pacman
          status=0
          for scenario in ${{ matrix.scenarios }}; do
            echo "::group::Scenario: $scenario"
            docker run --rm --cap-add SYS_PTRACE \
              ${{ matrix.image == 'debian:trixie-slim' && '-e HOSTILE_QT=1' || '' }} \
              ${{ inputs.publish_continuous && '-e EXPECT_APPIMAGE_UPDATE=1' || '' }} \
              ${{ needs.build.outputs.rust == 'TRUE' && '-e EXPECT_RUST=1' || '' }} \
              ${{ inputs.rust_version != '' && format('-e EXPECT_RUST_VERSION={0}', inputs.rust_version) || '' }} \
              -v "$PWD/pkgcache/apt:/var/cache/apt/archives" \
              -v "$PWD/pkgcache/lists:/var/lib/apt/lists" \
              -v "$PWD/pkgcache/dnf:/var/cache/libdnf5" \
              -v "$PWD/pkgcache/pacman:/var/cache/pacman/pkg" \
              -v "$PWD:/work" -w /work "${{ matrix.image }}" \
              bash -c "build-aux/appimage/test-appimage.sh OBS-Studio-*-linux-x86_64.AppImage results/$scenario obs-appimage-testkit $scenario" ||
              { status=1; echo "::error::scenario $scenario failed on ${{ matrix.image }}"; }
            echo "::endgroup::"
          done
          exit $status

      # The container must not have ffmpeg (OBS's libraries have to come from the
      # AppImage), so the recording it made is checked out here.
      - name: Check the recording 🎞️
        run: |
          command -v ffmpeg >/dev/null || sudo apt-get install -y --no-install-recommends ffmpeg >/dev/null
          build-aux/appimage/verify-recording.sh --self-test
          # (test-appimage.sh allows a run without the test producers only on
          # Ubuntu 22.04, and fails anywhere else)
          for scenario in ${{ matrix.scenarios }}; do
            case "$scenario" in saved-profile*) ;; *) continue ;; esac # only these record
            if [ -f "results/$scenario/recording-skipped.txt" ]; then
              echo "::notice::no recording on ${{ matrix.image }} ($scenario): $(cat "results/$scenario/recording-skipped.txt")"
            else
              build-aux/appimage/verify-recording.sh "results/$scenario/recording.mkv"
            fi
          done

      - name: Fix cache ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" pkgcache

      - name: Save test-infrastructure packages
        if: always() && github.ref == 'refs/heads/master' && steps.pkgcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: pkgcache
          key: testpkgs-${{ matrix.image }}-${{ hashFiles('build-aux/appimage/test-appimage.sh') }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: appimage-test-${{ strategy.job-index }}
          path: results
          if-no-files-found: ignore

  test-nixos:
    timeout-minutes: 45
    name: Test on NixOS 🧪
    needs: build
    if: github.event_name == 'push' || inputs.platform_tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: build-aux/appimage
      # The same AppImage the other lanes test: nothing is rebuilt here.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: obs-studio-appimage
      - name: Run through appimageTools.wrapType2 on NixOS 🐳
        run: |
          # bubblewrap (inside wrapType2) needs user namespaces: --privileged.
          docker run --rm --privileged -v "$PWD:/work" -w /work \
            nixos/nix@sha256:e623d73af9cac82d1b50784c83e0cf2a4b83bfd2cfe8d5b67809a2fc94e043ac \
            bash build-aux/appimage/test-appimage-nixos.sh OBS-Studio-*-linux-x86_64.AppImage results/nixos
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: appimage-test-nixos
          path: results/nixos
          if-no-files-found: ignore

  release:
    timeout-minutes: 30
    name: Publish to GitHub Releases 🚀
    needs: [build, test, test-nixos]
    # Only after the AppImage has run on every distribution in the matrix
    # (test-appimage.sh: bundle check, first start, runtime probes, and a saved
    # profile with PipeWire screen capture, camera and microphone recording): a
    # tag push feeds the release of that tag. (The daily beta and the rolling
    # "continuous" pre-release are published by release-rust.yaml, after its
    # release gate: #624.)
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: obs-studio-appimage

      - name: Attach to the tag's release 🏷️
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Only OBS version tags and OBS-Studio-Rust release tags; the repository
          # carries tags of other components (obs-stream-rust-v...) with releases of
          # their own, which an OBS AppImage has no business joining.
          case "$TAG" in
            [0-9]* | obs-studio-rust-v*) ;;
            *) echo "::notice::$TAG is not an OBS-Studio-Rust tag; nothing to publish"; exit 0 ;;
          esac
          ls -l OBS-Studio-*
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A tag pushed by hand has no release yet. Betas and release candidates
            # stay marked as such; tags carrying a release are published as one.
            case "$TAG" in
              *beta* | *rc* | *alpha*) pre=--prerelease ;;
              *) pre= ;;
            esac
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag $pre \
              --title "$TAG" --notes "AppImage of \`$TAG\`, built from [\`${GITHUB_SHA:0:9}\`](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)."
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber OBS-Studio-*-linux-x86_64.AppImage
