name: AppImage
run-name: AppImage build and portability test (${{ github.ref_name }}) 📦
# Builds the AppImage, proves it runs in stock containers, and then:
#   push of a tag   -> that tag's release carries it (created if missing)
#   workflow_call   -> release-rust.yaml builds it for the daily beta and, with
#                      publish_continuous, refreshes the rolling "continuous"
#                      pre-release (daily, not per master push: #436)
#   PR / dispatch   -> artifact only
on:
  push:
    tags:
      - '*'
    paths-ignore:
      - '**.md'
  workflow_call:
    inputs:
      rust_libobs:
        description: Build libobs with the Rust ports (ENABLE_RUST_LIBOBS)
        type: boolean
        required: false
        default: true
      ref:
        description: The commit to build (defaults to the caller's)
        type: string
        required: false
        default: ''
      publish_continuous:
        description: Publish the build as the rolling "continuous" pre-release
        type: boolean
        required: false
        default: false
      rust_version:
        description: Full OBS-Studio-Rust release string to embed (e.g. 0.1.0-beta.20261013) and expect from --version
        type: string
        required: false
        default: ''
  pull_request:
    paths:
      - 'build-aux/appimage/**'
      - '.github/workflows/appimage.yaml'
  workflow_dispatch:
    inputs:
      rust_libobs:
        description: Build libobs with the Rust ports (ENABLE_RUST_LIBOBS)
        type: boolean
        default: true
      qsv:
        description: Include the Intel QSV plugin (probes the Intel GPU through the host's libvpl runtime at startup; off until verified on real hardware)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: appimage-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build AppImage 🧱
    runs-on: ubuntu-26.04
    outputs:
      rust: ${{ steps.configure.outputs.rust }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: '1'
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }} # empty outside workflow_call: the event's own commit
          submodules: recursive
          fetch-depth: 0 # `git describe` needs the release tags to derive the OBS version
          persist-credentials: false

      # Caches are restored on every run and saved even when a later step fails, so a
      # red build still leaves its compiled objects behind for the next attempt.
      # Keys carry the run id (caches are immutable); restore-keys pick the newest.
      - name: Restore ccache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .ccache
          key: ccache-appimage-${{ github.run_id }}
          restore-keys: ccache-appimage-

      - name: Restore cargo
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build_ubuntu/cargo
          key: cargo-appimage-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            cargo-appimage-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            cargo-appimage-

      - name: Restore apt packages
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .apt-cache
          key: apt-appimage-${{ hashFiles('.github/workflows/appimage.yaml') }}-${{ github.run_id }}
          restore-keys: apt-appimage-${{ hashFiles('.github/workflows/appimage.yaml') }}-

      - name: Install build dependencies 🛍️
        timeout-minutes: 10 # a hang here must fail with logs rather than sit for hours
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_SUSPEND: '1' # never restart runner services in the middle of the install
        run: |
          sudo apt-get update
          mkdir -p .apt-cache/partial
          # Same set as .github/scripts/utils.zsh/setup_ubuntu, minus CEF/VLC/Python
          # (not shipped in the AppImage), plus tools for packaging, plus what the
          # bundled libpipewire loads at runtime: its modules (libpipewire-0.3-modules)
          # and client.conf (pipewire-bin). assemble-appdir.sh fails without them
          # (obs-rust/obs-studio#426).
          sudo -E apt-get install -y --no-install-recommends -o DPkg::Lock::Timeout=120 -o Dir::Cache::archives="$PWD/.apt-cache" \
            build-essential cmake ninja-build ccache pkg-config git curl ca-certificates \
            patchelf desktop-file-utils file squashfs-tools zsync \
            libglib2.0-dev extra-cmake-modules libcurl4-openssl-dev \
            libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev libjansson-dev libx11-xcb-dev libgles2-mesa-dev \
            libwayland-dev libpipewire-0.3-dev libpulse-dev libx264-dev libmbedtls-dev \
            libpipewire-0.3-modules pipewire-bin \
            libgl1-mesa-dev libgbm-dev ffmpeg uthash-dev libsimde-dev libluajit-5.1-dev swig libxss-dev libglvnd-dev \
            libx11-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xinerama0-dev libxcb-composite0-dev \
            libxinerama-dev libxcb1-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libatk1.0-dev libatk-bridge2.0-dev libxcomposite-dev libxdamage-dev \
            libasound2-dev libfdk-aac-dev libfontconfig-dev libfreetype6-dev libjack-jackd2-dev \
            libsndio-dev libspeexdsp-dev libudev-dev libv4l-dev libva-dev libpci-dev libdrm-dev \
            nlohmann-json3-dev libwebsocketpp-dev libasio-dev libqrcodegencpp-dev \
            libffmpeg-nvenc-dev librist-dev libsrt-openssl-dev libvpl-dev libvpl2 \
            qt6-base-dev qt6-base-private-dev libqt6svg6-dev qt6-svg-plugins qt6-wayland \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xkb1 libxcb-sync1 libxcb-xinerama0
          sudo chown -R "$(id -u):$(id -g)" .apt-cache # apt ran as root; the cache action must read it

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Build libavutil with host VA compatibility
        run: |
          # Keep Ubuntu's complete feature configuration. Only the optional
          # newer VA mapping API is adapted; exports/backends are audited.
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update -qq
          sudo -E apt-get -y -qq -o DPkg::Lock::Timeout=120 -o Dir::Cache::archives="$PWD/.apt-cache" build-dep --arch-only ffmpeg=7:8.0.1-3ubuntu2
          sudo chown -R "$(id -u):$(id -g)" .apt-cache
          uv run --no-project build-aux/appimage/build_vaapi_compat.py avutil-compat
          # FFmpeg's recipe replaces this with libsrt-gnutls-dev, which lacks
          # the library name OBS's finder expects. Restore OBS's build input
          # after the audited avutil build; keep MPEG-TS/SRT enabled.
          sudo -E apt-get -y -qq -o DPkg::Lock::Timeout=120 -o Dir::Cache::archives="$PWD/.apt-cache" install libsrt-openssl-dev
          sudo chown -R "$(id -u):$(id -g)" .apt-cache

      - name: Determine version 🏷️
        run: |
          # Same tag filter as cmake/common/versionconfig.cmake: this repository also carries
          # non-OBS tags (obs-studio-rust-v...), which must not become the OBS version.
          # In a fork or shallow clone without OBS release tags `git describe` yields a bare
          # commit hash, which CMake rejects as a project VERSION, so use a dev version then.
          if desc="$(git describe --tags --match '[0-9]*.[0-9]*.[0-9]*' 2>/dev/null)" && [[ "$desc" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "OBS_VERSION=$desc" >> "$GITHUB_ENV"
          else
            echo "OBS_VERSION=0.0.0-g${GITHUB_SHA::9}" >> "$GITHUB_ENV"
          fi

      - name: Configure 🔧
        id: configure
        env:
          # Keep absent inputs (push, tag, pull_request) distinct from explicit
          # false: loose Boolean equality would treat both as zero.
          RUST_LIBOBS: ${{ format('{0}', inputs.rust_libobs) != 'false' }}
          QSV: ${{ github.event_name == 'workflow_dispatch' && inputs.qsv }}
          OBS_RUST_VERSION: ${{ inputs.rust_version }}
        run: |
          echo "rust=${RUST_LIBOBS^^}" >> "$GITHUB_OUTPUT" # the tests check the build really has it
          cmake --preset ubuntu-ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DOBS_VERSION_OVERRIDE="${OBS_VERSION}" \
            -DENABLE_RELOCATABLE=ON \
            -DENABLE_RUST_LIBOBS="${RUST_LIBOBS^^}" \
            -DENABLE_QSV11="${QSV^^}" \
            -DENABLE_BROWSER=OFF -DENABLE_VLC=OFF -DENABLE_WEBRTC=OFF -DENABLE_AJA=OFF \
            -DENABLE_SCRIPTING_PYTHON=OFF

      - name: Build 🧱
        run: |
          cmake --build build_ubuntu
          ccache -s

      - name: Save ccache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .ccache
          key: ccache-appimage-${{ github.run_id }}

      - name: Save cargo
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build_ubuntu/cargo
          key: cargo-appimage-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}

      - name: Save apt packages
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .apt-cache
          key: apt-appimage-${{ hashFiles('.github/workflows/appimage.yaml') }}-${{ github.run_id }}

      - name: Assemble AppDir 📁
        run: |
          DESTDIR="$PWD/AppDir" cmake --install build_ubuntu
          build-aux/appimage/assemble-appdir.sh AppDir avutil-compat/libavutil.so.60

      - name: Create AppImage 📀
        env:
          # A tagged release (not the rolling "continuous" build), verified by checksum. To
          # update: change both, e.g. sha256sum of .../releases/download/<tag>/appimagetool-x86_64.AppImage
          APPIMAGETOOL_VERSION: '1.9.1'
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
        run: |
          curl -fsSLo appimagetool "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          # Runners have no /dev/fuse: extract appimagetool instead of running it.
          ./appimagetool --appimage-extract >/dev/null
          # A build published as the "continuous" pre-release (release job) carries
          # update information: AppImageUpdate and friends can then fetch the next
          # continuous build as a delta against this one (.zsync).
          update=()
          if [ "${{ inputs.publish_continuous }}" = true ]; then
            update=(-u "gh-releases-zsync|${GITHUB_REPOSITORY%/*}|${GITHUB_REPOSITORY#*/}|continuous|OBS-Studio-Rust-*-linux-x86_64.AppImage.zsync")
          fi
          version="$(AppDir/AppRun --version)"
          asset="$(uv run --no-project build-aux/appimage/asset_metadata.py name --version "$version")"
          ARCH=x86_64 squashfs-root/AppRun --no-appstream "${update[@]}" AppDir "$asset"
          ls -lh OBS-Studio-*

      - name: Build the test helper 🧰
        # Run by test-appimage.sh next to obs, with the AppImage's own loader and
        # (through the same relative DT_RPATH obs has) its own libraries: runtime
        # probes, a fake ScreenCast/Camera portal and the test tone.
        run: |
          gcc -O2 -Wall -Wextra -Werror -o obs-appimage-testkit build-aux/appimage/testkit.c \
            $(pkg-config --cflags --libs gio-unix-2.0 libpipewire-0.3 libpulse) -lm \
            -Wl,--disable-new-dtags -Wl,-rpath,'$ORIGIN/../lib'
          gcc -O2 -Wall -Wextra -Werror -o obs-appimage-gpu-test build-aux/appimage/gpu-test.c \
            $(pkg-config --cflags --libs gbm egl glesv2 libavcodec libavformat libavutil) \
            -Wl,--disable-new-dtags -Wl,-rpath,'$ORIGIN/../lib'
          ffmpeg -v error -f lavfi -i testsrc2=size=128x72:rate=12 -frames:v 12 \
            -c:v libx264 -pix_fmt yuv420p -bf 0 -crf 18 gpu-h264.mp4
          ffmpeg -v error -i gpu-h264.mp4 -pix_fmt yuv420p -f rawvideo gpu-reference.yuv

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: obs-appimage-gpu-test
          path: |
            obs-appimage-gpu-test
            gpu-h264.mp4
            gpu-reference.yuv
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: obs-studio-appimage
          path: |
            OBS-Studio-*-linux-x86_64.AppImage
            OBS-Studio-*-linux-x86_64.AppImage.zsync
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: obs-appimage-testkit
          path: obs-appimage-testkit
          if-no-files-found: error

  test:
    name: Test on ${{ matrix.image }} 🧪
    needs: build
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # Different glibc versions and families, none with OBS dependencies installed:
        # Debian 13 (glibc 2.41), Ubuntu 22.04 (2.35, older than the build host), Fedora, and
        # Arch Linux (rolling: glibc 2.44+, newer than the 2.43 the AppImage is built with, whose
        # Mesa/LLVM cannot load against an older glibc; obs-rust/obs-studio#621).
        image: ['debian:trixie-slim', 'ubuntu:22.04', 'fedora:latest', 'archlinux:latest']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: build-aux/appimage

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: obs-studio-appimage

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: obs-appimage-testkit

      # Package downloads of the test infrastructure (X server, Mesa, ...) are cached per image.
      - name: Restore test-infrastructure packages
        id: pkgcache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: pkgcache
          key: testpkgs-${{ matrix.image }}-${{ hashFiles('build-aux/appimage/test-appimage.sh') }}

      # One fresh container per scenario, so nothing one scenario starts or
      # leaves behind can affect another; each also fails if it leaves anything
      # running. Every scenario runs even after one fails.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install host GPU runtime for metadata check
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_SUSPEND: '1'
        run: |
          # The actual frontend loads the unbundled GPU libraries even for --version.
          # Provide the same host driver stack as the distro runtime scenarios.
          mkdir -p results pkgcache/apt pkgcache/lists pkgcache/dnf pkgcache/pacman
          sudo apt-get update -qq
          sudo -E apt-get install -y --no-install-recommends -o DPkg::Lock::Timeout=120 \
            libgl1-mesa-dri libglx-mesa0 libegl-mesa0 libgl1 libegl1 libgbm1 libdrm2 \
            libva2 libva-drm2 libva-x11-2 libopengl0 libwayland-client0 libwayland-egl1 libvulkan1

      - name: Verify AppImage identity and updater metadata
        env:
          REQUIRE_UPDATE: ${{ inputs.publish_continuous }}
        run: |
          set -euo pipefail
          chmod +x OBS-Studio-*-linux-x86_64.AppImage
          options=()
          [ "$REQUIRE_UPDATE" != true ] || options=(--require-update)
          uv run --no-project build-aux/appimage/asset_metadata.py verify \
            OBS-Studio-*-linux-x86_64.AppImage --repository "$GITHUB_REPOSITORY" "${options[@]}"

      - name: Run the AppImage in stock containers 🐳
        run: |
          mkdir -p results pkgcache/apt pkgcache/lists pkgcache/dnf pkgcache/pacman
          status=0
          for scenario in bundle first-start probes saved-profile saved-profile-custom saved-profile-existing; do
            echo "::group::Scenario: $scenario"
            docker run --rm --cap-add SYS_PTRACE \
              ${{ matrix.image == 'debian:trixie-slim' && '-e HOSTILE_QT=1' || '' }} \
              ${{ inputs.publish_continuous && '-e EXPECT_APPIMAGE_UPDATE=1' || '' }} \
              ${{ needs.build.outputs.rust == 'TRUE' && '-e EXPECT_RUST=1' || '' }} \
              ${{ inputs.rust_version != '' && format('-e EXPECT_RUST_VERSION={0}', inputs.rust_version) || '' }} \
              -v "$PWD/pkgcache/apt:/var/cache/apt/archives" \
              -v "$PWD/pkgcache/lists:/var/lib/apt/lists" \
              -v "$PWD/pkgcache/dnf:/var/cache/libdnf5" \
              -v "$PWD/pkgcache/pacman:/var/cache/pacman/pkg" \
              -v "$PWD:/work" -w /work "${{ matrix.image }}" \
              bash -c "build-aux/appimage/test-appimage.sh OBS-Studio-*-linux-x86_64.AppImage results/$scenario obs-appimage-testkit $scenario" ||
              { status=1; echo "::error::scenario $scenario failed on ${{ matrix.image }}"; }
            echo "::endgroup::"
          done
          exit $status

      # The container must not have ffmpeg (OBS's libraries have to come from the
      # AppImage), so the recording it made is checked out here.
      - name: Check the recording 🎞️
        run: |
          command -v ffmpeg >/dev/null || sudo apt-get install -y --no-install-recommends ffmpeg >/dev/null
          build-aux/appimage/verify-recording.sh --self-test
          # (test-appimage.sh allows a run without the test producers only on
          # Ubuntu 22.04, and fails anywhere else)
          for scenario in saved-profile saved-profile-custom saved-profile-existing; do
            if [ -f "results/$scenario/recording-skipped.txt" ]; then
              echo "::notice::no recording on ${{ matrix.image }} ($scenario): $(cat "results/$scenario/recording-skipped.txt")"
            else
              build-aux/appimage/verify-recording.sh "results/$scenario/recording.mkv"
            fi
          done

      - name: Fix cache ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" pkgcache

      - name: Save test-infrastructure packages
        if: always() && steps.pkgcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: pkgcache
          key: testpkgs-${{ matrix.image }}-${{ hashFiles('build-aux/appimage/test-appimage.sh') }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: appimage-test-${{ strategy.job-index }}
          path: results
          if-no-files-found: ignore

  release:
    name: Publish to GitHub Releases 🚀
    needs: [build, test]
    # Only after the AppImage has run on every distribution in the matrix
    # (test-appimage.sh: bundle check, first start, runtime probes, and a saved
    # profile with PipeWire screen capture, camera and microphone recording): a
    # tag push feeds the release of that tag. (The daily beta and the rolling
    # "continuous" pre-release are published by release-rust.yaml, after its
    # release gate: #624.)
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: obs-studio-appimage

      - name: Attach to the tag's release 🏷️
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Only OBS version tags and OBS-Studio-Rust release tags; the repository
          # carries tags of other components (obs-stream-rust-v...) with releases of
          # their own, which an OBS AppImage has no business joining.
          case "$TAG" in
            [0-9]* | obs-studio-rust-v*) ;;
            *) echo "::notice::$TAG is not an OBS-Studio-Rust tag; nothing to publish"; exit 0 ;;
          esac
          ls -l OBS-Studio-*
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A tag pushed by hand has no release yet. Betas and release candidates
            # stay marked as such; tags carrying a release are published as one.
            case "$TAG" in
              *beta* | *rc* | *alpha*) pre=--prerelease ;;
              *) pre= ;;
            esac
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag $pre \
              --title "$TAG" --notes "AppImage of \`$TAG\`, built from [\`${GITHUB_SHA:0:9}\`](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)."
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber OBS-Studio-*-linux-x86_64.AppImage
